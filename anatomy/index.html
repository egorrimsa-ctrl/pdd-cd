<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Анатомия 3D">
<title>Анатомия 3D</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<div id="app">
  <!-- ATLAS -->
  <section id="v-atlas" class="view">
    <canvas id="c3d"></canvas>
    <div class="topbar">
      <button class="search-btn" id="b-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Поиск структуры…</button>
      <button class="ibtn" id="b-layers" title="Слои"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
    </div>
    <div class="syschips" id="syschips"></div>
    <div class="modebar" id="modebar"></div>
    <div class="sidetools">
      <button class="ibtn" id="b-hide" title="Скрывать касанием"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/><path d="M4 4l16 16"/></svg></button>
      <button class="ibtn" id="b-undo" title="Вернуть скрытое"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg></button>
      <button class="ibtn" id="b-section" title="Срез"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16" stroke-dasharray="2 2.5"/></svg></button>
      <button class="ibtn" id="b-view" title="Вид"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
      <button class="ibtn" id="b-reset" title="Показать всё"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="7" r="3"/><path d="M12 10v5M8 21l4-6 4 6M6 13h12"/></svg></button>
    </div>
    <div id="labels"></div>
    <div class="loading hidden" id="loading"><div id="loading-t">Загрузка модели…</div><div class="bar"><b id="loading-b"></b></div></div>
    <div class="sheet hidden" id="sheet"></div>
    <div class="qbanner hidden" id="qbanner"></div>
  </section>
  <!-- CARDS -->
  <section id="v-cards" class="view hidden"><div class="scroll" id="cards-root"></div></section>
  <!-- TESTS -->
  <section id="v-tests" class="view hidden"><div class="scroll" id="tests-root"></div></section>
  <!-- NOTES -->
  <section id="v-notes" class="view hidden"><div class="scroll" id="notes-root"></div></section>

  <div id="overlay"></div>

  <nav id="tabs">
    <button data-v="atlas" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2.2"/><path d="M12 7v7M8 9.5h8M9 21l3-7 3 7"/></svg>Атлас</button>
    <button data-v="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2.5"/><path d="M7 3h11.5A2.5 2.5 0 0121 5.5V17"/></svg>Карточки</button>
    <button data-v="tests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l2.5 2.5L16 9"/><rect x="3.5" y="3.5" width="17" height="17" rx="3"/></svg>Тесты</button>
    <button data-v="notes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 016.5 3H18v15H6.5A1.5 1.5 0 005 19.5z"/><path d="M5 19.5A1.5 1.5 0 006.5 21H18v-3M9 7.5h5M9 11h5"/></svg>Конспекты</button>
  </nav>
</div>
<script src="data/notes.js"></script>
<script src="data/questions.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
