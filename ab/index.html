дноцветной сигнализацией, предназначенный для маршрутных ТС, разрешает движение прямо. Трамвай, поворачивающий направо, дожидается смены сигнала. Зеленый сигнал светофора разрешает Вам движение – проезжайте перекресток прямо первым.(Пункты 6.2, 6.8 ПДД)","img":"i174.jpg","tp":[8],"p":["6.2","6.8"]},{"t":13,"n":14,"q":"Кто из водителей, выполняющих поворот, должен уступить дорогу пешеходам?","a":["Только водитель легкового автомобиля","Только водитель грузового автомобиля","Оба"],"c":2,"tip":"При повороте направо или налево при проезде перекрёстков, как регулируемых, так и нерегулируемых, водитель обязан уступить дорогу пешеходам, переходящим проезжую часть дороги, на которую он поворачивает. Оба водителя уступают дорогу пешеходам.(Пункт 13.1 ПДД)","img":"i175.jpg","tp":[8],"p":["13.1"]},{"t":13,"n":15,"q":"Можете ли Вы в данной ситуации приступить к повороту налево?","a":["Можете","Можете, только убедившись в том, что не создадите помех встречному автомобилю, выполняющему поворот налево","Не можете"],"c":1,"tip":"Перекрёсток неравнозначный. Транспортные средства, находящиеся на главной дороге, имеют преимущество. Но так как Ваша траектория движения не пересекается с грузовиком, можете совершить движение через перекрёсток одновременно, при этом Вы должны учитывать преимущество грузовика, т.е. не создавать ему помех.(«Дорожные знаки», пункты 1.2 термин «Уступить дорогу», 13.9 ПДД)","img":"i176.jpg","tp":[8],"p":["1.2","13.9"]},{"t":13,"n":16,"q":"Разрешается ли Вам на легковом автомобиле перестроиться вправо, чтобы продолжить движение в прямом направлении?","a":["Разрешается, если не создадите помех движению маршрутных транспортных средств","Разрешается, если Вы управляете легковым такси","Запрещается"],"c":1,"tip":"Согласно знаку 5.14.1 «Полоса для маршрутных транспортных средств» и разметки 1.23.1 (в виде буквы «А») правая полоса принадлежит маршрутным транспортным средствам и ТС, используемым в качестве легкового такси, а также велосипедистам и «школьным автобусам». Движение и остановка других транспортных средств на этой полосе запрещается. Исключением является только остановка для посадки и высадки пассажиров, а также заезд на эту полосу при въезде на дорогу и при поворотах для предварительного перестроения, если эта полоса отделена от остальной проезжей части прерывистой линией разметки.Вам можно перестроиться по указанной траектории и продолжить движение в прямом направлении, если Вы управляете легковым такси.(Пункт 18.2 ПДД, «Горизонтальная разметка» 1.23.1)","img":"i177.jpg","tp":[24],"p":["1.23","18.2"]},{"t":13,"n":17,"q":"Задние противотуманные фонари можно использовать:","a":["Только в условиях недостаточной видимости","Только при движении в тёмное время суток","В обоих перечисленных случаях"],"c":0,"tip":"Задние противотуманные фонари могут применяться только в условиях недостаточной видимости.(Пункт 19.7 ПДД)","img":null,"tp":[20],"p":["19.7"]},{"t":13,"n":18,"q":"При возникновении какой неисправности запрещено дальнейшее движение транспортного средства даже до места ремонта или стоянки?","a":["Не работает стеклоподъемник","Неисправно рулевое управление","Неисправен глушитель"],"c":1,"tip":"При неисправности рулевого управления движение представляет явную опасность, поэтому запрещено.(Пункт 2.3.1 ПДД)","img":null,"tp":[11],"p":["2.3"]},{"t":13,"n":19,"q":"Двигаясь в прямом направлении, Вы внезапно попали на небольшой участок скользкой дороги. Что следует предпринять?","a":["Плавно затормозить","Повернуть руль, чтобы съехать с этого участка дороги","Не менять траектории и скорости движения"],"c":2,"tip":"Если это действительно небольшой участок дороги, то необходимо не менять траекторию и скорость, чтобы избежать возникновения заноса.","img":null,"tp":[12],"p":[]},{"t":13,"n":20,"q":"На какой срок может быть наложен кровоостанавливающий жгут?","a":["Не более получаса в теплое время года и не более одного часа в холодное время года","Не более одного часа в теплое время года и не более получаса в холодное время года","Время наложения жгута не ограничено"],"c":1,"tip":"Кровоостанавливающий жгут накладывается: в теплое время года (+4°С и выше ) - на время не более чем на один час, и на время не более получаса в холодное время года (ниже +4°С).","img":null,"tp":[16],"p":[]},{"t":14,"n":1,"q":"Что означает термин «Ограниченная видимость»?","a":["Видимость водителем дороги, ограниченная рельефом местности, геометрическими параметрами дороги, растительностью, строениями, сооружениями или другими объектами","Видимость водителем дороги менее 300 м в условиях тумана, дождя, снегопада, а также в сумерки","Видимость водителем дороги менее 150 м в ночное время","Видимость водителем дороги во всех перечисленных случаях"],"c":0,"tip":"«Ограниченная видимость» - видимость водителем дороги в направлении движения, ограниченная рельефом местности, геометрическими параметрами дороги, растительностью, строениями, сооружениями или иными объектами, в том числе транспортными средствами.(Пункт 1.2 ПДД термин «Ограниченная видимость»)","img":null,"tp":[0],"p":["1.2"]},{"t":14,"n":2,"q":"О чем предупреждают Вас эти знаки:","a":["Остановка транспортных средств на обочине запрещена","Съезд на обочину опасен в связи с проведением на ней дорожных работ","В месте производства дорожных работ стоянка запрещена"],"c":1,"tip":"Знак 1.25 «Дорожные работы» в сочетании с табличкой 8.12 «Опасная обочина» предупреждает водителей, что съезд на обочину опасен в связи с проведением на ней дорожных (ремонтных) работ.(«Дорожные знаки»)","img":"i178.jpg","tp":[1],"p":[]},{"t":14,"n":3,"q":"Какие из указанных знаков разрешают движение грузовым автомобилям с разрешённой максимальной массой не более 3,5 т?","a":["Только А","А и В","Все"],"c":1,"tip":"Из данных знаков только знак «Б» - 3.1 «Въезд запрещён» - запрещает въезд всех транспортных средств. От требований знака отступают маршрутные транспортные средства: трамвай, троллейбус, автобус, а также обозначенные табличками 8.4.1 - 8.4.8; 8.5.1, 8.5.2, 8.5.3, 8.5.4, 8.5.5 - 8.5.7 и 8.4.9 - 8.4.16. Знак «А» - 5.3 «Дорога для автомобилей» - обозначающий дорогу, предназначенную только для автомобилей (без ограничений), автобусов и мотоциклов, каких-либо требований к массе и т.п. перечисленных транспортных средств не предъявляет.Знак «В» - 3.4 «Движение грузовых автомобилей запрещено» - при отсутствии цифры на автомобиле знака обозначает, что под знак могут проезжать грузовые автомобили только если их р.м.м. не более 3,5 т.Правильный ответ – А и В. («Дорожные знаки»)","img":"i179.jpg","tp":[1],"p":[]},{"t":14,"n":4,"q":"Вам можно продолжить движение по крайней левой полосе на легковом автомобиле:","a":["Только налево","Прямо или налево","Прямо, налево или в обратном направлении"],"c":2,"tip":"При наличии знаков, организующих направление движения по полосам (5.15.2), в данной ситуации, с крайнее левой полосы разрешается движение прямо, налево и разворот в обратном направлении. Разворот автоматически добавляется к повороту налево, но только с крайней левой полосы. («Дорожные знаки» 5.15.2)","img":"i180.jpg","tp":[1],"p":[]},{"t":14,"n":5,"q":"В каком из указанных мест Вам разрешено пересечь сплошную линию разметки и остановиться?","a":["А и Б","Только Б","В указанных местах пересекать сплошную линию разметки запрещено"],"c":1,"tip":"Разделительная полоса не предназначена для движения и остановки транспортных средств. (Место «А»).В месте «Б» – Вам можно останавливаться. Линия разметки 1.2 в данном случае обозначает край проезжей части, граничащий с обочиной. В такой ситуации ее допускается пересекать для остановки ТС на обочине и при выезде с нее в местах, где разрешена остановка или стоянка.(Пункт 1.2 термин «Разделительная полоса», «Горизонтальная разметка»)","img":"i181.jpg","tp":[2],"p":[]},{"t":14,"n":6,"q":"Должны ли Вы остановиться по требованию регулировщика в указанном им месте?","a":["Должны","Должны только с заездом на тротуар","Не должны"],"c":0,"tip":"Регулировщик решил Вас остановить. В этом случае его действия должны быть чёткими и конкретными. Первоначально он должен дать именно Вам указание об остановке, т.е. жест его руки должен быть направлен на Ваше транспортное средство. После этого регулировщик указывает место остановки. Ваша задача остановиться в указанном месте, даже если это противоречит правилам остановки. Как в данной ситуации, остановившись у тротуара.(Пункт 6.11 ПДД)","img":"i182.jpg","tp":[3],"p":["6.11"]},{"t":14,"n":7,"q":"Такой сигнал рукой, подаваемый водителем мотоцикла, информирует Вас:","a":["О его намерении повернуть налево или выполнить разворот","О его намерении продолжить движение прямо или налево","О наличии транспортного средства, приближающегося слева"],"c":0,"tip":"Сигналу левого поворота (разворота) соответствует вытянутая в сторону левая рука. Может использоваться для такого сигнала и правая вытянутая рука, но согнутая в локте под прямым углом вверх.(Пункт 8.1 ПДД)","img":"i183.jpg","tp":[4],"p":["8.1"]},{"t":14,"n":8,"q":"По какой траектории Вам разрешается выполнить поворот налево?","a":["Только по А","Только по Б","По любой из указанных"],"c":2,"tip":"Согласно знаку 5.7.2 «Выезд на дорогу с односторонним движением» на данном перекрёстке можно продолжить движение прямо, налево и совершить разворот. На дороге с односторонним движением можете двигаться по любой полосе. Поэтому Вам разрешается движение по любой из указанных траекторий.(«Дорожные знаки», пункт 8.6 ПДД)","img":"i184.jpg","tp":[4],"p":["8.6"]},{"t":14,"n":9,"q":"Можно ли Вам развернуться в этом месте?","a":["Можно","Можно, только в светлое время суток","Нельзя"],"c":0,"tip":"Табличка под знаком 8.2.1 «Зона действия» указывает протяжённость опасных поворотов, о которых предупреждает знак 1.12.1 «Опасные повороты», и который устанавливается вне населённых пунктов за 150 – 300 м до опасного участка. При развороте Вы не должны оказаться в месте с видимостью дороги хотя бы в одном направлении менее 100 м. У Вас ещё есть небольшое расстояние, на котором можете совершить разворот.(«Дорожные знаки», пункт 8.11 ПДД)","img":"i185.jpg","tp":[4],"p":["8.11"]},{"t":14,"n":10,"q":"Допускается ли движение автомобилей по тротуарам или пешеходным дорожкам?","a":["Допускается","Допускается только при доставке грузов к торговым и другим предприятиям, расположенным непосредственно у тротуаров или пешеходных дорожек, если отсутствуют другие возможности подъезда","Не допускается"],"c":1,"tip":"Допускается движение автомобилей по тротуарам или пешеходным дорожкам только если Вы обслуживаете торговые или другие предприятия, расположенные непосредственно у этих тротуаров или дорожек, при отсутствии других возможностей подъезда.(Пункт 9.9 ПДД)","img":null,"tp":[13],"p":["9.9"]},{"t":14,"n":11,"q":"В данной ситуации, Вы:","a":["Должны уступить дорогу, так как встречный автомобиль движется на подъем","Имеете право проехать первым, так как Вы движетесь на спуск","Имеете право проехать первым, так как препятствие находится на полосе движения встречного автомобиля"],"c":0,"tip":"В обычных условиях уступает тот из водителей, на чьей стороне помеха. На уклонах, обозначенных соответствующими знаками, иной порядок. При наличии препятствия уступить дорогу должен водитель транспортного средства, движущегося на спуск. Согласно знаку 1.13 «Крутой спуск» Вы руководствуетесь этим правилом и уступаете дорогу, встречному автомобилю движущемуся на подъем.(«Дорожные знаки», пункт 11.7 ПДД)","img":"i186.jpg","tp":[6],"p":["11.7"]},{"t":14,"n":12,"q":"Разрешено ли Вам остановиться на мосту в этом месте?","a":["Разрешено","Разрешено только для высадки пассажиров","Запрещено"],"c":0,"tip":"На мостах, путепроводах и эстакадах остановка запрещается, если количество полос движения в данном направлении менее трёх. В данной ситуации – три полосы. Можете остановиться.(Пункт 12.4 ПДД)","img":"i187.jpg","tp":[7],"p":["12.4"]},{"t":14,"n":13,"q":"При включении зелёного сигнала светофора Вы должны уступить дорогу:","a":["Только грузовому автомобилю, завершающему разворот на перекрёстке","Только легковому автомобилю","Обоим автомобилям"],"c":2,"tip":"Правила предусматривают такую ситуацию. При включении разрешающего сигнала светофора водитель обязан уступить дорогу транспортным средствам, завершающим движение через перекрёсток.У Вас именно такая ситуация – уступаете дорогу всем автомобилям, находящимся в границах перекрестка, в данном случае – обоим автомобилям.(Пункт 13.8 ПДД)","img":"i188.jpg","tp":[8],"p":["13.8"]},{"t":14,"n":14,"q":"Вы намерены проехать перекрёсток в прямом направлении. Кому Вы обязаны уступить дорогу?","a":["Только трамваю А","Только трамваю Б","Обоим трамваям"],"c":2,"tip":"Перекрёсток равнозначный. В равнозначных условиях трамваи имеют преимущество. В данной ситуации траектории движения трамваев не пересекаются, проезжают перекрёсток одновременно. Вы – после них.(Пункт 13.11 ПДД)","img":"i189.jpg","tp":[8],"p":["13.11"]},{"t":14,"n":15,"q":"При повороте налево Вы:","a":["Имеете преимущество","Должны уступить дорогу только автобусу","Должны уступить дорогу легковому автомобилю и автобусу"],"c":1,"tip":"Перекрёсток неравнозначный. Преимущество имеют транспортные средства, находящиеся на главной дороге. При повороте налево следует уступить дорогу транспортным средствам, движущимся прямо со встречного направления. Вы должны уступить только автобусу.(Пункты 13.9, 13.12 ПДД)","img":"i190.jpg","tp":[8],"p":["13.12","13.9"]},{"t":14,"n":16,"q":"Кто из водителей нарушает правила разворота на автомагистрали?","a":["Оба","Только водитель легкового автомобиля","Только водитель грузового автомобиля, выполняющего работы по ремонту или содержанию дорог","Никто не нарушает"],"c":1,"tip":"Совершать разворот в технологических разрывах разделительной полосы с пересечением сплошной линии разметки 1.2.1, разрешено только водителям дорожно-эксплуатационных машин с включенным проблесковым маячком оранжевого или желтого цвета при выполнении работ по ремонту или содержанию дорог 3.5. Другим ТС этот маневр на автомагистрали запрещен 16.1.","img":"i191.jpg","tp":[18],"p":[]},{"t":14,"n":17,"q":"Буксировка двухколесного мотоцикла разрешается:","a":["Только если мотоцикл с боковым прицепом, а водитель соответствующего транспортного средства имеет право на управления транспортными средствами в течение двух и более лет","Если мотоцикл с боковым прицепом","Если водитель соответствующего транспортного средства имеет право на управления транспортными средствами в течение двух и более лет"],"c":0,"tip":"Правила не запрещают буксировку двухколесного мотоцикла с боковым прицепом, равно как и буксировку таким мотоциклом пункт 20.4. При этом управление буксирующим ТС должно осуществляться водителем, имеющим право на управление ТС в течение 2 и более лет пункт 20.2(1). Буксировка такого мотоцикла требует повышенного внимания и осторожности, учитывая его недостаточную устойчивость и ограниченную маневренность.","img":null,"tp":[15],"p":[]},{"t":14,"n":18,"q":"В каком из перечисленных случаев разрешается эксплуатация автомобиля?","a":["Шины имеют отслоения протектора или боковины","Шины имеют порезы, обнажающие корд","Зимние шины имеют восстановленные шипы противоскольжения"],"c":2,"tip":"Не запрещается эксплуатация автомобиля с \"наварными\" шинами, т.е. с восстановленным рисунком протектора, при условии соблюдения требований пункта 5.9 \"Перечня неисправностей\"Иные дефекты шин, перечисленные в других ответах запрещают эксплуатацию ТС.(«Перечень неисправностей» пункт 5.6.)","img":null,"tp":[11],"p":[]},{"t":14,"n":19,"q":"Как влияет длительный разгон транспортного средства с включенной первой передачей на расход топлива?","a":["Расход топлива увеличивается","Расход топлива не изменяется","Расход топлива уменьшается"],"c":0,"tip":"Движение без необходимости на пониженных передачах увеличивает расход топлива.","img":null,"tp":[12],"p":[]},{"t":14,"n":20,"q":"Является ли безопасным движение вне населенного пункта на легковом автомобиле в темное время суток с включенным ближним светом фар по неосвещенному участку дороги со скоростью 90 км/ч?","a":["Является безопасным, поскольку предельная допустимая скорость соответствует требованиям Правил","Является безопасным при малой интенсивности движения","Не является безопасным, поскольку остановочный путь превышает расстояние видимости"],"c":2,"tip":"Расстояние видимости водителем при движении ТС всегда должно превышать остановочный путь. Конструктивно данное условие обеспечивается в темное время суток при движении ТС со скоростью 60 км/ч. Поэтому, движение вне населенного пункта на легковом автомобиле в темное время суток с включенным ближним светом фар по неосвещенному участку дороги со скоростью 90 км/ч не является безопасным, поскольку остановочный путь будет превышать расстояние видимости.В своих действиях за рулем исключите неоправданный риск, который часто заканчивается ДТП.(«Техника управления автомобилем»)","img":null,"tp":[12],"p":[]},{"t":15,"n":1,"q":"Какой неподвижный объект, не позволяющий продолжить движение по полосе, не относится к понятию «Препятствие»?","a":["Дефект проезжей части","Посторонний предмет","Неисправное или повреждённое транспортное средство","Транспортное средство, остановившееся на этой полосе из-за образования затора"],"c":3,"tip":"Не является препятствием затор или транспортное средство, остановившееся на полосе движения в соответствии с требованиями Правил.(Пункт 1.2 ПДД термин «Препятствие»)","img":null,"tp":[0],"p":["1.2"]},{"t":15,"n":2,"q":"Вам можно продолжить движение на перекрёстке:","a":["Только в направлении Б","В направлениях А и Б","В направлениях Б и В"],"c":1,"tip":"Разделительная полоса делит дорогу на проезжие части. Действие знака 4.1.1 «Движение прямо», установленного перед перекрёстком, распространяется только на первое пересечение проезжих частей за знаком. Движение по траектории «В» запрещено. Вы можете двигаться по траектории «А» или «Б».(«Дорожные знаки», пункт 1.2 ПДД)","img":"i192.jpg","tp":[1],"p":["1.2"]},{"t":15,"n":3,"q":"Этот дорожный знак:","a":["Рекомендует двигаться со скоростью 40 км/ч","Требует двигаться со скоростью не менее 40 км/ч","Запрещает движение со скоростью более 40 км/ч"],"c":2,"tip":"Знак 3.24 «Ограничение максимальной скорости» - часто встречающийся знак на наших дорогах. («Дорожные знаки»). Запрещается движение со скоростью (км/ч), превышающей указанную на знаке. За превышение скоростного режима свыше +20 км/ч следует наказание – штраф; свыше +60 км/ч – штраф или лишение прав. Зона действия:1 - От места установки до ближайшего перекрестка, а в н.п. при отсутствии перекрёстка - до конца н.п.2 - Зона действия может ограничиваться табличкой 8.2.1 «Зона действия».3 - До такого же знака с другим значением скорости.4 - До знака 5.23.1 или 5.23.2 «Начало населённого пункта» с белым фоном.5 - До знака 3.25 «Конец зоны ограничения скорости».6 - До знака 3.31 «Конец зоны всех ограничений».(«Дорожные знаки»)","img":"i193.jpg","tp":[1],"p":[]},{"t":15,"n":4,"q":"Какие из указанных табличек указывают протяжённость зоны действия знаков, с которыми они применяются?","a":["Только А","Только Б","Б и В"],"c":2,"tip":"Таблички 8.2.1, 8.2.2 «Зона действия», обозначенные «Б» и «В», указывают зону действия запрещающих знаков. Табличка «А» 8.1.1 «Расстояние до объекта» указывает точное расстояние от знака до начала опасного участка, места введения какого-либо ограничения или определённого объекта, находящегося впереди по ходу движения.(«Дорожные знаки»)","img":"i194.jpg","tp":[1],"p":[]},{"t":15,"n":5,"q":"Разрешён ли Вам такой маневр при выключенных реверсивных светофорах?","a":["Разрешен","Разрешен, если нет встречных транспортных средств","Разрешен только для обгона","Запрещен"],"c":3,"tip":"Прерывистую линию 1.9 горизонтальной разметки, разделяющую транспортные потоки противоположных направлений, при выключенных реверсивных светофорах пересекать ЗАПРЕЩАЕТСЯ.(«Горизонтальная разметка»)","img":"i195.jpg","tp":[2],"p":[]},{"t":15,"n":6,"q":"При таких сигналах светофора и жесте регулировщика Вы должны:","a":["Остановиться у стоп-линии","Продолжить движение только прямо","Продолжить движение прямо или направо"],"c":0,"tip":"Перекрёсток регулируемый. Согласно «принципу приоритетности регулирования дорожного движения» сигналы светофора «не работают». Руководствуемся только сигналами регулировщика, поднятая вверх рука которого запрещает движение всех транспортных средств и пешеходов. При этом водители при наличии стоп-линии должны остановиться перед ней. Исключением являются транспортные средства, которые при поднятии регулировщиком руки вверх не могут остановиться, не прибегая к экстренному торможению.(Пункты 6.10, 6.13, 6.14 ПДД)","img":"i196.jpg","tp":[3],"p":["6.10","6.13","6.14"]},{"t":15,"n":7,"q":"Обязан ли в этой ситуации водитель, остановившийся из-за неисправности, выставить знак аварийной остановки?","a":["Обязан","Обязан, если неисправна аварийная сигнализация","Не обязан"],"c":0,"tip":"При вынужденной остановке в местах, где она запрещена, водитель должен включить аварийную сигнализацию и выставить знак аварийной остановки. Знак аварийной остановки устанавливается вне зависимости от наличия и исправности аварийной сигнализации, на той полосе движения, на которой находится ТС.(Пункты 7.1, 7.2 ПДД)","img":"i197.jpg","tp":[25],"p":["7.1","7.2"]},{"t":15,"n":8,"q":"По какой траектории Вам разрешено продолжить движение налево?","a":["Только по А","Только по Б","По любой из указанных"],"c":2,"tip":"При повороте налево, проезжая перекрёсток, водитель сам определяет траекторию движения, при этом должно быть выполнено условие: автомобиль при пересечении границы проезжих частей должен находиться на своей стороне дороги. По любой из указанных траекторий можете продолжать движение.(Пункт 8.6 ПДД)","img":"i198.jpg","tp":[4],"p":["8.6"]},{"t":15,"n":9,"q":"Как Вам следует действовать, выезжая с места стоянки одновременно с другим автомобилем?","a":["Уступить дорогу","Проехать первым","По взаимной договоренности с водителем этого автомобиля"],"c":0,"tip":"На стоянках, на территориях складов, баз, в поле и т.п. водители при разъезде руководствуются «правилом правой руки», т.е. у кого по траектории движения помеха справа, тот и уступает дорогу. Вы уступаете другому автомобилю.(Пункт 8.9 ПДД)","img":"i199.jpg","tp":[4],"p":["8.9"]},{"t":15,"n":10,"q":"К резкому торможению можно прибегнуть:","a":["Для остановки перед перекрестком или пешеходным переходом, когда зеленый сигнал светофора сменился на желтый","Для предотвращения дорожно-транспортного происшествия","В обоих перечисленных случаях"],"c":1,"tip":"Правилами разрешается применение резкого (экстренного) торможения только для предотвращения дорожно-транспортного происшествия. В остальных случаях используется служебное торможение.(Пункт 10.5 ПДД, «Техника управления автомобилем»)","img":null,"tp":[5],"p":["10.5"]},{"t":15,"n":11,"q":"Разрешается ли на двухполосной дороге выполнять обгон на перекрёстках?","a":["Разрешается","Разрешается только на нерегулируемых перекрёстках","Разрешается только на перекрёстках неравнозначных дорог при движении по главной дороге","Запрещается"],"c":2,"tip":"Обгон запрещён на равнозначных перекрёстках. Допускается производить обгон на неравнозначных перекрёстках при движении по главной дороге.(Пункт 11.4 ПДД)","img":null,"tp":[6],"p":["11.4"]},{"t":15,"n":12,"q":"Кто из водителей нарушил правила остановки?","a":["Оба","Только водитель автомобиля","Только водитель мотоцикла","Никто не нарушил"],"c":0,"tip":"Действие происходит вне населённого пункта. Остановка в таком случае с левой стороны дороги по ходу движения запрещается. Водитель легкового автомобиля явно нарушает правила. Нарушителем является и мотоциклист, так как при наличии обочины для остановки он должен был съехать на неё.(Пункт 12.1 ПДД)","img":"i200.jpg","tp":[7],"p":["12.1"]},{"t":15,"n":13,"q":"В каком случае Вы обязаны пропустить трамвай?","a":["При повороте налево, перестроившись на трамвайные пути попутного направления","При движении прямо","В обоих перечисленных случаях"],"c":2,"tip":"Перекресток регулируется светофором, траектории движения трамвая и ваша пересекаются. Находясь в равнозначных условиях трамвай имеет преимущество перед безрельсовыми Т.С.Вы уступаете дорогу в обоих перечисленных случаях.(Пункты 6.2, 13.6 ПДД)","img":"i201.jpg","tp":[8],"p":["13.6","6.2"]},{"t":15,"n":14,"q":"При движении в прямом направлении, Вам следует:","a":["Проехать перекрёсток первым","Уступить дорогу только трамваю","Уступить дорогу трамваю и легковому автомобилю"],"c":1,"tip":"Перекрёсток равнозначный. Трамвай в равнозначных условиях имеет преимущество перед безрельсовыми транспортными средствами. Проезжает первым. Вы с водителем легкового автомобиля руководствуетесь «правилом правой руки». У Вас помехи справа нет. Проезжаете перекрёсток, уступая только трамваю.(Пункт 13.11 ПДД)","img":"i202.jpg","tp":[8],"p":["13.11"]},{"t":15,"n":15,"q":"Кому Вы должны уступить дорогу при повороте налево?","a":["Только автобусу","Только легковому автомобилю","Никому"],"c":0,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Транспортные средства, находящиеся на главной дороге, имеют преимущество, между собой руководствуются «правилом правой руки». У Вас помеха справа, уступаете автобусу. Легковой автомобиль проедет последним, так как находится на второстепенной дороге.(Пункты 13.9, 13.10, 13.11 ПДД)","img":"i203.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":15,"n":16,"q":"Вам разрешено продолжить движение:","a":["Только по траектории А","Только по траектории Б","По траекториям А или Б","По траекториям Б или В","По любой траектории из указанных"],"c":1,"tip":"При повороте направо транспортное средство должно двигаться по возможности ближе к правому краю. Вы так и поступаете. Поворачиваете на крайнюю полосу, но продолжать движение по ней нельзя, так как согласно знаку 5.14.1 и разметки 1.23.1 (в виде буквы «А») она предназначена для движения маршрутных транспортных средств и ТС используемых в качестве легкового такси, а также велосипедистов и «школьных автобусов». Поэтому перестраиваетесь по траектории «Б» на соседнюю полосу.(Пункты 8.6, 18.2 ПДД, «Дорожные знаки»)","img":"i204.jpg","tp":[24],"p":["18.2","8.6"]},{"t":15,"n":17,"q":"Привлечь внимание водителя обгоняемого автомобиля при движении вне населенного пункта в светлое время суток можно:","a":["Только подачей звукового сигнала","Только кратковременным переключением фар с ближнего света на дальний","Только совместной подачей указанных сигналов","Любым из перечисленных способов"],"c":3,"tip":"Для предупреждения и привлечения внимания водителя обгоняемого автомобиля при движении вне населенного пункта Вы можете воспользоваться звуковым сигналом, либо кратковременным переключением фар с ближнего света на дальний, включая и совместную подачу этих сигналов.(Пункты 19.10, 19.11 ПДД)","img":null,"tp":[20],"p":["19.10","19.11"]},{"t":15,"n":18,"q":"Эксплуатация мотоцикла запрещается:","a":["Только при отсутствии предусмотренных конструкцией подножек, поперечных рукояток для пассажиров на седле","Только при отсутствии предусмотренных конструкцией дуг безопасности","При отсутствии всего перечисленного оборудования"],"c":2,"tip":"Пункт 9.8 «Перечня неисправностей» запрещает эксплуатацию мотоцикла при отсутствии всего перечисленного оборудования.(«Перечень неисправностей» ).","img":null,"tp":[11],"p":[]},{"t":15,"n":19,"q":"Как следует выбирать передачу при торможении двигателем с учетом крутизны спуска?","a":["Чем круче спуск, тем выше передача","Чем круче спуск, тем ниже передача","Выбор передачи не зависит от крутизны спуска"],"c":1,"tip":"Такую зависимость эффективности торможения водитель может использовать на крутых спусках, на автомобиле, имеющем механическую коробку перемены передач или перейти в ручной режим для выбора передачи на автоматизированных КПП.","img":null,"tp":[12],"p":[]},{"t":15,"n":20,"q":"О каких травмах у пострадавшего может свидетельствовать поза «лягушки» (ноги согнуты в коленях и разведены, а стопы развернуты подошвами друг к другу) и какую первую помощь необходимо при этом оказать?","a":["У пострадавшего могут быть ушиб брюшной стенки, перелом лодыжки, перелом костей стопы. При первой помощи вытянуть ноги, наложить шины на обе ноги от голеностопного сустава до подмышки.","У пострадавшего могут быть переломы шейки бедра, костей таза, перелом позвоночника, повреждение внутренних органов малого таза, внутреннее кровотечение. Позу ему не менять, ноги не вытягивать, шины не накладывать. При первой помощи подложить под колени валик из мягкой ткани, к животу по возможности приложить холод.","У пострадавшего могут быть переломы костей голени и нижней трети бедра. При первой помощи наложить шины только на травмированную ногу от голеностопного до коленного сустава, не вытягивая ногу."],"c":1,"tip":"Правильный ответ тот, в котором указан перелом позвоночника.Вынужденную позу «лягушки» у пострадавшего не следует менять. Ноги не вытягивать, шины не накладывать.","img":null,"tp":[16],"p":[]},{"t":16,"n":1,"q":"При наличии каких условий в случаях вынужденной остановки транспортного средства или дорожно-транспортного происшествия водитель обязан быть одетым в куртку, жилет или жилет-накидку с полосами световозвращающего материала?","a":["Если это произошло вне населенных пунктов","Если это произошло в темное время суток либо в условиях ограниченной видимости","Если водитель находится на проезжей части или обочине","При наличии всех перечисленных условий"],"c":3,"tip":"В темное время суток, либо в условиях ограниченной видимости за пределами населенных пунктов при нахождении на проезжей части или обочине нужно быть одетым в куртку, жилет или жилет-накидку с полосами световозвращающего материала 2.3.4.(Изменение с 18 марта 2018)","img":null,"tp":[23],"p":[]},{"t":16,"n":2,"q":"В какой из дворов Вам можно въехать в данной ситуации?","a":["Повороты во дворы запрещены","Только во двор направо","Только во двор налево","В любой"],"c":1,"tip":"Знак 4.1.1 «Движение прямо» установлен за пересечением проезжих частей, т.е в начале участка дороги. Действие его в этом случае распространяется до следующего перекрёстка, при этом не запрещается совершать поворот направо во дворы и на прилегающие территории. Соответственно можете повернуть только во двор направо.(«Дорожные знаки»)","img":"i205.jpg","tp":[1],"p":[]},{"t":16,"n":3,"q":"Какой из указанных знаков запрещает дальнейшее движение всех без исключения транспортных средств?","a":["А","Б","В"],"c":1,"tip":"Знак «Б» - 3.17.2 «Опасность» запрещает дальнейшее движение всех без исключения транспортных средств. Необходимо понимать, что знак устанавливается в местах, угрожающих жизни и здоровью людей.(«Дорожные знаки»)","img":"i206.jpg","tp":[1],"p":[]},{"t":16,"n":4,"q":"О чём информируют эти знаки?","a":["Разрешенная скорость не более 40 км/ч при влажном покрытии","Рекомендуемая скорость 40 км/ч при влажном покрытии","Рекомендуемая скорость не более 40 км/ч только во время дождя"],"c":1,"tip":"Табличка 8.16 «Влажное покрытие» указывает, что действие знака 6.2 «Рекомендуемая скорость» распространяется на период времени, когда покрытие проезжей части влажное. В данном случае действие распространяется до ближайшего перекрёстка.(«Дорожные знаки»)","img":"i207.jpg","tp":[1],"p":[]},{"t":16,"n":5,"q":"Разрешена ли Вам остановка в этом месте?","a":["Разрешена","Разрешена без заезда на тротуар","Запрещена"],"c":2,"tip":"Сплошная линия разметки 1.4 жёлтого цвета обозначает места, где запрещена остановка. Применяется самостоятельно или в сочетании со знаком 3.27 «Остановка запрещена». Действие её распространяется также на ту сторону дороги, где она нанесена. Прилегающий тротуар является частью стороны дороги. Остановка Вам на всей длине разметки запрещена.(«Горизонтальная разметка»)","img":"i208.jpg","tp":[2],"p":[]},{"t":16,"n":6,"q":"Как следует поступить водителю при переключении такого сигнала светофора?","a":["При включении красного сигнала повернуть направо, уступая дорогу другим участникам движения","При включении зеленого сигнала продолжить движение только направо","Указанные действия являются правильными в обоих случаях"],"c":1,"tip":"Сигналы светофора, выполненные в виде стрелок красного, желтого и зеленого цветов, имеют то же значение, что и круглые сигналы соответствующего цвета, но их действие распространяется только на направление (направление указанное стрелками). Обычно такими светофорами регулируется движение по полосам.При включении только зеленого сигнала можно продолжить движение направо.","img":"i209.jpg","tp":[3],"p":[]},{"t":16,"n":7,"q":"Аварийная сигнализация на буксируемом механическом транспортном средстве должна быть включена:","a":["Только в условиях недостаточной видимости","Только в темное время суток","Во всех случаях, когда осуществляется буксировка"],"c":2,"tip":"Во всех случаях при буксировке на буксируемом механическом транспортном средстве должна быть включена аварийная сигнализация.(Пункт 7.1 ПДД)","img":null,"tp":[25],"p":["7.1"]},{"t":16,"n":8,"q":"Обязан ли водитель автомобиля, который движется по левой полосе, уступить дорогу в данной ситуации?","a":["Обязан","Не обязан"],"c":1,"tip":"При перестроении водитель должен уступить дорогу транспортным средствам, движущимся попутно без изменения направления движения. Водитель автомобиля движущегося по левой полосе «хозяин» этой полосы, поэтому уступать не обязан.(Пункт 8.4 ПДД)","img":"i210.jpg","tp":[4],"p":["8.4"]},{"t":16,"n":9,"q":"Можно ли Вам на перекрёстке выполнить разворот, двигаясь задним ходом?","a":["Можно","Можно, если при этом не будут созданы помехи другим участникам движения","Нельзя"],"c":2,"tip":"Движение задним ходом на перекрёстках запрещено.(Пункт 8.12 ПДД)","img":"i211.jpg","tp":[4],"p":["8.12"]},{"t":16,"n":10,"q":"С какой максимальной скоростью Вы имеете право продолжить движение вне населенных пунктов на легковом автомобиле?","a":["60 км/ч","90 км/ч","110 км/ч"],"c":1,"tip":"Действие происходит вне населённого пункта. После проезда знака 3.25 «Конец зоны ограничения максимальной скорости» Вам разрешается движение с максимальной скоростью 90 км/ч.(«Дорожные знаки», пункт 10.3 ПДД)","img":"i212.jpg","tp":[5],"p":["10.3"]},{"t":16,"n":11,"q":"Разрешается ли Вам выполнить обгон в данной ситуации?","a":["Разрешается","Разрешается, только если скорость трактора менее 30 км/ч","Запрещается"],"c":0,"tip":"Перед Вами неравнозначный перекресток. Вы находитесь на главной дороге. Правила обгона разрешают в данной ситуации производить обгон любого транспортного средства.(Пункт 11.4 ПДД)","img":"i213.jpg","tp":[6],"p":["11.4"]},{"t":16,"n":12,"q":"В каком из указанных мест Вы можете поставить автомобиль на стоянку?","a":["Только В","Б или В","В любом"],"c":0,"tip":"В местах «А» и «Б» останавливаться нельзя, так как остановка с левой стороны дороги по ходу движения разрешается только в населённом пункте, обозначенном знаком 5.23.1 и 5.23.2 «Начало населённого пункта» с белым фоном. Правильно поступил бы водитель, остановившись в месте «В».(Пункт 12.1 ПДД)","img":"i214.jpg","tp":[7],"p":["12.1"]},{"t":16,"n":13,"q":"Вы намерены проехать перекрёсток в прямом направлении. Кому вы должны уступить дорогу?","a":["Трамваю и автомобилю","Только трамваю","Никому"],"c":1,"tip":"Перекрёсток регулируемый. Трамвай в равнозначных условиях имеет преимущество перед безрельсовыми транспортными средствами. Проезжает первым. Легковой автомобиль при повороте налево обязан уступить дорогу транспортным средствам, движущимся со встречного направления прямо и направо. Вы уступаете дорогу только трамваю.(Пункты 13.3, 13.4, 13.6 ПДД)","img":"i215.jpg","tp":[8],"p":["13.3","13.4","13.6"]},{"t":16,"n":14,"q":"При въезде на перекрёсток Вы:","a":["Должны уступить дорогу обоим транспортным средствам","Должны уступить дорогу только автомобилю","Имеете преимущество перед обоими транспортными средствами"],"c":0,"tip":"При въезде на перекресток, на котором организовано круговое движение, обозначенный знаком 4.3 «Круговое движение», Вы обязаны уступить дорогу всем ТС, движущимся по такому перекрестку.(Пункт 13.11.1 ПДД)(Изменения ПДД от 8 ноября 2017)","img":"i216.jpg","tp":[8],"p":["13.11"]},{"t":16,"n":15,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Только автобусу","Только легковому автомобилю","Обоим транспортным средствам"],"c":2,"tip":"Перекрёсток неравнозначный. Преимущество имеют транспортные средства, находящиеся на главной дороге. Вы находитесь на второстепенной дороге и уступаете обоим транспортным средствам, независимо от направления их дальнейшего движения.(«Дорожные знаки», пункт 13.9 ПДД)","img":"i217.jpg","tp":[8],"p":["13.9"]},{"t":16,"n":16,"q":"Разрешено ли Вам остановиться на автомагистрали правее линии, обозначающей край проезжей части?","a":["Разрешено","Разрешено только в случае вынужденной остановки","Запрещено"],"c":1,"tip":"На автомагистрали запрещается остановка вне специально выделенных мест. Для вывода транспортного средства с проезжей части на предназначенную полосу в случае вынужденной остановки необходимо пересечь сплошную линию горизонтальной разметки, расположенную справа и обозначающую край проезжей части.(«Горизонтальная разметка» 1.2, пункты 16.1, 16.2 ПДД)","img":"i218.jpg","tp":[18],"p":["1.2","16.1","16.2"]},{"t":16,"n":17,"q":"Какие из перечисленных требований являются обязательными при перевозке детей?","a":["Перевозка детей в возрасте до 11 лет (включительно) на переднем сиденье легкового автомобиля должна осуществляться только с использованием соответствующих детских удерживающих систем (устройств), соответствующих весу и росту ребенка","Запрещается перевозка детей в возрасте младше 12 лет на заднем сиденье мотоцикла","Оба требования являются обязательными"],"c":2,"tip":"ПДД РФ запрещают перевозить ребёнка до 12 летнего возраста на заднем сиденье мотоцикла, а на переднем сиденье легкового автомобиля его можно перевозить только с использованием детского удерживающего устройства, соответствующего весу и росту ребенка. Пункт 22.9 ПДД РФ.","img":null,"tp":[10],"p":[]},{"t":16,"n":18,"q":"Запрещается эксплуатация легкового автомобиля, если стояночная тормозная система не обеспечивает неподвижное состояние автомобиля в снаряженном состоянии на уклоне:","a":["До 16% включительно","До 23% включительно","До 31% включительно"],"c":1,"tip":"«Перечень неисправностей» запрещает эксплуатацию легковых автомобилей, если стояночная тормозная система не обеспечивает неподвижное состояние их на уклоне до 23 процентов включительно.(«Перечень неисправностей» пункт 1.9).","img":null,"tp":[11],"p":[]},{"t":16,"n":19,"q":"При повороте направо обеспечение безопасности движения достигается путем выполнения поворота по траектории, которая показана:","a":["На левом рисунке","На правом рисунке","На обоих рисунках"],"c":0,"tip":"Центробежная сила тянет автомобиль влево. Для компенсации этих сил у водителя на левом рисунке ещё есть запас по ширине проезжей части для сохранения направления движения без выезда на полосу встречного движения. У водителя на правом рисунке никакого запаса нет, а учесть все факторы, которые влияют на сцепление колёс с дорогой на крутом повороте, не всегда удаётся и опытному водителю.(«Техника управления автомобилем»)","img":"i219.jpg","tp":[12],"p":[]},{"t":16,"n":20,"q":"Как определить наличие дыхания у потерявшего сознание пострадавшего?","a":["Взять пострадавшего за подбородок, запрокинуть голову и в течение 10 секунд проследить за движением его грудной клетки","Положить одну руку на лоб пострадавшего, двумя пальцами другой поднять подбородок и, запрокинув голову, наклониться к его лицу и в течение 10 секунд прислушаться к дыханию, постараться ощутить выдыхаемый воздух своей щекой, проследить за движением грудной клетки","Не запрокидывая головы пострадавшего, наклониться к его лицу и в течение 10 секунд прислушаться к дыханию, почувствовать его своей щекой, проследить за движением его грудной клетки"],"c":1,"tip":"У потерявшего сознание пострадавшего дыхание может не определяться из-за западания языка, перекрывающего поступление воздуха в дыхательные пути. Для определения наличия дыхания необходимо сначала восстановить проходимость дыхательных путей пострадавшего. Положить одну руку на лоб пострадавшего, двумя пальцами другой поднять подбородок и, запрокинув голову, наклониться к его лицу и в течение 10 секунд прислушаться к дыханию, постараться ощутить выдыхаемый воздух своей щекой, проследить за движением грудной клетки.","img":null,"tp":[16],"p":[]},{"t":17,"n":1,"q":"Являются ли тротуары и обочины частью дороги?","a":["Являются","Являются только обочины","Не являются"],"c":0,"tip":"«Дорога» – обустроенная или приспособленная и используемая для движения транспортных средств полоса земли либо поверхность искусственного сооружения. Дорога включает в себя одну или несколько проезжих частей, а также трамвайные пути, тротуары, обочины и разделительные полосы при их наличии.Пункт 1.2 термин «Дорога».","img":null,"tp":[0],"p":[]},{"t":17,"n":2,"q":"На каком расстоянии до неровного участка дороги устанавливается этот знак вне населённого пункта?","a":["150-300 м","50-100 м","Непосредственно перед неровным участком дороги"],"c":0,"tip":"Как и большинство предупреждающих знаков, знак 1.16 «Неровная дорога» устанавливается вне населённого пункта за 150-300 м до опасного участка дороги.(«Дорожные знаки»)","img":"i220.jpg","tp":[1],"p":[]},{"t":17,"n":3,"q":"Требования каких знаков из указанных вступают в силу непосредственно в том месте, где они установлены?","a":["Только Б","А и Б","Всех"],"c":1,"tip":"Действие запрещающего знака 3.24 «Ограничение максимальной скорости» распространяется от места установки до ближайшего перекрёстка, а при отсутствии перекрёстка - до конца населённого пункта («Б»). Зона действия может ограничиваться, например, табличкой 8.2.1 «Зона действия» («А»).3нак действует 100 м от его места установки. Табличка 8.1.1 под знаком («В») «Расстояние до объекта» указывает расстояние от знака до места начала его действия.(«Дорожные знаки»)","img":"i221.jpg","tp":[1],"p":[]},{"t":17,"n":4,"q":"Вам разрешено продолжить движение:","a":["По траекториям Б или В","По траекториям А или В","По любой траектории из указанных"],"c":1,"tip":"Знак 6.3.1 «Место для разворота» запрещает поворот налево для всех видов транспортных средств. Из указанных направлений нельзя продолжать движение по траектории «Б». Вам разрешено движение по траектории «А» или «В». («Дорожные знаки»).","img":"i222.jpg","tp":[1],"p":[]},{"t":17,"n":5,"q":"Можно ли Вам выполнить обгон при наличии данной разметки?","a":["Можно","Можно, если скорость трактора менее 30 км/ч","Нельзя"],"c":2,"tip":"Горизонтальную разметку 1.11 разрешается пересекать со стороны прерывистой линии для обгона или объезда. С Вашей стороны - сплошная линия. В такой ситуации пересекать ее нельзя.(«Горизонтальная разметка»)","img":"i223.jpg","tp":[2],"p":[]},{"t":17,"n":6,"q":"В каком месте Вам следует остановиться?","a":["Перед светофором","Перед пересекаемой проезжей частью","В любом из перечисленных"],"c":0,"tip":"Знак 6.16 «Стоп-линия» указывает место остановки транспортных средств при запрещающем сигнале светофора (регулировщика). Вам «горит красный» - в данной ситуации останавливаетесь перед светофором, т.к. он размещён со знаком 6.16 на одной опоре.(«Дорожные знаки», пункт 6.2 ПДД)","img":"i224.jpg","tp":[3],"p":["6.2"]},{"t":17,"n":7,"q":"На каком расстоянии от транспортного средства должен быть выставлен знак аварийной остановки в данной ситуации?","a":["Не менее 10 м","Не менее 15 м","Не менее 20 м","Не менее 30 м"],"c":1,"tip":"Действие происходит в населённом пункте. В этом случае знак аварийной остановки устанавливается на расстоянии не менее 15 м от транспортного средства.(Пункт 7.2 ПДД)","img":"i225.jpg","tp":[25],"p":["7.2"]},{"t":17,"n":8,"q":"Разрешено ли Вам выполнить поворот направо в данной ситуации?","a":["Разрешено","Разрешено, если при этом не будут созданы помехи транспортным средствам, движущимся с других направлений","Запрещено"],"c":2,"tip":"Вы находитесь на левой полосе, с которой совершить поворот направо нельзя. Для поворота направо необходимо было заблаговременно перестроиться на правую полосу.(Пункты 8.5, 6.3 ПДД)","img":"i226.jpg","tp":[4],"p":["6.3","8.5"]},{"t":17,"n":9,"q":"Можно ли Вам выполнить разворот по данной траектории?","a":["Можно","Можно, если ширина проезжей части недостаточна для выполнения маневра из крайнего левого положения","Нельзя"],"c":1,"tip":"Если при развороте вне перекрестка ширина проезжей части недостаточна для выполнения маневра из крайнего левого положения, его допускается производить от правого края проезжей части (с правой обочины). При этом водитель должен уступить дорогу попутным и встречным транспортным средствам.(Пункт 8.8 ПДД)","img":"i227.jpg","tp":[4],"p":["8.8"]},{"t":17,"n":10,"q":"Разрешается ли водителю движение со слишком малой скоростью?","a":["Разрешается","Разрешается, если при этом не создаются помехи другим транспортным средствам","Запрещается"],"c":1,"tip":"Водителю разрешается движение с относительно малой скоростью по отношению к другим транспортным средствам, если при этом не создаются помехи другим транспортным средствам.(Пункт 10.5 ПДД)","img":null,"tp":[5],"p":["10.5"]},{"t":17,"n":11,"q":"Можно ли Вам начать обгон в населённом пункте?","a":["Можно","Можно, если обгон будет завершен до переезда","Нельзя"],"c":2,"tip":"Обгон на железнодорожных переездах и ближе, чем за 100 м перед ними, запрещён. Трактор согласно знаку 1.2 «Железнодорожной переезд без шлагбаума», который в населённом пункте устанавливается за 50-100 м, находится уже в зоне запрещения обгона. Теперь начать обгон сможете только за железнодорожным переездом.(«Дорожные знаки», пункт 11.4 ПДД)","img":"i228.jpg","tp":[6],"p":["11.4"]},{"t":17,"n":12,"q":"В каком месте на данном участке дороги Вам разрешено поставить автомобиль на длительную стоянку?","a":["В любом месте на обочине","Только через 500 м на специальной площадке","Во всех перечисленных местах"],"c":1,"tip":"Стоянка с целью длительного отдыха, ночлега и т.п. вне населённого пункта разрешается только на предусмотренных для этого площадках или за пределами дорог. О наличии такой площадки Вас информирует знак сервиса 7.11 «Место отдыха». Цифра на знаке указывает расстояние до этого места.(«Дорожные знаки», пункт 12.3 ПДД)","img":"i229.jpg","tp":[7],"p":["12.3"]},{"t":17,"n":13,"q":"Обязаны ли Вы уступить дорогу автобусу?","a":["Обязаны","Не обязаны"],"c":0,"tip":"«Правило правой руки» универсально. Оно не работает в двух случаях – один из случаев, когда ТС движется под дополнительную секцию, включенную одновременно с основным желтым или красным сигналом. В данной ситуации Вы обязаны уступить дорогу всем ТС, движущимся с других направлений. Вы обязаны уступить дорогу автобусу.(Пункт 13.5 ПДД)","img":"i230.jpg","tp":[8],"p":["13.5"]},{"t":17,"n":14,"q":"Вы намерены повернуть налево. Ваши действия?","a":["Уступите дорогу обоим грузовым автомобилям","Выехав на перекрёсток, уступите дорогу встречному грузовому автомобилю и завершите поворот","Проедете перекресток первым"],"c":0,"tip":"Перекрёсток равнозначный. При «разводке» транспортных средств руководствуемся «правилом правой руки», т.е. у кого помеха справа, тот и уступает. Первым проедет грузовик, движущийся прямо, после него грузовик с маячком оранжевого цвета (который не предоставляет «преимущество»), последним Вы.(«Дорожные знаки», пункт 13.11 ПДД)","img":"i231.jpg","tp":[8],"p":["13.11"]},{"t":17,"n":15,"q":"После въезда на этот перекресток:","a":["Вы должны уступить дорогу легковому автомобилю, въезжающему на него","Вы будете иметь преимущество перед легковым автомобилем, въезжающим на него","Вам следует действовать по взаимной договоренности с водителем легкового автомобиля"],"c":1,"tip":"После въезда на перекресток, на котором организовано круговое движение, обозначенный знаком 4.3 «Круговое движение», Вы будете иметь преимущество в движении перед легковым автомобилем, поскольку при въезде на этот перекресток его водитель обязан уступить дорогу ТС, движущимся по нему п. 13.11.1.(Изменения ПДД от 8 ноября 2017)","img":"i232.jpg","tp":[8],"p":[]},{"t":17,"n":16,"q":"Кто из водителей должен уступить дорогу трамваю?","a":["Оба","Только водитель грузового автомобиля","Только водитель легкового автомобиля","Никто из водителей"],"c":3,"tip":"Вне перекрёстков, где трамвайные пути пересекают проезжую часть, трамвай имеет преимущество перед безрельсовыми транспортными средствами, кроме случаев выезда из депо. Здесь именно такой случай. Поэтому никто из водителей не уступает дорогу трамваю.(Пункт 18.1 ПДД)","img":"i233.jpg","tp":[24],"p":["18.1"]},{"t":17,"n":17,"q":"Можно ли буксировать автомобиль с недействующей тормозной системой, если фактическая масса этого автомобиля превышает половину фактической массы Вашего автомобиля?","a":["Можно","Можно только при скорости буксировки не более 30 км/ч","Нельзя"],"c":2,"tip":"Запрещается буксировать автомобиль с недействующей тормозной системой на гибкой сцепке, на жесткой сцепке, путём частичной погрузки - во всех случаях, если фактическая масса буксируемого ПРЕВЫШАЕТ ПОЛОВИНУ фактической массы Вашего автомобиля (буксирующего).(Пункт 20.4 ПДД)","img":null,"tp":[15],"p":["20.4"]},{"t":17,"n":18,"q":"При совершении административного правонарушения, влекущего задержание транспортного средства, оно задерживается до:","a":["Составления протокола об административном правонарушении","Устранения причины задержания","Рассмотрения дела об административном правонарушении"],"c":1,"tip":"Согласно ст. 27.13 ч.1 КоАП при совершении административного правонарушения, влекущего задержание ТС, оно задерживается до устранения причины задержания.«Кодекс РФ об административных правонарушениях».","img":null,"tp":[22],"p":[]},{"t":17,"n":19,"q":"Как изменяется длина тормозного пути легкового автомобиля при движении с прицепом, не имеющим тормозной системы?","a":["Уменьшается, так как прицеп оказывает дополнительное сопротивление движению","Не изменяется","Увеличивается"],"c":2,"tip":"Управление легковым автомобилем с прицепом требует определённых навыков. Следует учитывать, что тормозной путь увеличивается, и значительно, происходит перераспределение нагрузки по осям, особенно это отражается при езде на переднеприводных автомобилях. Центробежная сила, инерционная сила незакрепленного груза в прицепе, воздействуя на буксирный крюк автомобиля, резко меняют его поведение, особенно при криволинейном движении. Поэтому скоростной режим автомобилей с прицепом Правилами несколько ограничен.(«Техника управления автомобилем»)","img":null,"tp":[12],"p":[]},{"t":17,"n":20,"q":"В тёмное время суток и в пасмурную погоду скорость встречного автомобиля воспринимается:","a":["Ниже, чем в действительности","Восприятие скорости не меняется","Выше, чем в действительности"],"c":0,"tip":"В темное время суток и в пасмурную погоду скорость встречного автомобиля воспринимается ниже, чем в действительности.","img":null,"tp":[12],"p":[]},{"t":18,"n":1,"q":"Что означает термин «Обгон»?","a":["Опережение одного или нескольких транспортных средств, связанное с выездом на полосу (сторону проезжей части), предназначенную для встречного движения, и последующим возвращением на ранее занимаемую полосу (сторону проезжей части)","Опережение одного или нескольких транспортных средств, связанное с выездом из занимаемой полосы","Любое опережение одного или нескольких транспортных средств"],"c":0,"tip":"«Обгон» - опережение одного или нескольких транспортных средств, связанное с выездом на полосу (сторону проезжей части), предназначенную для встречного движения, и последующим возвращением на ранее занимаемую полосу (сторону проезжей части).(Пункт 1.2 ПДД термин «Обгон»).Если рассматривать в контексте термин «Обгон», «Опережение», пункты 9.2, 9.3, раздел 11 «Обгон, опережение, встречный разъезд», то следует вывод: «Обгон можно производить только на дорогах с двусторонним движением, имеющих две или три полосы движения.","img":null,"tp":[0],"p":["1.2"]},{"t":18,"n":2,"q":"Этот дорожный знак предупреждает:","a":["О приближении к скользкому участку дороги","О приближении к мокрому или загрязнённому участку дороги","О приближении к участку дороги, где возможен выброс гравия (щебня) из-под колёс"],"c":2,"tip":"Предупреждающий знак 1.18 «Выброс гравия» устанавливается вне населённого пункта за 150-300 м до опасного участка. При проезде этого участка следует по возможности увеличить интервал и дистанцию между автомобилями, снизить скорость. Летящие щебень, гравий могут «травмировать» лобовое стекло, стёкла фар автомобиля. На наших дорогах это не редкость.(«Дорожные знаки»)","img":"i234.jpg","tp":[1],"p":[]},{"t":18,"n":3,"q":"Разрешено ли Вам ставить автомобиль на стоянку в этом месте по четным числам месяца?","a":["Разрешено","Разрешено только после 21 часа","Запрещено"],"c":0,"tip":"Действие запрещающих стоянку знаков начинается от места их установки. Вы же намереваетесь поставить автомобиль на стоянку до знака, т.е. вне его действия. Однозначно разрешено.(«Дорожные знаки», пункт 12.1 ПДД)","img":"i235.jpg","tp":[1],"p":["12.1"]},{"t":18,"n":4,"q":"Какие из указанных знаков информируют о том, что на данной дороге действуют требования Правил, устанавливающие порядок движения в населённых пунктах?","a":["Только А","А и Б","Все"],"c":1,"tip":"Знаки «А» и «Б» - 5.23.1 и 5.23.2 «Начало населённого пункта» (с белым фоном).(«Дорожные знаки»)","img":"i236.jpg","tp":[1],"p":[]},{"t":18,"n":5,"q":"В данной ситуации Вы:","a":["Должны остановиться у знака","Должны остановиться у стоп-линии","Можете при отсутствии других транспортных средств проехать перекрёсток без остановки"],"c":1,"tip":"Знак 2.5 «Движение без остановки запрещено» установлен перед пересечением проезжих частей. При наличии стоп-линии (разметка 1.12) запрещается движение без остановки перед стоп-линией.(«Дорожные знаки», «Горизонтальная разметка»)","img":"i237.jpg","tp":[2],"p":[]},{"t":18,"n":6,"q":"В каком направлении Вам разрешено движение?","a":["Только налево и в обратном направлении","Прямо, налево и в обратном направлении","В любом"],"c":1,"tip":"При таком жесте регулировщика со стороны левого бока безрельсовым транспортным средствам разрешается движение во всех направлениях, но при этом должна учитываться «рядность» расположения. С левой полосы можете продолжить движение прямо, налево или развернуться, для движения в обратном направлении.(Пункты 6.10, 8.5 ПДД)","img":"i238.jpg","tp":[3],"p":["6.10","8.5"]},{"t":18,"n":7,"q":"Вы намерены остановиться слева у тротуара. В каком случае Вы обязаны включить указатели поворота?","a":["Перед перестроением","Перед остановкой","В обоих перечисленных случаях"],"c":2,"tip":"Для остановки с левой стороны дороги по ходу вашего движения необходимо совершить перестроение. Заблаговременное включение левого указателя поворота обязательно. Обязательное его включение и перед остановкой.Правильный ответ - в обоих перечисленных случаях.","img":"i239.jpg","tp":[4],"p":[]},{"t":18,"n":8,"q":"Вам можно продолжить движение:","a":["Только по траектории А","По траекториям А или В","По любой траектории из указанных"],"c":1,"tip":"Стрелка на знаке 5.7.1 «Выезд на дорогу с односторонним движением» указывает направление движения на дороге с односторонним движением. Пересечение дороги не запрещается (траектория «В»). Запрещается поворот налево, т.е. движение во встречном направлении. При повороте направо транспортное средство должно двигаться по возможности ближе к правому краю проезжей части. У Вас такая возможность есть. Можете повернуть по траектории «А».(Пункт 8.6 ПДД, «Дорожные знаки»)","img":"i240.jpg","tp":[4],"p":["8.6"]},{"t":18,"n":9,"q":"По какой траектории Вы имеете право выполнить разворот?","a":["По любой из указанных","Только на перекрестке — по траектории А","Только перед перекрестком — по траектории Б","По указанным траекториям разворот запрещен"],"c":1,"tip":"Знак 4.1.1 «Движение прямо» установлен за пересечением проезжих частей, в начале участка дороги. В таком случае он действует до первого перекрестка за знаком. Вы можете выполнить разворот только на перекрестке – по траектории «А».","img":"i241.jpg","tp":[4],"p":[]},{"t":18,"n":10,"q":"В каких из перечисленных случаев разрешается движение в населенных пунктах со скоростью не более 20 км/ч?","a":["При движении в жилых зонах и на дворовых территориях","При движении в велосипедных зонах","Во всех перечисленных случаях"],"c":2,"tip":"Во всех перечисленных случаев разрешается движение в населенных пунктах со скоростью не более 20 км/ч.(Пункт 10.2 ПДД)","img":null,"tp":[5],"p":["10.2"]},{"t":18,"n":11,"q":"Можно ли водителю легкового автомобиля начать обгон?","a":["Можно","Можно, если грузовой автомобиль А двигается со скоростью менее 30 км/час","Нельзя"],"c":2,"tip":"Водитель грузовика «Б», движущегося позади легкового автомобиля, уже приступил к обгону. Помеху ему создавать нельзя.(Пункт 11.2 ПДД)","img":"i242.jpg","tp":[6],"p":["11.2"]},{"t":18,"n":12,"q":"Кто нарушил правила остановки?","a":["Оба водителя","Только водитель грузового автомобиля","Только водитель легкового автомобиля","Никто не нарушил"],"c":1,"tip":"До края пересекаемой проезжей части у обоих водителей расстояние соответствует правилам остановки. Но водитель грузовика не учёл, что между транспортным средством и сплошной линией разметки, разделяющей полосы движения, расстояние менее 3 м, что и является причиной нарушения.(Пункт 12.4 ПДД)","img":"i243.jpg","tp":[7],"p":["12.4"]},{"t":18,"n":13,"q":"Обязаны ли Вы уступить дорогу легковому автомобилю при повороте направо?","a":["Обязаны","Обязаны, если легковой автомобиль поворачивает налево","Не обязаны"],"c":2,"tip":"Перекрёсток регулируемый. Знаки приоритета «не работают». При повороте налево водитель легкового автомобиля обязан уступить дорогу транспортным средствам, движущимся со встречного направления прямо или направо. У Вас преимущество.(Пункты 13.3, 13.4 ПДД)","img":"i244.jpg","tp":[8],"p":["13.3","13.4"]},{"t":18,"n":14,"q":"Вы намерены выполнить разворот. Ваши возможные действия?","a":["Отказаться от преимущества в движении и приступить к развороту после проезда легкового автомобиля","Выехать на перекресток первым и, уступив дорогу легковому автомобилю, закончить разворот","Допускаются оба варианта действий"],"c":2,"tip":"Перекрёсток равнозначный. Водители ТС, траектории которых пересекаются в границах перекрестка, руководствуются «правилом правой руки».Правильный ответ – допускаются оба варианта действий.(Пункт 13.11 ПДД)","img":"i245.jpg","tp":[8],"p":["13.11"]},{"t":18,"n":15,"q":"Вы намерены проехать перекрёсток в прямом направлении. В данной ситуации:","a":["Вы обязаны уступить дорогу грузовому автомобилю","Вы имеете право проехать перекресток первым"],"c":1,"tip":"Перекрёсток неравнозначный. Специальный жёлтый мигающий сигнал на грузовике преимуществ не предоставляет. Транспортные средства находятся на равнозначной дороге. При повороте налево водитель грузовика обязан уступить дорогу Вам, движущемуся прямо со встречного направления.Проезжаете перекресток первым.(«Дорожные знаки», пункты 3.4, 13.12 ПДД)","img":"i246.jpg","tp":[8],"p":["13.12","3.4"]},{"t":18,"n":16,"q":"Обязаны ли Вы уступить дорогу маршрутному транспортному средству, отъезжающему от тротуара, где нет обозначенного места остановки ?","a":["Обязаны","Не обязаны, если Вы управляете легковым такси","Не обязаны"],"c":2,"tip":"Маршрутным транспортным средствам приоритет предоставляется только в начале движения от обозначенных для них остановок, в населённых пунктах, обозначенных знаками «начало населённого пункта» с белым фоном. В других местах этой «льготой» они не пользуются ни при каких обстоятельствах.(Пункт 18.3 ПДД)","img":"i247.jpg","tp":[24],"p":["18.3"]},{"t":18,"n":17,"q":"Разрешено ли перевозить людей в буксируемом легковом автомобиле?","a":["Разрешено","Разрешено только при буксировке на гибкой или жесткой сцепке","Запрещено"],"c":1,"tip":"Перевозить людей в буксируемом легковом автомобиле разрешено только при буксировке на гибкой или жесткой сцепке.(Пункт 20.2 ПДД)","img":null,"tp":[15],"p":["20.2"]},{"t":18,"n":18,"q":"За какие административные правонарушения в области дорожного движения предусмотрено наказание в виде обязательных работ?","a":["За управление транспортным средством водителем, не имеющим права управления транспортным средством (за исключением учебной езды)","За управление транспортным средством водителем, лишенным права управления транспортными средствами","За передачу управления транспортным средством лицу, заведомо не имеющему права управления (за исключением учебной езды) или лишенному такого права","За все перечисленные правонарушения"],"c":1,"tip":"Статья 12.7 ч.2 КоАП предусматривает административное наказание за управление транспортным средством водителем, лишенным права управления транспортными средствами.","img":null,"tp":[22],"p":[]},{"t":18,"n":19,"q":"Как водитель должен воздействовать на педаль управления подачей топлива при возникновении заноса, вызванного резким ускорением движения?","a":["Усилить нажатие на педаль","Не менять силу нажатия на педаль","Ослабить нажатие на педаль"],"c":2,"tip":"Не делая никаких резких движений рулём, следует уменьшить нажатие на педаль газа и сцепление колёс с дорогой восстановится.","img":null,"tp":[12],"p":[]},{"t":18,"n":20,"q":"В каких случаях следует увеличить боковой интервал?","a":["При встречном разъезде на большой скорости","При разъезде с длинномерным транспортным средством","В обоих перечисленных случаях"],"c":2,"tip":"В обоих перечисленных случаях следует увеличивать боковой интервал, т. к. «динамический коридор» (отступление от прямолинейного движения) в данных ситуациях увеличивается.","img":null,"tp":[12],"p":[]},{"t":19,"n":1,"q":"Сколько проезжих частей имеет данная дорога?","a":["Одну","Две","Четыре"],"c":1,"tip":"Разделительная полоса делит дорогу на проезжие части. Данная дорога имеет две проезжие части, четыре полосы движения.(Пункт 1.2 ПДД)","img":"i13.jpg","tp":[0],"p":["1.2"]},{"t":19,"n":2,"q":"В каком направлении Вам можно продолжить движение на легковом автомобиле?","a":["Только прямо","Прямо и направо","В любом"],"c":2,"tip":"Табличка 8.4.1 «Вид транспортного средства» распространяет действие знака, с которым она применена, на грузовые автомобили, в том числе с прицепом, с р.м.м. более 3,5 т. Вы управляете легковым автомобилем, действие знака на Вас не распространяется. Можете продолжать движение в любом направлении.(«Дорожные знаки»)","img":"i248.jpg","tp":[1],"p":[]},{"t":19,"n":3,"q":"Разрешено ли осуществлять посадку (высадку) пассажиров либо загрузку (разгрузку) транспортного средства в зоне действия этого знака?","a":["Разрешено","Разрешено, если это займет не более 5 минут","Запрещено"],"c":0,"tip":"В зоне действия знака 3.28 «Стоянка запрещена» разрешается «остановка», включающая все действия, определяемые данным термином.(Пункт 1.2 термин «Остановка», «Дорожные знаки»)","img":"i249.jpg","tp":[1],"p":[]},{"t":19,"n":4,"q":"Какие из указанных знаков разрешают выполнить разворот?","a":["Только А","Б и В","Все"],"c":2,"tip":"Все из обозначенных знаков разрешают выполнить разворот на перекрёстках, перед которыми они установлены.Знак «А» – 3.18.2. «Поворот налево запрещен».Знак «Б» – 5.7.2. «Выезд на дорогу с односторонним движением».Знак «В» – 5.13.2. «Выезд на дорогу с полосой для маршрутных транспортных средств».(«Дорожные знаки»)","img":"i250.jpg","tp":[1],"p":[]},{"t":19,"n":5,"q":"Чем необходимо руководствоваться, если значения дорожных знаков и линий горизонтальной разметки противоречат друг другу?","a":["Требованиями линий разметки","Требованиями дорожных знаков","Правила эту ситуацию не регламентируют"],"c":1,"tip":"В случае, когда значения дорожных знаков, в том числе временных, и линий горизонтальной разметки противоречат друг другу, водители должны руководствоваться знаками.(«Горизонтальная разметка»)","img":null,"tp":[2],"p":[]},{"t":19,"n":6,"q":"Как Вы должны поступить в данной ситуации?","a":["Продолжить движение, не изменяя скорости","Снизить скорость и быть готовым в случае необходимости незамедлительно остановиться","Остановиться около автомобиля ДПС и продолжить движение только после разрешения сотрудника полиции"],"c":1,"tip":"Впереди нештатная дорожная ситуация. Приближаясь к стоящему транспортному средству с включенным проблесковым маячком синего цвета, водитель должен снизить скорость, чтобы иметь возможность незамедлительно остановиться в случае необходимости.(Пункт 3.3 ПДД)","img":"i251.jpg","tp":[17],"p":["3.3"]},{"t":19,"n":7,"q":"Когда должна быть прекращена подача сигнала указателями поворота?","a":["Непосредственно перед началом маневра","Сразу после начала маневра","Сразу после завершения маневра"],"c":2,"tip":"Подача сигнала указателями поворота должна производиться заблаговременно до начала выполнения маневра и прекращаться немедленно после его завершения. При этом сигнал не должен вводить в заблуждение других участников движения.(Пункт 8.2 ПДД)","img":null,"tp":[4],"p":["8.2"]},{"t":19,"n":8,"q":"Вам можно выполнить поворот налево:","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":0,"tip":"При отсутствии знаков 5.15.1 «Направления движения по полосам» или 5.15.2 следует выполнять поворот с заездом на трамвайные пути, т.е. по траектории «А».(Пункт 8.5 ПДД)","img":"i252.jpg","tp":[4],"p":["8.5"]},{"t":19,"n":9,"q":"Водитель случайно проехал нужный въезд во двор. Разрешено ли в этой ситуации использовать задний ход, чтобы затем повернуть направо?","a":["Разрешено","Разрешено, если водитель управляет легковым такси","Запрещено"],"c":0,"tip":"Правила базируются на принципе: «Все, что не запрещено, - допустимо». При этом подразумевается, что допустимое не противоречит разумному и водитель при этом обеспечивает безопасные условия движения. На дорогах с односторонним движением «задний ход» не запрещён. Следовательно, Вы можете выполнить указанный маневр.(«Дорожные знаки», пункт 8.12 ПДД)","img":"i253.jpg","tp":[4],"p":["8.12"]},{"t":19,"n":10,"q":"С какой скоростью Вы имеете право продолжить движение в населённом пункте по левой полосе?","a":["Не более 40 км/ч","Не более 60 км/ч","Не менее 40 км/ч и не более 60 км/ч"],"c":2,"tip":"Разрешённая скорость движения в населённом пункте не более 60 км/ч. Вы выезжаете на полосу, над которой установлен знак 4.6 «Ограничение минимальной скорости» с табличкой 8.14 «Полоса движения», которая указывает полосу, на которую распространяется действие данного знака. Поэтому движение по данной полосе разрешается со скоростью не менее 40 км/ч, но и не превышающей 60 км/ч.(Пункт 10.2 ПДД, «Дорожные знаки»)","img":"i254.jpg","tp":[5],"p":["10.2"]},{"t":19,"n":11,"q":"По какой полосе Вам можно продолжить движение в населённом пункте после опережения грузового автомобиля?","a":["Только по правой","Только по левой","По любой"],"c":2,"tip":"Действие происходит в населённом пункте на дороге, имеющей по две полосы движения в каждом направлении. В этом случае имеете право использовать наиболее удобную для Вас полосу, т.е. любую.(Пункт 9.4 ПДД)","img":"i255.jpg","tp":[6,13],"p":["9.4"]},{"t":19,"n":12,"q":"Кто из водителей нарушил правила стоянки?","a":["Оба","Только водитель автомобиля А","Только водитель автомобиля Б","Никто не нарушил"],"c":2,"tip":"В данной ситуации табличка 8.6.1 «Способ постановки транспортного средства на стоянку» распространяет действие знака на ВСЕ транспортные средства. Она конкретизирует расположение этих транспортных средств на стоянке, находящейся в местном уширении проезжей части. Нарушает правила стоянки водитель автомобиля «Б».(«Дорожные знаки». Пункт 12.2 ПДД)","img":"i256.jpg","tp":[7],"p":["12.2"]},{"t":19,"n":13,"q":"Вы намерены проехать перекрёсток в прямом направлении. Ваши действия?","a":["Остановитесь перед стоп-линией","Продолжите движение, уступая дорогу легковому автомобилю","Продолжите движение, имея преимущество перед легковым автомобилем"],"c":1,"tip":"Перекрёсток регулируемый. Вы продолжаете движение под дополнительную секцию светофора, включенную одновременно с основным красным сигналом светофора без остановки у стоп-линии. Но в этом случае, продолжая движение, необходимо учитывать, что уступаете дорогу всем транспортным средствам, движущимся с других направлений. В случае создания помехи, Вы создадите опасную ситуацию, которая может перейти в аварийную, и тогда Вы станете виновником ДТП.(Пункты 13.3, 13.5 ПДД)","img":"i257.jpg","tp":[8],"p":["13.3","13.5"]},{"t":19,"n":14,"q":"Как Вам следует поступить при повороте направо?","a":["Проехать перекрёсток первым","Уступить дорогу только легковому автомобилю","Уступить дорогу легковому автомобилю и мотоциклу"],"c":0,"tip":"Перекрёсток равнозначный. Водители руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает. Мотоциклист и легковой автомобиль имеют помеху справа. У Вас помехи нет, проедете перекрёсток первым, вторым - легковой автомобиль, мотоциклист - последним.(Пункт 13.11 ПДД)","img":"i258.jpg","tp":[8],"p":["13.11"]},{"t":19,"n":15,"q":"Если невозможно определить наличие покрытия на дороге (темное время суток, грязь, снег и тому подобное), а знаков приоритета нет, то:","a":["Вы имеете право считать, что находитесь на главной дороге","Вам следует считать, что находитесь на равнозначной дороге","Вы должны считать, что находитесь на второстепенной дороге"],"c":2,"tip":"Если водитель не может определить наличие покрытия на дороге (темное время суток, грязь, снег и тому подобное), а знаков приоритета нет, он должен считать, что находится на второстепенной дороге(Дорожные знаки, пункт 13.13 ПДД)","img":null,"tp":[8],"p":["13.13"]},{"t":19,"n":16,"q":"В данной ситуации Вы:","a":["Должны уступить дорогу автобусу, начинающему движение от обозначенного места остановки","Имеете преимущество, так как автобус начинает движение с выездом на левую полосу"],"c":0,"tip":"В населённых пунктах, обозначенных соответствующим знаком с белым фоном, при трогании от обозначенного места остановки автобусы и троллейбусы имеют преимущество. При этом водители троллейбусов и автобусов могут начинать движение только после того, как убедятся, что им уступают дорогу. Этот пункт Правил предусматривает редкий случай - равнозначную ответственность водителей за разрешение дорожной ситуации.(Пункт 18.3 ПДД)","img":"i259.jpg","tp":[24],"p":["18.3"]},{"t":19,"n":17,"q":"Какие внешние световые приборы должны быть включены в темное время суток и в условиях недостаточной видимости независимо от освещения дороги, а также в тоннелях на буксируемых механических транспортных средствах?","a":["Дневные ходовые огни","Габаритные огни","Задние противотуманные фонари"],"c":1,"tip":"В темное время суток и в условиях недостаточной видимости независимо от освещения дороги, а также в тоннелях на движущемся транспортном средстве должны быть включены следующие световые приборы – на прицепах и буксируемых механических транспортных средствах – габаритные огни.(Пункт 19.1 ПДД)","img":null,"tp":[20],"p":["19.1"]},{"t":19,"n":18,"q":"У водителя, совершившего административное правонарушение, водительское удостоверение изымается:","a":["При выявлении и пресечении правонарушения","Немедленно после вынесения постановления о лишении права управления транспортными средствами","После вступления постановления о лишении права управления транспортными средствами в законную силу"],"c":2,"tip":"У водителя, совершившего административное правонарушение, водительское удостоверение изымается после вступления в законную силу постановления о лишении права управления транспортными средствами.(КоАП ст. 31.1 п.1, ст. 31.2 ч.2, ст. 32.6 ч.1)","img":null,"tp":[22],"p":[]},{"t":19,"n":19,"q":"Для прекращения заноса, вызванного торможением, водитель в первую очередь должен:","a":["Прекратить начатое торможение","Выключить сцепление","Продолжить торможение, не изменяя усилия на педаль тормоза"],"c":0,"tip":"Причиной заноса при торможении является или неодновременное срабатывание тормозных механизмов, или блокировка колёс. Следует немедленно разблокировать колёса, т.е. педаль тормоза отпустить, попытаться выровнять автомобиль.(«Техника управления автомобилем»)","img":null,"tp":[12],"p":[]},{"t":19,"n":20,"q":"Что необходимо сделать для извлечения инородного тела, попавшего в дыхательные пути пострадавшего?","a":["Уложить пострадавшего на свое колено лицом вниз и ударить кулаком по спине несколько раз","Вызвать рвоту, надавив на корень языка. При отрицательном результате ударить ребром ладони по спине пострадавшего либо встать спереди и сильно надавить кулаком на его живот.","Встать сбоку от пострадавшего, поддерживая его одной рукой под грудь, второй рукой наклонить корпус пострадавшего вперед головой вниз. Нанести пять резких ударов основанием ладони в область между лопаток. При отрицательном результате встать сзади, обхватить его обеими руками чуть выше пупка, сцепить свои руки в замок и пять раз резко надавить на область живота в направлении внутрь и кверху."],"c":2,"tip":"Признаки попадания инородного тела: шумное и затрудненное дыхание, невозможность говорить. Для извлечения инородного тела, попавшего в дыхательные пути пострадавшего, необходимо запомнить, что в первую очередь надо встать сбоку от пострадавшего, придерживая его одной рукой под грудь, второй рукой наклонить корпус вперед вниз головой. И только теперь ударить несколько раз ладонью по спине пострадавшего, в область между лопаток. Далее действовать, как изложено в правильном ответе.","img":null,"tp":[16],"p":[]},{"t":20,"n":1,"q":"Какие условия являются обязательными для оформления документа о дорожно-транспортном происшествии (ДТП) без участия уполномоченных на то сотрудников полиции?","a":["В результате взаимодействия (столкновения) двух транспортных средств (в том числе с прицепами к ним) вред причинен только им","Гражданская ответственность владельцев транспортных средств застрахована в соответствии с законодательством","Обстоятельства причинения вреда в связи с повреждением транспортных средств, характер и перечень видимых повреждений зафиксированы в соответствии с правилами обязательного страхования","Все перечисленные условия"],"c":3,"tip":"Согласно пункта 2.6.1 ПДД и ч. 1 ст. 11.1 ФЗ «Об обязательном страховании гражданской ответственности владельцев транспортных средств\" водители, причастные к ДТП при наличии всех перечисленных условий, указанных в ответах могут оформить документы о дорожно-транспортном происшествии без участия уполномоченных на то сотрудников полиции. (14.12.18 обновлены формулировки вопроса и вариантов ответа)","img":null,"tp":[23],"p":[]},{"t":20,"n":2,"q":"Можно ли Вам за перекрёстком въехать во двор?","a":["Можно","Можно, если Вы проживаете в этом доме","Нельзя"],"c":0,"tip":"Действие знака 4.1.1 «Движение прямо» в случае его установки перед пересечением проезжих частей (перекрёстком) распространяется только на первое пересечение за знаком. Поворот налево совершается вне зоны действия знака. Ничего противоречащего его выполнению нет. Въезжаете во двор по указанной траектории.(«Дорожные знаки»)","img":"i260.jpg","tp":[1],"p":[]},{"t":20,"n":3,"q":"Разрешается ли Вам остановка за знаком?","a":["Разрешается","Разрешается только для посадки (высадки) пассажира","Запрещается"],"c":2,"tip":"Табличка 8.2.4 «Зона действия», установленная под знаком 3.27 «Остановка запрещена», указывает, что зона действия запрещающего знака распространяется и до знака, и после знака. Поэтому остановка в указанном месте Правилами запрещена.(«Дорожные знаки»)","img":"i261.jpg","tp":[1],"p":[]},{"t":20,"n":4,"q":"Какие из указанных знаков запрещают дальнейшее движение без остановки?","a":["А и Г","Б и В","В и Г","Все"],"c":1,"tip":"Проезд без остановки запрещают: знак «Б» - 3.17.1 «Таможня» и знак «В» - 3.17.3 «Контроль».(«Дорожные знаки»)","img":"i262.jpg","tp":[1],"p":[]},{"t":20,"n":5,"q":"Чем необходимо руководствоваться, если нанесённые на проезжей части белые и оранжевые линии разметки противоречат друг другу?","a":["Белыми линиями разметки","Оранжевыми линиями разметки","Правила эту ситуацию не регламентируют"],"c":1,"tip":"Постоянная разметка имеет белый цвет. Временная - оранжевый цвет. В случаях, когда линии временной разметки и линии постоянной разметки противоречат друг другу, водители должны руководствоваться линиями временной разметки.(«Горизонтальная разметка»)","img":null,"tp":[2],"p":[]},{"t":20,"n":6,"q":"Вы намеревались проехать перекрёсток в прямом направлении. Как следует поступить, если Вы не успели заранее перестроиться на левую полосу?","a":["Остановиться перед стоп-линией и дождаться зеленого сигнала светофора","Выехать за стоп-линию, перестроиться на левую полосу и остановиться перед пересекаемой проезжей частью","Повернуть направо"],"c":2,"tip":"В данном случае ничего не поделаешь. И знак 5.15.1 «Направления движения по полосам», и светофор с дополнительной секцией обязывают Вас с крайней правой полосы совершить поворот направо.(«Дорожные знаки», пункт 6.3 ПДД)","img":"i263.jpg","tp":[3],"p":["6.3"]},{"t":20,"n":7,"q":"Какой знак используется для обозначения транспортного средства при вынужденной остановке в местах, где с учетом условий видимости оно не может быть своевременно замечено другими водителями?","a":["А","Б","В"],"c":0,"tip":"Знак аварийной остановки «А».(Пункт 7.2 ПДД)","img":"i264.jpg","tp":[25],"p":["7.2"]},{"t":20,"n":8,"q":"Вам можно выполнить поворот налево?","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":2,"tip":"Знак 5.15.1 – «Направления движения по полосам» разрешает поворот налево из крайней левой полосы и средней. Указанные траектории наглядно показывают, как его следует осуществлять с любой из перечисленных полос. При повороте соблюдайте выбранную рядность.(«Дорожные знаки», пункт 8.5 ПДД)","img":"i265.jpg","tp":[4],"p":["8.5"]},{"t":20,"n":9,"q":"Разрешается ли Вам выполнить разворот с заездом во двор задним ходом?","a":["Разрешается","Разрешается, если при этом не будут созданы помехи другим участникам движения","Запрещается"],"c":1,"tip":"Ничего противоречащего выполнению разворота подобным способом в данной ситуации нет. Движение задним ходом запрещается на перекрёстках. Здесь же используется прилегающая территория (въезд во двор через арку). Осуществляемый маневр должен быть безопасен и не создавать помех другим участникам движения.(Пункты 1.2, 8.12 ПДД)","img":"i266.jpg","tp":[4],"p":["1.2","8.12"]},{"t":20,"n":10,"q":"Укажите расстояние, под которым в Правилах понимается дистанция:","a":["Только А","Только Б","Только В","А и В"],"c":1,"tip":"Расстояние «Б» – дистанция между попутными транспортными средствами. Расстояние «А» – интервал между встречными транспортными средствами, расстояние «В» – интервал между попутными транспортными средствами.(Пункт 9.10 ПДД)","img":"i267.jpg","tp":[13],"p":["9.10"]},{"t":20,"n":11,"q":"Можно ли Вам начать обгон грузового автомобиля в данной ситуации?","a":["Можно","Можно, только после проезда дорожного знака","Нельзя"],"c":2,"tip":"В данной ситуации Вам обгон грузового автомобиля начинать нельзя, хотя зона запрещения обгона заканчивается. Причина – водителю запрещается выполнять обгон, если ТС, движущееся впереди, в данном случае грузовик, уже производит обгон.(Пункт 11.2 ПДД)","img":"i268.jpg","tp":[6],"p":["11.2"]},{"t":20,"n":12,"q":"Какой автомобиль разрешено поставить на стоянку указанным на табличке способом?","a":["Только легковой","Легковой и грузовой с разрешенной максимальной массой не более 3,5 т","Любой"],"c":0,"tip":"В местах, обозначенных знаком 6.4 «Парковка (парковочное место)» совместно с одной из табличек 8.6.2 – 8.6.9 «Способ постановки транспортного средства на стоянку», разрешена стоянка легковых автомобилей и мотоциклов только так, как указано на табличке. Всем остальным придётся подыскивать другое место стоянки.(«Дорожные знаки»)","img":"i269.jpg","tp":[7],"p":[]},{"t":20,"n":13,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Только встречному автомобилю","Только пешеходам","Встречному автомобилю и пешеходам"],"c":2,"tip":"Перекрёсток регулируемый. При повороте налево Вы обязаны уступить дорогу легковому автомобилю, движущемуся прямо со встречного направления, и пешеходам, переходящим проезжую часть дороги, на которую поворачиваете.(Пункты 13.1, 13.4 ПДД)","img":"i270.jpg","t
