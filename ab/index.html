 {id:'spec',t:'Спецсигналы',p:['3.'],l:['Синий маячок вместе с сиреной — уступите дорогу.','Только синий маячок без сирены преимущества не даёт.','Оранжевый или жёлтый маячок преимущества не даёт.','Колонну с сопровождением обгонять нельзя и встраиваться в неё тоже.']},
 {id:'ped',t:'Пешеходы и маршрутный транспорт',p:['13.1','14.','18.'],l:['Поворачивая направо или налево, уступите пешеходам и велосипедистам, которые пересекают дорогу, куда вы поворачиваете (п. 13.1).','Перед нерегулируемым переходом уступите тем, кто переходит или уже вступил на переход.','Соседняя машина остановилась перед переходом — тоже остановитесь и продолжайте, только убедившись, что пешеходов нет.','В населённом пункте уступите автобусу и троллейбусу, отъезжающим от обозначенной остановки.','Вне перекрёстка трамвай главнее безрельсовых ТС.']},
 {id:'tow',t:'Буксировка и перевозка',p:['20.','22.','23.'],l:['Гибкая сцепка — от 4 до 6 м, жёсткая — не более 4 м. В гололедицу на гибкой сцепке буксировать нельзя.','Скорость при буксировке — до 50 км/ч.','Груз выступает больше чем на 1 м спереди или сзади или на 0,4 м сбоку от габаритного огня — обозначьте его.']},
 {id:'duty',t:'Обязанности водителя',p:['2.'],l:['При себе: водительское удостоверение, документ о регистрации ТС и полис ОСАГО.','При ДТП: остановиться, включить аварийку, выставить знак и не перемещать предметы, связанные с происшествием.','Нельзя пользоваться телефоном без hands-free и передавать руль человеку без прав или в опьянении.']},
 {id:'signs',t:'Знаки: учите по форме',tp:['Дорожные знаки'],l:['Треугольник с красной каймой — предупреждает. Красный круг — запрещает. Синий круг — предписывает. Синий прямоугольник — особые предписания или информация.','Запрещающий знак действует до ближайшего перекрёстка за ним. Выезд со двора перекрёстком не считается.','Временный знак на жёлтом фоне главнее постоянного. Табличка под знаком уточняет, где и для кого он действует.']},
 {id:'marks',t:'Разметка',tp:['Дорожная разметка'],l:['Сплошную линию пересекать нельзя, прерывистую можно.','Если знак и разметка противоречат друг другу, выполняйте знак. Временные знаки главнее и знаков, и разметки.']},
 {id:'safety',t:'Безопасность и техника управления',tp:['Безопасность движения и техника управления автомобилем'],l:['Верный ответ почти всегда про плавность: без резких рывков рулём и тормозом.','При заносе задней оси повернуть руль в сторону заноса.','Время реакции водителя около секунды: на 90 км/ч машина успевает проехать примерно 25 м.']},
 {id:'faults',t:'Неисправности',tp:['Неисправности и условия допуска транспортных средств к эксплуатации'],l:['Остаточный протектор: легковые — не меньше 1,6 мм, мотоциклы — 0,8 мм.','Стояночный тормоз должен удерживать машину на уклоне до 23% включительно.','Неисправность в пути: тормоза или рулевое — дальше ехать нельзя; фары в темноте — нельзя.']},

 if(s.k==='scale'){const mx=Math.log10(Math.max(...s.marks.map(m=>m[0]))*1.15);

const PACKS=8,IMGC='pdd-cd-img-1';
let OFF={done:0,ok:'serviceWorker' in navigator&&'caches' in window,fail:false};
const offText=()=>!OFF.ok?'Работа без интернета недоступна в этом браузере':OFF.done>=PACKS?'Всё скачано: приложение работает без интернета':OFF.fail?`Картинки скачаны не все (${OFF.done} из ${PACKS}). Докачаются, когда появится интернет`:`Скачиваю картинки для работы без интернета: ${OFF.done} из ${PACKS}`;
const isStandalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
function appHTML(){
 return `${isStandalone()?'':`<div class="odds install"><h3>Установить на iPhone</h3>
  <p>Откройте эту страницу в Safari, нажмите кнопку «Поделиться» внизу экрана и выберите «На экран „Домой“». Появится иконка, и тренажёр будет открываться как обычное приложение, без интернета.</p></div>`}
 <p class="mono muted" id="offst" style="font-size:13px">${offText()}</p>`}
async function prefetchPacks(){
 try{const c=await caches.open(IMGC);
  for(let k=0;k<PACKS;k++){const u='p'+k+'.json';
   if(!(await c.match(u))){const r=await fetch(u,{cache:'reload'});if(!r.ok)throw 0;await c.put(u,r)}
   OFF.done=k+1;const el=$('#offst');if(el)el.textContent=offText()}}
 catch(e){OFF.fail=true;const el=$('#offst');if(el)el.textContent=offText()}}
if(OFF.ok){navigator.serviceWorker.register(SWP).catch(()=>{});prefetchPacks();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
/* ---------- переключатель категорий ---------- */
try{localStorage.setItem('pdd-cat',CAT)}catch(e){}
document.querySelectorAll('.cats a').forEach(a=>a.addEventListener('click',()=>{try{localStorage.setItem('pdd-cat',a.dataset.cat)}catch(e){}}));
/* ---------- router ---------- */
let view='plan';
const go=()=>{const h=location.hash.slice(1);view=['plan','rules','hard','train','mistakes','exam'].includes(h)?h:'plan';render()};
window.addEventListener('hashchange',go);
function setNav(){document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===view));
  const L=Q.filter((_,i)=>learned(i)).length;$('#hdrProg').textContent=`выучено ${L} из 800`}
function render(){setNav();const v=$('#view');
  if(view==='plan')v.innerHTML=appHTML()+planHTML()+xferHTML();
  if(view==='rules')v.innerHTML=rulesHTML();
  if(view==='hard')v.innerHTML=hardHTML();
  if(view==='train')v.innerHTML=SESS&&SESS.mode==='train'?sessHTML():trainHTML();
  if(view==='mistakes')v.innerHTML=SESS&&SESS.mode==='mist'?sessHTML():mistHTML();
  if(view==='exam')v.innerHTML=EX?examHTML():examPickHTML();
  bind();}
const pct=s=>s.length?Math.round(100*s.filter(learned).length/s.length):0;
function planHTML(){
  const L=Q.filter((_,i)=>learned(i)).length,M=mistakes().length,cov=new Set(R.filter(r=>r.p).flatMap(r=>r.qs)).size;
  return `<section class="sec"><h2>Программа на 14 дней</h2>
  <p class="lead">Учите не билеты по порядку, а блоками по темам: в одном блоке вопросы держатся на 2–3 правилах. Перед каждым днём прочитайте карточки правил этого дня (2 минуты), потом решите вопросы. Неверные попадут в «Ошибки»; оттуда вопрос уходит после двух верных ответов подряд. Начинайте каждый день с «Ошибок».</p></section>
  <div class="stats"><div class="stat"><b>${L}</b><span>выучено из 800</span></div><div class="stat"><b>${M}</b><span>в ошибках</span></div><div class="stat"><b>${cov}</b><span>вопросов на 20 правилах</span></div></div>
  <div class="days">${DAYS.map((d,k)=>{const n=d.s?d.s.length:20*(d.exam[1]-d.exam[0]+1),p=d.s?pct(d.s):0;
   return `<div class="day${p>=95?' done':''}"><div class="post"><small>день</small><b>${k+1}</b></div>
   <div class="info"><h3>${esc(d.t)}</h3><p class="muted">${esc(d.d)} <span class="mono">${n} вопр.</span></p>
   ${d.r?`<div class="chips">${d.r.map(id=>{const r=R.find(x=>x.id===id);return `<button class="chip link" data-rule="${id}">${esc(r.t)}</button>`}).join('')}</div>`:''}
   ${d.s?`<div class="bar" title="${p}%"><i style="width:${p}%"></i></div>`:''}</div>
   <button class="btn small" data-day="${k}">${d.s?(p?'Продолжить':'Начать'):'К экзамену'}</button></div>`}).join('')}</div>`}
function rulesHTML(){
  return `<section class="sec"><h2>Закономерности</h2>
  <p class="lead">Я разобрал все 800 вопросов. 706 формулировок уникальны, но в пояснениях к ответам постоянно повторяются одни и те же пункты ПДД. Двадцать правил ниже закрывают ${new Set(R.filter(r=>r.p).flatMap(r=>r.qs)).size} вопросов, ещё пять карточек — знаки, разметку, технику, неисправности и медицину.</p></section>
  <div class="odds"><h3>Угадать не получится</h3><p class="muted">Проверил популярные «приёмы» на всех 800 вопросах. Ни один не работает надёжно, поэтому учите правила.</p>
  <table><tr><td>Верный ответ на 1-м, 2-м, 3-м месте (когда вариантов 3)</td><td>25% · 35% · 39%</td></tr>
  <tr><td>Самый длинный вариант оказался верным</td><td>34%</td></tr>
  <tr><td>Вариант, начинающийся с «Только…», верен</td><td>24%</td></tr>
  <tr><td>«Во всех перечисленных случаях» верен</td><td>20 из 34</td></tr>
  <tr><td>«В обоих случаях» верен</td><td>24 из 42</td></tr>
  <tr><td>«В любом месте / случае» верен</td><td>11 из 37</td></tr></table></div>
  <section class="sec"><h3>Правила, которые закрывают больше всего вопросов</h3>
  <div class="rules">${R.slice().sort((a,b)=>b.qs.length-a.qs.length).map(r=>`<article class="rule" id="r-${r.id}"><header><h3>${esc(r.t)}</h3><span class="plate">${r.p?'п. '+esc(r.p.map(x=>x.endsWith('.')?'разд. '+x.slice(0,-1):x).join(', ')):'тема'}</span></header>
   <ul>${r.l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${r.mn?`<p class="mn">${esc(r.mn)}</p>`:''}
   <div class="row"><button class="btn small" data-rq="${r.id}">Решить ${r.qs.length} ${plural(r.qs.length,'вопрос','вопроса','вопросов')}</button><span class="muted mono">выучено ${pct(r.qs)}%</span></div></article>`).join('')}</div></section>
  <section class="sec"><h3>Все цифры из билетов</h3><p class="muted">Числа, которые встречаются в верных ответах. Выучите эту таблицу, и вопросы «на сколько метров» решаются сами.</p>
  <div class="numtable"><table><tr><th>Число</th><th>Где встречается</th></tr>${NUMS.map(n=>`<tr><td>${n[0]}</td><td>${esc(n[1])}</td></tr>`).join('')}</table></div></section>`}
function trainHTML(){
  const byT=t=>Q.map((q,i)=>i).filter(i=>Q[i].t===t);
  return `<section class="sec"><h2>Тренировка</h2><p class="lead">После каждого ответа видно верный вариант и пояснение. Выберите билет или тему.</p></section>
  <section class="sec"><h3>По билетам</h3><div class="grid40">${Array.from({length:40},(_,k)=>{const s=byT(k+1),p=pct(s),w=s.some(isMistake);return `<button data-ticket="${k+1}" class="${w?'w':p===100?'g':''}" aria-label="Билет ${k+1}">${k+1}</button>`}).join('')}</div>
  <p class="muted" style="font-size:14px">Зелёный — билет выучен, красный — в нём есть ошибки.</p></section>
  <section class="sec"><h3>По темам</h3><div class="topics">${TOP.map((t,k)=>({t,k,s:Q.map((q,i)=>i).filter(i=>Q[i].tp[0]===k)})).sort((a,b)=>b.s.length-a.s.length).map(o=>`<button data-topic="${o.k}"><span>${esc(o.t)}</span><span>${o.s.length} · ${pct(o.s)}%</span></button>`).join('')}</div></section>
  <section class="sec"><h3>Вперемешку</h3><div class="row"><button class="btn ghost" data-rand="20">20 случайных</button><button class="btn ghost" data-new="20">20 ещё не решённых</button></div></section>`}
function mistHTML(){const m=mistakes();
  return `<section class="sec"><h2>Работа над ошибками</h2><p class="lead">Сюда попадает каждый вопрос, на который вы ответили неверно. Он уходит отсюда после двух верных ответов подряд.</p></section>
  ${m.length?`<div class="row"><button class="btn" data-mist="1">Решить ${m.length} ${plural(m.length,'вопрос','вопроса','вопросов')}</button></div>
  <div class="topics">${TOP.map((t,k)=>({t,n:m.filter(i=>Q[i].tp[0]===k).length})).filter(o=>o.n).sort((a,b)=>b.n-a.n).map(o=>`<button disabled><span>${esc(o.t)}</span><span>${o.n}</span></button>`).join('')}</div>`
  :`<div class="odds"><h3>Ошибок пока нет</h3><p class="muted">Начните с первого дня программы. Неверные ответы появятся здесь сами.</p><div class="row"><a class="btn" href="#plan" style="text-decoration:none">Открыть программу</a></div></div>`}`}
/* ---------- training session ---------- */
let SESS=null;
function startSess(title,list,mode='train'){if(!list.length)return;SESS={title,list,i:0,res:[],mode,picked:null};location.hash===('#'+(mode==='mist'?'mistakes':'train'))?render():location.hash=mode==='mist'?'mistakes':'train';scrollTo(0,0)}
function qHTML(qi,picked,reveal,head){const q=Q[qi];
  return `<article class="qcard"><div class="meta"><span>${head}</span><span>Билет ${q.t} · вопрос ${q.n}</span></div>
  ${q.img?`<img data-img="${q.img}" data-pk="${(q.t-1)/5|0}" ${IMG[q.img]?`src="${IMG[q.img]}"`:''} alt="Иллюстрация к вопросу" width="640" height="240" style="aspect-ratio:auto">`:''}
  <div class="qbody"><p class="qtext">${esc(q.q)}</p><div class="ans">${q.a.map((a,j)=>{let c='';if(reveal){if(j===q.c)c='ok';else if(j===picked)c='bad'}else if(j===picked)c='pick';
   return `<button data-a="${j}" class="${c}" ${reveal?'disabled':''}><span>${j+1}</span><span>${esc(a)}</span></button>`}).join('')}</div>
  ${reveal&&q.tip?`<p class="tip">${esc(q.tip)}</p>`:''}</div></article>`}
function sessHTML(){const s=SESS;
  if(s.i>=s.list.length){const ok=s.res.filter(Boolean).length,bad=s.list.filter((_,k)=>!s.res[k]);
   return `<section class="sec"><h2>${esc(s.title)}: готово</h2></section><div class="result ${bad.length?'bad':'ok'}"><span class="verdict">${ok} из ${s.list.length} верно</span><span>${bad.length?'Неверные ответы добавлены в «Ошибки».':'Без ошибок.'}</span></div>
   <div class="row">${bad.length?`<button class="btn" data-again="1">Повторить ${bad.length} неверных</button>`:''}<button class="btn ghost" data-end="1">К выбору</button><a class="btn ghost" href="#plan" style="text-decoration:none" data-end="1">Программа</a></div>`}
  const reveal=s.picked!==null,qi=s.list[s.i];
  return `<div class="sessbar"><h3>${esc(s.title)}</h3><span class="mono muted">${s.i+1} / ${s.list.length}</span></div>
  <div class="dots">${s.list.map((_,k)=>`<i class="${k<s.i||(k===s.i&&reveal)?(s.res[k]?'ok':'bad'):k===s.i?'cur':''}"></i>`).join('')}</div>
  ${qHTML(qi,s.picked,reveal,esc(TOP[Q[qi].tp[0]]))}
  ${reveal?`<div class="row"><span class="verdict ${s.res[s.i]?'ok':'bad'}">${s.res[s.i]?'Верно':'Неверно'}</span><button class="btn" data-next="1">Дальше</button></div>`:''}
  <div class="row"><button class="btn ghost small" data-end="1">Закончить</button><span class="muted" style="font-size:13px">Клавиши: 1–5 — ответ, Enter — дальше</span></div>`}
/* ---------- exam ---------- */
let EX=null,TICK=null;
function examPickHTML(){return `<section class="sec"><h2>Экзамен</h2><p class="lead">Как в ГИБДД: 20 вопросов, 20 минут, верные ответы не показываются до конца. Одна ошибка в блоке из пяти вопросов — 5 дополнительных вопросов по той же теме и +5 минут. Не сдан: две ошибки в одном блоке, больше двух ошибок, любая ошибка в дополнительных или вышло время.</p></section>
 <div class="row"><button class="btn" data-exam="0">Случайный билет</button></div>
 <section class="sec"><h3>Выбрать билет</h3><div class="grid40">${Array.from({length:40},(_,k)=>`<button data-exam="${k+1}">${k+1}</button>`).join('')}</div></section>`}
function startExam(n){if(!n)n=1+Math.floor(Math.random()*40);
 const list=Q.map((q,i)=>i).filter(i=>Q[i].t===n);EX={n,list,ans:[],i:0,base:20,end:Date.now()+20*60e3,done:null,extraAdded:false};
 clearInterval(TICK);TICK=setInterval(()=>{if(!EX||EX.done){clearInterval(TICK);return}const t=$('#timer');const left=EX.end-Date.now();if(left<=0){finishExam('Время вышло');return}if(t)t.textContent=fmt(left)},500);render();scrollTo(0,0)}
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function examAnswer(j){const qi=EX.list[EX.i];EX.ans[EX.i]=j;mark(qi,j===Q[qi].c);EX.i++;
 if(EX.i===EX.base&&!EX.extraAdded){const err=[];for(let b=0;b<4;b++){const e=[0,1,2,3,4].map(k=>b*5+k).filter(k=>EX.ans[k]!==Q[EX.list[k]].c);if(e.length>1)return finishExam('Две ошибки в одном блоке');err.push(...e)}
  if(err.length>2)return finishExam('Больше двух ошибок');
  EX.extraAdded=true;if(!err.length)return finishExam(null);
  err.forEach(k=>{const tp=Q[EX.list[k]].tp[0];const pool=shuffle(Q.map((q,i)=>i).filter(i=>Q[i].tp[0]===tp&&!EX.list.includes(i))).slice(0,5);EX.list.push(...pool);EX.end+=5*60e3})}
 else if(EX.i>EX.base&&j!==Q[qi].c)return finishExam('Ошибка в дополнительном вопросе');
 if(EX.i>=EX.list.length)return finishExam(null);render()}
function finishExam(reason){EX.done={reason,pass:!reason};clearInterval(TICK);render();scrollTo(0,0)}
function examHTML(){const e=EX;
 if(e.done){const wrong=e.ans.map((a,k)=>({a,k})).filter(o=>o.a!==undefined&&o.a!==Q[e.list[o.k]].c);
  return `<section class="sec"><h2>Билет ${e.n}</h2></section><div class="result ${e.done.pass?'ok':'bad'}"><span class="verdict">${e.done.pass?'Экзамен сдан':'Экзамен не сдан'}</span><span>${e.done.pass?(e.extraAdded&&e.list.length>20?'С дополнительными вопросами.':'Без ошибок или с допустимыми ошибками.'):esc(e.done.reason)}</span><span class="mono">Ответов: ${e.ans.filter(a=>a!==undefined).length} · ошибок: ${wrong.length}</span></div>
  <div class="row"><button class="btn" data-exam="${e.n}">Пересдать этот билет</button><button class="btn ghost" data-exam="0">Случайный билет</button><button class="btn ghost" data-exend="1">Выбрать билет</button></div>
  ${wrong.length?`<section class="sec"><h3>Разбор ошибок</h3><div class="review">${wrong.map(o=>qHTML(e.list[o.k],o.a,true,o.k<20?'Основной вопрос '+(o.k+1):'Дополнительный')).join('')}</div></section>`:''}`}
 const qi=e.list[e.i],extra=e.i>=20;
 return `<div class="sessbar"><h3>Билет ${e.n}${extra?' · дополнительные':''}</h3><span class="timer" id="timer">${fmt(e.end-Date.now())}</span></div>
 <div class="dots">${e.list.map((_,k)=>`<i class="${k<e.i?'done':k===e.i?'cur':''}"></i>`).join('')}</div>
 ${qHTML(qi,null,false,extra?'Дополнительный вопрос':'Вопрос '+(e.i+1)+' из 20')}
 <div class="row"><button class="btn ghost small" data-exend="1">Прервать</button></div>`}
/* ---------- images: loaded per 5 tickets ---------- */
const IMG={},PK={};
function pack(k){if(!PK[k])PK[k]=fetch('p'+k+'.json').then(r=>r.json()).then(o=>{for(const n in o)IMG[n]='data:image/jpeg;base64,'+o[n]}).catch(()=>{delete PK[k]});return PK[k]}
function fillImgs(){document.querySelectorAll('img[data-img]:not([src])').forEach(im=>pack(+im.dataset.pk).then(()=>{if(IMG[im.dataset.img])im.src=IMG[im.dataset.img]}))}
/* ---------- events ---------- */
function bind(){const v=$('#view');fillImgs();bindXfer();
 if(SESS&&SESS.i+1<SESS.list.length)pack((Q[SESS.list[SESS.i+1]].t-1)/5|0);
 v.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const d=DAYS[+b.dataset.day];if(d.s){const rest=d.s.filter(i=>!learned(i));startSess('День '+(+b.dataset.day+1)+'. '+d.t,rest.length?rest:d.s)}else location.hash='exam'});
 v.querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>{location.hash='rules';setTimeout(()=>{const el=document.getElementById('r-'+b.dataset.rule);if(el)el.scrollIntoView({block:'start'})},30)});
 v.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(b.dataset.lesson));
 v.querySelectorAll('[data-hq]').forEach(b=>b.onclick=()=>{const x=HARD.find(o=>o.id===b.dataset.hq);startSess(x.t,x.qs)});
 v.querySelectorAll('[data-hall]').forEach(b=>b.onclick=()=>startSess('Сложное вперемешку',shuffle(hardAll())));
 v.querySelectorAll('[data-hmist]').forEach(b=>b.onclick=()=>startSess('Сложное: ошибки',shuffle(hardAll().filter(isMistake))));
 v.querySelectorAll('details.hcard').forEach(d=>d.ontoggle=()=>{try{const o=JSON.parse(localStorage.getItem('pdd-ab-open')||'{}');o[d.id]=d.open;localStorage.setItem('pdd-ab-open',JSON.stringify(o))}catch(e){}});
 try{const o=JSON.parse(localStorage.getItem('pdd-ab-open')||'{}');v.querySelectorAll('details.hcard').forEach(d=>{if(o[d.id])d.open=true})}catch(e){}
 v.querySelectorAll('[data-rq]').forEach(b=>b.onclick=()=>{const r=R.find(x=>x.id===b.dataset.rq);startSess(r.t,r.qs)});
 v.querySelectorAll('[data-ticket]').forEach(b=>b.onclick=()=>{const t=+b.dataset.ticket;startSess('Билет '+t,Q.map((q,i)=>i).filter(i=>Q[i].t===t))});
 v.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{const k=+b.dataset.topic;startSess(TOP[k],Q.map((q,i)=>i).filter(i=>Q[i].tp[0]===k))});
 v.querySelectorAll('[data-rand]').forEach(b=>b.onclick=()=>startSess('20 случайных',shuffle(Q.map((q,i)=>i)).slice(0,20)));
 v.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{const n=Q.map((q,i)=>i).filter(i=>ST.r[i]===undefined);startSess('Новые вопросы',shuffle(n.length?n:Q.map((q,i)=>i)).slice(0,20))});
 v.querySelectorAll('[data-mist]').forEach(b=>b.onclick=()=>startSess('Ошибки',shuffle(mistakes()),'mist'));
 v.querySelectorAll('[data-again]').forEach(b=>b.onclick=()=>{const bad=SESS.list.filter((_,k)=>!SESS.res[k]);startSess(SESS.title,bad,SESS.mode)});
 v.querySelectorAll('[data-end]').forEach(b=>b.addEventListener('click',()=>{SESS=null;render()}));
 v.querySelectorAll('[data-next]').forEach(b=>b.onclick=next);
 v.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>startExam(+b.dataset.exam));
 v.querySelectorAll('[data-exend]').forEach(b=>b.onclick=()=>{EX=null;clearInterval(TICK);render()});
 v.querySelectorAll('.ans button[data-a]').forEach(b=>b.onclick=()=>answer(+b.dataset.a));
}
function answer(j){
 if(view==='exam'&&EX&&!EX.done)return examAnswer(j);
 const s=SESS;if(!s||s.picked!==null||s.i>=s.list.length)return;const qi=s.list[s.i];if(j>=Q[qi].a.length)return;
 s.picked=j;s.res[s.i]=j===Q[qi].c;mark(qi,s.res[s.i]);render();
 const n=document.querySelector('[data-next]');if(n)n.scrollIntoView({block:'nearest'})}
function next(){const s=SESS;if(!s||s.picked===null)return;s.i++;s.picked=null;render();scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=+e.key;
 if(k>=1&&k<=5){const b=document.querySelector(`.ans button[data-a="${k-1}"]:not(:disabled)`);if(b){e.preventDefault();b.click()}}
 if(e.key==='Enter'){const n=document.querySelector('[data-next]');if(n){e.preventDefault();n.click()}}});
go();
</script>

</body></html>
