портные средства, находящиеся на второстепенной дороге. Вы находитесь на второстепенной дороге. Уступаете обоим транспортным средствам.(Пункты 13.9, 13.10, 13.11 ПДД)","img":"i460.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":34,"n":16,"q":"Сигналом остановки для машиниста поезда служит следующее расположение руки или рук (днем с лоскутом яркой материи либо каким-нибудь хорошо видимым предметом, ночью — с факелом или фонарем):","a":["Вытянутые в стороны руки","Круговое движение руки","Поднятая вверх правая рука","Поднятые вверх обе руки"],"c":1,"tip":"Сигналом остановки для машиниста поезда служит круговое движение руки (днём с лоскутом яркой материи или каким-либо хорошо видимым предметом, ночью – с факелом или фонарем).(Пункт 15.5 ПДД. Примечание)","img":null,"tp":[14],"p":["15.5"]},{"t":34,"n":17,"q":"В тоннеле с искусственным освещением должны быть включены:","a":["Фары ближнего света или габаритные огни","Фары ближнего света или дневные ходовые огни","Фары ближнего или дальнего света"],"c":2,"tip":"Независимо от освещённости тоннеля при въезде в него должен быть включен дальний или ближний свет фар.(Пункт 19.1 ПДД)","img":null,"tp":[20],"p":["19.1"]},{"t":34,"n":18,"q":"Уголовная ответственность предусмотрена за управление транспортным средством, не повлекшее причинение тяжкого вреда здоровью или смерть человека, лицом, находящимся в состоянии опьянения, если оно ранее было подвергнуто административному наказанию:","a":["За управление транспортным средством в состоянии опьянения","За невыполнение законного требования уполномоченного должностного лица о прохождении медицинского освидетельствования на состояние опьянения","За совершение любого из перечисленных правонарушений"],"c":2,"tip":"Согласно статьи 264.1 УК РФ, уголовная ответственность предусмотрена в данной ситуации за совершение любого из перечисленных правонарушений.","img":null,"tp":[22],"p":[]},{"t":34,"n":19,"q":"При движении по двухполосной дороге за грузовым автомобилем у Вас появилась возможность совершить обгон. Ваши действия?","a":["Максимально приблизитесь к обгоняемому автомобилю, затем перестроитесь на полосу встречного движения и завершите маневр","Перестроитесь на полосу встречного движения, после чего произведете сближение с обгоняемым транспортным средством и завершите маневр","Допустимы оба варианта действий"],"c":1,"tip":"Движущийся впереди большегрузный грузовой автомобиль – это «движущаяся стена», ограничивающая обзорность. Только на дистанции можно просматривать достаточное для обгона расстояние, своевременно информировать и быть замеченным обгоняемым. При необходимости своевременно прекратить обгон и вернуться на свою полосу.(«Техника управления автомобилем»)","img":"i461.jpg","tp":[12],"p":[]},{"t":34,"n":20,"q":"Каким образом проводится сердечно-легочная реанимация пострадавшего?","a":["Искусственное дыхание и давление руками на грудину пострадавшего: вначале 1 вдох методом «Рот ко рту», затем 15 надавливаний на грудину","Давление руками на грудину пострадавшего и искусственное дыхание: вначале 15 надавливаний на грудину, затем 1 вдох методом «Рот ко рту»","Давление руками на грудину пострадавшего и искусственное дыхание: вначале 30 надавливаний на грудину, затем 2 вдоха методом «Рот ко рту»"],"c":2,"tip":"При проведении сердечно-легочной реанимации пострадавший должен лежать на твердой поверхности. Начинают реанимацию с давления руками на грудину пострадавшего. После 30 надавливаний на грудину проводят искусственное дыхание – 2 вдоха методом «Рот ко рту». При проведении искусственного дыхания рекомендуется использовать устройство «Рот-Устройство-Рот», входящее в состав аптечки.","img":null,"tp":[16],"p":[]},{"t":35,"n":1,"q":"Что означает термин «Недостаточная видимость»?","a":["Видимость дороги менее 100 м вблизи опасных поворотов и переломов продольного профиля дороги","Видимость дороги менее 150 м в ночное время","Видимость дороги менее 300 м в условиях тумана, дождя, снегопада и т. п., а также в сумерки"],"c":2,"tip":"«Недостаточная видимость» – видимость дороги менее 300м в условиях тумана, дождя, снегопада и тому подобного, а также в сумерки.Пункт 1.2 термин «Недостаточная видимость».","img":null,"tp":[0],"p":[]},{"t":35,"n":2,"q":"Вы можете продолжить движение на следующем перекрестке:","a":["Только в направлении Б","В направлениях А и Б","В любом направлении из указанных"],"c":2,"tip":"В данном случае знак 4.1.1 «Движение прямо» установлен за пересечением проезжих частей, т.е. в начале участка дороги. Действие знака в такой ситуации распространяется до ближайшего перекрёстка. Поэтому Вы можете продолжать движение во всех указанных направлениях.(«Дорожные знаки»)","img":"i462.jpg","tp":[1],"p":[]},{"t":35,"n":3,"q":"Какие из указанных знаков разрешают движение со скоростью 60 км/ч?","a":["Только Б","Б и В","Все"],"c":1,"tip":"Знаки: «Б» – 4.6 «Ограничение минимальной скорости», «В» – 6.2 «Рекомендуемая скорость».(«Дорожные знаки»)","img":"i463.jpg","tp":[1],"p":[]},{"t":35,"n":4,"q":"Кто из водителей нарушил правила стоянки:","a":["Водители мотоцикла и грузового автомобиля","Только водитель мотоцикла","Только водитель грузового автомобиля","Никто не нарушил"],"c":2,"tip":"Водителям любых грузовых автомобилей остановка и стоянка с заездом на тротуар, граничащий с проезжей частью, запрещена. Водитель данного грузового автомобиля явно нарушает Правила.Водители легкового автомобиля и мотоцикла согласно знаку 6.4 «Парковка (парковочное место)» и таблички 8.6.3 абсолютно верно выполнили требования Правил.(Пункт 12.2 ПДД)","img":"i464.jpg","tp":[1,7],"p":["12.2"]},{"t":35,"n":5,"q":"Вы можете объехать препятствие:","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":0,"tip":"Знаки имеют приоритет над разметкой. Поэтому согласно знаку 4.2.2 «Объезд препятствия слева» Вы должны продолжить движение по траектории «А».(«Дорожные знаки», «Горизонтальная разметка»)","img":"i465.jpg","tp":[2],"p":[]},{"t":35,"n":6,"q":"Что означает сочетание красного и жёлтого сигналов светофора?","a":["Неисправна светофорная сигнализация","Вскоре будет включен зелёный сигнал","Вскоре будет включен красный сигнал"],"c":1,"tip":"Сочетание красного и жёлтого сигналов светофора запрещает движение и информирует о предстоящем включении зелёного сигнала.(Пункт 6.2 ПДД)","img":null,"tp":[3],"p":["6.2"]},{"t":35,"n":7,"q":"На каком расстоянии от транспортного средства должен быть выставлен знак аварийной остановки в данной ситуации?","a":["Не менее 15 м","Не менее 20 м","Не менее 30 м"],"c":2,"tip":"Действие происходит вне населённого пункта, поэтому расстояние, на котором устанавливается знак аварийной остановки, больше, чем в населённом пункте. Устанавливаете знак по обстановке, но это расстояние должно быть не менее 30 м.(Пункт 7.2 ПДД)","img":"i466.jpg","tp":[25],"p":["7.2"]},{"t":35,"n":8,"q":"Кому Вы должны уступить дорогу при повороте во двор?","a":["Только встречному автомобилю","Встречному автомобилю и пешеходам","Никому"],"c":1,"tip":"При повороте налево вне перекрестка водитель безрельсового ТС обязан уступить дорогу встречным ТС, лицам, использующим для передвижения СИМ и пешеходам, путь движения которых он пересекает.(Пункты 8.3, 8.8 ПДД)","img":"i467.jpg","tp":[4],"p":["8.3","8.8"]},{"t":35,"n":9,"q":"Для обеспечения безопасности при выезде задним ходом с места стоянки, имеющего ограниченную видимость, необходимо:","a":["Подать звуковой сигнал","Включить аварийную сигнализацию","Прибегнуть к помощи других лиц"],"c":2,"tip":"Движение транспортного средства задним ходом разрешается при условии, что этот маневр будет безопасен и не создаст помех другим участникам движения. При необходимости водитель должен прибегнуть к помощи других лиц.(Пункт 8.12 ПДД)","img":null,"tp":[4],"p":["8.12"]},{"t":35,"n":10,"q":"С какой максимальной скоростью Вы имеете право продолжить движение на грузовом автомобиле с разрешённой максимальной массой не более 3,5 т после въезда на примыкающую слева дорогу?","a":["60 км/ч","70 км/ч","90 км/ч"],"c":0,"tip":"На всех дорогах населённого пункта, обозначенного знаком 5.23.1 с белым фоном, разрешается движение со скоростью не более 60 км/ч.(«Дорожные знаки», пункт 10.2 ПДД)","img":"i468.jpg","tp":[5],"p":["10.2"]},{"t":35,"n":11,"q":"Как Вам следует поступить в данной ситуации?","a":["Уступить дорогу встречному автомобилю","Проехать первым","Действовать по взаимной договоренности с водителем встречного автомобиля"],"c":1,"tip":"В случае, если встречный разъезд затруднен, то водитель, на стороне которого имеется препятствие, должен уступить дорогу. В данной ситуации преимущество Ваше – проезжаете первым.(Пункт 11.7 ПДД)","img":"i469.jpg","tp":[6],"p":["11.7"]},{"t":35,"n":12,"q":"Водители каких автомобилей не нарушили правила остановки?","a":["Только автомобиля Б","Только автомобиля В","Автомобилей А и Б","Автомобилей А и В"],"c":2,"tip":"Действие происходит в населённом пункте на дороге, обозначенной знаком 5.5 «Дорога с односторонним движением». На такой дороге на легковом автомобиле разрешается остановка и стоянка и с левой стороны дороги по ходу движения (место «А»). В месте «В» останавливаться и стоять нельзя, так как будете находиться в зоне действия знака 3.27 «Остановка запрещена» с табличкой 8.2.3 «Зона действия», которая указывает конец зоны действия данного знака. На стоянку можно поставить автомобиль в месте «А» или «Б».(«Дорожные знаки», пункт 12.1 ПДД)","img":"i470.jpg","tp":[7],"p":["12.1"]},{"t":35,"n":13,"q":"Вам необходимо уступить дорогу другим участникам движения:","a":["Только при повороте налево или развороте","Только при повороте направо","В обоих перечисленных случаях"],"c":2,"tip":"При повороте направо Вы обязаны уступить дорогу пешеходам. При повороте налево или развороте – трамваю, имеющему преимущество в равнозначных условиях. Никаких помех нет при движении прямо.Правильный ответ - в обоих перечисленных случаях.(Пункты 6.2, 13.1, 13.6 ПДД)","img":"i471.jpg","tp":[8],"p":["13.1","13.6","6.2"]},{"t":35,"n":14,"q":"Вы намерены продолжить движение прямо. Ваши действия?","a":["Проедете перекресток первым","Уступите дорогу грузовому автомобилю, так как он приближается справа","Уступите дорогу грузовому автомобилю, так как он находится на главной дороге"],"c":1,"tip":"Перекрёсток равнозначный. Водители руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает. У Вас помеха справа, грузовик имеет преимущество.(Пункт 13.11 ПДД)","img":"i472.jpg","tp":[8],"p":["13.11"]},{"t":35,"n":15,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Обоим транспортным средствам","Автомобилю с включенными проблесковым маячком и специальным звуковым сигналом","Никому"],"c":1,"tip":"Бесспорно преимущество имеет «оперативник» с мигалкой синего цвета и включенной сиреной. Все остальные обязаны обеспечить ему беспрепятственный проезд перекрёстка. После его проезда проезжаете Вы, так как находитесь на главной дороге и имеете преимущество перед грузовиком, находящимся на второстепенной дороге.(Пункты 3.1, 13.9 ПДД)","img":"i473.jpg","tp":[8],"p":["13.9","3.1"]},{"t":35,"n":16,"q":"При вынужденной остановке на железнодорожном переезде, если в транспортном средстве находятся пассажиры, водитель должен:","a":["Немедленно высадить людей","Высадить людей, если принятые меры не позволяют убрать транспортное средство с переезда","Высадить людей при появлении поезда"],"c":0,"tip":"При вынужденной остановке на переезде водитель должен немедленно высадить людей и принять меры для освобождения переезда.(Пункт 15.5 ПДД)","img":null,"tp":[14],"p":["15.5"]},{"t":35,"n":17,"q":"При остановке и стоянке на неосвещённых участках дорог в тёмное время суток необходимо:","a":["Включить габаритные огни","Включить фары ближнего света","Выставить знак аварийной остановки"],"c":0,"tip":"При остановке и стоянке в темное время суток на неосвещенных участках дорог, а также в условиях недостаточной видимости на транспортном средстве должны быть включены габаритные огни.(Пункт 19.3 ПДД)","img":null,"tp":[20],"p":["19.3"]},{"t":35,"n":18,"q":"В каком случае разрешается эксплуатация автомобиля?","a":["Неисправны или отсутствуют предусмотренные изготовителем транспортного средства стеклоочистители","Неисправны или отсутствуют предусмотренные изготовителем транспортного средства стеклоомыватели","Не работает стеклоподъёмник"],"c":2,"tip":"«Перечень неисправностей» запрещает эксплуатацию при указанных неисправностях стеклоочистителей и стеклоомывателей. Исправность стеклоподъёмника этим перечнем не оговаривается, значит эксплуатация допускается.(\"Перечень неисправностей\", пункт 4.5)","img":null,"tp":[11],"p":[]},{"t":35,"n":19,"q":"По какой траектории двигается прицеп легкового автомобиля при прохождении поворота?","a":["Дальше от центра поворота, чем траектория движения автомобиля","По траектории движения автомобиля","Ближе к центру поворота, чем траектория движения автомобиля"],"c":2,"tip":"Любой прицеп, включая и прицеп легкового автомобиля, двигается ближе к центру поворота, чем траектория движения автомобиля.","img":null,"tp":[12],"p":[]},{"t":35,"n":20,"q":"Принято считать, что среднее время реакции водителя составляет:","a":["Примерно 0,5 секунды","Примерно 1 секунду","Примерно 2 секунды"],"c":1,"tip":"Время реакции у каждого водителя различно и постоянной величиной не является. Экспериментально выведено, что среднее время реакции водителей примерно равно 1 секунде. Что такое секунда – произнесите сочетание слов «двадцать два». Время секунды прошло. При увеличении индивидуального времени реакции ее следует компенсировать снижением средней скорости движения транспортного средства. Более подробно о реакции водителя, «потерянном времени», минимальной безопасной дистанции, выполнении обгона изложено в пособии «Автошкола РФ», издательства «ЭКСМО».","img":null,"tp":[12],"p":[]},{"t":36,"n":1,"q":"Главной на перекрестке является:","a":["Дорога с твердым покрытием по отношению к грунтовой дороге","Дорога с асфальтобетонным покрытием по отношению к дороге, покрытой брусчаткой","Дорога с тремя или более полосами движения по отношению к дороге с двумя полосами"],"c":0,"tip":"При отсутствии знаков, обозначающих главную дорогу, дорога с твердым покрытием по отношению к грунтовой является главной.(Пункт 1.2 термин «Главная дорога»)","img":null,"tp":[0],"p":[]},{"t":36,"n":2,"q":"Разрешается ли Вам въехать на мост одновременно с водителем мотоцикла?","a":["Разрешается","Разрешается, если Вы не затрудните ему движение","Запрещается"],"c":1,"tip":"Данный знак (2.6) запрещает выезд на узкий участок дороги только в том случае, если это затруднит встречное движение.(«Дорожные знаки»)","img":"i474.jpg","tp":[1],"p":[]},{"t":36,"n":3,"q":"Водители каких автомобилей нарушили правила стоянки?","a":["Только автомобиля А","Только автомобиля Б","Автомобилей А и Б"],"c":0,"tip":"Действие знака 3.27 «Остановка запрещена» распространяется до ближайшего перекрёстка. В данном случае до перекрёстка с примыкающей слева дорогой. Можно поставить автомобиль на стоянку в месте «Б». Правила остановки и стоянки нарушает только водитель автомобиля «А».(«Дорожные знаки», пункт 12.1 ПДД)","img":"i475.jpg","tp":[1],"p":["12.1"]},{"t":36,"n":4,"q":"Какие из указанных табличек распространяют действие установленных с ними знаков на грузовые автомобили с разрешённой максимальной массой не более 3,5 т?","a":["Только Б","Только В","Б и В","Все"],"c":2,"tip":"Таблички 8.4.1 (А) и 8.4.3.2 (Б) «Вид транспортного средства» распространяют своё действие: «А» – на грузовые автомобили, в том числе с прицепом, с р.м.м. более 3,5 т, «Б» – на легковые автомобили, а также грузовые автомобили с р.м.м. до 3,5 т. Табличка 8.6.1 (В) «Способ постановки транспортного средства на стоянку» распространяет действие знака 6.4 «Парковка (парковочное место)» на ВСЕ транспортные средства. Поэтому только таблички «Б» и «В» касаются грузовых автомобилей, р.м.м. которых не более 3,5 т.(«Дорожные знаки»)","img":"i476.jpg","tp":[1],"p":[]},{"t":36,"n":5,"q":"Правая полоса предназначена для движения:","a":["Любых автобусов","Всех автобусов и троллейбусов","Автобусов и троллейбусов, являющихся маршрутными транспортными средствами, школьных автобусов и легковых такси, а также велосипедистов"],"c":2,"tip":"По крайней правой полосе, обозначенной разметкой 1.23.1 (в виде буквы «А») и знаком 5.14.1 «Полоса для маршрутных транспортных средств» из перечисленных в ответах ТС имеют право на движение автобусы и троллейбусы, движущиеся по установленным маршрутам с обозначенными местами остановок, относящиеся к маршрутным транспортным средствам, а также школьные автобусы, легковые такси и велосипедисты.(Пункт 1.2 ПДД, «Дорожные знаки», «Горизонтальная разметка»)","img":"i477.jpg","tp":[2],"p":["1.2"]},{"t":36,"n":6,"q":"Как следует поступить водителю легкового автомобиля при приближении автомобиля оперативной службы?","a":["Продолжить движение по левой полосе","Перестроиться на правую полосу","Остановиться справа у тротуара"],"c":1,"tip":"Автомобилям оперативной службы, едущим с включенным проблесковым маячком синего цвета и специальным звуковым сигналом, следует уступать дорогу, обеспечив беспрепятственный проезд. Водителю легкового автомобиля следует перестроиться на правую полосу и продолжить движение.(Пункт 3.2 ПДД)","img":"i478.jpg","tp":[17],"p":["3.2"]},{"t":36,"n":7,"q":"Согнутая в локте рука водителя автомобиля является сигналом, информирующим Вас о его намерении:","a":["Повернуть направо","Продолжить движение прямо","Остановиться, чтобы уступить дорогу мотоциклу"],"c":0,"tip":"Сигналу правого поворота соответствует вытянутая в сторону правая рука либо левая, вытянутая в сторону и согнутая в локте под прямым углом вверх (как в данной ситуации).(Пункт 8.1 ПДД)","img":"i479.jpg","tp":[4],"p":["8.1"]},{"t":36,"n":8,"q":"Вам можно продолжить движение при повороте налево:","a":["Только по траектории А","Только по траектории В","По любой траектории из указанных"],"c":2,"tip":"При повороте налево на перекрёстке Вы можете выбирать любую траекторию движения. Главное условие - при выезде с пересечения проезжих частей Ваше транспортное средство не должно оказаться на стороне встречного движения.(Пункт 8.6 ПДД)","img":"i480.jpg","tp":[4],"p":["8.6"]},{"t":36,"n":9,"q":"Если траектории движения транспортных средств пересекаются, а очерёдность проезда не оговорена Правилами, следует:","a":["Уступить дорогу транспортному средству, приближающемуся справа","Уступить дорогу транспортному средству, приближающемуся слева","Действовать по взаимной договоренности водителей"],"c":0,"tip":"В случаях, не оговоренных Правилами, а это, например, на территориях стоянок, заправок, заводов, в поле, в лугах и т.п., очерёдность проезда определяется «правилом правой руки», т.е. у кого помеха справа, тот и уступает.(Пункт 8.9 ПДД)","img":null,"tp":[4],"p":["8.9"]},{"t":36,"n":10,"q":"В каких случаях на дорогах, проезжая часть которых разделена линиями разметки, водители обязаны двигаться строго по полосам?","a":["Только при интенсивном движении","Только если полосы движения обозначены сплошными линиями разметки","Во всех случаях"],"c":2,"tip":"При наличии разметки движение осуществляется строго по обозначенным полосам во всех случаях.(Пункт 9.7 ПДД)","img":null,"tp":[13],"p":["9.7"]},{"t":36,"n":11,"q":"Водитель обгоняемого транспортного средства:","a":["Обязан снизить скорость движения","Обязан не повышать скорость движения","Имеет право действовать по своему усмотрению"],"c":1,"tip":"Водителю обгоняемого транспортного средства запрещается препятствовать обгону повышением скорости движения или иными действиями.(Пункт 11.3 ПДД)","img":null,"tp":[6],"p":["11.3"]},{"t":36,"n":12,"q":"Разрешена ли Вам остановка для высадки пассажиров в указанном месте?","a":["Разрешена","Разрешена, если при этом не будут созданы помехи для движения маршрутных транспортных средств","Запрещена"],"c":1,"tip":"В населённых пунктах на дорогах, имеющих по одной полосе движения в каждом направлении, без трамвайных путей посередине разрешается остановка и стоянка не только с правой стороны, но и с левой по ходу движения. Остановка, связанная с высадкой и посадкой пассажиров, разрешается в местах остановки маршрутных транспортных средств, обозначенных зигзагообразной разметкой 1.17.1, если эта остановка не создаёт помехи их движению.(«Дорожные знаки», пункты 12.1, 12.4 ПДД)","img":"i481.jpg","tp":[7],"p":["12.1","12.4"]},{"t":36,"n":13,"q":"Вы намерены повернуть направо. Ваши действия?","a":["Дождетесь другого сигнала регулировщика","Уступите дорогу легковому автомобилю, осуществляющему разворот","Проедете перекресток первым"],"c":2,"tip":"Со стороны вытянутой правой руки регулировщика безрельсовым транспортным средствам движение разрешается только направо. При этом разворачивающийся автомобиль, руководствуясь «правилом правой руки», уступает Вам дорогу.(Пункт 6.10 ПДД)","img":"i482.jpg","tp":[8],"p":["6.10"]},{"t":36,"n":14,"q":"В каком случае Вы должны пропустить трамвай?","a":["При повороте налево, перестроившись на трамвайные пути попутного направления","При движении прямо","В обоих перечисленных случаях"],"c":2,"tip":"Вы и трамвай находитесь на одной дороге в равнозначных условиях. В таком случае трамвай всегда имеет преимущество перед безрельсовыми транспортными средствами. Вы должны уступить дорогу трамваю в обоих перечисленных случаях.(Пункт 13.11 ПДД)","img":"i483.jpg","tp":[8],"p":["13.11"]},{"t":36,"n":15,"q":"Как Вам следует поступить при повороте налево?","a":["Уступить дорогу обоим транспортным средствам","Уступить дорогу только грузовому автомобилю","Проехать перекресток первым"],"c":1,"tip":"Перекрёсток нерегулируемый, неравнозначный. Преимущество имеют транспортные средства, находящиеся на главной дороге, которые между собой руководствуются «правилом правой руки». После проезжают перекрёсток транспортные средства, находящиеся на второстепенной дороге. Первым проезжает грузовик, Вы ему уступаете. Последним проедет легковой автомобиль.(Пункты 13.3, 13.9, 13.12 ПДД)","img":"i484.jpg","tp":[8],"p":["13.12","13.3","13.9"]},{"t":36,"n":16,"q":"Вы обязаны уступить дорогу грузовому автомобилю:","a":["Только при повороте направо","Только при повороте налево","В обоих перечисленных случаях"],"c":2,"tip":"Вы выезжаете из жилой зоны, о чём информирует знак 5.22 «Конец жилой зоны». Уступаете дорогу другим участникам дорожного движения, в данной ситуации - грузовому автомобилю в обоих перечисленных случаях.(«Дорожные знаки», пункт 17.3 ПДД)","img":"i485.jpg","tp":[9],"p":["17.3"]},{"t":36,"n":17,"q":"В каких случаях необходимо включать фары ближнего света или дневные ходовые огни в светлое время суток?","a":["Только при движении вне населенного пункта","Только при движении в населенном пункте","В обоих перечисленных случаях"],"c":2,"tip":"Фары ближнего света или дневные ходовые огни в светлое время суток должны быть включены в обоих перечисленных случаях.(Пункт 19.5 ПДД)","img":null,"tp":[20],"p":["19.5"]},{"t":36,"n":18,"q":"Административная ответственность установлена за нарушение Правил дорожного движения или правил эксплуатации транспортного средства, повлекшее причинение:","a":["Легкого вреда здоровью человека либо незначительного материального ущерба","Легкого или средней тяжести вреда здоровью человека","Легкого или средней тяжести вреда здоровью человека либо материального ущерба"],"c":1,"tip":"В соответствии со ст. 12.24 КоАП административная ответственность устанавливается за нарушения ПДД или правил эксплуатации ТС, повлекшие причинение легкого или средней тяжести вреда здоровью человека.\"Кодекс РФ об административных правонарушениях\"","img":null,"tp":[22],"p":[]},{"t":36,"n":19,"q":"Как правильно произвести экстренное торможение на скользкой дороге, если автомобиль не оборудован антиблокировочной тормозной системой?","a":["Нажать на педаль тормоза до упора и удерживать ее до полной остановки","Нажать на педаль тормоза с одновременным использованием стояночного тормоза","Тормозить прерывистым нажатием на педаль тормоза, не допуская блокировки колес"],"c":2,"tip":"Экстренное, не служебное, торможение на скользком покрытии следует производить комбинировано, т. е. «торможением двигателем» (без выключения сцепления до значительного падения скорости) и прерывистым нажатием на педаль тормоза, не допуская полной блокировки колес, следствием которой будет «юз» и увеличение тормозного пути. Главной ошибкой в таком случае является длительное удерживание педали, т. е. неумение тормозить импульсно (прерывисто).","img":null,"tp":[12],"p":[]},{"t":36,"n":20,"q":"Как воспринимается водителем скорость своего автомобиля при длительном движении по равнинной дороге на большой скорости?","a":["Кажется меньше, чем в действительности","Восприятие скорости не меняется","Кажется больше, чем в действительности"],"c":0,"tip":"Водитель определяет скорость передвижения по скорости перемещения предметов, попадающих в поле его зрения. При длительном монотонном движении скорость кажется меньше чем в действительности. Для контроля скорости движения в таких ситуациях чаще чем обычно пользуйтесь показаниями спидометра.","img":null,"tp":[12],"p":[]},{"t":37,"n":1,"q":"К категории «В» относятся автомобили:","a":["С разрешенной максимальной массой не более 2,5 т и числом сидячих мест, помимо сиденья водителя, не более 8","С разрешенной максимальной массой не более 3,5 т и числом сидячих мест, помимо сиденья водителя, не более 8","С разрешенной максимальной массой не более 3,5 т и числом сидячих мест, помимо сиденья водителя, не более 16"],"c":1,"tip":"В соответствии со ст. 25 п.1 Федерального закона «О безопасности дорожного движения» к категории «В» относятся автомобили с разрешенной максимальной массой не более 3,5 т и числом сидячих мест, помимо сиденья водителя, не более 8.","img":null,"tp":[23],"p":[]},{"t":37,"n":2,"q":"Какие из указанных знаков устанавливают непосредственно перед железнодорожным переездом?","a":["Только А","Только Б","Только В","А и В"],"c":2,"tip":"Из обозначенных только знак «В» – 1.3.2 «Многопутная железная дорога» – устанавливается непосредственно перед железнодорожным переездом. Следует учитывать, что при отсутствии шлагбаумов на ж.д. переезде знаки 1.3.1 и 1.3.2 определяют размер переезда. Комбинации знаков «А» и «Б» устанавливаются вне населённых пунктов на расстоянии 150-300 м.(«Дорожные знаки»)","img":"i486.jpg","tp":[1],"p":[]},{"t":37,"n":3,"q":"Вам разрешено выполнить разворот:","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":1,"tip":"Движение на перекрёстке, обозначенном знаком 4.3 «Круговое движение», организовано по кругу в направлении стрелок. Траектория «А» проходит во встречном направлении, что недопустимо. Для разворота следует выехать на перекрёсток и совершить «круг почета». Разворот можно совершить только по траектории «Б».(«Дорожные знаки»)","img":"i487.jpg","tp":[1],"p":[]},{"t":37,"n":4,"q":"Можно ли Вам поставить автомобиль на стоянку за путепроводом?","a":["Можно","Можно не ближе 5 м от опоры путепровода","Нельзя"],"c":2,"tip":"В указанном месте стоянка запрещена знаком 3.28 «Стоянка запрещена», действие которого распространяется до ближайшего перекрёстка. Путепровод не может прекращать действие данного знака.(«Дорожные знаки»)","img":"i488.jpg","tp":[1],"p":[]},{"t":37,"n":5,"q":"Разрешается ли Вам перестроиться на полосу с реверсивным движением в данной ситуации?","a":["Разрешается","Разрешается только для поворота налево или разворота","Запрещается"],"c":0,"tip":"Зелёная стрелка реверсивного светофора разрешает движение по реверсивной полосе. Вы можете пересечь двойную прерывистую линию разметки 1.9, для движения по ней, т.е. в попутном направлении.(Пункт 6.7 ПДД, «Горизонтальная разметка»)","img":"i489.jpg","tp":[2],"p":["6.7"]},{"t":37,"n":6,"q":"Вам разрешено движение:","a":["Только в направлении А","В направлениях А и Б","В любом направлении из указанных"],"c":0,"tip":"Действия регулировщика распространяются на то пересечение проезжих частей, на котором он находится. Будем считать, что он находится на первом пересечении. Со стороны вытянутой руки безрельсовым транспортным средствам разрешается движение только направо. Можно продолжить движение по траектории «А».(Пункт 6.10 ПДД)","img":"i490.jpg","tp":[3],"p":["6.10"]},{"t":37,"n":7,"q":"Какие указатели поворота Вы обязаны включить при выполнении разворота по такой траектории?","a":["Только правого поворота","Только левого поворота","Сначала правого поворота, а при движении от тротуара – левого поворота"],"c":2,"tip":"Если при развороте вне перекрёстка ширина проезжей части недостаточна для выполнения маневра из крайнего положения (согласно пункту 8.5), его допускается производить от правого края проезжей части (но не от середины проезжей части данного направления). Разворот по такой траектории совершается на узкой дороге. Во время его выполнения необходимо проявлять большую осторожность и выполнение его не производить на высокой скорости, так как едущий позади водитель может при включении в первоначальный момент правого указателя поворота подумать, что Вы совершаете остановку. После включения левого указателя ещё раз убедитесь в отсутствии помехи, так как во время разворота должны уступить дорогу как попутным, так и встречным транспортным средствам.(Пункты 8.1, 8.5, 8.8 ПДД)","img":"i491.jpg","tp":[4],"p":["8.1","8.5","8.8"]},{"t":37,"n":8,"q":"Ситуация, в которой водитель транспортного средства, движущегося по правой полосе, обязан уступить дорогу при перестроении, показана:","a":["На левом рисунке","На правом рисунке","На обоих рисунках"],"c":0,"tip":"При одновременном перестроении водители руководствуются «правилом правой руки». Такая ситуация на правом рисунке. Движущийся по правой полосе автомобиль имеет преимущество. На левом рисунке перестроение единоличное. Вы, перестраиваясь, уступаете дорогу транспортным средствам, движущимся попутно без изменения направления движения. Преимущество в такой ситуации имеет «хозяин полосы».Правильный ответ на левом рисунке.(Пункт 8.4 ПДД)","img":"i492.jpg","tp":[4],"p":["8.4"]},{"t":37,"n":9,"q":"Разрешено ли водителю легкового автомобиля движение задним ходом для посадки пассажира?","a":["Разрешено","Разрешено, если при этом не будут созданы помехи маршрутным транспортным средствам","Запрещено"],"c":2,"tip":"Движение задним ходом в местах расположения остановок маршрутных транспортных средств запрещено. (Пункты 8.11, 8.12 ПДД).","img":"i493.jpg","tp":[4],"p":["8.11","8.12"]},{"t":37,"n":10,"q":"В данной ситуации для того, чтобы продолжить движение в прямом направлении, Вы имеете право:","a":["Объехать грузовой автомобиль справа","Продолжить движение только после того, как грузовой автомобиль выполнит поворот налево","Выполнить любое из перечисленных действий"],"c":2,"tip":"В данной ситуации Ваше право выбирать:или объехать грузовой автомобиль справа;или дождаться освобождения полосы, на которой Вы находитесь, чтобы без лишних перестроений продолжить дальнейшее движение.(Пункты ПДД: 1.2 термины «Перестроение», Опережение», 8.4)","img":"i494.jpg","tp":[13],"p":["1.2","8.4"]},{"t":37,"n":11,"q":"Запрещается ли выполнять обгон на мостах, путепроводах, эстакадах и под ними?","a":["Запрещается","Запрещается только под мостами, путепроводами и эстакадами","Запрещается только при наличии сплошной линии разметки","Разрешается"],"c":0,"tip":"Обгон запрещён - на мостах, путепроводах, эстакадах и под ними.(Пункт 11.4 ПДД)","img":null,"tp":[6],"p":["11.4"]},{"t":37,"n":12,"q":"Можно ли Вам остановиться в тоннеле для посадки пассажира?","a":["Можно","Можно, если Вы управляете легковым такси","Нельзя"],"c":2,"tip":"Однозначно нет. Так как в тоннелях, под эстакадами, мостами, путепроводами остановка запрещена.(Пункт 12.4 ПДД)","img":"i495.jpg","tp":[7],"p":["12.4"]},{"t":37,"n":13,"q":"Как Вам следует поступить при повороте направо?","a":["Остановиться перед стоп-линией и, пропустив пешеходов, повернуть направо","Выехав на перекрёсток, остановиться перед пешеходным переходом, чтобы пропустить пешеходов","Продолжить движение без остановки на перекрёстке"],"c":1,"tip":"При повороте направо, налево на любом перекрёстке (регулируемом, нерегулируемом) водитель обязан уступить дорогу пешеходам, переходящим проезжую часть дороги, на которую он поворачивает.(Пункты 6.2, 13.1 ПДД)","img":"i496.jpg","tp":[8],"p":["13.1","6.2"]},{"t":37,"n":14,"q":"При движении в каком направлении Вы будете иметь преимущество?","a":["Только при повороте направо","Только при повороте налево","В любом направлении из перечисленных"],"c":2,"tip":"Перекрёсток равнозначный. Водители руководствуются «правилом правой руки». У Вас помехи справа нет, в любом направлении из перечисленных. Проезжаете перекрёсток первым.(Пункт 13.11 ПДД)","img":"i497.jpg","tp":[8],"p":["13.11"]},{"t":37,"n":15,"q":"Вы намерены продолжить движение прямо. Ваши действия:","a":["Проедете перекрёсток первым","Уступите дорогу трамваю"],"c":1,"tip":"Перекрёсток неравнозначный. Вы и трамвай находитесь на главной дороге. «Правило правой руки» в этом случае не работает. Трамвай в равнозначных условиях имеет преимущество перед безрельсовыми транспортными средствами. Уступаете дорогу трамваю.(Пункт 13.11 ПДД, «Дорожные знаки»)","img":"i498.jpg","tp":[8],"p":["13.11"]},{"t":37,"n":16,"q":"На каких участках автомагистрали запрещается движение задним ходом?","a":["Только в местах въезда или выезда с нее","Только в местах остановок маршрутных транспортных средств","На всем протяжении дороги"],"c":2,"tip":"Движение задним ходом на автомагистрали запрещено на всем протяжении дороги.(Пункт 16.1 ПДД)","img":null,"tp":[18],"p":["16.1"]},{"t":37,"n":17,"q":"На каких дорогах водителям мопедов запрещается поворачивать налево или разворачиваться?","a":["На дорогах с трамвайным движением","На дорогах, имеющих более одной полосы для движения в данном направлении","На всех перечисленных дорогах"],"c":2,"tip":"Водители мопедов могут двигаться по правому краю проезжей части в один ряд. Им запрещается поворачивать налево или разворачиваться на дорогах с трамвайными путями и на дорогах, имеющих более одной полосы для движения в данном направлении. (Пункты 24.7, 24.8 ПДД)","img":null,"tp":[19],"p":["24.7","24.8"]},{"t":37,"n":18,"q":"При какой неисправности запрещено движение транспортного средства во время дождя или снегопада?","a":["Не работают в установленном режиме стеклоочистители","Не действует стеклоочиститель со стороны водителя","Не работают стеклоомыватели"],"c":1,"tip":"Запрещается движение при недействующем со стороны водителя стеклоочистителе во время дождя или снегопада.(Пункт 2.3.1 ПДД)","img":null,"tp":[11],"p":["2.3"]},{"t":37,"n":19,"q":"С увеличением скорости движения на повороте величина центробежной силы:","a":["Не изменяется","Увеличивается пропорционально скорости","Увеличивается пропорционально квадрату скорости"],"c":2,"tip":"Центробежная сила зависит от массы автомобиля, радиуса поворота и пропорциональна квадрату скорости. Повлиять на массу движущегося автомобиля водитель не может. Несколько увеличить радиус поворота может, а вот скорость, которая является самой результативной величиной, для этой силы полностью зависит от водителя. Поэтому до вхождения в поворот и рекомендуется снижение скорости.(«Техника управления автомобилем»)","img":null,"tp":[12],"p":[]},{"t":37,"n":20,"q":"Как оказывается первая помощь при переломах конечностей, если отсутствуют транспортные шины и подручные средства для их изготовления?","a":["Верхнюю конечность, вытянутую вдоль тела, прибинтовывают к туловищу. Нижние конечности прибинтовывают друг к другу, проложив между ними мягкую ткань.","Верхнюю конечность, согнутую в локте, подвешивают на косынке и прибинтовывают к туловищу. Нижние конечности прибинтовывают друг к другу, обязательно проложив между ними мягкую ткань.","Верхнюю конечность, согнутую в локте, подвешивают на косынке и прибинтовывают к туловищу. Нижние конечности плотно прижимают друг к другу и прибинтовывают."],"c":1,"tip":"В такой ситуации - верхнюю конечность, согнутую в локте, подвешивают на косынке и прибинтовывают к туловищу. Нижние конечности прибинтовывают друг к другу, обязательно проложив между ними мягкую ткань.Особенность действий - обязательно проложить между конечностями мягкую ткань.","img":null,"tp":[16],"p":[]},{"t":38,"n":1,"q":"Сколько пересечений проезжих частей имеет этот перекрёсток?","a":["Одно","Два","Четыре"],"c":1,"tip":"Этот перекрёсток имеет два пересечения проезжих частей, которые образует разделительная полоса.(Пункт 1.2 ПДД)","img":"i300.jpg","tp":[0],"p":["1.2"]},{"t":38,"n":2,"q":"Данные знаки предупреждают о приближении:","a":["К месту производства работ на дороге","К железнодорожному переезду со шлагбаумом","К железнодорожному переезду без шлагбаума"],"c":1,"tip":"Знак 1.1 «Железнодорожный переезд со шлагбаумом» и знак 1.4.1 «Приближение к железнодорожному переезду» расположены на одной стойке, так как вне населённого пункта они располагаются на расстоянии 150 – 300 м до опасного участка. Вне населённого пункта знак 1.1 обязательно повторяется. Данные знаки предупреждают о приближении к железнодорожному переезду со шлагбаумами.(«Дорожные знаки»)","img":"i499.jpg","tp":[1],"p":[]},{"t":38,"n":3,"q":"Действие каких из указанных знаков не распространяется на транспортные средства, управляемые инвалидами I и II групп, перевозящие таких инвалидов или детей-инвалидов, если на транспортных средствах установлен опознавательный знак «Инвалид»?","a":["А и Б","Б и Г","Б, В и Г","Всех"],"c":1,"tip":"Из указанных знаков, действие не распространяются на транспортные средства, управляемые инвалидами I и II групп, перевозящие таких инвалидов или детей-инвалидов, если на ТС установлен опознавательный знак «Инвалид»: знак «Б» – 3.2 «Движение запрещено» и знак «Г» - 3.28 «Стоянка запрещена».(«Дорожные знаки»)","img":"i500.jpg","tp":[1],"p":[]},{"t":38,"n":4,"q":"Вы можете продолжить движение по крайней левой полосе:","a":["Только налево","Только в обратном направлении","Налево или в обратном направлении"],"c":2,"tip":"Знаки, указывающие направление движения по полосам (полосе), разрешающие поворот налево из крайней левой полосы, разрешают и разворот. Вы, двигаясь по крайней левой полосе, согласно знаку 5.15.2 «Направления движения по полосе», можете повернуть налево или развернуться для продолжения движения в обратном направлении.(«Дорожные знаки»)","img":"i501.jpg","tp":[1],"p":[]},{"t":38,"n":5,"q":"Разрешается ли Вам остановка в этом месте?","a":["Разрешается","Разрешается только с заездом на тротуар","Разрешается, если при этом не будут созданы помехи маршрутным транспортным средствам","Запрещается"],"c":0,"tip":"Прерывистая жёлтая линия разметки 1.10 обозначает места, где запрещена стоянка. С 1 марта 2023 года применяется только самостоятельно. Ничего противоречащего остановке нет, т.е. она разрешается. («Горизонтальная разметка»)","img":"i502.jpg","tp":[2],"p":[]},{"t":38,"n":6,"q":"Преимущество перед другими участниками движения имеет водитель автомобиля:","a":["Только с включенным проблесковым маячком синего или бело-лунного цвета","Только с включенным проблесковым маячком оранжевого или желтого цвета","Только с включенными проблесковым маячком синего (синего и красного) цвета и специальным звуковым сигналом","Любого из перечисленных"],"c":2,"tip":"Для получения преимущества «оперативное» транспортное средство должно обязательно применить сочетание проблескового маячка синего цвета или синего и красного и специального звукового сигнала.(Пункт 3.1 ПДД)","img":null,"tp":[17],"p":["3.1"]},{"t":38,"n":7,"q":"Вы намерены остановиться сразу за перекрестком. В каком месте необходимо включить указатели правого поворота?","a":["До въезда на перекрёсток, чтобы заблаговременно предупредить других водителей об остановке","Только после въезда на перекрёсток","Место включения указателей поворота не имеет значения, так как поворот направо запрещён"],"c":1,"tip":"Здесь следует дополнить ответ уточнением. Каждый водитель в своих действиях руководствуется только теми знаками, которые располагаются на его дороге. В изображённой ситуации водитель легкового автомобиля знает о Вашем преимуществе. Об этом Вы судите по его действиям. Вы убеждены, что он уступает дорогу. Включение сигнала поворота до перекрёстка будет им однозначно воспринято: что Вы намерены совершить поворот направо. Включение сразу же после въезда на перекрёсток также может быть воспринято неправильно. Например, что Вы несколько задержались с принятием решения о направлении дальнейшего движения, но всё же будете совершать поворот направо. Поэтому включение указателя поворота произведите на перекрёстке, но только не в начальной фазе въезда на перекрёсток. Тогда будет выполнено обязательное условие – сигнал не введёт в заблуждение других участников движения.(Пункт 8.2 ПДД)","img":"i503.jpg","tp":[4],"p":["8.2"]},{"t":38,"n":8,"q":"При съезде с дороги на прилегающую справа территорию, Вы:","a":["Пользуетесь преимуществом перед другими участниками движения","Должны уступить дорогу только пешеходам","Должны уступить дорогу только велосипедисту","Должны уступить дорогу пешеходам и велосипедисту"],"c":3,"tip":"Съезжая с дороги на прилегающую территорию, уступаете дорогу велосипедисту и пешеходам, лицам, использующим для передвижения СИМ, путь движения которых пересекаете.(Пункт 8.3 ПДД)","img":"i504.jpg","tp":[4],"p":["8.3"]},{"t":38,"n":9,"q":"Разрешено ли Вам выполнить разворот при движении на подъеме?","a":["Разрешено","Разрешено только при видимости дороги 100 м и более","Запрещено"],"c":1,"tip":"«Перелом» дороги ограничивает видимость. Разворот запрещается в местах с видимостью дороги хотя бы в одном направлении менее 100 м.(Пункт 8.11 ПДД)","img":"i505.jpg","tp":[4],"p":["8.11"]},{"t":38,"n":10,"q":"С какой максимальной скоростью разрешается продолжить движение при буксировке неисправного механического транспортного средства?","a":["50 км/ч","70 км/ч","90 км/ч"],"c":0,"tip":"При буксировке скорость не должна превышать 50 км/ч, которая и является максимальной.(Пункт 10.4 ПДД)","img":"i506.jpg","tp":[5],"p":["10.4"]},{"t":38,"n":11,"q":"Можно ли Вам начать обгон?","a":["Можно","Можно, если обгон будет завершен до перекрестка","Нельзя"],"c":1,"tip":"Табличка 8.1.1 «Расстояние до объекта» под знаком 2.4 «Уступите дорогу» указывает расстояние от знака до пересечения неравнозначных дорог, на которых обгон разрешается по направлению главной дороги. Вы находитесь на второстепенной дороге, поэтому начатый обгон должен быть завершён до перекрёстка.(«Дорожные знаки», пункт 11.4 ПДД)","img":"i507.jpg","tp":[6],"p":["11.4"]},{"t":38,"n":12,"q":"Водители каких автомобилей нарушили правила остановки?","a":["Только автомобиля В","Автомобилей А и В","Автомобилей Б и В","Всех перечисленных автомобилей"],"c":1,"tip":"Так как действие происходит в населённом пункте на участке дороги, обозначенном знаком 5.5 «Дорога с односторонним движением», то в этом случае останавливаться можно и с левой стороны по ходу движения. В данной ситуации, в месте «Б», за пешеходным переходом. Непосредственно перед пешеходным переходом, в местах «А» и «В», останавливаться нельзя.(Пункты 12.1, 12.4 ПДД)","img":"i508.jpg","tp":[7],"p":["12.1","12.4"]},{"t":38,"n":13,"q":"Как Вам следует поступить при повороте налево?","a":["Проехать перекресток первым","Уступить дорогу только автомобилю с включенными проблесковым маячком и специальным звуковым сигналом","Уступить дорогу обоим транспортным средствам"],"c":2,"tip":"Перекрёсток регулируемый. Знаки приоритета «не работают». «Оперативник» со специальными сигналами отступает от требований сигналов светофора. Другие водители обязаны обеспечить его беспрепятственный проезд. При повороте налево Вы обязаны уступить легковому автомобилю, движущемуся прямо со встречного направления.(Пункты 3.1, 3.2, 13.3, 13.4 ПДД)","img":"i509.jpg","tp":[8],"p":["13.3","13.4","3.1","3.2"]},{"t":38,"n":14,"q":"При движении в каком направлении Вы обязаны уступить дорогу трамваю?","a":["Только налево","Только прямо","В обоих перечисленных"],"c":2,"tip":"Перекрёсток равнозначный. Вы и трамвай находитесь в равнозначных условиях. В таком случае трамвай всегда имеет преимущество перед безрельсовыми транспортными средствами.(Пункт 13.11 ПДД)","img":"i510.jpg","tp":[8],"p":["13.11"]},{"t":38,"n":15,"q":"Вы намерены повернуть направо. Можете ли Вы приступить к повороту?","a":["Можете","Можете после того, как грузовой автомобиль начнет выполнять поворот налево","Не можете"],"c":1,"tip":"Перекрёсток неравнозначный. Знак 2.4 обязывает Вас уступить дорогу транспортным средствам, движущимся по пересекаемой дороге. Только после того как убедитесь, что грузовой автомобиль действительно поворачивает налево и Ваше движение не может создать ему помеху, выезжаете на перекрёсток, чтобы совершить поворот направо.(Пункты 1.2, 13.9 ПДД, «Дорожные знаки»)","img":"i511.jpg","tp":[8],"p":["1.2","13.9"]},{"t":38,"n":16,"q":"Подъехав к трамваю попутного направления, остановившемуся у посадочной площадки, которая расположена посередине дороги, водитель должен:","a":["Уступить дорогу пешеходам, идущим к трамваю или от него","Остановиться и продолжить движение только после закрытия дверей трамвая","Остановиться и продолжить движение только после начала движения трамвая"],"c":0,"tip":"При наличии посадочной площадки уступить дорогу пешеходам, идущим к трамваю или от него. При отсутствии пешеходов, переходящих проезжую часть со стороны дверей, с соблюдением необходимых мер предосторожности, т.е. возможности Вашей остановки в любой момент при появлении «выскочившего пешехода», можете продолжать движение, не дожидаясь закрытия дверей и начала движения маршрутного транспортного средства.(Пункт 14.6 ПДД. «Комментарий к ПДД РФ», издательство «За рулем»)","img":null,"tp":[21],"p":["14.6"]},{"t":38,"n":17,"q":"Запрещается перевозка детей в легковом автомобиле без использования соответствующих детских удерживающих систем (устройств):","a":["Если они перевозятся в возрасте младше 7 лет","Если они перевозятся в возрасте от 7 до 11 лет (включительно) на переднем сиденье","В обоих перечисленных случаях"],"c":2,"tip":"Дети бесспорно любят ездить на переднем сиденье автомобиля. Но разрешать это им следует, как требуют Правила, только с использованием соответствующих детских удерживающих систем (устройств). (Пункт 22.9 ПДД)","img":null,"tp":[10],"p":["22.9"]},{"t":38,"n":18,"q":"Владелец транспортного средства обязан возместить вред, причинённый этим транспортным средством, если не докажет, что вред возник:","a":["Исключительно вследствие непреодолимой силы","Исключительно вследствие умысла потерпевшего","Вследствие непреодолимой силы или умысла потерпевшего"],"c":2,"tip":"Согласно ст.1079 гражданского кодекса РФ могут рассматриваться как следствие непреодолимой силы, так и следствие умысла потерпевшего.«Гражданский кодекс РФ».","img":null,"tp":[22],"p":[]},{"t":38,"n":19,"q":"При движении ночью во время сильной метели наилучшую видимость дороги обеспечивает включение","a":["Только противотуманных фар","Противотуманных фар совместно с ближним светом фар","Противотуманных фар совместно с дальним светом фар"],"c":1,"tip":"Метель, туман создают очень опасные условия для езды. Двигаясь в таких условиях используйте ближний свет фар. Если есть противотуманные фары, используйте совместно. Дальний свет в метель не применяется по причине того, что он высветляет снег, который образует «слепящую световую стену», которая уменьшает видимость дороги.","img":null,"tp":[12],"p":[]},{"t":38,"n":20,"q":"В каких случаях пострадавшего следует извлекать из салона автомобиля","a":["При высокой вероятности опрокидывания автомобиля, пожара, взрыва или при потере потерпевшим сознания","При высокой вероятности опрокидывания автомобиля, пожара, взрыва, переохлаждения потерпевшего, при отсутствии у него сознания и дыхания, а также невозможности оказания первой помощи непосредственно в салоне автомобиля","При высокой вероятности опрокидывания автомобиля, пожара, взрыва или при обильном кровотечении либо черепно-мозговой травме"],"c":1,"tip":"Только при необходимости реанимации, т.е. при отсутствии трех признаков жизни у пострадавшего, а это - потере потерпевшим сознания и отсутствии у него пульса на сонной артерии и признаков дыхания, пострадавшего необходимо извлечь из салона автомобиля.","img":null,"tp":[16],"p":[]},{"t":39,"n":1,"q":"В каком виде предусмотрено представление для проверки страхового полиса обязательного страхования гражданской ответственности?","a":["На бумажном носителе","В виде электронного документа или его копии на бумажном носителе","В любом из перечисленных видов"],"c":2,"tip":"Согласно нового пункта Правил 2.1.1(1) ПДД, указанный страховой полис может быть предоставлен водителем на бумажном носителе, а в случае заключения такого договора в порядке, установленном п. 72 статьи и п.15 Федерального закона о страховании, в виде электронного документа или его копии на бумажном носителе.","img":null,"tp":[23],"p":[]},{"t":39,"n":2,"q":"Этот знак предупреждает о приближении к тоннелю, в котором:","a":["Будет затруднён разъезд со встречными транспортными средствами","Отсутствует искусственное освещение","Очерёдность движения регулируется светофором"],"c":1,"tip":"Знак 1.31 «Тоннель» предупреждает о приближении к тоннелю, в котором отсутствует искусственное освещение, или к тоннелю, видимость въездного портала которого ограничена. В тоннелях на движущемся транспортном средстве должны быть включены фары дальнего или ближнего света фар, независимо от наличия освещённости тоннеля.(«Дорожные знаки», пункт 19.1 ПДД)","img":"i512.jpg","tp":[1],"p":["19.1"]},{"t":39,"n":3,"q":"Вы имеете право продолжить движение на перекрестке:","a":["Только в направлении В","В направлениях А и В","Во всех указанных направлениях, кроме Г"],"c":1,"tip":"Продолжить движение не нарушая Правил можно в направлениях «А» и «В».В направлении «Г» движение запрещает знак 3.18.1 «Поворот направо запрещен».Направление «Б» проходит по проезжей части встречного движения. Такое движение категорически запрещено.(Пункт 1.4 ПДД, «Дорожные знаки»)","img":"i513.jpg","tp":[1],"p":["1.4"]},{"t":39,"n":4,"q":"Какие из указанных знаков разрешают выполнить поворот налево?","a":["Только А","А и Б","Б и В","Все"],"c":3,"tip":"Все знаки позволяют выполнить поворот налево. Знак «А» - 3.19 «Разворот запрещен» – разрешает производить поворот налево. Знаки «Б» и «В» также не запрещают совершать маневр – поворот налево.(«Дорожные знаки»)","img":"i514.jpg","tp":[1],"p":[]},{"t":39,"n":5,"q":"При наличии данной разметки, нанесенной на полосе движения, Вам разрешено выполнить:","a":["Только поворот налево","Только разворот","Поворот налево и разворот"],"c":2,"tip":"Горизонтальная разметка 1.18 разрешает с данной полосы поворот налево и разворот.(«Горизонтальная разметка»)","img":"i515.jpg","tp":[2],"p":[]},{"t":39,"n":6,"q":"Вам можно двигаться:","a":["Только налево","Налево и в обратном направлении","В любом направлении"],"c":2,"tip":"Правая рука регулировщика вытянута вперёд. При таком жесте регулировщика со стороны левого бока безрельсовым транспортным средствам разрешено движение во всех направлениях – прямо, направо, налево и разворот.(Пункт 6.10 ПДД)","img":"i516.jpg","tp":[3],"p":["6.10"]},{"t":39,"n":7,"q":"Какие внешние световые приборы должны быть включены на транспортном средстве, имеющем опознавательные знаки «Перевозка детей», при посадке и высадке из него детей?","a":["Габаритные огни","Ближний свет фар или противотуманные фары","Аварийная сигнализация"],"c":2,"tip":"Аварийная сигнализация должна быть включена при посадке и высадке детей в автобус, имеющий опознавательные знаки «Перевозка детей».(Пункт 7.1 ПДД)","img":null,"tp":[25],"p":["7.1"]},{"t":39,"n":8,"q":"Водитель автомобиля, выполняющий перестроение на правую полосу, в данной ситуации:","a":["Не должен создавать помехи двигающемуся по правой полосе автомобилю","Имеет преимущество, поскольку завершает обгон","Имеет преимущество, так как на автомобиле включены указатели правого поворота"],"c":0,"tip":"При единоличном перестроении водитель должен уступить дорогу «хозяину полосы» – транспортным средствам, движущимся попутно без изменения направления движения.(Пункт 8.4 ПДД)","img":"i517.jpg","tp":[4],"p":["8.4"]},{"t":39,"n":9,"q":"Разрешается ли Вам выполнить разворот в указанном месте?","a":["Разрешается","Разрешается при видимости дороги не менее 100 м","Запрещается"],"c":1,"tip":"Впереди поворот. Разворот можете осуществлять, если видимость дороги не менее 100 м.(Пункт 8.11 ПДД)","img":"i518.jpg","tp":[4],"p":["8.11"]},{"t":39,"n":10,"q":"С какой максимальной скоростью Вы имеете право продолжить движение на легковом автомобиле с прицепом?","a":["50 км/ч","70 км/ч","90 км/ч","110 км/ч"],"c":2,"tip":"На автомагистралях это значение скорости равно 90 км/ч, на остальных дорогах 70 км/ч. Действие, согласно знаку 5.1, происходит на «Автомагистрали».(Пункт 10.3 ПДД)","img":"i519.jpg","tp":[5],"p":["10.3"]},{"t":39,"n":11,"q":"По какой траектории водителю мотоцикла можно выполнить обгон?","a":["Только по А","Только по Б","По любой из указанных"],"c":0,"tip":"Обгон запрещён на равнозначных перекрёстках. Поэтому водитель мотоцикла может совершить обгон только по траектории «А» (п. 11.4).","img":"i520.jpg","tp":[6],"p":[]},{"t":39,"n":12,"q":"Разрешается ли Вам остановка в указанном месте?","a":["Разрешается","Разрешается только для посадки или высадки пассажиров","Запрещается"],"c":2,"tip":"Левая полоса на дороге, обозначенной знаком 5.11.2 «Дорога с полосой для велосипедистов», согласно разметке 1.23.3 отведена для движения велосипедистов, мопедов и лиц, использующих средства индивидуальной мобильности, навстречу общему потоку ТС. Другим ТС движение по данной полосе и остановка на ней запрещается.(Пункты 9.9, 12.4 ПДД)","img":"i521.jpg","tp":[7],"p":["12.4","9.9"]},{"t":39,"n":13,"q":"Вы намерены проехать перекресток в прямом направлении. Ваши действия?","a":["Проедете первым, руководствуясь сигналом светофора","Проедете первым, руководствуясь знаком «Главная дорога»","Уступите дорогу трамваю"],"c":2,"tip":"Перекресток регулируется светофором. Знаки приоритета «не работают». Вы и трамвай находитесь в равнозначных условиях. Трамвай в таких ситуациях всегда имеет преимущество перед безрельсовыми ТС, поэтому Вы уступаете дорогу трамваю.(Пункт 13.6 ПДД)","img":"i522.jpg","tp":[8],"p":["13.6"]},{"t":39,"n":14,"q":"Как Вам следует поступить при повороте налево?","a":["Уступить дорогу легковому автомобилю","Проехать перекресток первым"],"c":0,"tip":"Перекрёсток равнозначный. Водители безрельсовых транспортных средств между собой руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает дорогу. У Вас помеха справа, легковой автомобиль проезжает первым.(Пункт 13.11 ПДД)","img":"i523.jpg","tp":[8],"p":["13.11"]},{"t":39,"n":15,"q":"Кому Вы должны уступить дорогу при движении прямо?","a":["Легковому автомобилю и мотоциклу","Только легковому автомобилю","Никому"],"c":1,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Первоначально проезжают перекрёсток транспортные средства, находящиеся на главной дороге. Они имеют преимущество. Между собой они руководствуются «правилом правой руки». У Вас помеха справа, уступаете только легковому автомобилю.(Пункты 13.9, 13.10, 13.11 ПДД)","img":"i524.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":39,"n":16,"q":"Нарушил ли водитель Правила при вынужденной остановке на автомагистрали?","a":["Нарушил","Нарушил, если не выставил знак аварийной остановки","Не нарушил"],"c":1,"tip":"Водитель совершил вынужденную остановку на автомагистрали. Для проведения ремонтных работ он вывел транспортное средство на специально предназначенную полосу. Согласно пунктам 16.2, 7.1, 7.2 ПДД в изображённой ситуации следует включить аварийную сигнализацию и выставить знак аварийной остановки на расстоянии не менее 30 м, т.к. действие происходит вне населённого пункта.","img":"i525.jpg","tp":[18],"p":[]},{"t":39,"n":17,"q":"Разрешается ли буксировка в гололедицу, если у буксируемого транспортного средства исправны тормоза и рулевое управление?","a":["Разрешается","Разрешается только на жёсткой сцепке или методом частичной погрузки","Запрещается"],"c":1,"tip":"Буксировка в гололедицу на гибкой сцепке при любых обстоятельствах запрещается. Не запрещается буксировка методом частичной погрузки или на жёсткой сцепке.(Пункт 20.4 ПДД)","img":null,"tp":[15],"p":["20.4"]},{"t":39,"n":18,"q":"Разрешается ли устанавливать на транспортном средстве шины с шипами противоскольжения совместно с шинами без шипов противоскольжения?","a":["Разрешается","Разрешается только на разные оси","Запрещается"],"c":2,"tip":"Запрещается устанавливать на транспортном средстве ошипованные и неошипованные шины.(«Перечень неисправностей» п. 5.2.)","img":null,"tp":[11],"p":[]},{"t":39,"n":19,"q":"При трогании на подъеме на автомобиле с механической коробкой передач следует начинать отключать (отпускать) стояночный тормоз:","a":["До начала движения","Одновременно с началом движения","После начала движения"],"c":1,"tip":"Главное условие при трогании на подъёме – не допустить скатывания назад. Это проблема начинающих водителей, неправильно или недостаточно обученных. Скатывание назад происходит если стояночный тормоз начинают отпускать до начала движения. Если отпускать стояночный тормоз после начала движения, может произойти остановка двигателя. Правильный ответ - следует отпускать стояночный тормоз одновременно с началом движения.","img":null,"tp":[12],"p":[]},{"t":39,"n":20,"q":"Что понимается под остановочным путем?","a":["Расстояние, пройденное транспортным средством с момента обнаружения водителем опасности до полной остановки","Расстояние, пройденное транспортным средством с момента нажатия на педаль тормоза до полной остановки","Расстояние, пройденное транспортным средством с момента начала срабатывания тормозного привода до полной остановки"],"c":0,"tip":"Остановочный путь - расстояние, пройденное транспортным средством с момента обнаружения водителем опасности до полной его остановки. Остановочный путь включает в себя: путь за время реакции водителя плюс путь за время срабатывания тормозной системы, плюс замедление движения автомобиля до нулевой скорости.(«Техника управления автомобилем»)","img":null,"tp":[12],"p":[]},{"t":40,"n":1,"q":"По требованию каких лиц необходимо передавать для проверки водительское удостоверение на право управления транспортным средством соответствующей категории или подкатегории и представлять для проверки страховой полис обязательного страхования гражданской ответственности на бумажном носителе или в виде электронного документа либо его копии на бумажном носителе?","a":["Сотрудника полиции","Сотрудника Военной автомобильной инспекции","Любого регулировщика","Всех перечисленных лиц"],"c":0,"tip":"Пункт 2.1.1 ПДД обязывает водителя выполнить перечисленные действия только по требованию сотрудника полиции.","img":null,"tp":[23],"p":[]},{"t":40,"n":2,"q":"Вам разрешено продолжить движение на перекрёстке?","a":["Только прямо","Прямо и налево","Прямо и в обратном направлении","В любом направлении"],"c":0,"tip":"В случае установки знака 4.1.1 «Движение прямо» непосредственно перед пересечением проезжих частей движение разрешается только прямо.(«Дорожные знаки»)","img":"i526.jpg","tp":[1],"p":[]},{"t":40,"n":3,"q":"Какие из указанных знаков разрешают разворот?","a":["Только А","А и В","Все"],"c":2,"tip":"Предписывающие знаки, к которым относится знак А – 4.1.3 «Движение налево», разрешающие поворот налево, разрешают и разворот. Знак В – 5.7.2 «Выезд на дорогу с односторонним движением» запрещает поворот направо, но не запрещает производить разворот. Чаще всего и водители, и сотрудники ГИБДД или забывают, или не знают, что знак Б – 3.18.2 «Поворот налево запрещён» не запрещает производить разворот.Поэтому все три данных знака разрешают производить маневр – разворот.(«Дорожные знаки»)","img":"i527.jpg","tp":[1],"p":[]},{"t":40,"n":4,"q":"Поставить на стоянку указанным на табличке способом можно:","a":["Только легковые автомобили и мотоциклы","Все транспортные средства, кроме грузовых автомобилей с разрешенной максимальной массой более 3,5 т","Любые транспортные средства"],"c":0,"tip":"Табличка 8.6.3 «Способ постановки транспортного средства на стоянку» указывает, как должны располагаться легковые автомобили и мотоциклы на краю тротуара в месте, обозначенном знаком 6.4 «Парковка (парковочное место)».(«Дорожные знаки»)","img":"i528.jpg","tp":[1],"p":[]},{"t":40,"n":5,"q":"Разметкой в виде буквы «А» обозначают?","a":["Специальную полосу для любых автобусов","Специальную полосу для маршрутных транспортных средств","Место остановки и стоянки любых автобусов"],"c":1,"tip":"Горизонтальная разметка 1.23.1 (в виде буквы «А») обозначает специальную полосу для маршрутных транспортных средств, к которым относятся автобусы и троллейбусы, движущиеся по установленным маршрутам с обозначенными остановками. К этой категории не относятся маршрутные такси.","img":"i529.jpg","tp":[2],"p":[]},{"t":40,"n":6,"q":"Разрешено ли Вам движение?","a":["Разрешено прямо и направо","Разрешено только направо","Запрещено"],"c":2,"tip":"Вспоминаем афоризм «спина-стена». Вам движение со стороны спины запрещено.(Пункт 6.10 ПДД)","img":"i530.jpg","tp":[3],"p":["6.10"]},{"t":40,"n":7,"q":"Какой опознавательный знак должен быть закреплен на задней части буксируемого механического транспортного средства при отсутствии или неисправности аварийной сигнализации?","a":["А","Б","В"],"c":0,"tip":"«А» – знак аварийной остановки.(Пункт 7.3 ПДД)","img":"i531.jpg","tp":[25],"p":["7.3"]},{"t":40,"n":8,"q":"На перекрестке Вы намерены повернуть направо. Как Вам следует поступить?","a":["Перестроиться на правую полосу, затем осуществить поворот","Продолжить движение по левой полосе до перекрёстка, затем повернуть","Возможны оба варианта действий"],"c":2,"tip":"Действие знака 5.15.1 «Направления движения по полосам», установленного перед перекрёстком, распространяется на весь перекрёсток, если другие знаки 5.15.1 и 5.15.2, установленные на нём, не дают иных указаний. Поворот направо разрешается с обеих полос, поэтому допустимы оба варианта.(«Дорожные знаки»)","img":"i532.jpg","tp":[4],"p":[]},{"t":40,"n":9,"q":"Кто должен уступить дорогу при одновременном развороте?","a":["Водитель автобуса","Водитель легкового автомобиля","В данной ситуации водителям следует действовать по взаимной договоренности"],"c":0,"tip":"В случаях определения порядка проезда транспортных средств, не оговоренных Правилами, водители руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает. У водителя автобуса помеха справа, уступает дорогу.(Пункт 8.9 ПДД)","img":"i533.jpg","tp":[4],"p":["8.9"]},{"t":40,"n":10,"q":"Кто из водителей занял правильное положение на полосе движения?","a":["Оба","Только водитель мопеда, занимающего левое положение на полосе движения","Только водитель мотоцикла, занимающего правое положение на полосе движения","Никто из водителей"],"c":2,"tip":"Водители мопедов должны двигаться по правому краю проезжей части в один ряд. Мотоциклисты могут выбирать для движения в населенном пункте любую полосу, при обеспечении безопасного интервала, Правила не запрещают им двигаться по полосе в два ряда.(Пункты 9.4, 24.7 ПДД)","img":"i534.jpg","tp":[13],"p":["24.7","9.4"]},{"t":40,"n":11,"q":"Как Вам следует поступить в данной ситуации?","a":["Проехать первым","Использовать обочину для встречного разъезда","Уступить дорогу грузовому автомобилю"],"c":0,"tip":"Помеха на стороне водителя грузовика. Он уступает дорогу, вы проезжаете первым.(Пункт 11.7 ПДД)","img":"i535.jpg","tp":[6],"p":["11.7"]},{"t":40,"n":12,"q":"Нарушил ли водитель автомобиля правила остановки?","a":["Нарушил","Нарушил, если расстояние от автомобиля до линии разметки менее 3 м","Не нарушил"],"c":0,"tip":"На Т-образном перекрёстке можно останавливаться напротив бокового проезда, но при этом он должен иметь сплошную линию разметки или разделительную полосу. Здесь же разметка из двух линий – сплошной и прерывистой. Остановка поэтому запрещена.(Пункт 12.4 ПДД)","img":"i536.jpg","tp":[7],"p":["12.4"]},{"t":40,"n":13,"q":"Вы намерены повернуть направо. Ваши действия?","a":["Проедете перекрёсток первым","Уступите дорогу только трамваю А","Уступите дорогу только трамваю Б","Уступите дорогу обоим трамваям"],"c":3,"tip":"При одновременном праве на движение трамваи имеют преимущество перед безрельсовыми транспортными средствами.(Пункт 13.6 ПДД)","img":"i537.jpg","tp":[8],"p":["13.6"]},{"t":40,"n":14,"q":"При движении прямо Вы:","a":["Имеете преимущество","Должны уступить дорогу только мотоциклу","Должны уступить дорогу только автомобилю","Должны уступить дорогу обоим транспортным средствам"],"c":1,"tip":"Перекрёсток равнозначный. Мигающий маячок оранжевого или жёлтого цвета на грузовике преимуществ его водителю не предоставляет. Водители руководствуются «правилом правой руки». У Вас помеха справа – мотоциклист. Вы уступаете дорогу только мотоциклисту, который начнёт первым движение, выкатится на перекрёсток. После этого Вы проедете через перекрёсток, за Вами грузовик, мотоциклист последним закончит движение.(Пункты 3.4, 13.11 ПДД)","img":"i538.jpg","tp":[8],"p":["13.11","3.4"]},{"t":40,"n":15,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Только автобусу","Только грузовому автомобилю","Обоим транспортным средствам"],"c":2,"tip":"Перед Вами знак 2.4 «Уступите дорогу». Уступаете дорогу транспортным средствам, движущимся по пересекаемой дороге, в данной ситуации обоим транспортным средствам.(Пункт 13.9 ПДД, «Дорожные знаки»)","img":"i539.jpg","tp":[8],"p":["13.9"]},{"t":40,"n":16,"q":"Можно ли Вам въехать на железнодорожный переезд?","a":["Можно","Можно, если отсутствует приближающийся поезд","Нельзя"],"c":2,"tip":"Водитель грузовика остановился, чтобы уступить дорогу. Выехав на железнодорожный переезд, Вы будете вынуждены на нём остановиться, дожидаясь освобождения места за переездом. Выезд на железнодорожный переезд в такой ситуации запрещён.(Пункт 15.3 ПДД)","img":"i540.jpg","tp":[14],"p":["15.3"]},{"t":40,"n":17,"q":"Разрешается ли перевозка людей в салоне легкового автомобиля, буксирующего неисправное транспортное средство?","a":["Разрешается","Разрешается только при буксировке на жёсткой сцепке","Запрещается"],"c":0,"tip":"Пунктом 20.2 ПДД перевозка людей в салоне легкового автомобиля, буксирующего неисправное транспортное средство не запрещается, т. е. – разрешается.","img":null,"tp":[15],"p":[]},{"t":40,"n":18,"q":"Водитель, в отношении которого имеются достаточные основания полагать, что он находится в состоянии опьянения, направляется на медицинское освидетельствование на состояние опьянения:","a":["При отказе от прохождения освидетельствования на состояние алкогольного опьянения","При несогласии с результатами освидетельствования на состояние алкогольного опьянения","При наличии достаточных оснований полагать, что водитель находится в состоянии опьянения, и отрицательном результате освидетельствования на состояние алкогольного опьянения","Во всех перечисленных случаях"],"c":3,"tip":"Согласно ст. 27.12 ч.1.1 КоАП РФ, во всех перечисленных случаях водитель направляется на медицинское освидетельствование на состояние опьянения.","img":null,"tp":[22],"p":[]},{"t":40,"n":19,"q":"Как следует поступить водителю при посадке в автомобиль, стоящий у тротуара или на обочине?","a":["Обойти автомобиль спереди","Обойти автомобиль сзади","Допустимы оба варианта действий"],"c":0,"tip":"Правилами данная ситуация не регламентируется. В такой ситуации следует выполнять действия, которые в большей степени обеспечивают безопасность дорожного движения.При посадке в автомобиль стоящий у тротуара или на обочине, водителю следует обходить его спереди, чтобы постоянно контролировать ситуацию и видеть ТС движущиеся в попутном направлении. Правильный ответ - обойти автомобиль спереди.","img":null,"tp":[12],"p":[]},{"t":40,"n":20,"q":"Какова первая помощь при наличии признаков поверхностного термического ожога (покраснение и отек кожи, образование на месте ожога пузырей, наполненных прозрачной жидкостью, сильная боль)?","a":["Полить ожоговую поверхность холодной водой, накрыть стерильной салфеткой и туго забинтовать","Вскрыть ожоговые пузыри, очистить ожоговую поверхность от остатков одежды, накрыть стерильной салфеткой (не бинтовать), по возможности приложить холод, поить пострадавшего водой","Охладить ожоговую поверхность водой в течение 20 минут. Ожоговые пузыри не вскрывать, остатки одежды с обожженной поверхности не удалять, место ожога накрыть стерильной салфеткой (не бинтовать), по возможности приложить холод и поить пострадавшего водой."],"c":2,"tip":"При ожогах - пузыри НЕ вскрывать. Иначе образуется рана, которая инфицируется, остатки одежды с обожженной поверхности не удалять. В первую очередь необходимо охладить обожженную рану водой в течение не менее 20 минут. Место ожога накрыть стерильной салфеткой (не бинтовать), по возможности приложить холод и поить пострадавшего водой.","img":null,"tp":[16],"p":[]}]}</script>
<script>
const D=JSON.parse(document.getElementById('qd').textContent);
const Q=D.q, TOP=D.topics;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?c:m>1&&m<5?b:m===1?a:c};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
/* ---------- progress (per-viewer, this browser only) ---------- */
let ST={r:{},w:{}};
try{const s=JSON.parse(localStorage.getItem('pdd-ab-v1')||'null');if(s&&s.r)ST=s}catch(e){}
const save=()=>{try{localStorage.setItem('pdd-ab-v1',JSON.stringify(ST))}catch(e){}};
const mark=(i,ok)=>{ST.r[i]=ok?(ST.r[i]||0)+1:0;if(!ok)ST.w[i]=1;save()};
const learned=i=>(ST.r[i]||0)>=1;
const isMistake=i=>ST.w[i]&&(ST.r[i]||0)<2;
const mistakes=()=>Q.map((_,i)=>i).filter(isMistake);
/* ---------- program ---------- */
const T=n=>TOP.indexOf(n);
const byTopics=(names,from=1,to=40)=>Q.map((q,i)=>i).filter(i=>names.map(T).includes(Q[i].tp[0])&&Q[i].t>=from&&Q[i].t<=to);
const DAYS=[
 {t:'Теория без картинок',d:'Термины, обязанности, штрафы, первая помощь. Лёгкий старт.',s:byTopics(['Общие положения','Общие обязанности водителей','Ответственность водителя','Оказание доврачебной медицинской помощи']),r:['terms','duty','med']},
 {t:'Сигналы',d:'Светофор, регулировщик, спецсигналы, аварийка, фары.',s:byTopics(['Сигналы светофора и регулировщика','Применение специальных сигналов','Применение аварийной сигнализации и знака аварийной остановки','Пользование внешними световыми приборами и звуковыми сигналами']),r:['light','reg','spec','hazard','beam']},
 {t:'Знаки, часть 1',d:'Вопросы о знаках из билетов 1–20.',s:byTopics(['Дорожные знаки'],1,20),r:['signs']},
 {t:'Знаки, часть 2',d:'Вопросы о знаках из билетов 21–40.',s:byTopics(['Дорожные знаки'],21,40),r:['signs']},
 {t:'Разметка и полосы',d:'Линии разметки и расположение на проезжей части.',s:byTopics(['Дорожная разметка','Расположение транспортных средств на проезжей части']),r:['marks','lanes']},
 {t:'Манёвры, часть 1',d:'Повороты, перестроения, разворот. Билеты 1–20.',s:byTopics(['Начало движения, маневрирование'],1,20),r:['turn','uturn','terms']},
 {t:'Манёвры, часть 2',d:'То же, билеты 21–40.',s:byTopics(['Начало движения, маневрирование'],21,40),r:['turn','uturn']},
 {t:'Перекрёстки, часть 1',d:'Самый «дорогой» блок. Билеты 1–20 и приоритет маршрутных.',s:byTopics(['Проезд перекрестков'],1,20).concat(byTopics(['Приоритет маршрутных транспортных средств'])),r:['right','left','main','light']},
 {t:'Перекрёстки, часть 2',d:'Билеты 21–40. Те же три правила.',s:byTopics(['Проезд перекрестков'],21,40),r:['right','left','main']},
 {t:'Обгон и скорость',d:'Обгон, скорость, автомагистрали.',s:byTopics(['Обгон, опережение, встречный разъезд','Скорость движения','Движение по автомагистралям']),r:['overtake','speed','motorway']},
 {t:'Остановка и особые места',d:'Остановка и стоянка, переезды, жилые зоны, буксировка, перевозка.',s:byTopics(['Остановка и стоянка','Движение через железнодорожные пути','Движение в жилых зонах','Буксировка механических транспортных средств','Перевозка людей и грузов','Пешеходные переходы и места остановок маршрутных транспортных средств','Учебная езда и дополнительные требования к движению велосипедистов']),r:['stop','rail','motorway','tow','ped']},
 {t:'Безопасность и неисправности',d:'Техника управления и когда машину нельзя эксплуатировать.',s:byTopics(['Безопасность движения и техника управления автомобилем','Неисправности и условия допуска транспортных средств к эксплуатации']),r:['safety','faults']},
 {t:'Экзамен: билеты 1–20',d:'Каждый билет в режиме экзамена, потом «Ошибки».',exam:[1,20]},
 {t:'Экзамен: билеты 21–40',d:'Цель — 3 сдачи подряд без допвопросов.',exam:[21,40]},
];
/* ---------- rules (patterns) ---------- */
const R=[
 {id:'right',t:'Помеха справа',p:['13.11','8.9'],l:['На равнозначном перекрёстке уступаете тому, кто приближается справа.','Трамвай на равнозначном перекрёстке едет первым, куда бы он ни поворачивал.','Если очерёдность нигде не оговорена (п. 8.9), работает то же правило: уступает тот, к кому другой приближается справа.']},
 {id:'left',t:'Налево — уступи встречным',p:['13.4','13.12'],l:['Поворачивая налево или разворачиваясь, уступите встречным, которые едут прямо или направо.','Работает и на зелёный сигнал (п. 13.4), и на равнозначном перекрёстке (п. 13.12).'],mn:'Кто едет прямо — тот прав. Поворачиваешь налево — ты последний.'},
 {id:'main',t:'Главная дорога',p:['13.9','13.10'],l:['Со второстепенной дороги уступаете всем на главной, куда бы они ни ехали.','Если главная дорога поворачивает (табличка под знаком), машины на главной разъезжаются между собой по «помехе справа». Машины на второстепенной — тоже между собой.','Сначала определите, кто на главной, потом примените помеху справа внутри каждой пары.']},
 {id:'light',t:'Светофор',p:['6.2','6.3','6.4','6.13','6.14','13.2','13.3','13.5','13.6','13.7','13.8'],l:['Мигающий зелёный разрешает движение и предупреждает о смене сигнала.','Жёлтый запрещает въезд, но можно продолжить, если остановиться удастся только экстренным торможением.','Жёлтый мигающий или выключенный светофор — перекрёсток нерегулируемый, смотрите на знаки приоритета.','Работает светофор — знаки приоритета не действуют.','Въехали на разрешающий — выезжайте в намеченном направлении. На зелёный уступите тем, кто заканчивает проезд перекрёстка, и пешеходам.','Едете по дополнительной стрелке — уступите тем, кто едет с других направлений.','За перекрёстком затор — на перекрёсток не въезжайте (п. 13.2).']},
 {id:'reg',t:'Регулировщик',p:['6.10','6.11','6.12','6.15'],l:['Регулировщик главнее светофора, знаков и разметки.','Руки в стороны или опущены: со стороны груди и спины — стоп; с боков — трамваю прямо, остальным прямо и направо.','Правая рука вперёд: с левого бока — можно во всех направлениях; со стороны груди — только направо; со спины и с правого бока — стоп.','Рука поднята вверх — стоп всем, кроме тех, кто не может остановиться без экстренного торможения.'],mn:'Если палка смотрит в рот — делай правый поворот. Если палка смотрит вправо — ехать не имеешь права. Если палка смотрит влево — поезжай как королева. Грудь и спина — стена.'},
 {id:'turn',t:'Поворотник и крайнее положение',p:['8.1','8.2','8.3','8.4','8.5','8.6','8.7'],l:['Сигнал поворота — заранее до манёвра, выключить сразу после. Преимущества он не даёт.','Перед поворотом и разворотом займите крайнее положение. После поворота налево нельзя оказаться на встречной стороне.','Перестраиваясь, уступите тем, кто едет попутно без перестроения. Перестраиваетесь одновременно с соседом — уступает тот, у кого сосед справа.','Выезжаете со двора, парковки, АЗС — уступите всем на дороге (п. 8.3).']},
 {id:'uturn',t:'Разворот и задний ход',p:['8.8','8.11','8.12'],l:['Разворот запрещён: на пешеходных переходах, в тоннелях, на мостах, путепроводах, эстакадах и под ними, на ж/д переездах, где видимость меньше 100 м хотя бы в одну сторону, на остановках маршрутных ТС.','Задний ход запрещён на перекрёстках и везде, где запрещён разворот.','Поворачиваете налево или разворачиваетесь вне перекрёстка — уступите встречным и попутному трамваю.'],mn:'Видимость 100 м — главная цифра разворота.'},
 {id:'overtake',t:'Обгон',p:['11.1','11.2','11.3','11.4','11.5','11.6','11.7'],l:['Обгон запрещён: на регулируемых перекрёстках; на нерегулируемых — если вы не на главной; на пешеходных переходах; на ж/д переездах и ближе 100 м перед ними; на мостах, путепроводах, эстакадах и под ними, в тоннелях; в конце подъёма, на опасных поворотах и при ограниченной видимости.','Обгоняемому нельзя ускоряться.','Обгон — выезд на встречную полосу. Опережение без выезда на встречную — это уже не обгон.']},
 {id:'stop',t:'Остановка и стоянка',p:['12.'],l:['Остановка — до 5 минут или дольше, если это посадка-высадка или погрузка. Дольше — стоянка.','Остановка запрещена: на трамвайных путях; на переездах, в тоннелях, на эстакадах, мостах, путепроводах (если в вашу сторону меньше трёх полос) и под ними; если до сплошной линии меньше 3 м; на переходах и ближе 5 м перед ними; на перекрёстке и ближе 5 м от края пересекаемой проезжей части; ближе 15 м от остановки автобуса или такси; где видимость меньше 100 м.','Стоянка дополнительно запрещена ближе 50 м от ж/д переездов и вне населённых пунктов на дорогах со знаком «Главная дорога».'],mn:'5 м — переход и перекрёсток. 15 м — остановка автобуса. 50 м — переезд.'},
 {id:'lanes',t:'Полосы движения',p:['9.'],l:['Полосы считают по всей ширине дороги; разделительная полоса делит дорогу на проезжие части.','На дороге с четырьмя полосами и больше нельзя выезжать на встречную сторону для обгона и объезда.','При трёх полосах средняя — только для обгона, объезда, поворота налево и разворота. Крайняя левая — для встречных.','Трамвайные пути встречного направления занимать нельзя.']},
 {id:'speed',t:'Скорость',p:['10.'],l:['В населённом пункте — до 60 км/ч, в жилой зоне и во дворах — до 20 км/ч.','Вне населённых пунктов легковым и мотоциклам — до 90 км/ч, на автомагистрали — до 110 км/ч.','Легковой с прицепом — до 70 км/ч. Буксировка — до 50 км/ч.','Нельзя без причины ехать слишком медленно и резко тормозить.']},
 {id:'beam',t:'Фары и звук',p:['19.'],l:['На ходу днём — ближний свет или дневные ходовые огни.','Дальний переключайте на ближний не ближе чем за 150 м до встречного.','Ослепили — включите аварийку и, не меняя полосы, снизьте скорость и остановитесь.']},
 {id:'hazard',t:'Аварийка и знак аварийной остановки',p:['7.'],l:['Аварийку включаете при ДТП, при вынужденной остановке там, где стоять нельзя, при ослеплении и на буксируемой машине.','Знак аварийной остановки: в населённом пункте не ближе 15 м, вне — не ближе 30 м.'],mn:'Город — 15, трасса — 30.'},
 {id:'rail',t:'Ж/д переезды',p:['15.'],l:['Стоп перед стоп-линией, знаком «Стоп» или светофором. Если их нет — не ближе 5 м от шлагбаума, а без шлагбаума — не ближе 10 м до ближайшего рельса.','Обгон запрещён на переезде и за 100 м до него. Стоянка — ближе 50 м.','Нельзя объезжать шлагбаум и въезжать, если за переездом затор.'],mn:'5 — до шлагбаума, 10 — до рельса, 50 — стоянка, 100 — обгон.'},
 {id:'motorway',t:'Автомагистраль и жилая зона',p:['16.','17.'],l:['На автомагистрали нельзя: разворачиваться, ехать задним ходом, учиться вождению и ехать медленнее 40 км/ч.','В жилой зоне пешеход главнее, скорость до 20 км/ч. Запрещены сквозное движение, учебная езда и стоянка с работающим двигателем.','Выезжаете из жилой зоны — уступите всем.']},
 {id:'terms',t:'Термины',p:['1.2'],l:['«Уступить дорогу» — не ехать и не маневрировать, если из-за вас другим придётся менять скорость или направление.','Выезд со двора, парковки, АЗС — прилегающая территория, а не перекрёсток.','Разделительная полоса делит дорогу на проезжие части. Число полос считают по всей дороге.','Обгон — опережение с выездом на встречную полосу и возвращением обратно.']},
