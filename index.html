  ${q.img?`<img data-img="${q.img}" data-pk="${(q.t-1)/5|0}" ${IMG[q.img]?`src="${IMG[q.img]}"`:''} alt="Иллюстрация к вопросу" width="640" height="240" style="aspect-ratio:auto">`:''}
  <div class="qbody"><p class="qtext">${esc(q.q)}</p><div class="ans">${q.a.map((a,j)=>{let c='';if(reveal){if(j===q.c)c='ok';else if(j===picked)c='bad'}else if(j===picked)c='pick';
   return `<button data-a="${j}" class="${c}" ${reveal?'disabled':''}><span>${j+1}</span><span>${esc(a)}</span></button>`}).join('')}</div>
  ${reveal&&q.tip?`<p class="tip">${esc(q.tip)}</p>`:''}</div></article>`}
function sessHTML(){const s=SESS;
  if(s.i>=s.list.length){const ok=s.res.filter(Boolean).length,bad=s.list.filter((_,k)=>!s.res[k]);
   return `<section class="sec"><h2>${esc(s.title)}: готово</h2></section><div class="result ${bad.length?'bad':'ok'}"><span class="verdict">${ok} из ${s.list.length} верно</span><span>${bad.length?'Неверные ответы добавлены в «Ошибки».':'Без ошибок.'}</span></div>
   <div class="row">${bad.length?`<button class="btn" data-again="1">Повторить ${bad.length} неверных</button>`:''}<button class="btn ghost" data-end="1">К выбору</button><a class="btn ghost" href="#plan" style="text-decoration:none" data-end="1">Программа</a></div>`}
  const reveal=s.picked!==null,qi=s.list[s.i];
  return `<div class="sessbar"><h3>${esc(s.title)}</h3><span class="mono muted">${s.i+1} / ${s.list.length}</span></div>
  <div class="dots">${s.list.map((_,k)=>`<i class="${k<s.i||(k===s.i&&reveal)?(s.res[k]?'ok':'bad'):k===s.i?'cur':''}"></i>`).join('')}</div>
  ${qHTML(qi,s.picked,reveal,esc(TOP[Q[qi].tp[0]]))}
  ${reveal?`<div class="row"><span class="verdict ${s.res[s.i]?'ok':'bad'}">${s.res[s.i]?'Верно':'Неверно'}</span><button class="btn" data-next="1">Дальше</button></div>`:''}
  <div class="row"><button class="btn ghost small" data-end="1">Закончить</button><span class="muted" style="font-size:13px">Клавиши: 1–5 — ответ, Enter — дальше</span></div>`}
/* ---------- exam ---------- */
let EX=null,TICK=null;
function examPickHTML(){return `<section class="sec"><h2>Экзамен</h2><p class="lead">Как в ГИБДД: 20 вопросов, 20 минут, верные ответы не показываются до конца. Одна ошибка в блоке из пяти вопросов — 5 дополнительных вопросов по той же теме и +5 минут. Не сдан: две ошибки в одном блоке, больше двух ошибок, любая ошибка в дополнительных или вышло время.</p></section>
 <div class="row"><button class="btn" data-exam="0">Случайный билет</button></div>
 <section class="sec"><h3>Выбрать билет</h3><div class="grid40">${Array.from({length:40},(_,k)=>`<button data-exam="${k+1}">${k+1}</button>`).join('')}</div></section>`}
function startExam(n){if(!n)n=1+Math.floor(Math.random()*40);
 const list=Q.map((q,i)=>i).filter(i=>Q[i].t===n);EX={n,list,ans:[],i:0,base:20,end:Date.now()+20*60e3,done:null,extraAdded:false};
 clearInterval(TICK);TICK=setInterval(()=>{if(!EX||EX.done){clearInterval(TICK);return}const t=$('#timer');const left=EX.end-Date.now();if(left<=0){finishExam('Время вышло');return}if(t)t.textContent=fmt(left)},500);render();scrollTo(0,0)}
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function examAnswer(j){const qi=EX.list[EX.i];EX.ans[EX.i]=j;mark(qi,j===Q[qi].c);EX.i++;
 if(EX.i===EX.base&&!EX.extraAdded){const err=[];for(let b=0;b<4;b++){const e=[0,1,2,3,4].map(k=>b*5+k).filter(k=>EX.ans[k]!==Q[EX.list[k]].c);if(e.length>1)return finishExam('Две ошибки в одном блоке');err.push(...e)}
  if(err.length>2)return finishExam('Больше двух ошибок');
  EX.extraAdded=true;if(!err.length)return finishExam(null);
  err.forEach(k=>{const tp=Q[EX.list[k]].tp[0];const pool=shuffle(Q.map((q,i)=>i).filter(i=>Q[i].tp[0]===tp&&!EX.list.includes(i))).slice(0,5);EX.list.push(...pool);EX.end+=5*60e3})}
 else if(EX.i>EX.base&&j!==Q[qi].c)return finishExam('Ошибка в дополнительном вопросе');
 if(EX.i>=EX.list.length)return finishExam(null);render()}
function finishExam(reason){EX.done={reason,pass:!reason};clearInterval(TICK);render();scrollTo(0,0)}
function examHTML(){const e=EX;
 if(e.done){const wrong=e.ans.map((a,k)=>({a,k})).filter(o=>o.a!==undefined&&o.a!==Q[e.list[o.k]].c);
  return `<section class="sec"><h2>Билет ${e.n}</h2></section><div class="result ${e.done.pass?'ok':'bad'}"><span class="verdict">${e.done.pass?'Экзамен сдан':'Экзамен не сдан'}</span><span>${e.done.pass?(e.extraAdded&&e.list.length>20?'С дополнительными вопросами.':'Без ошибок или с допустимыми ошибками.'):esc(e.done.reason)}</span><span class="mono">Ответов: ${e.ans.filter(a=>a!==undefined).length} · ошибок: ${wrong.length}</span></div>
  <div class="row"><button class="btn" data-exam="${e.n}">Пересдать этот билет</button><button class="btn ghost" data-exam="0">Случайный билет</button><button class="btn ghost" data-exend="1">Выбрать билет</button></div>
  ${wrong.length?`<section class="sec"><h3>Разбор ошибок</h3><div class="review">${wrong.map(o=>qHTML(e.list[o.k],o.a,true,o.k<20?'Основной вопрос '+(o.k+1):'Дополнительный')).join('')}</div></section>`:''}`}
 const qi=e.list[e.i],extra=e.i>=20;
 return `<div class="sessbar"><h3>Билет ${e.n}${extra?' · дополнительные':''}</h3><span class="timer" id="timer">${fmt(e.end-Date.now())}</span></div>
 <div class="dots">${e.list.map((_,k)=>`<i class="${k<e.i?'done':k===e.i?'cur':''}"></i>`).join('')}</div>
 ${qHTML(qi,null,false,extra?'Дополнительный вопрос':'Вопрос '+(e.i+1)+' из 20')}
 <div class="row"><button class="btn ghost small" data-exend="1">Прервать</button></div>`}
/* ---------- images: loaded per 5 tickets ---------- */
const IMG={},PK={};
function pack(k){if(!PK[k])PK[k]=fetch('p'+k+'.json').then(r=>r.json()).then(o=>{for(const n in o)IMG[n]='data:image/jpeg;base64,'+o[n]}).catch(()=>{delete PK[k]});return PK[k]}
function fillImgs(){document.querySelectorAll('img[data-img]:not([src])').forEach(im=>pack(+im.dataset.pk).then(()=>{if(IMG[im.dataset.img])im.src=IMG[im.dataset.img]}))}
/* ---------- events ---------- */
function bind(){const v=$('#view');fillImgs();bindXfer();
 if(SESS&&SESS.i+1<SESS.list.length)pack((Q[SESS.list[SESS.i+1]].t-1)/5|0);
 v.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{const d=DAYS[+b.dataset.day];if(d.s){const rest=d.s.filter(i=>!learned(i));startSess('День '+(+b.dataset.day+1)+'. '+d.t,rest.length?rest:d.s)}else location.hash='exam'});
 v.querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>{location.hash='rules';setTimeout(()=>{const el=document.getElementById('r-'+b.dataset.rule);if(el)el.scrollIntoView({block:'start'})},30)});
 v.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(b.dataset.lesson));
 v.querySelectorAll('[data-hq]').forEach(b=>b.onclick=()=>{const x=HARD.find(o=>o.id===b.dataset.hq);startSess(x.t,x.qs)});
 v.querySelectorAll('[data-hall]').forEach(b=>b.onclick=()=>startSess('Сложное вперемешку',shuffle(hardAll())));
 v.querySelectorAll('[data-hmist]').forEach(b=>b.onclick=()=>startSess('Сложное: ошибки',shuffle(hardAll().filter(isMistake))));
 v.querySelectorAll('details.hcard').forEach(d=>d.ontoggle=()=>{try{const o=JSON.parse(localStorage.getItem('pdd-cd-open')||'{}');o[d.id]=d.open;localStorage.setItem('pdd-cd-open',JSON.stringify(o))}catch(e){}});
 try{const o=JSON.parse(localStorage.getItem('pdd-cd-open')||'{}');v.querySelectorAll('details.hcard').forEach(d=>{if(o[d.id])d.open=true})}catch(e){}
 v.querySelectorAll('[data-rq]').forEach(b=>b.onclick=()=>{const r=R.find(x=>x.id===b.dataset.rq);startSess(r.t,r.qs)});
 v.querySelectorAll('[data-ticket]').forEach(b=>b.onclick=()=>{const t=+b.dataset.ticket;startSess('Билет '+t,Q.map((q,i)=>i).filter(i=>Q[i].t===t))});
 v.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>{const k=+b.dataset.topic;startSess(TOP[k],Q.map((q,i)=>i).filter(i=>Q[i].tp[0]===k))});
 v.querySelectorAll('[data-rand]').forEach(b=>b.onclick=()=>startSess('20 случайных',shuffle(Q.map((q,i)=>i)).slice(0,20)));
 v.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{const n=Q.map((q,i)=>i).filter(i=>ST.r[i]===undefined);startSess('Новые вопросы',shuffle(n.length?n:Q.map((q,i)=>i)).slice(0,20))});
 v.querySelectorAll('[data-mist]').forEach(b=>b.onclick=()=>startSess('Ошибки',shuffle(mistakes()),'mist'));
 v.querySelectorAll('[data-again]').forEach(b=>b.onclick=()=>{const bad=SESS.list.filter((_,k)=>!SESS.res[k]);startSess(SESS.title,bad,SESS.mode)});
 v.querySelectorAll('[data-end]').forEach(b=>b.addEventListener('click',()=>{SESS=null;render()}));
 v.querySelectorAll('[data-next]').forEach(b=>b.onclick=next);
 v.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>startExam(+b.dataset.exam));
 v.querySelectorAll('[data-exend]').forEach(b=>b.onclick=()=>{EX=null;clearInterval(TICK);render()});
 v.querySelectorAll('.ans button[data-a]').forEach(b=>b.onclick=()=>answer(+b.dataset.a));
}
function answer(j){
 if(view==='exam'&&EX&&!EX.done)return examAnswer(j);
 const s=SESS;if(!s||s.picked!==null||s.i>=s.list.length)return;const qi=s.list[s.i];if(j>=Q[qi].a.length)return;
 s.picked=j;s.res[s.i]=j===Q[qi].c;mark(qi,s.res[s.i]);render();
 const n=document.querySelector('[data-next]');if(n)n.scrollIntoView({block:'nearest'})}
function next(){const s=SESS;if(!s||s.picked===null)return;s.i++;s.picked=null;render();scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=+e.key;
 if(k>=1&&k<=5){const b=document.querySelector(`.ans button[data-a="${k-1}"]:not(:disabled)`);if(b){e.preventDefault();b.click()}}
 if(e.key==='Enter'){const n=document.querySelector('[data-next]');if(n){e.preventDefault();n.click()}}});
go();
</script>

</body></html>
