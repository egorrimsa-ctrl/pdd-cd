/* Layout: one narrow study column, sticky road-sign header with tabs, cards only for rules and the question */
:root{

.hlist{display:flex;flex-direction:column;gap:12px}

.signs{display:flex;flex-wrap:wrap;gap:16px 22px}
.sg{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;text-align:center;font-size:15px;line-height:1.25;color:var(--stage-muted)}
.disc{width:84px;height:84px;border-radius:50%;background:#FFFFFF;border:9px solid var(--sign-red);color:#111111;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums}
.rulev{font-family:var(--f-display);font-size:clamp(26px,7vw,36px);line-height:1.2;border-left:6px solid var(--yellow);padding-left:16px;margin:0;text-wrap:balance}
.lp-acts{display:flex;flex-wrap:wrap;gap:10px}
.lp-acts .btn.ghost{color:var(--stage-ink);border-color:rgba(255,255,255,.6)}
.lp-acts .btn:not(.ghost){background:var(--yellow);color:#152033}
.lp-ctl{display:flex;justify-content:center;gap:28px;padding:10px 16px 16px}
.lp-ctl button{width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);color:var(--stage-ink);display:grid;place-items:center}
.lp-ctl .lp-pp{background:var(--yellow);border-color:var(--yellow);color:#152033}
.lp-ctl button:disabled{opacity:.3;cursor:default}
#lp:focus{outline:none}
#lp button:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
/* road signs */
.rsign{display:block;width:100%;height:100%;overflow:visible}
.sgw{display:block;width:84px;height:84px}
.sgal{display:flex;flex-direction:column;gap:12px}
.sgi{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center}
.sgal.big .sgi{grid-template-columns:112px 1fr}
.sgimg{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;max-width:100%}
.sgimg .rsign{max-height:100%;width:auto;max-width:100%;height:auto}
.sgt{display:flex;flex-direction:column;gap:3px;min-width:0}
.sgt .sgc{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--yellow)}
.sgt b{font-family:var(--f-display);font-size:21px;line-height:1.15}
.sgal.big .sgt b{font-size:24px}
.sgt span:last-child:not(.sgc){font-size:16px;line-height:1.35;color:var(--stage-muted)}
.vsign{display:block;width:64px;height:64px;margin-bottom:2px}
.vsign .rsign{width:auto;max-width:100%;max-height:100%;margin:auto}
.bigsign{width:120px;height:120px}
.bigsign .rsign{width:auto;max-width:100%;max-height:100%}
.hsigns{display:flex;flex-wrap:wrap;gap:12px 16px}
.hsigns figure{margin:0;width:72px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.hsigns .hs{width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.hsigns .rsign{width:auto;height:auto;max-width:100%;max-height:100%}
.hsigns figcaption{font-size:12px;line-height:1.25;color:var(--muted)}
@media (max-width:420px){.sgi{grid-template-columns:64px 1fr;gap:12px}.sgal.big .sgi{grid-template-columns:96px 1fr}.sgt b{font-size:19px}.sgal.big .sgt b{font-size:21px}.sgt span:last-child:not(.sgc){font-size:15px}.bigsign{width:100px;height:100px}}
@media (prefers-reduced-motion:no-preference){
 .lp-stage.go .a{animation:lpin .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*.22s)}
 .lp-stage.go .srow i{animation:lpbar .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*.22s + .15s)}
 .lp-stage.go .roadline{animation:lproad 1.2s linear both}
 #lp.paused .lp-stage .a,#lp.paused .lp-stage .srow i{animation-play-state:paused}
}
@keyframes lpin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes lpbar{from{width:0}to{width:var(--w)}}
@keyframes lproad{from{background-position:0 0}to{background-position:-96px 0}}
@media (max-width:420px){.ls h2{font-size:32px}.ls h3{font-size:24px}.ls .cap{font-size:16px}.ls ol.bul li,.ls ol.steps li{font-size:17px}.disc{width:72px;height:72px;font-size:28px;border-width:8px}.sg{width:84px}}
.brand .bl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.cats{display:inline-flex;border:1.5px solid rgba(255,255,255,.6);border-radius:6px;overflow:hidden}
.cats a{color:var(--head-ink);text-decoration:none;font-family:var(--f-display);font-size:16px;line-height:1.3;padding:3px 11px}
.cats a.on{background:var(--yellow);color:var(--on-yellow)}
.cats a:focus-visible{outline:2px solid var(--yellow);outline-offset:-3px}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:20px}.day{grid-template-columns:56px 1fr;}.day>.btn{grid-column:2;justify-self:start}h2{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<script id="qd" type="application/json">{"topics":["Общие положения","Дорожные знаки","Дорожная разметка","Сигналы светофора и регулировщика","Начало движения, маневрирование","Скорость движения","Обгон, опережение, встречный разъезд","Остановка и стоянка","Проезд перекрестков","Движение в жилых зонах","Пользование внешними световыми приборами и звуковыми сигналами","Неисправности и условия допуска транспортных средств к эксплуатации","Безопасность движения и техника управления автомобилем","Расположение транспортных средств на проезжей части","Движение через железнодорожные пути","Буксировка механических транспортных средств","Оказание доврачебной медицинской помощи","Применение специальных сигналов","Движение по автомагистралям","Учебная езда и дополнительные требования к движению велосипедистов","Пешеходные переходы и места остановок маршрутных транспортных средств","Ответственность водителя","Общие обязанности водителей","Перевозка людей и грузов","Приоритет маршрутных транспортных средств","Применение аварийной сигнализации и знака аварийной остановки"],"q":[{"t":1,"n":1,"q":"В каком случае водитель совершит вынужденную остановку?","a":["Остановившись непосредственно перед пешеходным переходом, чтобы уступить дорогу пешеходу","Остановившись на проезжей части из за технической неисправности транспортного средства","В обоих перечисленных случаях"],"c":1,"tip":"«Вынужденная остановка» - прекращение движения транспортного средства, связанное с его технической неисправностью, опасностью, создаваемой перевозимым грузом, состоянием водителя (пассажира) или появления препятствия на дороге.(Пункт 1.2 ПДД, термин «Вынужденная остановка»)","img":null,"tp":[0],"p":["1.2"]},{"t":1,"n":2,"q":"Разрешен ли Вам поворот на дорогу с грунтовым покрытием?","a":["Разрешен","Разрешен только при технической неисправности транспортного средства","Запрещен"],"c":0,"tip":"Впереди по ходу Вашего движения предупреждающий знак 1.11.2 «Опасный поворот» и знаки 1.34.2 «Направление поворота», которые указывают направление движения на закруглении дороги малого радиуса с ограниченной видимостью. Ничего, что бы Вам запрещало поворот на дорогу с грунтовым покрытием, нет. По Вашему желанию поворачиваете направо.(«Дорожные знаки»).","img":"i0.jpg","tp":[1],"p":[]},{"t":1,"n":3,"q":"Можно ли остановиться для посадки пассажира за знаком?","a":["Можно","Можно только на маломестном автобусе","Нельзя"],"c":0,"tip":"Знак 3.28 «Стоянка запрещена» не запрещает производить остановку. В указанном месте Вам совершить остановку можно.(«Дорожные знаки»).","img":"i1.jpg","tp":[1],"p":[]},{"t":1,"n":4,"q":"Каким транспортным средствам разрешается продолжить движение только направо?","a":["Только транспортным средствам, перевозящим груз массой более 10 т","Только транспортным средствам с фактической массой более 10 т","Транспортным средствам с разрешенной максимальной массой более 10 т"],"c":2,"tip":"Табличка 8.11 «Ограничение разрешённой максимальной массы» под знаком указывает, что действие знака 4.1.2 «Движение направо» распространяется только на транспортные средства с р.м.м. более 10 т.(«Дорожные знаки»)","img":"i2.jpg","tp":[1],"p":[]},{"t":1,"n":5,"q":"Вы намерены повернуть налево. Где следует остановиться, чтобы уступить дорогу легковому автомобилю?","a":["Перед знаком","Перед перекрестком у линии разметки","На перекрестке перед прерывистой линией разметки","В любом месте по усмотрению водителя"],"c":1,"tip":"Согласно знаку 2.4 «Уступите дорогу» водители должны пропускать транспорт, движущийся по пересекаемой дороге. Разметка 1.13 в виде треугольников указывает место, где при необходимости следует остановиться. У Вас такая необходимость есть, так как при повороте налево Вы уступаете дорогу легковому автомобилю. («Дорожные знаки», «Горизонтальная разметка»)","img":"i3.jpg","tp":[2],"p":[]},{"t":1,"n":6,"q":"Что означает мигание зеленого сигнала светофора?","a":["Предупреждает о неисправности светофора","Разрешает движение и информирует о том, что вскоре будет включен запрещающий сигнал","Запрещает дальнейшее движение"],"c":1,"tip":"Длительность мигания зелёного сигнала светофора обычно составляет 3-4 с. Это позволяет водителю заблаговременно, в зависимости от конкретных условий, принять решение:1) продолжить движение с прежней скоростью;2) несколько увеличить скорость;3) начать снижение скорости вплоть до остановки.(Пункт 6.2 ПДД)","img":null,"tp":[3],"p":["6.2"]},{"t":1,"n":7,"q":"Водитель обязан подавать сигналы световыми указателями поворота (рукой):","a":["Перед началом движения или перестроением","Перед поворотом или разворотом","Перед остановкой","Во всех перечисленных случаях"],"c":3,"tip":"Перед началом движения, перестроением, поворотом (разворотом) и остановкой водитель обязан подавать сигналы световыми указателями поворота соответствующего направления, а если они отсутствуют или неисправны – рукой. При выполнении маневра не должны создаваться опасность для движения, а также помехи другим участникам дорожного движения.(Пункт 8.1 ПДД)","img":null,"tp":[4],"p":["8.1"]},{"t":1,"n":8,"q":"Как Вам следует поступить при повороте направо?","a":["Перестроиться на правую полосу, затем осуществить поворот","Продолжить движение по второй полосе до перекрестка, затем повернуть","Возможны оба варианта действий"],"c":2,"tip":"Разметка разрешает поворот направо с обеих полос, поэтому возможны оба варианта действий. В таких случаях, выполняя поворот на перекрёстке, соблюдайте избранную Вами рядность.(«Горизонтальная разметка» 1.18, пункт 8.5 ПДД).","img":"i4.jpg","tp":[4],"p":["1.18","8.5"]},{"t":1,"n":9,"q":"По какой траектории Вам разрешено выполнить разворот на маломестном автобусе?","a":["Только по А","Только по Б","По любой из указанных"],"c":0,"tip":"Выезд с пересечения проезжих частей должен быть выполнен на «свою» сторону, т.е. исходя из правостороннего движения без выезда на сторону встречного движения. Двигаясь по траектории «Б», Вы совершаете встречное движение по пересекаемой дороге, что крайне опасно, так как можете произвести лобовое столкновение с автомобилем, приближающимся слева. Развернуться следует по траектории «А».(Пункт 8.6 ПДД)","img":"i5.jpg","tp":[4],"p":["8.6"]},{"t":1,"n":10,"q":"С какой скоростью Вы можете продолжить движение вне населенного пункта по левой полосе на грузовом автомобиле с разрешенной максимальной массой более 3,5 т?","a":["Не более 50 км/ч","Не менее 50 км/ч и не более 70 км/ч","Не менее 50 км/ч и не более 90 км/ч"],"c":1,"tip":"Над левой полосой висит знак 4.6 «Ограничение минимальной скорости» с табличкой 8.14 «Полоса движения», указывающей полосу движения, на которую распространяется действие знака. Скорость движения на грузовом автомобиле с р.м.м которого более 3,5 т по левой полосе не должна быть менее 50 км/ч и не должна превышать допустимой для дорог вне населённых пунктов, т.е. не более 70 км/ч.(«Дорожные знаки», пункт 10.3 ПДД)","img":"i6.jpg","tp":[5],"p":["10.3"]},{"t":1,"n":11,"q":"Можно ли водителю автобуса выполнить опережение грузовых автомобилей вне населенного пункта по такой траектории?","a":["Можно","Можно, если скорость грузовых автомобилей менее 30 км/ч","Нельзя"],"c":0,"tip":"На дорогах с двусторонним движением, имеющих четыре и более полос для движения обгон запрещён. В таких ситуациях можно совершать только опережение.Соблюдая правила маневрирования водитель автобуса на данном участке дороги может совершать опережение любых транспортных средств по различным траекториям включая и указанную.(Пункт 9.2 ПДД)","img":"i7.jpg","tp":[6],"p":["9.2"]},{"t":1,"n":12,"q":"В каком случае водителю разрешается поставить автомобиль на стоянку в указанном месте?","a":["Только если расстояние до сплошной линии разметки не менее 3 м","Только если расстояние до края пересекаемой проезжей части не менее 5 м","При соблюдении обоих перечисленных условий"],"c":2,"tip":"Водитель не нарушает правила остановки и стоянки. Расстояние до края проезжей части, до сплошной линии разметки соблюдается - не менее допустимых, указанных в ответах. Остановка и стоянка за пешеходным переходом также допустима.Правильный ответ - при соблюдении обоих перечисленных условий. (Пункт 12.4 ПДД)","img":"i8.jpg","tp":[7],"p":["12.4"]},{"t":1,"n":13,"q":"При повороте направо Вы должны уступить дорогу:","a":["Только велосипедисту","Только пешеходам","Пешеходам и велосипедисту","Никому"],"c":2,"tip":"При повороте направо или налево водитель обязан уступить дорогу пешеходам, переходящим проезжую часть дороги, на которую он поворачивает, и велосипедистам, независимо от того, регулируемый или нерегулируемый это перекресток.(Пункт 13.1 ПДД)","img":"i9.jpg","tp":[8],"p":["13.1"]},{"t":1,"n":14,"q":"Вы намерены проехать перекресток в прямом направлении. Кому Вы должны уступить дорогу?","a":["Обоим трамваям","Только трамваю А","Только трамваю Б","Никому"],"c":0,"tip":"Перекрёсток равнозначный. Трамваи в равнозначных условиях имеют преимущество перед безрельсовыми транспортными средствами. Между собой руководствуются «правилом правой руки». Помеха справа у трамвая «А». Соответственно первым проезжает трамвай «Б», за ним «А», Вы последним.(Пункт 13.11 ПДД)","img":"i10.jpg","tp":[8],"p":["13.11"]},{"t":1,"n":15,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Только автобусу","Только легковому автомобилю","Никому"],"c":2,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Транспортные средства, находящиеся на главной дороге, имеют преимущество, а водители между собой руководствуются «правилом правой руки». Никому не уступая, первым проезжаете Вы, вторым автобус, легковой автомобиль последним, так как он находится на второстепенной дороге.(«Дорожные знаки», пункты 13.9, 13.10, 13.11 ПДД)","img":"i11.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":1,"n":16,"q":"С какой максимальной скоростью можно продолжить движение за знаком?","a":["60 км/ч","50 км/ч","30 км/ч","20 км/ч"],"c":3,"tip":"В жилой зоне, согласно знаку, в которую Вы въезжаете, разрешается движение со скоростью не более 20 км/ч.(«Дорожные знаки» 5.21, пункт 10.2 ПДД).","img":"i12.jpg","tp":[9,5],"p":["10.2","5.21"]},{"t":1,"n":17,"q":"При движении в темное время суток вне населенных пунктов необходимо использовать:","a":["Только фары ближнего света","Только фары дальнего света","Фары ближнего или дальнего света"],"c":2,"tip":"Во время движения вне населенных пунктов в темное время суток на неосвещенных участках дорог, вы можете использовать фары дальнего или ближнего света. В большинстве случаев предпочтительнее езда с дальним светом фар, так как большее расстояние видимости позволяет двигаться с большей скоростью. Но с учётом факторов встречного и попутного транспорта водитель обязан переключаться на ближний свет фар.(Пункт 19.1 ПДД, «Техника управления автомобилем»)","img":null,"tp":[10],"p":["19.1"]},{"t":1,"n":18,"q":"При какой неисправности разрешается эксплуатация транспортного средства?","a":["Не работают запорные устройства топливных баков","Не работают механизм регулировки и фиксирующее устройство сиденья водителя","Не работает устройство обдува ветрового стекла","Не работает стеклоподъемник"],"c":3,"tip":"Перечисленные в ответах неисправности, за исключением неработающего стеклоподъемника, указаны в «Перечне неисправностей». Неработающий стеклоподъемник в данном перечне не указан. Следовательно, это не может быть причиной запрещения эксплуатации транспортного средства.(«Перечень неисправностей» п. 8.3, 9.2)","img":null,"tp":[11],"p":[]},{"t":1,"n":19,"q":"В случае, когда правые колеса автомобиля наезжают на неукрепленную влажную обочину, рекомендуется:","a":["Затормозить и полностью остановиться","Затормозить и плавно направить автомобиль на проезжую часть","Не прибегая к торможению, плавно направить автомобиль на проезжую часть"],"c":2,"tip":"Такая ситуация опасна вследствие возникновения момента сил, стремящегося развернуть автомобиль. Старайтесь плавно вернуть автомобиль на проезжую часть не меняя скорости.","img":null,"tp":[12],"p":[]},{"t":1,"n":20,"q":"Что понимается под временем реакции водителя?","a":["Время с момента обнаружения водителем опасности до полной остановки транспортного средства","Время с момента обнаружения водителем опасности до начала принятия мер по ее избежанию","Время, необходимое для переноса ноги с педали управления подачей топлива на педаль тормоза"],"c":1,"tip":"Под временем реакции водителя понимается время с момента обнаружения водителем опасности до начала принятия мер по её избежанию.Время реакции водителя - величина непостоянная. В основном зависит от возраста, самочувствия в данный момент. Компенсировать недостаток реакции можно снижением скорости.(«Техника управления автомобилем»)","img":null,"tp":[12],"p":[]},{"t":2,"n":1,"q":"Сколько полос для движения имеет данная дорога?","a":["Две","Четыре","Пять"],"c":1,"tip":"Разделительная полоса делит дорогу на проезжие части. Данная дорога имеет две проезжие части, четыре полосы движения.(Пункт 1.2 ПДД)","img":"i13.jpg","tp":[0],"p":["1.2"]},{"t":2,"n":2,"q":"Можно ли Вам въехать на мост первым?","a":["Можно","Можно, если Вы не затрудните движение встречному автомобилю","Нельзя"],"c":0,"tip":"Знак 2.7 «Преимущество перед встречным движением» предоставляет Вам право первым проехать через узкий участок дороги, т. е. через мост. («Дорожные знаки», пункт 1.2 термин «Уступить дорогу»)","img":"i14.jpg","tp":[1],"p":[]},{"t":2,"n":3,"q":"Разрешается ли Вам продолжить движение в прямом направлении на транспортном средстве подкатегории «С1» без прицепа?","a":["Разрешается","Разрешается, если Вы обслуживаете предприятие, находящееся в обозначенной знаком зоне","Запрещается"],"c":1,"tip":"Знак 3.4 «Движение грузовых автомобилей запрещено», при отсутствии цифры на автомобиле, распространяет свое действие на данные автомобили, в т.ч. и с прицепом, р.м.м. которых более 3,5 т. Также от действия данного знака отступают указанные ТС р.м.м. которых величиной до 26 т без прицепа, и они в этом случае обслуживают предприятия, находящиеся в обозначенной знаком зоне. Данное правило распространяется и на ТС подкатегории С1, т.к. их р.м.м. не превышает 7,5 т.(«Дорожные знаки» ст. 25 п.1 ФЗ «О безопасности дорожного движения»)","img":"i15.jpg","tp":[1],"p":[]},{"t":2,"n":4,"q":"Что запрещено в зоне действия этого знака?","a":["Движение любых транспортных средств","Движение всех транспортных средств со скоростью не более 20 км/ч","Движение механических транспортных средств"],"c":2,"tip":"Знак 5.33 «Пешеходная зона» обозначает место, с которого начинается территория (участок дороги), на которой разрешено движение только пешеходов и приравненных к ним лиц (это передвигающиеся в инвалидных колясках без двигателя, ведущие велосипед, мопед, мотоцикл, везущие санки, тележку, детскую и инвалидную коляску), а также велосипедистов и лиц, использующих для передвижения СИМ, в случаях, установленных в пунктах 24.2, 24.3, 24.4 и 24.6 ПДД. Въезд в обозначенную зону и, соответственно, движение в ней любых механических транспортных средств запрещено.(«Дорожные знаки», термин «Пешеход» п. 1.2 ПДД).","img":"i16.jpg","tp":[1],"p":[]},{"t":2,"n":5,"q":"Разрешен ли Вам выезд на полосу с реверсивным движением, если реверсивный светофор выключен?","a":["Разрешен","Разрешен, если скорость находящегося впереди автобуса менее 30 км/ч","Запрещен"],"c":2,"tip":"При выключенных сигналах реверсивного светофора, который расположен над полосой, обозначенной с обеих сторон разметкой 1.9, въезд на эту полосу запрещен.(Пункт 6.7 ПДД)","img":"i17.jpg","tp":[2],"p":["6.7"]},{"t":2,"n":6,"q":"Информационная световая секция в виде силуэта пешехода и стрелки с мигающим сигналом бело-лунного цвета, расположенная под светофором, информирует водителя о том, что:","a":["На пешеходном переходе, в направлении которого он поворачивает, включен сигнал светофора, разрешающий движение пешеходам","На пешеходном переходе, в направлении которого он поворачивает, включен сигнал светофора, запрещающий движение пешеходам","Он поворачивает в направлении пешеходного перехода"],"c":0,"tip":"Информационная световая секция в виде силуэта пешехода и стрелки с мигающим сигналом бело-лунного цвета, расположенная под светофором, информирует водителя о том, что на пешеходном переходе, в направлении которого он поворачивает, включен сигнал светофора, разрешающий движение пешеходам. Направление стрелки указывает на пешеходный переход, на котором включен сигнал светофора, разрешающий движение пешеходам (п. 6.4).","img":"i18.jpg","tp":[3],"p":[]},{"t":2,"n":7,"q":"Поднятая вверх рука водителя легкового автомобиля является сигналом, информирующим Вас о его намерении:","a":["Повернуть направо","Продолжить движение прямо","Снизить скорость, чтобы остановиться и уступить дорогу мотоциклу"],"c":2,"tip":"У водителя не работает световая сигнализация, поэтому он вынужден подавать соответствующие сигналы рукой. Согласно знаку 2.4 «Уступите дорогу» мотоциклист имеет преимущество. Поднятая вверх рука информирует о намерении притормозить для того, чтобы уступить дорогу мотоциклисту.(«Дорожные знаки», пункт 8.1 ПДД).","img":"i19.jpg","tp":[4],"p":["8.1"]},{"t":2,"n":8,"q":"Двигаясь по левой полосе, водитель намерен перестроиться на правую. На каком из рисунков показана ситуация, в которой он обязан уступить дорогу?","a":["На левом","На правом","На обоих"],"c":2,"tip":"На левом рисунке преимущество у автомобиля, двигающегося попутно по полосе без изменения направления движения, т.е. у «хозяина полосы». Водитель, двигающийся по левой полосе уступает.На правом рисунке одновременное перестроение. Водители руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает. Помеха справа у водителя, двигающегося также по левой полосе. Он уступает дорогу и в этой ситуации.(Пункт 8.4 ПДД)","img":"i20.jpg","tp":[4],"p":["8.4"]},{"t":2,"n":9,"q":"Можно ли Вам выполнить разворот в этом месте на маломестном автобусе?","a":["Можно","Можно только при отсутствии приближающегося поезда","Нельзя"],"c":0,"tip":"Разворот запрещён на железнодорожном переезде, границами которого являются шлагбаумы, а при их отсутствии - знаки 1.3.1 «Однопутная железная дорога» или 1.3.2 «Многопутная железная дорога». В нашем случае железнодорожный переезд без шлагбаума. Вы можете совершить разворот по указанной траектории, так как совершаете его на безопасном удалении от железнодорожных путей.(Пункт 8.11 ПДД)","img":"i21.jpg","tp":[4],"p":["8.11"]},{"t":2,"n":10,"q":"В каких случаях разрешается наезжать на прерывистые линии разметки, разделяющие проезжую часть на полосы движения?","a":["Только если на дороге нет других транспортных средств","Только при движении в темное время суток","Только при перестроении","Во всех перечисленных случаях"],"c":2,"tip":"Наезжать на прерывистые линии разметки разрешается лишь при перестроении. (Пункт 9.7 ПДД)","img":null,"tp":[13],"p":["9.7"]},{"t":2,"n":11,"q":"Разрешено ли Вам обогнать мотоцикл?","a":["Разрешено","Разрешено, если водитель мотоцикла снизил скорость","Запрещено"],"c":2,"tip":"Перекресток равнозначный. На равнозначных перекрёстках обгон ЗАПРЕЩЁН всех видов транспорта всеми транспортными средствами. Мотоциклист притормаживает, он уступает помехе справа. То же самое делаете и Вы. В противном случае Вы нарушите и правила обгона, и правила проезда перекрёстков. (Пункты 11.4, 13.11 ПДД).","img":"i22.jpg","tp":[6],"p":["11.4","13.11"]},{"t":2,"n":12,"q":"Разрешается ли Вам остановиться в указанном месте?","a":["Разрешается","Разрешается, если автомобиль будет находиться не ближе 5 м от края пересекаемой проезжей части","Запрещается"],"c":1,"tip":"На перекрёстке с круговым движением Вы можете совершить остановку и стоянку, но при этом расстояние между остановившимся транспортным средством и краем проезжей части должно быть не менее 5 м.(Пункты 12.4, 12.5 ПДД).","img":"i23.jpg","tp":[7],"p":["12.4","12.5"]},{"t":2,"n":13,"q":"Вы намерены повернуть налево. Кому Вы должны уступить дорогу?","a":["Только пешеходам","Только автобусу","Автобусу и пешеходам"],"c":2,"tip":"Перекрёсток регулируемый. Знаки приоритета «не работают». При повороте налево Вы уступаете автобусу, движущемуся прямо со встречного направления, и пешеходам, переходящим проезжую часть дороги, на которую Вы поворачиваете. (Пункты 13.1, 13.3, 13.4 ПДД).","img":"i24.jpg","tp":[8],"p":["13.1","13.3","13.4"]},{"t":2,"n":14,"q":"В каком случае Вы имеете преимущество?","a":["Только при повороте направо","Только при повороте налево","В обоих перечисленных случаях"],"c":2,"tip":"Перекресток равнозначный. Водители между собой руководствуются «правилом правой руки», т. е. у кого помеха справа, тот и уступает. У Вас преимущество и при повороте направо и при повороте налево, т. е. в обоих перечисленных случаях.(Пункт 13.11 ПДД).","img":"i25.jpg","tp":[8],"p":["13.11"]},{"t":2,"n":15,"q":"Обязан ли водитель мотоцикла уступить Вам дорогу?","a":["Обязан","Не обязан"],"c":0,"tip":"Мотоциклист выезжает на дорогу, обозначенную знаком 5.1 «Автомагистраль», которая является главной дорогой по отношению к примыкающей. На перекрёстке неравнозначных дорог преимущество имеют транспортные средства, движущиеся по главной дороге. Мотоциклист обязан уступить Вам дорогу.(Пункты 1.2, 13.9 ПДД).","img":"i26.jpg","tp":[8],"p":["1.2","13.9"]},{"t":2,"n":16,"q":"Разрешается ли водителю выполнить объезд грузового автомобиля?","a":["Разрешается","Разрешается, если между шлагбаумом и остановившимся грузовым автомобилем расстояние более 5 м","Запрещается"],"c":2,"tip":"Водитель автомобиля хочет объехать стоящий перед закрытым шлагбаумом грузовик. Правила, оговаривающие порядок проезда через железнодорожный переезд, такой маневр (с выездом на полосу встречного движения) запрещают.(Пункт 15.3 ПДД).","img":"i27.jpg","tp":[14],"p":["15.3"]},{"t":2,"n":17,"q":"В каких из перечисленных случаев запрещена буксировка на гибкой сцепке?","a":["Только на горных дорогах","Только в гололедицу","Только в темное время суток и в условиях недостаточной видимости","Во всех перечисленных случаях"],"c":1,"tip":"Запомните этот ответ. На экзамене часто отвечают, что только на горных дорогах. Видимо, ассоциируется опасность, связанная с высотой. Правилами запрещается буксировка на гибкой сцепке только в гололедицу.(Пункт 20.4 ПДД).","img":null,"tp":[15],"p":["20.4"]},{"t":2,"n":18,"q":"При каком максимальном значении суммарного люфта в рулевом управлении допускается эксплуатация автобуса?","a":["10 градусов","20 градусов","25 градусов"],"c":1,"tip":"Запрещается эксплуатация любого вида автобуса, если суммарный люфт в рулевом управлении превышает значение 20°. (Перечень неисправностей, п. 5.3)","img":null,"tp":[11],"p":[]},{"t":2,"n":19,"q":"Исключает ли антиблокировочная тормозная система возможность возникновения заноса или сноса при прохождении поворота?","a":["Полностью исключает возможность возникновения только заноса","Полностью исключает возможность возникновения только сноса","Не исключает возможность возникновения сноса или заноса"],"c":2,"tip":"Антиблокировочные системы (АБС) автомобилей представляют собой системы, оснащённые устройствами управления тормозами с обратной связью, которые предотвращают блокировку колёс во время торможения, тем самым сохраняя управляемость и курсовую устойчивость. Эта система имеет «большой плюс», но имеет и «минус». При ускоренном (не экстренном) нажатии на педаль тормоза на разнородном, даже твёрдом дорожном покрытии она может сработать. В момент ее срабатывания (от 1 до 2 сек.) водитель не может повлиять на процесс торможения. Чтобы появился навык управления автомобилем при срабатывании АБС, произведите несколько «контрольных» торможений на абсолютно свободном участке дороги или территории.При прохождении поворота на автомобиль действует центробежная сила. Антиблокировочная система в таких ситуациях не может повлиять на возможность возникновения сноса или заноса.","img":null,"tp":[12],"p":[]},{"t":2,"n":20,"q":"В каких случаях следует начинать сердечно-легочную реанимацию пострадавшего?","a":["При наличии болей в области сердца и затрудненного дыхания","При отсутствии у пострадавшего сознания, независимо от наличия дыхания","При отсутствии у пострадавшего сознания, дыхания и кровообращения"],"c":2,"tip":"В комментариях ответов по медицинским вопросам для лучшего запоминания правильного ответа используется прием «ключевых слов», которые выделены в тексте шрифтом. Обратите на это внимание.Проводить сердечно-легочную реанимацию следует при отсутствии трех признаков жизни - при отсутствии сознания, дыхания и кровообращения.","img":null,"tp":[16],"p":[]},{"t":3,"n":1,"q":"Выезжая с грунтовой дороги на перекресток, Вы попадаете:","a":["На главную дорогу","На равнозначную дорогу, поскольку отсутствуют знаки приоритета","На равнозначную дорогу, поскольку проезжая часть имеет твердое покрытие перед перекрестком"],"c":0,"tip":"Главной является дорога с покрытием по отношению к грунтовой. Перекрёсток неравнозначный. Вы находитесь на второстепенной дороге, выезжать будете на главную.(Пункт 1.2 термин «Главная дорога»)","img":"i28.jpg","tp":[0],"p":[]},{"t":3,"n":2,"q":"Где Вы должны остановиться?","a":["Перед знаком (А)","Перед перекрестком (Б)","Перед краем пересекаемой проезжей части (В)"],"c":2,"tip":"В случае установки знака 2.5 «Движение без остановки запрещено» непосредственно перед пересечением проезжих частей водитель обязан остановиться у стоп-линии. При её отсутствии (как в данном случае) водитель обязан остановиться перед границей проезжих частей, т.е. не заезжая за линию «В». Имейте в виду, что такие места опасны, часто находятся «под особым контролем» инспекторов ГИБДД. Поэтому всегда выполняйте главное условие - обязательную остановку. Это избавит Вас от конфликтной ситуации и сохранит Вашу собственную безопасность. («Дорожные знаки»)","img":"i29.jpg","tp":[1],"p":[]},{"t":3,"n":3,"q":"Вам необходимо двигаться со скоростью не более 40 км/ч:","a":["Только во время дождя","Во время выпадения осадков (дождя, града, снега)","Во всех случаях, когда покрытие проезжей части влажное"],"c":2,"tip":"Табличка 8.16 «Влажное покрытие» указывает, что действие знака распространяется на период времени, когда покрытие проезжей части влажное.(«Дорожные знаки»)","img":"i30.jpg","tp":[1,5],"p":[]},{"t":3,"n":4,"q":"Какой из указанных знаков устанавливается в начале дороги с односторонним движением?","a":["Только А","Только Б","Б или Г","Б или В"],"c":1,"tip":"Знак «Б» - 5.5 «Дорога с односторонним движением». («Дорожные знаки»)","img":"i31.jpg","tp":[1],"p":[]},{"t":3,"n":5,"q":"Можно ли Вам остановиться в этом месте для посадки или высадки пассажиров?","a":["Можно","Можно, если при этом не будут созданы помехи движению маршрутных транспортных средств","Нельзя"],"c":1,"tip":"В данном случае место остановки маршрутных транспортных средств обозначено соответствующим знаком и жёлтой зигзагообразной разметкой 1.17.1.Остановка в указанном месте допускается, если Вы произведёте ее для посадки или высадки пассажиров и в это время не создадите помех движению маршрутных транспортных средств.(«Дорожные знаки», «Горизонтальная разметка», пункт 12.4 ПДД)","img":"i32.jpg","tp":[2,1,7],"p":["12.4"]},{"t":3,"n":6,"q":"При повороте направо Вы:","a":["Имеете право проехать перекресток первым","Должны уступить дорогу только пешеходам","Должны уступить дорогу автомобилю с включенными проблесковым маячком и специальным звуковым сигналом, а также пешеходам"],"c":2,"tip":"Перекресток регулируемый. «Оперативник» с включенным проблесковым маячком и специальным звуковым сигналом может отступать от ряда требований Правил. В данной ситуации все водители должны обеспечить ему беспрепятственный проезд перекрестка. После его проезда, поворачивая направо Вы уступаете также и пешеходам. (Пункты 3.2, 13.1 ПДД)","img":"i33.jpg","tp":[17],"p":["13.1","3.2"]},{"t":3,"n":7,"q":"В каких случаях водитель не должен подавать сигнал указателями поворота?","a":["Только при отсутствии на дороге других участников движения","Только если сигнал может ввести в заблуждение других участников движения","В обоих перечисленных случаях"],"c":1,"tip":"Подача сигнала указателями поворота должна производиться заблаговременно до начала выполнения маневра и прекращаться немедленно после его завершения.При этом сигнал не должен вводить в заблуждение других участников движения.(Пункт 8.2 ПДД)","img":null,"tp":[4],"p":["8.2"]},{"t":3,"n":8,"q":"Вам разрешено выполнить поворот направо на маломестном автобусе:","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":0,"tip":"При повороте направо транспортное средство должно двигаться по возможности ближе к правому краю проезжей части. У Вас такая возможность есть, продолжаете движение по траектории «А».(Пункт 8.6 ПДД)","img":"i34.jpg","tp":[4],"p":["8.6"]},{"t":3,"n":9,"q":"Разрешается ли Вам выполнить разворот на перекрестке по указанной траектории?","a":["Разрешается","Разрешается, если видимость дороги не менее 100 м","Запрещается"],"c":2,"tip":"Впереди перекрёсток. Прежде, чем совершить на нём поворот или разворот, необходимо было перестроиться на левую крайнюю полосу. Вы этого своевременно не сделали. Разворот по данной траектории является нарушением.(Пункты 8.5, 8.8 ПДД)","img":"i35.jpg","tp":[4],"p":["8.5","8.8"]},{"t":3,"n":10,"q":"По какой полосе Вы имеете право двигаться с максимальной разрешенной скоростью вне населенных пунктов?","a":["Только по правой","Только по левой","По любой"],"c":0,"tip":"Действие происходит вне населённого пункта. В этом случае запрещается занимать левые полосы движения при свободных правых. Вам необходимо перестроиться и продолжать движение в данной ситуации только по правой полосе.(Пункт 9.4 ПДД).","img":"i36.jpg","tp":[13],"p":["9.4"]},{"t":3,"n":11,"q":"В каком случае водитель может начать обгон, если такой маневр на данном участке дороги не запрещен?","a":["Только если полоса, предназначенная для встречного движения, свободна на достаточном для обгона расстоянии","Только если его транспортное средство никто не обгоняет","В случае, если выполнены оба условия"],"c":2,"tip":"Выполняя «классический» обгон, Вы последовательно должны учитывать обязательных три условия, что при обгоне не создаёте никаких помех: 1) встречному, 2) едущим позади, 3) обгоняемому.(Пункты 11.1, 11.2 ПДД, «Техника управления автомобилем»)","img":null,"tp":[6],"p":["11.1","11.2"]},{"t":3,"n":12,"q":"Кто из водителей нарушил правила стоянки?","a":["Оба","Только водитель мотоцикла","Только водитель маломестного автобуса","Никто не нарушил"],"c":0,"tip":"Водитель автобуса любого вида в любой ситуации не имеет право заезда на прилегающий к проезжей части тротуар.Нарушает правила и водитель мотоцикла, т.к. расстояние между ним и сплошной линией разметки менее 3 м.(Пункты 12.2, 12.4 ПДД)","img":"i37.jpg","tp":[7],"p":["12.2","12.4"]},{"t":3,"n":13,"q":"При движении прямо Вы:","a":["Должны остановиться перед стоп-линией","Можете продолжить движение через перекресток без остановки","Должны уступить дорогу транспортным средствам, движущимся с других направлений"],"c":1,"tip":"Перекрёсток регулируемый. В этом случае знаки приоритета, а в их число входит и знак 2.5 «Движение без остановки запрещено», согласно принципу приоритетности регулирования дорожного движения, «не работают», т.е. ими мы не руководствуемся. Горит зелёный сигнал светофора. Продолжаете движение через перекрёсток без остановки.(Пункты 6.2, 6.15, 13.3 ПДД)","img":"i38.jpg","tp":[8],"p":["13.3","6.15","6.2"]},{"t":3,"n":14,"q":"Вы намерены повернуть направо. Ваши действия?","a":["Проедете перекресток первым","Уступите дорогу легковому автомобилю","Уступите дорогу обоим транспортным средствам"],"c":0,"tip":"Перекрёсток равнозначный. Водители при определении порядка проезда перекрёстка руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает дорогу. У Вас помехи справа при повороте направо нет. Проезжаете перекресток первым.(Пункт 13.11 ПДД)","img":"i39.jpg","tp":[8],"p":["13.11"]},{"t":3,"n":15,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Трамваям А и Б","Трамваю А и легковому автомобилю","Только трамваю А","Никому"],"c":2,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Транспортные средства, находящиеся на главной дороге, имеют преимущество; между собой безрельсовые транспортные средства руководствуются «правилом правой руки», уступая трамваю, имеющему преимущество в равнозначных условиях. Трамвай «А» проезжает первым, Вы после него. Легковой автомобиль и трамвай «Б» одновременно, так как их траектории не пересекаются.(«Дорожные знаки», пункты 13.9, 13.10, 13.11 ПДД)","img":"i40.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":3,"n":16,"q":"Кто из водителей нарушил правила остановки?","a":["Только водитель легкового автомобиля","Только водитель грузового автомобиля","Оба"],"c":2,"tip":"На автомагистрали остановка и стоянка вне мест, специально отведённых и обозначенных соответствующими знаками, запрещена. Оба водителя нарушают правила.(«Дорожные знаки», пункты 12.1, 16.1 ПДД)","img":"i41.jpg","tp":[18],"p":["12.1","16.1"]},{"t":3,"n":17,"q":"Какое оборудование должно иметь механическое транспортное средство, используемое для обучения вождению?","a":["Дополнительные педали привода сцепления (кроме транспортных средств с автоматической трансмиссией) и тормоза","Зеркало заднего вида для обучающего вождению","Опознавательные знаки «Учебное транспортное средство»","Все перечисленное оборудование"],"c":3,"tip":"Правильный ответ – все перечисленное оборудование, согласно Пункта 21.5 ПДД и и Пункта 5 Основных положений по допуску","img":null,"tp":[19],"p":[]},{"t":3,"n":18,"q":"Запрещается эксплуатация грузовых автомобилей категорий N2 и N3, если остаточная глубина рисунка протектора шин (при отсутствии индикаторов износа) составляет не более:","a":["0,8 мм","1,0 мм","1,6 мм","2,0 мм"],"c":1,"tip":"Остаточная глубина рисунка протектора шин (при отсутствии индикаторов износа) для грузовых автомобилей категорий N2 и N3, при которой запрещается эксплуатация ТС составляет не более 1 мм.(«Перечень неисправностей», п. 5.3)","img":null,"tp":[11],"p":[]},{"t":3,"n":19,"q":"На повороте возник занос задней оси переднеприводного автомобиля. Ваши действия?","a":["Уменьшите подачу топлива, рулевым колесом стабилизируете движение","Притормозите и повернете рулевое колесо в сторону заноса","Слегка увеличите подачу топлива, корректируя направление движения рулевым колесом","Значительно увеличите подачу топлива, не меняя положения рулевого колеса"],"c":2,"tip":"Переднеприводные автомобили значительно отличаются своим поведением от заднеприводных. Это обстоятельство следует учитывать во время управления. Учитывайте обстоятельство, что при движении по прямой переднеприводной автомобиль не склонен к заносу на значительно более высоких скоростях по сравнению с заднеприводным. Он хорошо держит дорогу. Но на поворотах, особенно мокрых, обледенелых, если не использовать «технику прохождения поворотов», его может не только занести, а снести, при этом происходит одновременная потеря сцепления колёс обеих осей с дорогой. Это явление, как правило, заканчивается ДТП. Случай заноса задней оси - это «полбеды». В такой ситуации плавно увеличивайте подачу топлива. Сцепление задних колес возрастёт. Рулевым колесом корректируйте направление движения.(«Техника управления автомобилем»)","img":null,"tp":[12],"p":[]},{"t":3,"n":20,"q":"Какие сведения необходимо сообщить диспетчеру для вызова скорой медицинской помощи при дорожно-транспортном происшествии (ДТП)?","a":["Указать общеизвестные ориентиры, ближайшие к месту ДТП. Сообщить о количестве пострадавших, указать их пол и возраст.","Указать улицу и номер дома, ближайшего к месту ДТП. Сообщить, кто пострадал в ДТП (пешеход, водитель автомобиля или пассажиры), и описать травмы, которые они получили.","Указать место ДТП (назвать улицу, номер дома и общеизвестные ориентиры, ближайшие к месту ДТП). Сообщить: количество пострадавших, их пол, примерный возраст, наличие у них сознания, дыхания, кровообращения, а также сильного кровотечения, переломов и других травм. Дождаться сообщения диспетчера о том, что вызов принят."],"c":2,"tip":"Наиболее полная информация позволяет службе «Скорой медицинской помощи» определиться с количеством высылаемых бригад медицинских специалистов, их специализацией, упрощает выбор пути и сокращает время приезда автомобиля «Скорой медицинской помощи» и других служб.","img":null,"tp":[16],"p":[]},{"t":4,"n":1,"q":"Сколько полос для движения имеет проезжая часть данной дороги?","a":["Одну полосу","Две полосы","Три полосы"],"c":1,"tip":"Сплошная линия горизонтальной разметки 1.1 применяется часто. Она может быть использована и для распределения транспортных потоков, и для обозначения границ полос. В данном случае она разделяет транспортные потоки одной неширокой проезжей части, на которой, судя по автомобилю, по одной полосе движения в каждом направлении, т.е. две. Мотоциклисты двигаются по одной полосе в два ряда, что им не запрещено.(«Горизонтальная разметка», пункты 1.2, 9.1 ПДД)","img":"i42.jpg","tp":[0],"p":["1.2","9.1"]},{"t":4,"n":2,"q":"Эти знаки предупреждают Вас:","a":["О наличии через 500 м опасных поворотов","О том, что на расстоянии 150 – 300 м за дорожным знаком начнется участок дороги протяженностью 500 м с опасными поворотами","О том, что сразу за знаком начнется участок протяженностью 500 м с опасными поворотами"],"c":1,"tip":"Табличка 8.2.1 «Зона действия» указывает протяженность ряда опасных поворотов, первый из которых - налево - начинается через 150 - 300 м.(«Дорожные знаки» 8.2.1, 1.12.2)","img":"i43.jpg","tp":[1],"p":[]},{"t":4,"n":3,"q":"Какой из указанных знаков распространяет своё действие только на ту полосу, над которой он установлен?","a":["Только А","Только Б","Б и В"],"c":0,"tip":"Знак с табличкой 8.14 «Полоса движения» («А»), указывающей полосу движения, на которую распространяется действие знака или светофора. («Дорожные знаки»)","img":"i44.jpg","tp":[1],"p":[]},{"t":4,"n":4,"q":"Вы буксируете неисправный автомобиль. По какой полосе Вам можно продолжить движение в населенном пункте?","a":["Только по правой","Только по левой","По любой"],"c":0,"tip":"По ходу Вашего движения установлен знак 5.15.3 «Начало полосы». По основной полосе знаком 4.6 «Ограничение минимальной скорости» введено ограничение - минимальная скорость должна быть не менее 60 км/ч. Водитель, который не может продолжать движение с указанной скоростью, должен перестроиться на правую полосу. Буксирующим механическим ТС разрешается движение со скоростью не более 50 км/ч.Вам следует продолжать движение только по правой полосе.(«Дорожные знаки», пункт 10.4 ПДД)","img":"i45.jpg","tp":[15,1],"p":["10.4"]},{"t":4,"n":5,"q":"Что означает разметка в виде надписи «СТОП» на проезжей части?","a":["Предупреждает о приближении к стоп-линии перед регулируемым перекрестком","Предупреждает о приближении к стоп-линии и знаку «Движение без остановки запрещено»","Предупреждает о приближении к знаку «Уступите дорогу»"],"c":1,"tip":"Разметка 1.21 (надпись «СТОП») предупреждает о приближении к стоп-линии (разметке 1.12), когда она применяется в сочетании со знаком 2.5 «Движение без остановки запрещено».(«Горизонтальная разметка»)","img":null,"tp":[2],"p":[]},{"t":4,"n":6,"q":"Каким транспортным средствам разрешено движение прямо?","a":["Только грузовому автомобилю","Легковому и грузовому автомобилям","Грузовому автомобилю и автобусу","Всем перечисленным транспортным средствам"],"c":0,"tip":"Перекрёсток регулируемый. С данной проезжей части осуществляется пополосное регулирование. Красный сигнал крайнего правого светофора запрещает движение с крайней правой полосы. Со средней полосы разрешается движение прямо. С крайней левой полосы разрешается движение налево и разворот. При таких сигналах светофора разрешено движение прямо только грузовому автомобилю.(Пункт 6.2 ПДД)","img":"i46.jpg","tp":[3],"p":["6.2"]},{"t":4,"n":7,"q":"Вы намерены продолжить движение по главной дороге. Обязаны ли Вы при этом включить указатели правого поворота?","a":["Обязаны","Обязаны только при наличии движущегося сзади транспортного средства","Не обязаны"],"c":0,"tip":"Независимо от того, куда Вы будете поворачивать на перекрёстке, налево или направо по главной дороге, обязательно следует включить соответствующий указатель поворота. В данной ситуации - включите правый указатель поворота. Ответ «обязаны».(«Дорожные знаки», пункт 8.1 ПДД)","img":"i47.jpg","tp":[4],"p":["8.1"]},{"t":4,"n":8,"q":"Кто должен уступить дорогу?","a":["Водитель грузового автомобиля","Водитель легкового автомобиля"],"c":1,"tip":"Знак 5.15.5 «Конец полосы» обозначает конец полосы на подъеме или полосы разгона. В любом случае при перестроении с неё необходимо уступить дорогу транспортным средствам движущимся попутно без изменения направления движения.(«Дорожные знаки», пункт 8.4 ПДД)","img":"i48.jpg","tp":[4],"p":["8.4"]},{"t":4,"n":9,"q":"Вам можно выполнить разворот:","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":1,"tip":"При наличии слева трамвайных путей попутного направления, расположенных на одном уровне с проезжей частью, для выполнения разворота необходимо заблаговременно выехать на трамвайные пути, после чего выполнить маневр. При этом не должно создаваться помех трамваю.Вам можно выполнить разворот только по траектории «Б».(Пункты 8.5, 9.6 ПДД)","img":"i49.jpg","tp":[1,4],"p":["8.5","9.6"]},{"t":4,"n":10,"q":"По какой полосе проезжей части разрешено движение в населенном пункте, если по техническим причинам транспортное средство не может развивать скорость более 40 км/ч?","a":["Только по крайней правой","Не далее второй полосы","По любой, кроме крайней левой"],"c":0,"tip":"Транспортные средства, скорость которых не должна превышать 40 км/ч или которые по техническим причинам не могут развивать такую скорость, должны двигаться по крайней правой полосе вне зависимости от того, где и по какой дороге происходит движение. Исключением являются случаи объезда, обгона или перестроения перед поворотом или разворотом. (Пункт 9.5 ПДД)","img":null,"tp":[13],"p":["9.5"]},{"t":4,"n":11,"q":"Разрешено ли Вам обогнать мотоцикл?","a":["Разрешено","Разрешено только после проезда перекрестка","Запрещено"],"c":0,"tip":"Обгон запрещён на нерегулируемых перекрестках при движении по дороге не являющейся главной. Мотоциклист и Вы согласно знака 2.1 «Главная дорога» двигаетесь по главной. Соответственно Вы можете производить обгон.(«Дорожные знаки», пункт 11.4 ПДД)","img":"i50.jpg","tp":[6],"p":["11.4"]},{"t":4,"n":12,"q":"Разрешается ли Вам остановка для посадки пассажира в этом месте?","a":["Разрешается","Разрешается, если при этом не будут созданы помехи для движения маршрутных транспортных средств","Запрещается"],"c":1,"tip":"В местах остановки маршрутных транспортных средств остановка, связанная с посадкой, высадкой пассажиров, допускается, но при этом не должно быть создано помех движению маршрутных транспортных средств.(Пункт 12.4 ПДД)","img":"i51.jpg","tp":[7],"p":["12.4"]},{"t":4,"n":13,"q":"Вы намерены проехать перекресток в прямом направлении. Ваши действия?","a":["Проедете перекресток первым","Уступите дорогу только встречному автомобилю","Уступите дорогу только автомобилю с включенными проблесковым маячком и специальным звуковым сигналом","Уступите дорогу обоим транспортным средствам"],"c":2,"tip":"Перекресток регулируемый. Первым проедет «оперативник» со специальными сигналами, который может отступать от требований сигналов светофора. Другие водители должны обеспечить ему беспрепятственный проезд перекрёстка. Водитель грузовика обязан уступить Вам, т.е. транспортному средству, движущемуся прямо со встречного направления. (Пункты 3.1, 3.2, 13.3, 13.4 ПДД)","img":"i52.jpg","tp":[8],"p":["13.3","13.4","3.1","3.2"]},{"t":4,"n":14,"q":"Кому Вы должны уступить дорогу при повороте направо?","a":["Только пешеходу, переходящему проезжую часть по нерегулируемому пешеходному переходу","Только пешеходам, переходящим проезжую часть, на которую Вы поворачиваете","Всем пешеходам"],"c":2,"tip":"Первоначально Вы должны уступить дорогу пешеходу, находящемуся на нерегулируемом пешеходном переходе. (Пункт 14.1 ПДД). В последующем при повороте направо уступите дорогу пешеходам, переходящим проезжую часть дороги, на которую Вы поворачиваете. (Пункт 13.1 ПДД). Это правило распространяется при проезде как регулируемых, так и нерегулируемых перекрёстков.","img":"i53.jpg","tp":[8],"p":["13.1","14.1"]},{"t":4,"n":15,"q":"Как Вам следует поступить при выполнении разворота?","a":["Проехать перекресток первым","Уступить дорогу только легковому автомобилю","Уступить дорогу обоим транспортным средствам"],"c":1,"tip":"Перекрёсток неравнозначный. Транспортные средства, находящиеся на главной дороге, имеют преимущество. При повороте налево, развороте Вы уступаете транспортным средствам, движущимся прямо со встречного направления. В данной ситуации уступаете дорогу только легковому автомобилю. (Пункты 13.9, 13.12 ПДД)","img":"i54.jpg","tp":[8],"p":["13.12","13.9"]},{"t":4,"n":16,"q":"Какие из перечисленных действий запрещены водителям транспортных средств в жилой зоне?","a":["Сквозное движение","Учебная езда","Стоянка с работающим двигателем","Все перечисленные действия"],"c":3,"tip":"Все действия, перечисленные в ответах, в жилой зоне, на дворовых территориях запрещены.(Пункты 17.2, 17.4 ПДД)","img":null,"tp":[9],"p":["17.2","17.4"]},{"t":4,"n":17,"q":"Какое расстояние должно быть обеспечено между буксирующим и буксируемым транспортными средствами при буксировке на жесткой сцепке?","a":["Не более 4 м","От 4 до 6 м","От 6 до 8 м"],"c":0,"tip":"При буксировке на жесткой сцепке, расстояние между буксирующим и буксируемым ТС должно быть не более 4 м.(Пункт 20.3 ПДД)","img":null,"tp":[15],"p":["20.3"]},{"t":4,"n":18,"q":"В каком случае разрешается эксплуатация транспортного средства?","a":["Установлены не предусмотренные конструкцией светового прибора оптические элементы","Регулировка фар не соответствует установленным требованиям","Рассеиватели внешних световых приборов отсутствуют или повреждены","На транспортном средстве спереди установлены световые приборы с огнями оранжевого цвета"],"c":3,"tip":"Третий раздел «Устройства освещения и световой сигнализации» «Перечня неисправностей» запрещает эксплуатацию транспортных средств в случаях, если установлены не предусмотренные конструкцией светового прибора оптические элементы; регулировка фар не соответствует установленным требованиям; рассеиватели внешних световых приборов отсутствуют или повреждены (пункты 3.1, 3.2, 3.3). Этим перечнем не запрещается эксплуатация ТС, на котором спереди установлены световые приборы с огнями оранжевого цвета.(«Перечень неисправностей», пункт 3.6)","img":null,"tp":[11],"p":[]},{"t":4,"n":19,"q":"Что следует предпринять водителю для предотвращения опасных последствий заноса автомобиля при резком повороте рулевого колеса на скользкой дороге?","a":["Быстро, но плавно повернуть рулевое колесо в сторону заноса, затем опережающим воздействием на рулевое колесо выровнять траекторию движения","Выключить сцепление и повернуть рулевое колесо в сторону заноса","Нажать на педаль тормоза и воздействием на рулевое колесо выровнять траекторию движения"],"c":0,"tip":"Чтобы не пришлось бороться с заносами на скользкой дороге, не следует резко тормозить, изменять направление движения, манипулировать педалью газа. Следует выбирать скорость, обеспечивающую надёжное сцепление колёс с дорогой. Это элементарное соблюдение мер предосторожности. В рассматриваемой ситуации «без паники» выполните действия только рулевым колесом.","img":null,"tp":[12],"p":[]},{"t":4,"n":20,"q":"Как следует расположить руки на грудной клетке пострадавшего при проведении сердечно-легочной реанимации?","a":["Основания ладоней обеих кистей, взятых в «замок», должны располагаться на грудной клетке на два пальца выше мечевидного отростка так, чтобы большой палец одной руки указывал в сторону левого плеча пострадавшего, а другой – в сторону правого плеча. Руки выпрямляются в локтевых суставах.","Основание ладони одной руки накладывают на середину грудной клетки на два пальца выше мечевидного отростка, вторую руку накладывают сверху, пальцы рук берут в замок. Руки выпрямляются в локтевых суставах, большие пальцы рук указывают на подбородок и живот. Надавливания должны проводиться без резких движений.","Давление руками на грудину выполняют основанием ладони одной руки, расположенной на грудной клетке на два пальца выше мечевидного отростка. Рука выпрямлена в локтевом суставе. Направление большого пальца не имеет значения."],"c":1,"tip":"Обращаем внимание, что в правильном ответе последнее действие руками - «надавливания должны проводиться без резких движений».","img":null,"tp":[16],"p":[]},{"t":5,"n":1,"q":"Сколько проезжих частей имеет данная дорога?","a":["Одну","Две","Четыре"],"c":0,"tip":"Данная горизонтальная разметка 1.3 не делит дорогу на проезжие части. Поэтому в изображенной ситуации дорога имеет четыре полосы движения - одну проезжую часть.(Пункт 1.2 ПДД термин «Разделительная полоса»)","img":"i55.jpg","tp":[0],"p":["1.2"]},{"t":5,"n":2,"q":"При наличии какого знака водитель должен уступить дорогу, если встречный разъезд затруднен?","a":["Только В","А и В","Б и В","Б и Г"],"c":1,"tip":"На уклонах, обозначенных знаками: «А» - 1.13 «Крутой спуск» и «Б» - 1.14 «Крутой подъем» - при наличии препятствия уступить дорогу должен водитель транспортного средства, двигающегося на спуск.На узких участках дороги, где встречный разъезд затруднён, устанавливают знаки: с одной стороны - «В» - 2.6 «Преимущество встречного движения», с другой стороны движения - «Г» - 2.7 «Преимущество перед встречным движением». В данном случае при затруднённом встречном разъезде запрещается въезд на узкий участок дороги со стороны знака 2.6.Ответ - знаки «А» и «В». («Дорожные знаки»)","img":"i56.jpg","tp":[1],"p":[]},{"t":5,"n":3,"q":"Разрешена ли Вам стоянка в указанном месте?","a":["Разрешена","Разрешена только в светлое время суток","Запрещена"],"c":0,"tip":"Действие знака 3.27 «Остановка запрещена» распространяется от места установки до ближайшего перекрёстка, а при отсутствии перекрестка - до конца населённого пункта. В данном случае до знака 5.24.2 «Конец населённого пункта». Вы имеете право остановиться на обочине за знаком.(«Дорожные знаки»)","img":"i57.jpg","tp":[1],"p":[]},{"t":5,"n":4,"q":"Нарушил ли водитель грузового автомобиля правила стоянки?","a":["Нарушил","Нарушил, если разрешенная максимальная масса автомобиля более 3,5 т","Не нарушил"],"c":0,"tip":"На околотротуарную стоянку, обозначенную знаками 6.4 «Парковка (парковочное место)» и 8.6.4 «Способ постановки транспортного средства на стоянку» можно поставить указанным способом только легковой автомобиль или мотоцикл. Грузовым автомобилям, независимо от их р.м.м. стоянка в данном месте не допускается. Данный водитель нарушил Правила. Не путайте табл. 8.6.4 «Способ постановки ТС на стоянку» с табл. 8.4.3 «Вид транспортного средства», иначе допустите ошибку. («Дорожные знаки»)","img":"i58.jpg","tp":[1],"p":[]},{"t":5,"n":5,"q":"О чем предупреждает Вас вертикальная разметка, нанесенная на ограждение дороги?","a":["О приближении к железнодорожному переезду","О приближении к опасному перекрестку","О движении по опасному участку дороги"],"c":2,"tip":"Вертикальная разметка 2.5 обозначает боковые поверхности ограждений дорог на закруглениях малого радиуса, крутых спусках, других опасных участках.","img":"i59.jpg","tp":[2],"p":[]},{"t":5,"n":6,"q":"Разрешается ли водителю продолжить движение после переключения зеленого сигнала светофора на желтый, если возможно остановиться перед перекрестком, только применив экстренное торможение?","a":["Разрешается","Разрешается, если водитель намерен проехать перекресток только в прямом направлении","Запрещается"],"c":0,"tip":"Экстренное (резкое насколько возможно) торможение применяется только для предотвращения дорожно-транспортного происшествия (ДТП). Поэтому правила разрешают движение «под жёлтый» сигнал светофора в том случае, если остановка потребовала бы от Вас экстренного торможения.(Пункты 6.2, 6.14, 10.5 ПДД)","img":null,"tp":[3],"p":["10.5","6.14","6.2"]},{"t":5,"n":7,"q":"Поднятая вверх рука водителя мотоцикла является сигналом, информирующим Вас о его намерении:","a":["Продолжить движение прямо","Повернуть направо","Снизить скорость, чтобы остановиться и уступить дорогу легковому автомобилю"],"c":2,"tip":"Перекрёсток равнозначный. У мотоциклиста помеха справа. Он обязан уступить дорогу, т.е. затормозить и остановиться. Об этом информирует его вытянутая вверх рука.(Пункты 8.1, 13.11 ПДД)","img":"i60.jpg","tp":[4],"p":["13.11","8.1"]},{"t":5,"n":8,"q":"В каких направлениях Вам можно продолжить движение по левой полосе на грузовом автомобиле с разрешенной максимальной массой более 3,5 т?","a":["Только прямо","Прямо и направо","Прямо, налево и в обратном направлении"],"c":0,"tip":"Действие знака 4.1.4 «Движение прямо или направо», согласно табличке 8.4.1 «Вид транспортного средства» распространяется на грузовые автомобили, в том числе с прицепом, с разрешённой максимальной массой более 3,5 т. Для поворота направо необходимо было заблаговременно занять крайнее правое положение на проезжей части, поэтому с занимаемой полосы можете продолжить движение только прямо.(«Дорожные знаки», пункт 8.5 ПДД)","img":"i61.jpg","tp":[4],"p":["8.5"]},{"t":5,"n":9,"q":"Вам необходимо повернуть на примыкающую справа дорогу. Ваши действия?","a":["Не меняя полосы, снизить скорость, затем перестроиться на полосу торможения","Не меняя скорости, перестроиться на полосу торможения, затем снизить скорость","Возможны оба варианта действий"],"c":1,"tip":"Снизить скорость при наличии следует только на полосе торможения.(Пункт 8.10 ПДД)","img":"i62.jpg","tp":[4],"p":["8.10"]},{"t":5,"n":10,"q":"С какой максимальной скоростью Вы имеете право продолжить движение вне населенного пункта на автобусе, в котором места для сидения пассажиров не оборудованы ремнями безопасности, и не предназначенном для перевозки исключительно сидящих пассажиров?","a":["60 км/ч","70 км/ч","90 км/ч"],"c":1,"tip":"Указанным автобусам на любых автодорогах, не относящимся к указанным, на автодорогах разрешается движение вне населённых пунктов с максимальной скоростью 70 км/ч.(Пункт 10.3 ПДД).","img":"i63.jpg","tp":[5],"p":["10.3"]},{"t":5,"n":11,"q":"Разрешен ли Вам обгон?","a":["Разрешен","Разрешен, если обгон будет завершен до перекрестка","Запрещен"],"c":0,"tip":"Обгон запрещён на равнозначных перекрёстках. Вы же, согласно знаку 2.3.1 «Пересечение со второстепенной дорогой», двигаетесь по направлению главной дороги. Можете совершить обгон.(«Дорожные знаки», пункт 11.4 ПДД)","img":"i64.jpg","tp":[6],"p":["11.4"]},{"t":5,"n":12,"q":"Кто из водителей нарушил правила стоянки?","a":["Оба","Только водитель автомобиля А","Только водитель автомобиля Б","Никто не нарушил"],"c":1,"tip":"Ставить ТС разрешается в один ряд параллельно краю проезжей части. Это правило распространяется и на местное уширение проезжей части (как в данной ситуации). Исключением являются подобные места, имеющие сочетание знака 6.4 с одной из табличек 8.6.4 - 8.6.9. Водитель автомобиля «А» нарушает правила стоянки. (Пункт 12.2 ПДД)","img":"i65.jpg","tp":[7],"p":["12.2"]},{"t":5,"n":13,"q":"Вы намерены развернуться. Ваши действия?","a":["Проедете перекресток первым","Выполните разворот, уступив дорогу легковому автомобилю","Дождетесь, когда регулировщик опустит правую руку"],"c":1,"tip":"Перекрёсток регулируемый. Правая рука регулировщика вытянута вперёд. Со стороны левого бока транспортные средства могут продолжить движение в любом направлении, соблюдая правила расположения транспортных средств на проезжей части.Производя разворот из крайней левой полосы, у Вас будет помеха справа. Вы уступите дорогу легковому автомобилю, поворачивающему направо. (Пункты 6.10, 13.4 ПДД)","img":"i66.jpg","tp":[8],"p":["13.4","6.10"]},{"t":5,"n":14,"q":"Кому Вы должны уступить дорогу при движении в прямом направлении?","a":["Только трамваю","Только легковому автомобилю","Обоим транспортным средствам"],"c":0,"tip":"Перекрёсток равнозначный. В равнозначных условиях трамвай имеет преимущество, а безрельсовые транспортные средства между собой руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает. Уступаете дорогу в данной ситуации - только трамваю.(Пункт 13.11 ПДД)","img":"i67.jpg","tp":[8],"p":["13.11"]},{"t":5,"n":15,"q":"Как Вам следует поступить при повороте налево?","a":["Проехать перекресток первым","Уступить дорогу только грузовому автомобилю с включенным проблесковым маячком","Уступить дорогу обоим транспортным средствам"],"c":0,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Проблесковый маячок жёлтого цвета на грузовике преимущество не предоставляет. Преимущество имеют транспортные средства, находящиеся на главной дороге. Вы проезжаете первым, после Вас проезжают автомобили, находящиеся на второстепенной дороге, которые между собой руководствуются «правилом правой руки». Легковой автомобиль проедет вторым, грузовик - последним.(Пункты 3.4, 13.9, 13.10, 13.11 ПДД)","img":"i68.jpg","tp":[8],"p":["13.10","13.11","13.9","3.4"]},{"t":5,"n":16,"q":"Разрешено ли Вам проехать железнодорожный переезд?","a":["Разрешено, поскольку дежурный по переезду запрещает движение только встречному автомобилю","Разрешено, если отсутствует приближающийся поезд","Запрещено"],"c":2,"tip":"Запрещающим сигналом дежурного по переезду является его обращение к водителям с поднятым над головой жезлом, красным фонарём или флажком, либо с вытянутыми в сторону руками. При этом выезд на переезд и со стороны груди, и со стороны спины запрещен (вспоминаем афоризм «грудь, спина - стена»).(Пункт 15.3 ПДД)","img":"i69.jpg","tp":[14],"p":["15.3"]},{"t":5,"n":17,"q":"В каких случаях разрешено применять звуковые сигналы в населенных пунктах?","a":["Только для предупреждения о намерении произвести обгон","Только для предотвращения дорожно-транспортного происшествия","В обоих перечисленных случаях"],"c":1,"tip":"Звуковые сигналы могут применяться только:- для предупреждения других водителей о намерении произвести обгон вне населенных пунктов;- в случаях, когда это необходимо для предотвращения дорожно-транспортного происшествия.(Пункт 19.10 ПДД)","img":null,"tp":[10],"p":["19.10"]},{"t":5,"n":18,"q":"Эксплуатация транспортного средства запрещается, если:","a":["Предохранительные приспособления (цепи, тросы) на прицепах, не оборудованных рабочей тормозной системой, неисправны","Предохранительные приспособления (цепи, тросы) на прицепах, оборудованных рабочей тормозной системой, неисправны","Предохранительные приспособления (цепи, тросы) на прицепах, независимо от их оборудования рабочей тормозной системой, неисправны"],"c":0,"tip":"При неисправностях, указанных в новом 6-м разделе «Сцепные устройства» («Перечень неисправностей»), эксплуатация ТС с прицепами разных типов запрещается.Согласно пункта 6.2 «Перечня неисправностей», при неисправностях в ответе: \"предохранительные приспособления (цепи, тросы) на прицепах, не оборудованных рабочей тормозной системой, неисправны\" эксплуатация ТС (тягача) с прицепами запрещается.","img":null,"tp":[11],"p":[]},{"t":5,"n":19,"q":"Как следует поступить водителю при высадке из автомобиля, стоящего у тротуара или на обочине?","a":["Обойти автомобиль спереди","Обойти автомобиль сзади","Допустимы оба варианта действий"],"c":1,"tip":"Правила не регламентируют действия водителя при высадке его из автомобиля. Но учитывая условия обеспечения безопасности дорожного движения в подобных ситуациях в большинстве случаев следует обойти автомобиль сзади, чтобы иметь возможность видеть ТС, движущиеся в попутном направлении. Главное условие безопасности при выходе из автомобиля в подобных ситуациях - действия водителя и других лиц не должны быть неожиданностью для других водителей.","img":null,"tp":[12],"p":[]},{"t":5,"n":20,"q":"При движении в условиях тумана расстояние до предметов представляется:","a":["Большим, чем в действительности","Соответствующим действительности","Меньшим, чем в действительности"],"c":0,"tip":"При движении в условиях тумана расстояние до предметов представляется большим, чем в действительности. Объясняется это психологическим фактором. Человек всё сравнивает с привычными, обычными условиями, в которых он проводит большую часть времени, т.е. с дневными условиями.","img":"i70.jpg","tp":[12],"p":[]},{"t":6,"n":1,"q":"Что называется разрешенной максимальной массой транспортного средства?","a":["Максимально допустимая для перевозки масса груза, установленная предприятием изготовителем","Масса снаряженного транспортного средства без учета массы водителя, пассажиров и груза, установленная предприятием изготовителем","Масса снаряженного транспортного средства с грузом, водителем и пассажирами, установленная предприятием изготовителем в качестве максимально допустимой"],"c":2,"tip":"Пункт 1.2 ПДД термин «Разрешённая максимальная масса».","img":null,"tp":[0],"p":[]},{"t":6,"n":2,"q":"Вам разрешено продолжить движение:","a":["Только прямо","Прямо или в обратном направлении","Во всех направлениях"],"c":1,"tip":"Знак 3.18.2 «Поворот налево запрещён» не запрещает производить разворот. Поэтому можете по своему усмотрению продолжить движение прямо или развернуться, и продолжить движение в обратном направлении.(«Дорожные знаки»)","img":"i71.jpg","tp":[1],"p":[]},{"t":6,"n":3,"q":"Какие из указанных знаков разрешают проезд на автомобиле к месту проживания или работы?","a":["Только А","Только В","А и В","Все"],"c":2,"tip":"Разрешают проезд на автомобиле к месту проживания или работы знаки: «А» - 3.2 «Движение запрещено», «В» - 3.3 «Движение механических транспортных средств запрещено». Из запрещающих знаков 6 знаков предоставляют такую «льготу». В их число не входит знак «Б» - 3.1 «Въезд запрещён», который запрещает въезд под знак всех ТС, кроме маршрутных транспортных средств и ТС, в случае применения знака 3.1 с табличками 8.4.1 - 8.4.8; 8.5.1, 8.5.2, 8.5.3, 8.5.4, 8.5.5 - 8.5.7 и 8.4.9 - 8.4.16.(«Дорожные знаки»)","img":"i72.jpg","tp":[1],"p":[]},{"t":6,"n":4,"q":"Что обозначают эти дорожные знаки?","a":["Парковочное место только для автобусов","Парковочное место для автобусов и троллейбусов","Парковочное место, где возможна пересадка на маршрутное транспортное средство (автобус или троллейбус)"],"c":2,"tip":"Знак 6.4 «Парковка (парковочное место)» применён с табличкой 8.21.2 «Вид маршрутного транспортного средства». Такое сочетание знаков показывает, что с этого места для дальнейшего движения можно воспользоваться маршрутными транспортными средствами - автобусом или троллейбусом, а свой автомобиль можно оставить на оборудованной стоянке. («Дорожные знаки»)","img":"i73.jpg","tp":[1],"p":[]},{"t":6,"n":5,"q":"Разметка в виде треугольника на полосе движения:","a":["Обозначает опасный участок дороги","Предупреждает Вас о приближении к месту, где нужно уступить дорогу","Указывает место, где Вам необходимо остановиться"],"c":1,"tip":"Разметка 1.20 предупреждает о приближении к разметке 1.13, которая указывает место, где водитель должен при необходимости остановиться, уступая дорогу транспортным средствам, движущимся по пересекаемой дороге.(«Горизонтальная разметка»)","img":"i74.jpg","tp":[2],"p":[]},{"t":6,"n":6,"q":"Разрешается ли продолжить движение, если регулировщик поднял руку вверх после того, как Вы въехали на перекресток?","a":["Разрешается","Разрешается, если Вы поворачиваете направо","Запрещается"],"c":0,"tip":"Вы находитесь на перекрёстке. Следует освободить его, иначе будете мешать осуществлять движение транспортным средствам, движущимся с других направлений.(Пункт 6.14 ПДД)","img":null,"tp":[3],"p":["6.14"]},{"t":6,"n":7,"q":"Вы намерены продолжить движение по главной дороге. Обязаны ли Вы включить указатели левого поворота?","a":["Обязаны","Обязаны, если с других направлений приближаются транспортные средства","Не обязаны"],"c":0,"tip":"Где бы ни происходило управление автомобилем, Вы должны строго придерживаться «своего внутреннего правила», которое можно сформулировать так: «Моя езда является безопасной в том случае, когда мои действия понятны всем остальным участникам дорожного движения». Вы намерены совершить маневр-поворот налево - обязательно информируйте других участников дорожного движения об этом, включив указатель поворота.(Пункт 8.1 ПДД)","img":"i75.jpg","tp":[4],"p":["8.1"]},{"t":6,"n":8,"q":"Кто должен уступить дорогу при взаимном перестроении?","a":["Водитель легкового автомобиля","Водитель грузового автомобиля","Водителям следует действовать по взаимной договоренности"],"c":1,"tip":"При одновременном перестроении водители руководствуются «правилом правой руки». Помеха справа у водителя грузовика. Он уступает дорогу. (Пункт 8.4 ПДД)","img":"i76.jpg","tp":[4],"p":["8.4"]},{"t":6,"n":9,"q":"В каких направлениях Вам можно продолжить движение?","a":["Только прямо","Прямо и налево","Прямо, налево и в обратном направлении"],"c":2,"tip":"С Вашей стороны прерывистая линия разметки 1.11, которая допускает её пересечение. Так как Вы находитесь на крайней левой полосе, можете продолжить движение прямо, повернуть налево или развернуться и продолжить движение в обратном направлении.(«Горизонтальная разметка», пункт 8.5 ПДД)","img":"i77.jpg","tp":[4],"p":["8.5"]},{"t":6,"n":10,"q":"С какой максимальной скоростью Вы имеете право продолжить движение на автобусе, в котором места для сидения пассажиров\nоборудованы ремнями безопасности, предназначенном для перевозки исключительно сидящих пассажиров?","a":["70 км/ч","90 км/ч","110 км/ч"],"c":1,"tip":"На автомагистрали разрешается более скоростное движение. Указанным транспортным средствам на автомагистрали допускается движение со скоростью не более 90 км/ч. («Дорожные знаки» 5.1. «Автомагистраль», пункт 10.3 ПДД)","img":"i78.jpg","tp":[5],"p":["10.3","5.1"]},{"t":6,"n":11,"q":"Как Вам следует поступить в данной ситуации?","a":["Уступить дорогу встречному автомобилю","Проехать первым","Действовать по взаимной договоренности с водителем встречного автомобиля"],"c":0,"tip":"На Вашей стороне проезжей части помеха - препятствие в виде неисправного автомобиля. Вы должны уступить дорогу. если бы аналогичная ситуация сложилась на уклоне, обозначенном знаками 1.13 «Крутой спуск», 1.14 «Крутой подъем», то уступить дорогу должен был бы автомобиль, движущийся на спуск, т.е. вниз.(Пункт 11.7 ПДД)","img":"i79.jpg","tp":[6],"p":["11.7"]},{"t":6,"n":12,"q":"Разрешено ли Вам поставить автомобиль на стоянку в этом месте?","a":["Разрешено","Разрешено, если при этом не будут созданы помехи для движения маршрутных транспортных средств","Запрещено"],"c":2,"tip":"Остановка и стоянка запрещены ближе 15 м от мест остановки маршрутных ТС (условие не нарушается), а также на пешеходном переходе и ближе 5 м до него. Остановившись вплотную к пешеходному переходу, Вы нарушите это требование. Поэтому стоянка ТС в этом месте запрещена.(Пункт 12.4 ПДД)","img":"i80.jpg","tp":[7],"p":["12.4"]},{"t":6,"n":13,"q":"Вы намерены повернуть налево. Ваши действия?","a":["Проедете перекресток\nпервым","Уступите дорогу трамваю, выполнив поворот с проезжей части","Пропустите трамвай, перестроитесь на трамвайные пути попутного направления и выполните с них поворот"],"c":2,"tip":"Светофор с сигналами бело-лунного цвета, предназначенный для водителей маршрутных транспортных средств, разрешает им движение прямо. Согласно зелёного сигнала светофора, разрешено движение и Вам в любом направлении. Для поворота налево, Вы должны пропустить трамвай, перестроиться на трамвайные пути попутного направления и с них выполнить поворот налево. (Пункты 6.2, 6.8, 8.5 ПДД).","img":"i81.jpg","tp":[8],"p":["6.2","6.8","8.5"]},{"t":6,"n":14,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Только пешеходам","Пешеходам и велосипедисту","Никому"],"c":1,"tip":"На перекрёстках, независимо регулируемые они или нет, при повороте налево или направо водитель обязан уступить дорогу пешеходам, переходящим проезжую часть, на которую он поворачивает. Следует уступить и велосипедисту, движущемуся навстречу прямо.(Пункты 13.1, 13.2 ПДД)","img":"i82.jpg","tp":[8],"p":["13.1","13.2"]},{"t":6,"n":15,"q":"В каком случае Вы должны будете уступить дорогу автомобилю ДПС?","a":["Если на автомобиле ДПС будут включены проблесковые маячки синего цвета","Если на автомобиле ДПС одновременно будут включены проблесковые маячки синего цвета и специальный звуковой сигнал","В любом"],"c":1,"tip":"В данном случае Вы должны уступить дорогу «оперативнику», если на данном автомобиле одновременно будут включены проблесковые маячки синего цвета и специальный звуковой сигнал.(Пункт 3.2 ПДД)","img":"i83.jpg","tp":[17,8],"p":["3.2"]},{"t":6,"n":16,"q":"При приближении к остановившемуся транспортному средству с включенной аварийной сигнализацией, которое имеет опознавательные знаки \"Перевозка детей\", водитель должен:","a":["Снизить скорость","При необходимости остановиться и пропустить детей","Осуществить все перечисленные действия"],"c":2,"tip":"Аварийная сигнализация должна быть включена при посадке детей в автобус и высадке из него, имеющем опознавательные знаки «Перевозка детей». Приближаясь к остановившемуся автобусу с включенной аварийной сигнализацией, имеющему опознавательные знаки «Перевозка детей» водитель должен снизить скорость, при необходимости остановиться и пропустить детей, т.е. осуществить все перечисленные действия. Необходимо учитывать, что организованная перевозка детей с 1 марта 2023 года разрешается только в автобусах.(Пункты 7.1, 14.7, 22.6 ПДД)","img":null,"tp":[20],"p":["14.7","22.6","7.1"]},{"t":6,"n":17,"q":"Дневные ходовые огни предназначены для:","a":["Улучшения видимости двигающегося транспортного средства в светлое время суток только сзади","Улучшения видимости двигающегося транспортного средства в светлое время суток только спереди","Улучшения видимости двигающегося транспортного средства в светлое время суток как сзади, так и спереди"],"c":1,"tip":"«Дневные ходовые огни», внешние световые приборы предназначены для улучшения видимости движущегося т. с. спереди в светлое время суток.В настоящее время получают распространение светодиодные ходовые огни.(Пункт 1.2 ПДД, термин «Дневные ходовые огни»)","img":null,"tp":[10],"p":["1.2"]},{"t":6,"n":18,"q":"Эксплуатация автобуса категории М2 и М3 разрешается, если:","a":["Имеется сквозная коррозия или разрушение пола пассажирского салона","В салоне установлены дополнительные элементы конструкции, ограничивающие свободный доступ к аварийным выходам","Не обозначены соответствующим знаком или надписью детали приведения в действие аварийных выходов","Неисправны или отсутствуют аварийный выключатель дверей и сигнал требования остановки","Неисправны приборы внутреннего освещения салона автобуса"],"c":4,"tip":"При следующих неисправностях: имеется сквозная коррозия или разрушение пола пассажирского салона; в салоне установлены дополнительные элементы конструкции, ограничивающие свободный доступ к аварийным выходам; не обозначены соответствующим знаком или надписью детали приведения в действие аварийных выходов; отсутствуют или ненадежно закреплены поручни в местах, предусмотренных изготовителем транспортного средства в эксплуатационной документации; неисправны или отсутствуют аварийный выключатель дверей и сигнал требования остановки запрещается эксплуатация автобуса категории М2 и М3.Только при неисправных приборах внутреннего освещения салона автобуса нет запрещения эксплуатации ТС.(«Перечень неисправностей», пункт 9.9).","img":null,"tp":[11],"p":[]},{"t":6,"n":19,"q":"В случае остановки на подъеме (спуске) при наличии обочины можно предотвратить самопроизвольное скатывание автобуса на проезжую часть, повернув его передние колеса в положение:","a":["А и Г","Б и В","А и В","Б и Г"],"c":0,"tip":"Колёса, вывернутые в сторону кювета («А» и «Г»), в случае непреднамеренного скатывания автомобиля уведут неуправляемый автомобиль в кювет, что позволит избежать встречного столкновения движущихся транспортных средств. И наоборот.","img":"i84.jpg","tp":[12],"p":[]},{"t":6,"n":20,"q":"Установленный факт употребления водителем вызывающих алкогольное опьянение веществ определяется наличием в его организме абсолютного этилового спирта в концентрации, превышающей:","a":["0,10 миллиграмма на один литр выдыхаемого воздуха","0,16 миллиграмма на один литр выдыхаемого воздуха","0,25 миллиграмма на один литр выдыхаемого воздуха"],"c":1,"tip":"Статья 12.8 КоАП, предусматривающая наказание водителей, находящихся в алкогольном опьянении предусматривает, что она вступает в силу, если наличие абсолютного этилового спирта в концентрации превышает показатель 0,16 миллилитров на один литр выдыхаемого воздуха.","img":null,"tp":[21],"p":[]},{"t":7,"n":1,"q":"Кому предоставлено право остановки грузовых автомобилей и автобусов, осуществляющих международные перевозки, в пунктах контроля, обозначенных данным дорожным знаком?","a":["Только сотрудникам полиции","Только уполномоченным должностным лицам Федеральной службы по надзору в сфере транспорта","Всем перечисленным должностным лицам"],"c":2,"tip":"В местах, обозначенных дорожным знаком 7.14.2 «Пункт транспортного контроля», право остановки грузовых автомобилей и автобусов предоставлено работникам Федеральной службы по надзору в сфере транспорта и регулировщикам, к которым относятся и сотрудники полиции.Лица, обладающие правом остановки транспортного средства, обязаны предъявлять по требованию водителя служебное удостоверение. (Пункты 1.2 «Регулировщик», 2.4 ПДД, «Дорожные знаки»)","img":"i85.jpg","tp":[22],"p":["1.2","2.4"]},{"t":7,"n":2,"q":"О чем информируют Вас эти дорожные знаки?","a":["О приближении к перекрестку, где установлен знак «Уступите дорогу»","О приближении к перекрестку, где установлен знак «Движение без остановки запрещено»","О приближении к таможне"],"c":1,"tip":"Табличка 8.1.2 «Расстояние до объекта» указывает расстояние от знака 2.4 «Уступите дорогу» до перекрёстка в случае, если непосредственно перед перекрёстком установлен знак 2.5 «Движение без остановки запрещено».(«Дорожные знаки»)","img":"i86.jpg","tp":[1],"p":[]},{"t":7,"n":3,"q":"Разрешено ли Вам произвести остановку в указанном месте?","a":["Запрещено","Разрешено только для посадки или высадки пассажиров","
