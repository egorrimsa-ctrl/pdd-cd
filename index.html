решённая максимальная масса которого более 2,5 т, может выехать на крайнюю левую полосу при наличии трёх полос и более в данном направлении только для поворота налево и разворота.(Пункт 9.4 ПДД)","img":"i376.jpg","tp":[13],"p":["9.4"]},{"t":28,"n":11,"q":"Можно ли Вам обогнать трактор, управляя грузовым автомобилем с разрешенной максимальной массой более 3,5 т?","a":["Можно","Можно, если скорость трактора менее 30 км/ч","Нельзя"],"c":2,"tip":"На данном автомобиле в зоне действия знака 3.22 «Обгон грузовым автомобилям запрещён» - запрещен обгон всех транспортных средств, без исключения.(«Дорожные знаки»)","img":"i377.jpg","tp":[6],"p":[]},{"t":28,"n":12,"q":"В каком месте Вам разрешено остановиться?","a":["Только А","Только Б","В любом из указанных"],"c":2,"tip":"На дороге, имеющей по одной полосе движения в каждом направлении, не имеющей трамвайных путей посередине, в населённом пункте, обозначенном знаком 5.23.1 и 5.23.2 «Начало населённого пункта» (с белым фоном), разрешается остановка и стоянка не только на правой стороне, но и на левой стороне дороги.(«Дорожные знаки», пункт 12.1 ПДД)","img":"i378.jpg","tp":[7],"p":["12.1"]},{"t":28,"n":13,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Только автомобилю","Только трамваю","Автомобилю и трамваю","Никому"],"c":2,"tip":"Перекрёсток регулируемый. Трамвай в равнозначных условиях имеет преимущество перед безрельсовыми транспортными средствами. Вместе с ним одновременно, так как траектории движения не пересекаются, проедет легковой автомобиль, поворачивающий направо, которому Вы при повороте налево обязаны также уступить. Вы проедете перекрёсток последним.(Пункты 13.3, 13.4, 13.6 ПДД)","img":"i379.jpg","tp":[8],"p":["13.3","13.4","13.6"]},{"t":28,"n":14,"q":"Вы должны уступить дорогу грузовому автомобилю:","a":["Только при движении прямо","Только при повороте направо","В обоих перечисленных случаях"],"c":0,"tip":"Перекрёсток равнозначный. Водители руководствуются «правилом правой руки». У Вас помеха справа будет только при движении прямо - Вы уступаете дорогу грузовому автомобилю. При повороте направо помеха справа отсутствует.(Пункт 13.11 ПДД)","img":"i380.jpg","tp":[8],"p":["13.11"]},{"t":28,"n":15,"q":"Вы намерены развернуться. Кому Вам необходимо уступить дорогу?","a":["Только грузовому автомобилю","Только легковому автомобилю","Обоим транспортным средствам"],"c":0,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Транспортные средства, находящиеся на главной дороге, имеют преимущество перед остальными независимо от их дальнейшего направления движения. Между собой руководствуются «правилом правой руки». Грузовик проезжает первым, Вы после него, легковой автомобиль - последним.(Пункты 13.9, 13.10, 13.11 ПДД)","img":"i381.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":28,"n":16,"q":"Где Вам разрешается остановиться при движении по автомагистрали?","a":["Только через 500 м","В любом месте правее линии, обозначающей край проезжей части","В любом месте у края проезжей части"],"c":0,"tip":"На автомагистрали запрещается остановка вне специальных площадок для стоянки, обозначенных знаками 6.4 «Парковка (парковочное место)» или 7.11 «Место отдыха» (изображённом на рисунке). При этом до обозначенного места расстояние 500 м.(«Дорожные знаки», пункт 16.1 ПДД)","img":"i382.jpg","tp":[18],"p":["16.1"]},{"t":28,"n":17,"q":"Двигаясь в темное время суток вне населенного пункта с включенными фарами дальнего света, Вы догнали движущееся впереди транспортное средство. Ваши действия?","a":["Оставите включенными габаритные огни, выключив фары дальнего света","Переключите дальний свет фар на ближний","Допускаются оба варианта действий"],"c":1,"tip":"Для исключения возможности ослепления обгоняемого водителя через зеркала заднего вида необходимо переключить дальний свет на ближний.(Пункт 19.2 ПДД)","img":null,"tp":[10],"p":["19.2"]},{"t":28,"n":18,"q":"Как обязан поступить водитель, если во время движения отказал в работе стеклоомыватель?","a":["Продолжить намеченную поездку с особой осторожностью","Попытаться устранить неисправность на месте, а если это невозможно, то следовать к месту стоянки или ремонта с соблюдением необходимых мер предосторожности","Прекратить дальнейшее движение"],"c":1,"tip":"Пункт 3 «Основных положений» запрещает эксплуатацию ТС при неисправностях в части, относящейся к безопасности дорожного движения.Пункт 2.3.1 ПДД не запрещает дальнейшее движение с такой неисправностью к месту стоянки или ремонта с соблюдением мер предосторожности.","img":null,"tp":[11],"p":[]},{"t":28,"n":19,"q":"Что следует предпринять, если на повороте возник занос задней оси заднеприводного автомобиля?","a":["Увеличить подачу топлива, рулевым колесом стабилизировать движение","Притормозить и повернуть рулевое колесо в сторону заноса","Значительно уменьшить подачу топлива, не меняя положения рулевого колеса","Слегка уменьшить подачу топлива и повернуть рулевое колесо в сторону заноса"],"c":3,"tip":"В такой ситуации не теряйтесь. Не сбрасывайте резко подачу топлива. Уменьшайте обороты двигателя как можно плавнее; для выравнивания заноса поверните рулевое колесо в сторону заноса.","img":null,"tp":[12],"p":[]},{"t":28,"n":20,"q":"В каком случае водителю необходимо оценивать обстановку сзади?","a":["Перед началом или возобновлением движения","Перед торможением","Перед осуществлением маневра (перестроения или изменения направления движения)","Во всех перечисленных случаях"],"c":3,"tip":"Перед любым выполнением маневра следует оценивать обстановку сзади. В перечисленных случаях тоже. Как правило, это делается через зеркала заднего вида. Учитывайте, что они имеют «мертвые» (непросматриваемые) зоны. Поэтому желательно избегать резких маневров.","img":null,"tp":[12],"p":[]},{"t":29,"n":1,"q":"Что означает требование уступить дорогу?","a":["Вы должны остановиться только при наличии дорожного знака «Уступите дорогу»","Вы должны обязательно остановиться, чтобы пропустить других участников движения","Вы не должны начинать, возобновлять или продолжать движение, осуществлять какой-либо маневр, если это может вынудить других участников движения, имеющих по отношению к Вам преимущество, изменить направление движения или скорость"],"c":2,"tip":"Уступить дорогу (не создавать помех) означает, что Вы не должны начинать, возобновлять или продолжать движение, осуществлять какой-либо маневр, если это может вынудить других участников движения, имеющих по отношению к Вам преимущество, изменить направление движения или скорость. (Пункт 1.2 термин «Уступить дорогу»)","img":null,"tp":[0],"p":[]},{"t":29,"n":2,"q":"Какие из указанных знаков предоставляют право преимущественного проезда нерегулируемых перекрестков?","a":["Только А","А и В","Все"],"c":1,"tip":"Знаки: 2.1 «Главная дорога» («А») и 2.3.5 «Примыкание второстепенной дороги» («В») предоставляют право преимущественного проезда нерегулируемых перекрёстков транспортным средствам, находящимся на главной дороге.(Пункт 1.2 термин «Главная дорога», 13.9 ПДД)","img":"i383.jpg","tp":[1],"p":["1.2","13.9"]},{"t":29,"n":3,"q":"Разрешено ли Вам выполнить обгон, если Вы управляете грузовым автомобилем с разрешенной максимальной массой более 3,5 т?","a":["Разрешено","Разрешено, если скорость обгоняемого автомобиля не более 30 км/ч","Запрещено"],"c":2,"tip":"На данном автомобиле в зоне действия знака 3.22 «Обгон грузовым автомобилям запрещен» - запрещен обгон всех транспортных средств, без исключения.(«Дорожные знаки»)","img":"i384.jpg","tp":[1],"p":[]},{"t":29,"n":4,"q":"Можно ли водителю поставить грузовой автомобиль на стоянку в этом месте указанным способом?","a":["Можно","Можно, если разрешенная максимальная масса автомобиля не более 7,5т","Нельзя"],"c":2,"tip":"Водителям грузовых автомобилей при наличии знака 6.4 «Парковка (парковочное место)» с одной из табличек 8.6.2 - 8.6.9 «Способ постановки транспортных средств на стоянку» стоять в зоне действия этого знака нельзя. Не допускает стоянку на краю тротуара любым грузовым автомобилям и пункт 12.2 ПДД и в иных местах, не обозначенных знаками. Поэтому ответ однозначен - водитель грузовика нарушает Правила.(«Дорожные знаки»)","img":"i385.jpg","tp":[1],"p":[]},{"t":29,"n":5,"q":"Такой вертикальной разметкой обозначают:","a":["Только нижний край пролетного строения тоннелей, мостов и путепроводов","Только въезд в неосвещенные тоннели","Любые элементы дорожных сооружений, представляющие опасность"],"c":0,"tip":"Вертикальной разметкой 2.2 обозначается нижний край пролётного строения тоннелей, мостов и путепроводов.(«Вертикальная разметка»)","img":"i386.jpg","tp":[2],"p":[]},{"t":29,"n":6,"q":"В каком месте Вы должны остановиться?","a":["Перед светофором","Перед стоп-линией","В любом из перечисленных"],"c":1,"tip":"При наличии стоп-линии (разметки 1.12) при запрещающем сигнале светофора следует остановиться перед стоп-линией.(«Горизонтальная разметка», пункт 6.13 ПДД ПДД)","img":"i387.jpg","tp":[3],"p":["6.13"]},{"t":29,"n":7,"q":"Должны ли водители подавать сигналы указателями поворота при маневрировании на территории автостоянки или АЗС?","a":["Должны","Должны только при наличии в непосредственной близости других транспортных средств","Не должны"],"c":0,"tip":"Всегда информируйте о своих намерениях других участников дорожного движения. При этом неважно где, при каких условиях, при каких обстоятельствах Вы являетесь водителем. Перед началом маневрирования следует включить соответствующий указатель поворота.(Пункт 8.1 ПДД)","img":null,"tp":[4],"p":["8.1"]},{"t":29,"n":8,"q":"Вам разрешено выполнить поворот направо на длинномерном транспортном средстве:","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":0,"tip":"Если ТС из-за своих габаритов или по другим причинам не может выполнить поворот из крайнего положения не нарушая пункт 8.5 ПДД, допускается отступать от этих требований. В этом случае поворот также должен осуществляться таким образом, чтобы при выезде с пересечения проезжих частей, ТС не оказалось на стороне встречного движения.(Пункты 8.6, 8.7 ПДД)","img":"i388.jpg","tp":[4],"p":["8.6","8.7"]},{"t":29,"n":9,"q":"Разрешено ли водителю движение задним ходом при отсутствии других участников движения?","a":["Разрешено","Разрешено только до пешеходного перехода","Запрещено"],"c":1,"tip":"Движение задним ходом на участках дорог, обозначенных знаком 5.5 «Дорога с односторонним движением», не запрещено. Поэтому можете выполнить маневр до пешеходного перехода, так как движение задним ходом на них запрещается.(«Дорожные знаки», пункт 8.12 ПДД)","img":"i389.jpg","tp":[4],"p":["8.12"]},{"t":29,"n":10,"q":"Можно ли Вам выехать на крайнюю левую полосу в данной ситуации?","a":["Можно","Можно, если гужевая повозка двигается со скоростью не более 30 км/ч","Нельзя"],"c":2,"tip":"Выезжать на крайнюю левую полосу, предназначенную для встречного движения на дороге с двусторонним движением, имеющей три полосы, запрещено.(Пункт 9.3 ПДД)","img":"i390.jpg","tp":[13],"p":["9.3"]},{"t":29,"n":11,"q":"Разрешается ли Вам выполнить обгон?","a":["Разрешается","Разрешается, если при этом не будут созданы помехи другим участникам движения","Запрещается"],"c":2,"tip":"Перекрёсток равнозначный. На равнозначных перекрёстках обгон запрещён.(Пункт 11.4 ПДД)","img":"i391.jpg","tp":[6],"p":["11.4"]},{"t":29,"n":12,"q":"Кто из водителей нарушил правила остановки?","a":["Оба","Только водитель автомобиля А","Только водитель автомобиля Б","Никто не нарушил"],"c":3,"tip":"Не путайте остановку со стоянкой. Остановка запрещена непосредственно на железнодорожном переезде, границами которого являются шлагбаумы. Стоянка запрещена непосредственно на железнодорожном переезде и ближе 50 м от него. Водители остановились вне железнодорожного переезда, не нарушая правил.(Пункты 12.4, 12.1 ПДД)","img":"i392.jpg","tp":[7],"p":["12.1","12.4"]},{"t":29,"n":13,"q":"При выполнении какого маневра водитель грузового автомобиля имеет преимущество в движении?","a":["Только при повороте налево","Только при развороте","При выполнении любого маневра из перечисленных"],"c":2,"tip":"Водитель грузового автомобиля, движущийся под включенную зеленую стрелку в дополнительной секции, включенную одновременно с основным зеленым сигналом, может повернуть налево и совершить разворот. При этом движущиеся под включенную зеленую стрелку, в дополнительной секции, включенную одновременно с основным красным сигналом, автобус и легковой автомобиль обязаны уступить всем другим ТС, движущимся со всех других направлений.Водитель грузового автомобиля имеет преимущество в данной ситуации при выполнении любого маневра из перечисленных.(Пункт 13.5 ПДД)","img":"i393.jpg","tp":[8],"p":["13.5"]},{"t":29,"n":14,"q":"Вы намерены повернуть налево. Ваши действия?","a":["Уступите дорогу трамваю, выполнив поворот с левой полосы","Пропустите трамвай, перестроитесь на трамвайные пути попутного направления, после чего выполните поворот","Проедете перекресток первым"],"c":0,"tip":"Вы и трамвай находитесь в равнозначных условиях. Трамвай в таком случае имеет преимущество перед безрельсовыми транспортными средствами. Уступаете дорогу трамваю.(Пункт 13.11 ПДД)","img":"i394.jpg","tp":[8],"p":["13.11"]},{"t":29,"n":15,"q":"Кому Вы обязаны уступить дорогу при движении в прямом направлении?","a":["Только легковому автомобилю","Только автобусу","Обоим транспортным средствам"],"c":2,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Преимущество имеют транспортные средства, находящиеся на главной дороге. Между собой они руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает. Вы находитесь на второстепенной дороге - уступаете обоим транспортным средствам.(«Дорожные знаки» 2.4, 8.13, пункты 13.9, 13.10 ПДД)","img":"i395.jpg","tp":[8],"p":["13.10","13.9","2.4","8.13"]},{"t":29,"n":16,"q":"Можно ли Вам, управляя грузовым автомобилем с разрешенной максимальной массой более 3,5 т, осуществить опережение в данной ситуации?","a":["Можно","Можно, если разрешенная максимальная масса автомобиля не более 7,5 т","Нельзя"],"c":2,"tip":"На любых дорогах, имеющих для движения в данном направлении три полосы и более, занимать крайнюю левую полосу разрешается только при интенсивном движении, когда заняты другие полосы, а также для поворота налево или разворота, а грузовым автомобилям с р.м.м. более 2,5 т - только для поворота налево или разворота. Осуществить опережение на грузовом автомобиле, если р.м.м. грузового автомобиля более 3,5 т нельзя.(Пункт 9.4 ПДД)","img":"i396.jpg","tp":[18,13],"p":["9.4"]},{"t":29,"n":17,"q":"При движении в светлое время суток на транспортном средстве должны быть включены:","a":["Только дневные ходовые огни","Только фары ближнего света","Только противотуманные фары","Любые внешние световые приборы из перечисленных"],"c":3,"tip":"В светлое время суток на всех движущихся транспортных средствах с целью их обозначения должны включаться фары ближнего света или дневные ходовые огни. Вместо ближнего света для этой цели, допускается применять противотуманные фары.Правильный ответ - любые из перечисленных.(Пункты 19.4, 19.5 ПДД)","img":null,"tp":[10],"p":["19.4","19.5"]},{"t":29,"n":18,"q":"Запрещается эксплуатация грузового автомобиля и автопоезда, если стояночная тормозная система не обеспечивает неподвижное состояние транспортного средства в снаряженном состоянии на уклоне:","a":["До 16% включительно","До 23% включительно","До 31% включительно"],"c":2,"tip":"Запрещается эксплуатация грузового автомобиля и автопоезда, если стояночная тормозная система не обеспечивает неподвижное состояние транспортного средства в снаряженном состоянии на уклоне до 31% включительно.(«Перечень неисправностей», пункт 1.9)","img":null,"tp":[11],"p":[]},{"t":29,"n":19,"q":"Что следует предпринять для быстрого восстановления эффективности тормозов транспортного средства после проезда через водную преграду?","a":["Резко нажать на педаль тормоза, после чего продолжить движение","Продолжить движение и просушить тормозные колодки многократными непродолжительными нажатиями на педаль тормоза","Продолжить движение с малой скоростью без притормаживания"],"c":1,"tip":"Проведению такой операции некоторые водители не придают значения, что приводит к наезду на препятствия и т.п., так как эффективность «сырых тормозов» резко снижается, особенно, если тормозные механизмы барабанного типа. Выполните «просушку» тормозов непродолжительными нажатиями, предварительно переключившись на более низкую передачу.","img":null,"tp":[12],"p":[]},{"t":29,"n":20,"q":"Каковы первоначальные действия при оказании первой помощи в случае ранения, полученного в результате ДТП?","a":["Промыть рану водой, удалить инородные тела, внедрившиеся в рану, приложить стерильную вату, закрепив ее бинтовой повязкой","Надеть медицинские перчатки, рану промыть спиртовым раствором йода, смазать лечебной мазью и заклеить сплошным лейкопластырем","Надеть медицинские перчатки, рану не промывать, на рану наложить марлевую стерильную салфетку, закрепив ее лейкопластырем по краям или бинтовой повязкой"],"c":2,"tip":"Для избежания заражения инфекциями, передающимися от пострадавшего через кровь, во время оказания первой помощи первоначально необходимо надеть медицинские перчатки, рану не промывать, на нее наложить марлевую стерильную салфетку, закрепив ее лейкопластырем по краям или бинтовой повязкой. Заклеивать рану сплошным лейкопластырем (герметизировать) нельзя, т. к. это приведет к последующим осложнениям.","img":null,"tp":[16],"p":[]},{"t":30,"n":1,"q":"На каком рисунке изображен перекресток?","a":["Только на левом","Только на правом","На обоих"],"c":0,"tip":"Перекрёсток - место пересечения, примыкания или разветвления дорог на одном уровне. На левом рисунке изображён неравнозначный перекрёсток. Не считаются перекрёстками выезды с прилегающих территорий. Пример - правый рисунок.(Пункт 1.2 ПДД)","img":"i397.jpg","tp":[0],"p":["1.2"]},{"t":30,"n":2,"q":"Вам можно выполнить разворот:","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":1,"tip":"Действие знака 4.1.1 «Движение прямо» в случае установки его перед пересечением проезжих частей, распространяется только на первое пересечение за знаком. Вы можете выполнить разворот по траектории «Б».(«Дорожные знаки»)","img":"i49.jpg","tp":[1,4],"p":[]},{"t":30,"n":3,"q":"Разрешено ли Вам ставить автомобиль на стоянку в этом месте по нечетным числам месяца?","a":["Разрешено","Разрешено только после 21 часа","Запрещено"],"c":1,"tip":"Действие происходит в населённом пункте, на дороге, имеющей по одной полосе движения в каждом направлении, без трамвайных путей посередине. На такой дороге можно осуществлять остановку и стоянку не только с правой стороны дороги, но и с левой, если нет запрещающих знаков. В данной же ситуации применены одновременно знаки: с правой стороны 3.29 «Стоянка запрещена по нечётным числам месяца», с левой 3.30 «Стоянка запрещена по четным числам месяца». При парковке автомобиля в таком случае следует учесть, что с 21.00 до 24.00 данные знаки не действуют из-за перестановки транспорта. Следовательно, в данном месте автомобиль можно поставить с 21.00 нечётного числа до 24.00 чётного числа.Правильный ответ – второй.Разрешено только после 21.00.(«Дорожные знаки», пункт 12.1 ПДД)","img":"i398.jpg","tp":[1],"p":["12.1"]},{"t":30,"n":4,"q":"Какие из указанных знаков обозначают участки, на которых водитель обязан уступать дорогу пешеходам, находящимся на проезжей части?","a":["Только Б","Б и В","Все"],"c":1,"tip":"Знаки: «Б» - 5.19.2 «Пешеходный переход», «В» - 5.21 «Жилая зона» предоставляют преимущество пешеходам на проезжей части на обозначенных ими участках дорог, территориях. Предупреждающий знак «А» - 1.22 «Пешеходный переход» предупреждает о приближении к пешеходному переходу, обозначенному знаками 5.19.1, 5.19.2 и (или) разметкой 1.14.1 и 1.14.2. Устанавливается в Н.П. за 50-100 м, вне Н.П. за 150-300 м.(«Дорожные знаки»)","img":"i399.jpg","tp":[1],"p":[]},{"t":30,"n":5,"q":"Что обозначает разметка А 100, нанесенная на проезжую часть дороги?","a":["Расстояние до ближайшего перекрестка","Расстояние до ближайшего населенного пункта","Номер дороги"],"c":2,"tip":"«Горизонтальная разметка» 1.22 обозначает номер дороги.","img":"i400.jpg","tp":[2],"p":[]},{"t":30,"n":6,"q":"Вам можно продолжить движение:","a":["Только прямо","Прямо или направо","Только направо"],"c":1,"tip":"Регулировщик в данной ситуации использует типовой сигнал - руки опущены («Грудь, спина - стена»). Безрельсовым транспортным средствам разрешается движение со стороны правого и левого бока – прямо и направо (п. 6.10). Согласно разметки 1.18, организующей движение по полосам, вы можете только повернуть направо. Но правильным является ответ «Прямо и направо», ссылающийся на абзац п. 6.15 ПДД: «Водители и пешеходы должны выполнять требования сигналов и распоряжения регулировщика, даже если они противоречат сигналам светофора, требованиям дорожных знаков или разметки».","img":"i401.jpg","tp":[3],"p":[]},{"t":30,"n":7,"q":"Как следует действовать, выполняя поворот налево на двухполосной дороге?","a":["Приступить к маневру, одновременно включив указатели левого поворота","Включить указатели левого поворота, затем приступить к маневру","Убедиться в безопасности выполнения маневра, затем включить указатели левого поворота и приступить к маневру"],"c":2,"tip":"На любой дороге при повороте налево или развороте Вы, как требует пункт 8.1 ПДД, заблаговременно включаете левый сигнал поворота. Но т. к. в рассматриваемой ситуации по одной полосе в каждом направлении, может кто-то из водителей движущихся сзади Вас в попутном направлении, уже опередив Вас, подать сигнал и приступить к выполнению обгона. В этом случае уже Вы, согласно пункта 11.3 ПДД, своими действиями будете создавать ему препятствие, являясь неосознанным нарушителем ПДД. Поэтому на такой дороге, если движение в потоке, заблаговременно плавно снижайте скорость, при этом практически не производя торможения, чуть нажимая на педаль тормоза несколько раз включите стоп-сигналы; в это время убедитесь, что никто не совершает обгон, включите левый сигнал поворота и еще раз убедившись, что дальнейшие намерения о повороте налево или развороте понятны другим водителям, приступайте к выполнению маневра, учитывая встречное движение.(Пункты 8.1, 11.1 ПДД)","img":null,"tp":[4],"p":["11.1","8.1"]},{"t":30,"n":8,"q":"Вы намерены начать движение от тротуара. Должны ли Вы уступить дорогу мотоциклу, выполняющему разворот?","a":["Должны","Не должны, если Вы управляете маршрутным транспортным средством","Не должны"],"c":0,"tip":"Перед началом движения водитель обязан убедиться, что маневр будет безопасен и он не создаст помех другим участникам дорожного движения. (Пункт 8.1 ПДД). Согласно этому пункту Вы уступаете дорогу мотоциклисту, независимо от того каким ТС вы управляете.","img":"i402.jpg","tp":[4],"p":["8.1"]},{"t":30,"n":9,"q":"Разрешено ли водителю маломестного автобуса движение задним ходом для посадки пассажира в тоннеле?","a":["Разрешено","Разрешено, если при этом не будут созданы помехи другим участникам движения","Запрещено"],"c":2,"tip":"В тоннелях движение задним ходом запрещено. При этом, независимо от наличия освещения в тоннеле, на транспортном средстве должны быть включены осветительные приборы. Действия данного водителя следует расценивать как опасные.(Пункты 8.11, 8.12 ПДД)","img":"i403.jpg","tp":[4],"p":["8.11","8.12"]},{"t":30,"n":10,"q":"Разрешается ли Вам двигаться на грузовом автомобиле по этой полосе?","a":["Разрешается","Разрешается, если разрешенная максимальная масса автомобиля не более 7,5 т","Запрещается"],"c":0,"tip":"В населённых пунктах на дорогах, имеющих для движения в данном направлении три полосы и более (как в данном случае), ограничение на движение существует на крайнюю левую полосу. По остальным полосам можно двигаться независимо от разрешенной максимальной массы грузового автомобиля.(Пункт 9.4 ПДД)","img":"i404.jpg","tp":[13],"p":["9.4"]},{"t":30,"n":11,"q":"Разрешено ли выполнить обгон в тоннеле?","a":["Разрешено","Разрешено только при наличии искусственного освещения","Запрещено"],"c":2,"tip":"Обгон запрещён на мостах, путепроводах, эстакадах и под ними, а также в тоннелях.(Пункт 11.4 ПДД)","img":null,"tp":[6],"p":["11.4"]},{"t":30,"n":12,"q":"Водитель грузового автомобиля нарушил правила остановки:","a":["Остановившись на обочине","Остановившись перед дорожным знаком","Закрыв от других водителей дорожный знак"],"c":2,"tip":"Водитель грузовика нарушил пункт 12.4 ПДД, который запрещает остановку в местах, где транспортное средство закроет от других водителей сигналы светофора, дорожные знаки. В данном случае он закрыл видимость знака 3.27 «Остановка запрещена», зона действия которого начинается от места установки знака.(«Дорожные знаки»)","img":"i405.jpg","tp":[7],"p":[]},{"t":30,"n":13,"q":"В каком случае Вы обязаны уступить дорогу грузовому автомобилю?","a":["При повороте налево","При развороте","В обоих перечисленных случаях"],"c":2,"tip":"Перекрёсток регулируемый. Вам разрешено движение. При повороте налево, развороте следует уступить дорогу транспортным средствам, движущимся со встречного направления прямо и направо. Уступаете грузовику в обоих перечисленных случаях.(Пункты 13.3, 13.4 ПДД)","img":"i406.jpg","tp":[8],"p":["13.3","13.4"]},{"t":30,"n":14,"q":"Вы намерены продолжить движение прямо при желтом мигающем сигнале светофора. Ваши действия?","a":["Остановитесь и продолжите движение только после включения зеленого сигнала светофора","Уступите дорогу гужевой повозке","Проедете перекресток первым вместе со встречным автомобилем"],"c":1,"tip":"Перекрёсток при жёлтом мигающем светофоре является нерегулируемым, в данном случае равнозначным, так как знаков приоритета нет. Руководствуемся «правилом правой руки», т.е. у кого помеха справа, тот и уступает. У Вас помеха справа - проедете перекрёсток последним, уступив дорогу гужевой повозке.(Пункты 13.3, 13.11 ПДД)","img":"i407.jpg","tp":[8],"p":["13.11","13.3"]},{"t":30,"n":15,"q":"Вы намерены повернуть налево. Кому Вы обязаны уступить дорогу?","a":["Легковому автомобилю и автобусу","Только автобусу","Только мотоциклу","Никому"],"c":3,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Транспортные средства, находящиеся на главной дороге, имеют преимущество, между собой руководствуются «правилом правой руки». После их проезда, руководствуясь этим же правилом, проедут транспортные средства, находящиеся на второстепенной дороге. Вы проезжаете первым, никому не уступая. Мотоциклист - вторым, автобус - третьим, легковой автомобиль - последним.(Пункты 13.9, 13.1, 13.11 ПДД)","img":"i408.jpg","tp":[8],"p":["13.1","13.11","13.9"]},{"t":30,"n":16,"q":"В каком случае водитель транспортного средства, приближающегося к нерегулируемому пешеходному переходу, обязан уступить дорогу пешеходам?","a":["Если пешеходы переходят дорогу","Если пешеходы вступили на проезжую часть (трамвайные пути) для осуществления перехода","В обоих перечисленных случаях"],"c":2,"tip":"Водитель транспортного средства, приближающегося к нерегулируемому пешеходному переходу, обязан выполнять требования «уступить дорогу». Это требование нужно выполнить в обоих перечисленных случаях.(Пункт 14.1 ПДД)","img":null,"tp":[20],"p":["14.1"]},{"t":30,"n":17,"q":"Должны ли Вы переключить дальний свет на ближний, если водитель встречного транспортного средства периодическим переключением света фар покажет необходимость этого?","a":["Должны","Должны, только если расстояние до встречного транспортного средства менее 150 м","Не должны"],"c":0,"tip":"Периодическое переключение света фар - это своеобразная просьба к Вам водителя встречного автомобиля о переключении света на Вашем транспортном средстве во избежание ослепления.(Пункт 19.2 ПДД, «Техника управления автомобилем»)","img":null,"tp":[10],"p":["19.2"]},{"t":30,"n":18,"q":"Какое административное наказание может быть назначено водителю транспортного средства за оставление в нарушение Правил места дорожно-транспортного происшествия, участником которого он является?","a":["Только штраф в размере от 1000 до 1500 рублей","Штраф в размере от 1000 до 1500 рублей или лишение права управления транспортными средствами на срок от 1 года до 1,5 лет","Лишение права управления транспортными средствами на срок от 1 года до 1,5 лет или административный арест на срок до 15 суток"],"c":2,"tip":"Согласно ст. 12.27 ч.2 водитель ТС за оставление в нарушение Правил места дорожно-транспортного происшествия, участником которого он является привлекается к наказанию лишению права управления ТС на срок от 1 года до 1,5 лет или административному аресту на срок до 15 суток.«Кодекс РФ об административных правонарушениях»","img":null,"tp":[21],"p":[]},{"t":30,"n":19,"q":"Для предупреждения скатывания автомобиля с механической трансмиссией при кратковременной остановке на подъеме следует:","a":["Привести в действие стояночный тормоз","Включить первую передачу или передачу заднего хода","Перевести рычаг переключения передач в нейтральное положение"],"c":0,"tip":"При кратковременной остановке на подъеме, на автомобиле с механической трансмиссией следует привести в действие стояночный тормоз.","img":null,"tp":[12],"p":[]},{"t":30,"n":20,"q":"Зависит ли выбор бокового интервала от скорости движения?","a":["Выбор бокового интервала от скорости движения не зависит","При увеличении скорости движения боковой интервал необходимо увеличить","При увеличении скорости движения боковой интервал можно уменьшить"],"c":1,"tip":"Любое ТС конструктивно имеет «динамический коридор», т.е. его поперечное отклонение от прямолинейного движения. Особенно большой «коридор движения» у длинномерных ТС, составов ТС.С увеличением скорости движения необходимо увеличивать боковой интервал как с попутными так и встречными ТС.","img":null,"tp":[12],"p":[]},{"t":31,"n":1,"q":"К подкатегории «С1» относятся автомобили (за исключением транспортных средств категории «D»), разрешенная максимальная масса которых:","a":["Более 2,5 т, но не более 7,5 т","Более 3,5 т, но не более 7,5 т","Более 3,5 т, но не более 12 т"],"c":1,"tip":"Согласно ст. 25 Федерального закона «О безопасности дорожного движения», к подкатегории С1 относятся автомобили (за исключением ТС категории D), р.м.м. которых превышает 3,5 т, но не превышает 7,5 т.","img":null,"tp":[22],"p":[]},{"t":31,"n":2,"q":"Какие из указанных знаков информируют о приближении к началу участка дороги со встречным движением?","a":["Только А","А и Б","Все"],"c":0,"tip":"Только предупреждающий знак «А» - 1.21 «Двустороннее движение» - устанавливается перед проезжей частью со встречным движением, если ему предшествовал участок дороги с односторонним движением.Знак «Б» - 5.8 «Реверсивное движение» - информирует о начале участка дороги, на котором на одной или нескольких полосах направление движения может изменяться на противоположное.Знак «В» - 5.15.7 «Направление движения по полосам» - указывает организацию движения в обоих направлениях на трёхполосной дороге.(«Дорожные знаки»)","img":"i409.jpg","tp":[1],"p":[]},{"t":31,"n":3,"q":"Вам разрешено продолжить движение на грузовом автомобиле с разрешенной максимальной массой 12 т при фактической массе 8 т:","a":["Только в направлении В","В направлениях А и В","В направлениях Б и Г","В любом направлении"],"c":1,"tip":"Знаки 3.4 «Движение грузовых автомобилей запрещено» и 8.3.3 «Направление действия» запрещают движение грузовых автомобилей и составов ТС с разрешенной максимальной массой более 10 т по пересекаемой дороге. Вы можете проехать прямо или развернуться. Фактическая масса в данном случае значения не имеет.(«Дорожные знаки»)","img":"i410.jpg","tp":[1],"p":[]},{"t":31,"n":4,"q":"О чем информирует Вас данный дорожный знак с желтым фоном?","a":["Дальнейшее движение возможно только по второй полосе","Дальнейшее движение возможно только по проезжей части встречного направления","Дальнейшее движение возможно только по другой дороге"],"c":1,"tip":"Знак 6.19.1 «Предварительный указатель перестроения на другую проезжую часть» указывает направление объезда, закрытого для движения участка проезжей части на дороге с разделительной полосой. Жёлтый фон знака обозначает, что объезд временный.(«Дорожные знаки»)","img":"i411.jpg","tp":[1],"p":[]},{"t":31,"n":5,"q":"Разрешается ли Вам пересекать двойную сплошную линию горизонтальной разметки?","a":["Разрешается только при выезде из дворов и других прилегающих территорий","Разрешается только при обгоне","Разрешается только при интенсивном движении","Запрещается"],"c":3,"tip":"Двойную сплошную горизонтальную разметку 1.3, разделяющую транспортные потоки противоположных направлений, пересекать ЗАПРЕЩАЕТСЯ.(«Горизонтальная разметка»)","img":null,"tp":[2],"p":[]},{"t":31,"n":6,"q":"О чем информируют Вас стрелки на зеленом сигнале светофора?","a":["На этом перекрестке всегда запрещен поворот направо","Движение направо регулируется дополнительной секцией","На этом перекрестке разрешен поворот налево из двух полос"],"c":1,"tip":"Нанесённые на основной зелёный сигнал светофора чёрные контурные стрелки информируют водителей о наличии дополнительной секции светофора и указывают иные разрешённые направления движения, чем сигнал дополнительной секции.(Пункт 6.4 ПДД)","img":"i412.jpg","tp":[3],"p":["6.4"]},{"t":31,"n":7,"q":"Такой сигнал рукой, подаваемый водителем легкового автомобиля, информирует Вас:","a":["О его намерении начать движение","О его просьбе оказать помощь","Об имеющейся опасности за поворотом"],"c":0,"tip":"Вытянутая в сторону левая рука является сигналом левого поворота, который водитель обязан подать перед началом движения.(Пункт 8.1 ПДД)","img":"i413.jpg","tp":[4],"p":["8.1"]},{"t":31,"n":8,"q":"В каком направлении разрешено продолжить движение водителю грузового автомобиля?","a":["Только направо","Только по кругу","В любом направлении из перечисленных"],"c":2,"tip":"Въезд на перекрёсток с круговым движением как исключение можно производить с любой полосы данного направления (без предварительного перестроения). Выезд же с данного перекрёстка производится по общим правилам. Для поворота направо следует заблаговременно занять соответствующее крайнее положение на проезжей части. Совершая поворот, транспортное средство должно двигаться по возможности также ближе к правому краю проезжей части. Водитель грузового автомобиля может продолжить движение по кругу и, включив сигнал правого поворота, повернуть направо, т.е. продолжить движение в любом направлении из перечисленных. («Дорожные знаки», пункты 8.5, 8.6 ПДД)","img":"i414.jpg","tp":[4],"p":["8.5","8.6"]},{"t":31,"n":9,"q":"Вам можно продолжить движение на перекрестке:","a":["Только налево","Налево и в обратном направлении","В любом направлении"],"c":2,"tip":"На перекрёстках разворот не запрещён. В данной ситуации можете продолжить движение в любом направлении. (Пункт 8.11 ПДД)","img":"i415.jpg","tp":[4],"p":["8.11"]},{"t":31,"n":10,"q":"Движение в населенном пункте со скоростью более 60 км/ч разрешается:","a":["Только при выполнении обгона","Только если установлены дорожные знаки, разрешающие движение со скоростью более 60 км/ч","В обоих перечисленных случаях"],"c":1,"tip":"В населённых пунктах скорость движения ограничена: она не должна превышать 60 км/ч. Повышенная скорость может быть введена на отдельных участках дорог путём установки знаков 3.24 «Ограничение максимальной скорости». (Пункт 10.2 ПДД)","img":null,"tp":[5],"p":["10.2"]},{"t":31,"n":11,"q":"В данной ситуации преимущество имеет:","a":["Легковой автомобиль, так как он движется на подъем","Грузовой автомобиль, так как он движется на спуск","Грузовой автомобиль, так как препятствие находится на полосе движения легкового автомобиля"],"c":0,"tip":"При затруднённом встречном разъезде на уклонах, обозначенных соответствующими знаками 1.13 «Крутой спуск», 1.14 «Крутой подъём», уступить дорогу должен водитель транспортного средства, движущегося на спуск. В данной дорожной ситуации уступает водитель грузовика. Водитель легкового автомобиля имеет преимущество, т.к. он движется на подъем.(Пункт 11.7 ПДД)","img":"i416.jpg","tp":[6],"p":["11.7"]},{"t":31,"n":12,"q":"Можно ли Вам поставить автомобиль на стоянку в указанном месте?","a":["Можно","Можно только при видимости дороги не менее 100м","Нельзя"],"c":0,"tip":"При наличии съезда на обочину поставить автомобиль на стоянку можно и в местах с ограниченной видимостью.(Пункты 12.1, 12.4, 12.5 ПДД)","img":"i417.jpg","tp":[7],"p":["12.1","12.4","12.5"]},{"t":31,"n":13,"q":"Как Вам следует поступить при повороте налево?","a":["Остановиться у стоп-линии и дождаться сигнала регулировщика, разрешающего поворот","Выехав на перекресток, остановиться и дождаться сигнала регулировщика, разрешающего поворот","Повернуть, уступив дорогу встречному автомобилю"],"c":0,"tip":"Перекрёсток регулируемый. У регулировщика руки опущены. Движение со стороны правого и левого бока безрельсовым транспортным средствам разрешается прямо и направо. Вы же намереваетесь повернуть налево. Поэтому Вам необходимо остановиться перед стоп-линией и дождаться соответствующего Вашему намерению сигнала регулировщика, после чего выполнить маневр.(Пункты 6.10, 6.13, 13.3 ПДД, «Горизонтальная разметка» 1.12)","img":"i418.jpg","tp":[8],"p":["1.12","13.3","6.10","6.13"]},{"t":31,"n":14,"q":"Вы намерены проехать перекресток в прямом направлении. Ваши действия?","a":["Проедете перекресток вместе с трамваем, не уступая дорогу грузовому автомобилю","Проедете перекресток, уступив дорогу грузовому автомобилю"],"c":1,"tip":"Перекрёсток равнозначный. Трамвай на равнозначных перекрёстках имеет преимущество перед безрельсовыми транспортными средствами независимо от его дальнейшего направления движения. Безрельсовые транспортные средства руководствуются между собой «правилом правой руки», т.е. у кого помеха справа, тот и уступает дорогу. У Вас помеха справа - уступаете дорогу грузовику.(Пункт 13.11 ПДД)","img":"i419.jpg","tp":[8],"p":["13.11"]},{"t":31,"n":15,"q":"Кому Вы обязаны уступить дорогу при движении прямо?","a":["Только мотоциклу","Мотоциклу и легковому автомобилю","Автобусу и мотоциклу","Всем транспортным средствам"],"c":3,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Транспортные средства, находящиеся на главной дороге имеют преимущество, между собой руководствуются «правилом правой руки». После них, руководствуясь этим же правилом, проезжают перекрёсток транспортные средства, находящиеся на второстепенной дороге. Первым проедет мотоциклист, вторым - автобус, третьим - легковой автомобиль. Вы последним, уступив всем транспортным средствам.(Пункты 13.9, 13.10, 13.11 ПДД)","img":"i420.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":31,"n":16,"q":"Разрешено ли обучать вождению на этой дороге?","a":["Запрещено","Разрешено, только при движении по крайней правой полосе проезжей части","Разрешено"],"c":2,"tip":"Движение происходит согласно знаку 5.1 по автомагистрали. Учебная езда на ней не запрещена, т.е. разрешена.(«Дорожные знаки», пункт 16.1 ПДД).","img":"i421.jpg","tp":[18],"p":["16.1"]},{"t":31,"n":17,"q":"Можно ли использовать в светлое время суток противотуманные фары вместо ближнего света фар?","a":["Можно","Можно, кроме случаев движения в тоннелях и в условиях недостаточной видимости","Нельзя"],"c":1,"tip":"Разрешается в светлое время суток, кроме случаев движения в тоннелях и в условиях недостаточной видимости.(Пункты 19.4, 19.5 ПДД)","img":null,"tp":[10],"p":["19.4","19.5"]},{"t":31,"n":18,"q":"Разрешается ли устанавливать на одну ось грузового автомобиля шины с различными рисунками протектора?","a":["Разрешается","Разрешается только на заднюю ось","Запрещается"],"c":2,"tip":"Шины с различным рисунком протектора ведут себя по разному, вследствие неравномерности сцепления колес с дорогой. Следствием этой разницы может являться занос автомобиля как при движении по криволинейной траектории, так и при торможении.(«Основные положения», «Перечень неисправностей» п. 5.8)","img":null,"tp":[11],"p":[]},{"t":31,"n":19,"q":"В случае потери сцепления колес с дорогой из за образования «водяного клина» водителю следует:","a":["Увеличить скорость","Снизить скорость резким нажатием на педаль тормоза","Снизить скорость, применяя торможение двигателем"],"c":2,"tip":"Водяное скольжение - или так называемое аквапланирование - возникает при езде на легковом автомобиле при проливном дожде или при проезде скопления воды на дороге в низинах: осенью, весной или в оттепель.Зная об этом явлении, водитель не должен быть захвачен врасплох. Совет может быть только один - сразу же снизить скорость движения, применяя торможение двигателем.«Техника управления автомобилем»","img":null,"tp":[12],"p":[]},{"t":31,"n":20,"q":"Как влияет утомленное состояние водителя на его внимание и реакцию?","a":["Внимание ослабляется, время реакции уменьшается","Внимание ослабляется, время реакции увеличивается","Внимание и время реакции не изменяются"],"c":1,"tip":"Утомление, усталость бесспорно отражаются на безопасности движения. Внимание ослабляется, время реакции увеличивается. Хороший водитель должен делать паузы в движении, которые время от времени будут прерывать однообразие управления. Нескольких минут часто бывает достаточно, чтобы восстановить уровень внимания, необходимый для безопасного движения.(«Автошкола», А. И. Копусов-Долинин, издательство «ЭКСМО»)","img":null,"tp":[12],"p":[]},{"t":32,"n":1,"q":"По требованию каких лиц водители обязаны проходить освидетельствование на состояние алкогольного опьянения и медицинское освидетельствование на состояние опьянения?","a":["Всех регулировщиков","Должностных лиц, уполномоченных на осуществление федерального государственного контроля (надзора) в области безопасности дорожного движения","Любых сотрудников полиции"],"c":1,"tip":"Водитель обязан проходить освидетельствование на состояние алкогольного опьянения и медицинское освидетельствование на состояние опьянения по требованию должностных лиц, которым предоставлено право государственного надзора и контроля за безопасностью дорожного движения и эксплуатации транспортного средства.(Пункт 2.3.2 ПДД)","img":null,"tp":[22],"p":["2.3"]},{"t":32,"n":2,"q":"Какие из указанных знаков информируют о том, что на перекрестке необходимо уступить дорогу транспортным средствам, приближающимся слева?","a":["Только А","Только Б","А и Б","Все"],"c":1,"tip":"Порядок проезда транспортных средств на перекрёстках определяется знаками приоритета, обозначенными в данном случае «А» и «Б».Знак «А» - 2.3.3 «Примыкание второстепенной дороги» - информирует, что примыкающая дорога слева - второстепенная. Двигаясь по главной дороге, Вы имеете преимущество.Комбинация знаков «Б» - 2.4 «Уступите дорогу» с табличкой 8.13 «Направление главной дороги» информирует, что движущиеся транспортные средства, находящиеся на главной дороге слева и прямо со встречного направления, имеют преимущество. Вы обязаны уступить им дорогу.Знак «В» - 5.13.1 «Выезд на дорогу с полосой для маршрутных транспортных средств» - входит в группу знаков особых предписаний. Он не может регулировать очерёдность проезда транспортных средств.(«Дорожные знаки»)","img":"i422.jpg","tp":[1],"p":[]},{"t":32,"n":3,"q":"Разрешено ли Вам продолжить движение в прямом направлении на грузовом автомобиле с прицепом?","a":["Разрешено","Разрешено, если Вы обслуживаете предприятие, расположенное в обозначенной знаком зоне","Запрещено"],"c":1,"tip":"От действия знака 3.7 «Движение с прицепом запрещено» отступают те, кто проживает, работает или обслуживает предприятия, находящиеся в зоне действия знака.(«Дорожные знаки»)","img":"i423.jpg","tp":[1],"p":[]},{"t":32,"n":4,"q":"Вам разрешается движение:","a":["Только в направлении Б","В направлениях А и Б","В направлениях Б и В","В любом направлении из указанных"],"c":3,"tip":"Знак 5.7.2 «Выезд на дорогу с односторонним движением» запрещает поворот направо, т.е. встречное движение. Разрешённые направления движения на таком пересечении - прямо, налево (в направлении стрелки на знаке) и разворот. Можете продолжить движение в любом направлении из указанных. («Дорожные знаки»)","img":"i424.jpg","tp":[1],"p":[]},{"t":32,"n":5,"q":"О чем информирует Вас увеличение длины штриха прерывистой линии разметки?","a":["О начале зоны, где запрещены любые маневры","О начале опасного участка дороги","О приближении к сплошной линии разметки, разделяющей транспортные потоки попутных направлений"],"c":2,"tip":"Разметка 1.6 (линия приближения - прерывистая линия, у которой длина штрихов в три раза превышает промежутки между ними) предупреждает о приближении к сплошной линии 1.1 (может быть и 1.11), которая разделяет транспортные потоки, в данном случае, попутных направлений.(«Горизонтальная разметка»)","img":"i425.jpg","tp":[2],"p":[]},{"t":32,"n":6,"q":"Можно ли Вам перестроиться на соседнюю полосу?","a":["Можно","Можно, если грузовой автомобиль движется со скоростью 30 км/час","Нельзя"],"c":2,"tip":"Для выполнения маневра Вы вынуждены были бы выехать на полосу реверсивного движения. Красный сигнал реверсивного светофора запрещает движение по данной полосе.(Пункт 6.7 ПДД, «Горизонтальная разметка»)","img":"i426.jpg","tp":[3],"p":["6.7"]},{"t":32,"n":7,"q":"Обязаны ли Вы включить указатели правого поворота перед въездом на этот перекресток?","a":["Обязаны","Обязаны только при наличии движущихся сзади транспортных средств","Не обязаны"],"c":0,"tip":"При въезде на перекрёсток с круговым движением Вы совершаете поворот направо. Об этом Вы должны информировать других участников движения, для чего включаете правые указатели поворота.(Пункт 8.1 ПДД)","img":"i427.jpg","tp":[4],"p":["8.1"]},{"t":32,"n":8,"q":"Выезжая с прилегающей территории, необходимо уступить дорогу:","a":["Только маршрутным транспортным средствам","Всем механическим транспортным средствам","Транспортным средствам, лицам, использующим для передвижения средства индивидуальной мобильности и пешеходам"],"c":2,"tip":"При выезде на дорогу с прилегающей территории водитель должен уступить дорогу: транспортным средствам, лицам, использующим для передвижения средства индивидуальной мобильности и пешеходам. (Пункт 8.3 ПДД)","img":null,"tp":[4],"p":["8.3"]},{"t":32,"n":9,"q":"Разрешено ли выполнить разворот на участке дороги, обозначенном этим знаком?","a":["Разрешено","Разрешено только в населенном пункте","Разрешено только при видимости дороги не менее 100 м","Запрещено"],"c":3,"tip":"Совершив разворот на дороге, обозначенной знаком 5.5 «Дорога с односторонним движением», Вы осуществите встречное движение, что на данной дороге недопустимо.(«Дорожные знаки»)","img":"i428.jpg","tp":[4],"p":[]},{"t":32,"n":10,"q":"В каких случаях водителю запрещается движение вне населенных пунктов со скоростью более 60 км/ч?","a":["При перевозке людей в кузове грузового автомобиля","При организованной перевозке групп детей","Если такая максимальная скорость движения установлена при согласовании условий перевозки крупногабаритных, тяжеловесных или опасных грузов","Во всех перечисленных случаях"],"c":3,"tip":"Во всех перечисленных случаях водителю запрещается движение со скоростью более 60 км/ч.(Пункты 10.3, 10.4 ПДД)","img":null,"tp":[5],"p":["10.3","10.4"]},{"t":32,"n":11,"q":"Разрешается ли выполнить обгон на пешеходном переходе?","a":["Разрешается","Запрещается только при наличии на нем пешеходов","Запрещается"],"c":2,"tip":"На пешеходных переходах обгон запрещён. (Пункт 11.4 ПДД)","img":null,"tp":[6],"p":["11.4"]},{"t":32,"n":12,"q":"В каком месте Вам можно остановиться?","a":["Только В","А и В","Б и В","В любом из указанных"],"c":0,"tip":"Вне населённого пункта остановка, стоянка разрешается только на правой стороне дороги - на обочине, а при её отсутствии - у края проезжей части. Вы правильно поступите, если совершите остановку в месте «В».(Пункт 12.1 ПДД)","img":"i429.jpg","tp":[7],"p":["12.1"]},{"t":32,"n":13,"q":"Как Вам следует поступить при повороте налево?","a":["Проехать перекресток первым","Уступить дорогу только грузовому автомобилю с включенным проблесковым маячком","Уступить дорогу только автобусу"],"c":2,"tip":"Перекрёсток регулируемый. Знаки приоритета «не работают». Грузовик с «жёлтой мигалкой» стоит и дожидается разрешающего ему движение сигнала светофора, так как отступать от требований сигналов светофора жёлтый специальный сигнал не разрешает. Вы при повороте налево обязаны уступить дорогу транспортным средствам, движущимся прямо со встречного направления. Уступаете дорогу автобусу.(Пункты 3.4, 13.3, 13.4 ПДД)","img":"i430.jpg","tp":[8],"p":["13.3","13.4","3.4"]},{"t":32,"n":14,"q":"Вы намерены развернуться. Ваши действия?","a":["Развернетесь первым","Выедете на перекресток и, уступив дорогу легковому автомобилю, завершите разворот","Будете действовать по взаимной договоренности с водителем легкового автомобиля"],"c":1,"tip":"Перекрёсток равнозначный. При определении порядка проезда перекрёстка водители руководствуются «правилом правой руки». Во время разворота у Вас будет помеха справа, уступаете дорогу.(Пункт 13.11 ПДД)","img":"i431.jpg","tp":[8],"p":["13.11"]},{"t":32,"n":15,"q":"Кому Вы обязаны уступить дорогу при движении прямо?","a":["Только трамваю","Только легковому автомобилю","Трамваю и легковому автомобилю","Всем транспортным средствам"],"c":2,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Преимущество имеют транспортные средства, находящиеся на главной дороге, при этом безрельсовые транспортные средства между собой руководствуются «правилом правой руки», уступая трамваю, находящемуся с ними в равнозначных условиях. Вы уступаете дорогу трамваю и легковому автомобилю, которые проедут перекрёсток одновременно, так как их траектории движения не пересекаются. Мотоциклист уступает всем, потому что находится на второстепенной дороге.(«Дорожные знаки», пункты 13.9, 13.10, 13.11 ПДД)","img":"i432.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":32,"n":16,"q":"Разрешается ли движение по автомагистрали на транспортном средстве, скорость которого по техническому состоянию менее 40 км/ч?","a":["Разрешается","Разрешается только по крайней правой полосе","Запрещается"],"c":2,"tip":"На автомагистралях запрещается движение транспортных средств, скорость которых по технической характеристике или их состоянию менее 40 км/ч.(Пункт 16.1 ПДД)","img":null,"tp":[18],"p":["16.1"]},{"t":32,"n":17,"q":"Перевозка груза запрещена, если он:","a":["Выступает более чем на 1 м за габариты транспортного средства спереди или сзади и обозначен опознавательными знаками","Закрывает внешние световые приборы, световозвращатели, регистрационные и опознавательные знаки","Установлен на сиденье для пассажиров"],"c":1,"tip":"Согласно пункту 23.3 ПДД запрещается перевозка груза при условиях, перечисленных во втором ответе. При грузе, выступающем более чем на 1 м за габариты транспортного средства спереди или сзади, перевозка не запрещается. Но в этом случае груз должен быть обозначен опознавательным знаком «Крупногабаритное транспортное средство», а в тёмное время суток и в условиях недостаточной видимости осветительными приборами.(Пункт 23.4 ПДД)","img":null,"tp":[23],"p":["23.4"]},{"t":32,"n":18,"q":"Разрешено ли движение транспортного средства до места ремонта или стоянки в темное время суток с негорящими (из-за неисправности) фарами и задними габаритными огнями?","a":["Разрешено","Разрешено только на дорогах с искусственным освещением","Запрещено"],"c":2,"tip":"При указанной неисправности в тёмное время суток или в условиях недостаточной видимости запрещается движение и к месту ремонта, и к месту стоянки, однозначно, независимо от наличия освещённости дороги.(Пункт 2.3.1 ПДД)","img":null,"tp":[11],"p":["2.3"]},{"t":32,"n":19,"q":"При повороте налево обеспечение безопасности движения достигается путем выполнения поворота по траектории, которая показана:","a":["На левом рисунке","На правом рисунке","На обоих рисунках"],"c":0,"tip":"Если параметры (масса и скорость) движущихся автомобилей на обоих рисунках одинаковы, то центробежная сила, стремящаяся занести автомобиль, теоретически меньше на правом рисунке, т.к. траектория движения проходит по большему радиусу кривизны. Но у водителя при этом отсутствует запас (выходит из поворота у самого края проезжей части), а все факторы, влияющие на автомобиль, не всегда удаётся учесть. Предпочтительнее траектория движения, изображённая на левом рисунке, т.к. она более безопасна. В данной ситуации водитель до вхождения в поворот занял правильное расположение ТС на проезжей части, расположив его у внешней его границы. Во время движения по криволинейной траектории у него в этом случае всегда существует запас по ширине проезжей части. Водителю очень важно приучить себя обязательно до вхождения в поворот снижать скорость не менее чем на одну треть, чтобы в последующем это происходило автоматически.(«Техника управления автомобилем»)","img":"i433.jpg","tp":[12],"p":[]},{"t":32,"n":20,"q":"Как обеспечить восстановление проходимости дыхательных путей пострадавшего при подготовке его к проведению сердечно-легочной реанимации?","a":["Уложить пострадавшего на спину на твердую поверхность, запрокинуть ему голову, положить одну руку на лоб, приподняв подбородок двумя пальцами другой руки","Уложить пострадавшего на бок, наклонить его голову к груди. При наличии слизи и рвотных масс очистить от них ротовую полость.","Уложить пострадавшего на спину и, не запрокидывая ему голову, сжать щеки, чтобы раздвинуть губы и раскрыть рот. При наличии слизи и рвотных масс очистить от них ротовую полость."],"c":0,"tip":"Первоначально у пострадавшего в данной ситуации надо очистить ротовую полость от слизи и рвотных масс, далее согласно правильного ответа, уложить пострадавшего на спину на твердую поверхность, запрокинуть ему голову, положить одну руку на лоб, приподняв подбородок двумя пальцами другой руки.","img":null,"tp":[16],"p":[]},{"t":33,"n":1,"q":"Какой маневр намеревается выполнить водитель маломестного автобуса?","a":["Обгон","Перестроение с дальнейшим опережением","Объезд"],"c":1,"tip":"Водитель маломестного автобуса осуществляет «перестроение» в параллельный ряд и дальнейшее «опережение» - движение транспортного средства со скоростью большей скорости попутного транспортного средства.(Пункт 1.2 ПДД термины «Перестроение», «Опережение»)","img":"i434.jpg","tp":[0],"p":["1.2"]},{"t":33,"n":2,"q":"Этот знак:","a":["Показывает направления движения на перекрестке","Указывает, что на пересекаемой дороге движение осуществляется по двум полосам","Запрещает разворот на перекрестке"],"c":0,"tip":"Предупреждающий знак 1.34.3 «Направление поворота» указывает направления движения на Т-образном перекрёстке.(«Дорожные знаки»)","img":"i435.jpg","tp":[1],"p":[]},{"t":33,"n":3,"q":"Действие данных знаков распространяется:","a":["Только на грузовые автомобили с разрешенной максимальной массой более 3,5 т","На все грузовые автомобили","На все грузовые автомобили и автобусы"],"c":0,"tip":"Табличка 8.4.1 «Вид транспортного средства» распространяет действие знака на грузовые автомобили, в том числе с прицепом, с разрешённой максимальной массой более 3,5 т.(«Дорожные знаки»)","img":"i436.jpg","tp":[1],"p":[]},{"t":33,"n":4,"q":"Какой из знаков указывает протяженность зоны для разворота?","a":["Только А","Только Б","А и Б"],"c":1,"tip":"Знак «Б» - 6.3.2 «Зона для разворота» применяется для обозначения места на участке дороги, разрешающего разворот, и его протяжённость. В данном случае протяжённость зоны для разворота - не более 15 м.Комбинация знаков «А» - 6.3.1 «Место для разворота» и табличка 8.1.1 «Расстояние до объекта» указывают, что через 50 м от установки знаков по ходу движения будет находиться место, предназначенное только для выполнения разворота. Протяжённость зоны разворота в данной ситуации не оговаривается.(«Дорожные знаки»)","img":"i437.jpg","tp":[1],"p":[]},{"t":33,"n":5,"q":"Данная разметка обозначает:","a":["Участок дороги, где запрещено движение у тротуара","Места, где запрещена любая остановка","Места остановки маршрутных транспортных средств и стоянки такси"],"c":2,"tip":"Жёлтой зигзагообразной разметкой 1.17.1 обозначают места остановки маршрутных транспортных средств и стоянки такси.(«Горизонтальная разметка»)","img":"i438.jpg","tp":[2],"p":[]},{"t":33,"n":6,"q":"В каких случаях необходимо уступить дорогу транспортному средству, имеющему нанесенные на наружные поверхности специальные цветографические схемы?","a":["Если его водитель включил проблесковый маячок синего цвета и специальный звуковой сигнал","Если его водитель включил проблесковый маячок синего цвета","Во всех случаях"],"c":0,"tip":"Для получения преимущества «оперативник» должен включить проблесковый маячок синего цвета и специальный звуковой сигнал.(Пункт 3.1 ПДД)","img":null,"tp":[17],"p":["3.1"]},{"t":33,"n":7,"q":"Дает ли преимущество в движении подача сигнала указателями поворота?","a":["Дает преимущество","Дает преимущество только при завершении обгона","Не дает преимущества"],"c":2,"tip":"Подача сигнала указателями поворота не дает водителю преимущества и не освобождает его от принятия мер предосторожности.(Пункт 8.2 ПДД)","img":null,"tp":[4],"p":["8.2"]},{"t":33,"n":8,"q":"Разрешается ли Вам выполнить поворот направо по указанной траектории в данной ситуации?","a":["Разрешается","Запрещается"],"c":0,"tip":"При повороте направо транспортное средство должно двигаться по возможности ближе к правому краю проезжей части, т.е. по крайней правой полосе. В данном случае у Вас такой возможности нет по причине остановки на этой полосе легкового автомобиля. Продолжаете движение по указанной траектории. (Пункт 8.6 ПДД)","img":"i439.jpg","tp":[4],"p":["8.6"]},{"t":33,"n":9,"q":"Можно ли Вам выполнить разворот?","a":["Можно","Можно только по траектории А","Можно только по траектории Б","Нельзя"],"c":3,"tip":"Вы находитесь на дороге с односторонним движением, по которой встречное движение запрещено. По указанным траекториям продолжать движение нельзя.(«Дорожные знаки» 5.6, 1.21)","img":"i440.jpg","tp":[4],"p":[]},{"t":33,"n":10,"q":"В каких случаях на дорогах с двусторонним движением запрещается движение по полосе, предназначенной для встречного движения?","a":["Если она отделена трамвайными путями","Если она отделена разделительной полосой","Если она отделена разделительной разметкой 1.1 или 1.3, либо разметкой 1.11, прерывистая линия которой расположена слева","Во всех перечисленных случаях"],"c":3,"tip":"На любых дорогах с двусторонним движением запрещается движение по полосе, предназначенной для встречного движения, если она отделена трамвайными путями, разделительной полосой, разметкой 1.1, разметкой 1.3 или разметкой 1.11, прерывистая линия которой расположена слева.(Пункт 9.1(1) ПДД)Изменения ПДД от 12 июля 2017.","img":null,"tp":[13],"p":[]},{"t":33,"n":11,"q":"Разрешается ли Вам обогнать грузовой автомобиль в конце подъема?","a":["Разрешается","Разрешается, если скорость грузового автомобиля не более 30 км/ч","Запрещается"],"c":2,"tip":"Перелом дороги ограничивает видимость в конце подъёма. Поэтому обгон запрещён.(Пункт 11.4 ПДД)Не забываем главное условие обгона - «Путь, необходимый для обгона, никогда не должен превышать половины видимого отрезка пути».","img":"i441.jpg","tp":[6],"p":["11.4"]},{"t":33,"n":12,"q":"Разрешено ли Вам поставить автомобиль на стоянку в этом месте при наличии узкой обочины?","a":["Разрешено","Разрешено только в светлое время суток","Запрещено"],"c":2,"tip":"Стоянка вне населённых пунктов на проезжей части дорог, обозначенных знаком 2.1 «Главная дорога», запрещается.(Пункт 12.5 ПДД)","img":"i442.jpg","tp":[7],"p":["12.5"]},{"t":33,"n":13,"q":"Как Вам следует поступить при повороте направо?","a":["Проехать перекресток первым","Уступить дорогу только трамваю А","Уступить дорогу только трамваю Б","Уступить дорогу обоим трамваям"],"c":3,"tip":"Для поворота направо Вы должны пересечь трамвайные пути. Оба трамвая так же, как и Вы, имеют право на движение, они двигаются «по рукам регулировщика». Вы им уступаете, так как при одновременном праве на движение трамвай имеет преимущество перед безрельсовыми транспортными средствами.(Пункты 6.10, 13.6 ПДД)","img":"i443.jpg","tp":[8],"p":["13.6","6.10"]},{"t":33,"n":14,"q":"Вы намерены повернуть налево. Ваши действия?","a":["Проедете перекресток первым","Выедете на перекресток первым и, уступив дорогу мотоциклу, завершите поворот","Уступите дорогу обоим транспортным средствам"],"c":1,"tip":"Перекрёсток равнозначный. Водители между собой руководствуются «правилом правой руки». Первым начинаете движение Вы, поскольку в первоначальный момент не имеете помехи справа. Выкатившись на перекрёсток, перед самым поворотом налево останавливаетесь. После этого по траектории движения легкового автомобиля будет отсутствовать помеха справа - проезжает через перекрёсток первым, мотоциклист - вторым, Вы - последним.(Пункт 13.11 ПДД)","img":"i444.jpg","tp":[8],"p":["13.11"]},{"t":33,"n":15,"q":"Вы обязаны уступить дорогу при движении прямо:","a":["Только легковому автомобилю","Только грузовому автомобилю","Обоим транспортным средствам"],"c":2,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Преимущество имеют транспортные средства, находящиеся на главной дороге, которые между собой руководствуются «правилом правой руки». Вы находитесь на второстепенной дороге, уступаете дорогу обоим транспортным средствам.(«Дорожные знаки» 2.4, 8.13; пункты 13.9, 13.10, 13.11 ПДД)","img":"i445.jpg","tp":[8],"p":["13.10","13.11","13.9","2.4","8.13"]},{"t":33,"n":16,"q":"Кто из водителей нарушает Правила?","a":["Водители мопеда и грузового автомобиля с разрешенной максимальной массой более 3,5 т","Только водитель грузового автомобиля","Никто не нарушает"],"c":0,"tip":"Движение по автомагистрали на мопедах запрещено. Запрещается и движение грузовым автомобилям с р.м.м более 2,5 т по любой дороге, имеющей три полосы движения в данном направлении по крайней левой полосе. Нарушают правила водители грузового автомобиля и мопеда.(Пункты 9.4, 16.1 ПДД)","img":"i446.jpg","tp":[18,13],"p":["16.1","9.4"]},{"t":33,"n":17,"q":"При ослеплении дальним светом фар встречных или движущихся попутно транспортных средств водитель должен:","a":["Принять вправо к краю проезжей части и остановиться","Включить аварийную сигнализацию и, не меняя полосы движения, снизить скорость и остановиться","Подавая звуковой сигнал, остановиться"],"c":1,"tip":"Постарайтесь выполнить действия в той последовательности, которая оговорена Правилами, - включить аварийную сигнализацию и, не меняя полосы движения, снизить скорость и остановиться.(Пункт 19.2 ПДД)","img":null,"tp":[10],"p":["19.2"]},{"t":33,"n":18,"q":"Какие виды административных наказаний могут применяться к водителям за нарушения Правил?","a":["Только предупреждение или штраф","Предупреждение, штраф, лишение права управления транспортными средствами, административный арест","Предупреждение, штраф, лишение права управления транспортными средствами, конфискация орудия совершения или предмета административного правонарушения, административный арест, обязательные работы"],"c":2,"tip":"Согласно главы 12 КоАП к водителям за нарушение ПДД могут применяться все виды наказаний, перечисленные в ответах. Правильный ответ - самый полный.«Кодекс РФ об административных правонарушениях»","img":null,"tp":[21],"p":[]},{"t":33,"n":19,"q":"Какие действия водителя приведут к уменьшению центробежной силы, возникающей на повороте?","a":["Увеличение скорости движения","Снижение скорости движения","Уменьшение радиуса прохождения поворота"],"c":1,"tip":"Самой результативной величиной, влияющей на центробежную силу, является скорость. Она пропорциональна квадрату скорости. В то же время, скорость определяется водителем. Её уменьшение приводит к уменьшению центробежной силы. Вот почему до вхождения в поворот рекомендуется снижение скорости движения.(«Техника управления автомобилем»)","img":null,"tp":[12],"p":[]},{"t":33,"n":20,"q":"Как влияет алкоголь на время реакции водителя?","a":["Время реакции уменьшается","Алкоголь на время реакции не влияет","Время реакции увеличивается"],"c":2,"tip":"Водителю за рулём требуется не только реакция, которая при употреблении алкоголя увеличивается. Самое главное - это постоянная оценка событий и прогнозирование их развития. Под воздействием алкоголя мозг даёт неправильные оценки, в этом и заключается главная опасность управления транспортным средством в состоянии алкогольного опьянения.«Транспортная психология».","img":null,"tp":[12],"p":[]},{"t":34,"n":1,"q":"Главная дорога показана:","a":["Только на левом верхнем рисунке","Только на правом верхнем рисунке","На обоих верхних рисунках","На всех рисунках"],"c":2,"tip":"На левом верхнем рисунке главная дорога обозначена знаком 5.1 «Автомагистраль». На правом верхнем рисунке - знаком 2.3.2 «Примыкание второстепенной дороги».(«Дорожные знаки»)","img":"i447.jpg","tp":[0],"p":[]},{"t":34,"n":2,"q":"На каком расстоянии до скользкого участка дороги устанавливается данный знак в населенном пункте?","a":["150 – 300 м","50 – 100 м","Непосредственно перед началом скользкого участка"],"c":1,"tip":"В населённом пункте большинство предупреждающих знаков устанавливается на расстоянии 50-100 м до опасного участка. На таком расстоянии устанавливается и знак 1.15 «Скользкая дорога».(«Дорожные знаки»)","img":"i448.jpg","tp":[1],"p":[]},{"t":34,"n":3,"q":"Этот знак запрещает движение транспортных средств:","a":["Разрешенная максимальная масса которых более 6 т","Фактическая масса которых более 6 т","Фактическая масса которых, приходящаяся на какую либо ось, более 6 т"],"c":2,"tip":"Знак 3.12 «Ограничение массы, приходящейся на ось транспортного средства» запрещает движение транспортных средств, у которых нагрузка (фактическая) на любую из осей больше указанной на знаке.(«Дорожные знаки»)","img":"i449.jpg","tp":[1],"p":[]},{"t":34,"n":4,"q":"Какие из указанных знаков используются для обозначения кемпинга?","a":["Только А","Только Б","Только В","Б и В"],"c":1,"tip":"Знаки сервиса информируют о расположении соответствующих объектов.Обозначенные знаки: «Б» - 7.10 «Кемпинг»; «А» - 7.9 «Гостиница или мотель»; «В» - 7.11 «Место отдыха».(«Дорожные знаки»)","img":"i450.jpg","tp":[1],"p":[]},{"t":34,"n":5,"q":"Если Вы управляете маломестным автобусом, то в случае выключения реверсивных светофоров следует:","a":["Немедленно перестроиться вправо на соседнюю полосу","Продолжить движение по полосе только до перекрестка","При отсутствии встречных транспортных средств продолжить движение по полосе"],"c":0,"tip":"При выключенных сигналах реверсивного светофора, который расположен над полосой, обозначенной с обеих сторон разметкой 1.9, въезд на эту полосу запрещён. Вам необходимо перестроиться на правую полосу.(Пункт 6.7 ПДД, «Горизонтальная разметка»)","img":"i451.jpg","tp":[2],"p":["6.7"]},{"t":34,"n":6,"q":"Вам разрешено продолжить движение:","a":["Только налево","Только в обратном направлении","Налево и в обратном направлении"],"c":2,"tip":"И горящая стрелка дополнительной секции светофора, и знак 5.15.1 «Направления движения по полосам», и разметка разрешают Вам из крайней левой полосы совершить поворот налево и разворот для движения в обратном направлении.(«Дорожные знаки», пункт 6.3 ПДД)","img":"i452.jpg","tp":[3],"p":["6.3"]},{"t":34,"n":7,"q":"Как необходимо обозначить буксируемый автомобиль при отсутствии или неисправности аварийной сигнализации?","a":["Установить на задней части буксируемого автомобиля знак аварийной остановки","Включить габаритные огни","Включить задний противотуманный фонарь"],"c":0,"tip":"При отсутствии или неисправности аварийной сигнализации на буксируемом механическом транспортном средстве на его задней части должен быть закреплен знак аварийной остановки.(Пункт 7.3 ПДД)","img":null,"tp":[25],"p":["7.3"]},{"t":34,"n":8,"q":"Можно ли водителю автомобиля в данной ситуации начать движение от тротуара?","a":["Можно","Можно, если при этом не будут созданы помехи грузовому автомобилю, движущемуся по левой полосе","Нельзя"],"c":1,"tip":"Водитель автомобиля, находящегося на крайней правой полосе может начать движение, если не создаст помех грузовому автомобилю, движущемуся по левой полосе.(Пункт 8.1 ПДД)","img":"i453.jpg","tp":[4],"p":["8.1"]},{"t":34,"n":9,"q":"Водитель случайно проехал нужный въезд во двор. Разрешается ли ему в этой ситуации использовать задний ход, чтобы затем повернуть направо?","a":["Разрешается","Разрешается, если при этом не будут созданы помехи движению маршрутных транспортных средств","Запрещается"],"c":2,"tip":"Движение задним ходом запрещается в местах расположения остановочных пунктов. Такой маневр Вам в данной ситуации запрещается, так как Вы его собираетесь произвести в месте остановок маршрутных транспортных средств, о котором информирует знак 5.16 «Место остановки автобуса и троллейбуса», а также зигзагообразная разметка жёлтого цвета 1.17.1.(Пункты 8.11, 8.12 ПДД)","img":"i454.jpg","tp":[4],"p":["8.11","8.12"]},{"t":34,"n":10,"q":"Количество полос для движения на проезжей части определяется:","a":["Только разметкой","Только соответствующими знаками","Разметкой или знаками, а если их нет, то самим водителем"],"c":2,"tip":"Количество полос движения для безрельсовых транспортных средств определяется знаками, разметкой, а если их нет, мысленно самим водителем, с учетом ширины проезжей части, габаритов транспортных средств и необходимых интервалов между ними.(Пункт 9.1 ПДД)","img":null,"tp":[13],"p":["9.1"]},{"t":34,"n":11,"q":"Можно ли Вам продолжить движение по средней полосе после опережения автомобиля, движущегося по правой полосе?","a":["Можно","Можно только при отсутствии встречного транспорта","Нельзя"],"c":2,"tip":"Средняя полоса в данной ситуации используется для движения в обоих направлениях. Она предназначена только для обгона, объезда, поворота налево или разворота. Закончив обгон, необходимо перестроиться на крайнюю правую полосу. (Пункт 9.3 ПДД). Дальнейшее движение Вы осуществляете согласно пункту 9.4 ПДД. «Вне населённых пунктов водители транспортных средств должны вести их по возможности ближе к правому краю проезжей части». У Вас такая возможность есть.","img":"i455.jpg","tp":[6,13],"p":["9.3"]},{"t":34,"n":12,"q":"Можно ли Вам остановиться на грузовом автомобиле с разрешенной максимальной массой более 3,5 т в этом месте?","a":["Можно","Можно только для загрузки или разгрузки","Нельзя"],"c":0,"tip":"В населённом пункте, на дороге, имеющей по одной полосе движения в каждом направлении, без трамвайных путей посередине, разрешается остановка, стоянка по ходу движения и с левой стороны дороги. Это правило распространяется на все транспортные средства, без каких-либо ограничений. (Пункт 12.1 ПДД)","img":"i456.jpg","tp":[7],"p":["12.1"]},{"t":34,"n":13,"q":"Как Вам следует поступить при движении в прямом направлении?","a":["Проехать перекресток первым","Уступить дорогу трамваю","Дождаться другого сигнала регулировщика"],"c":0,"tip":"Перекрёсток регулируемый. Трамваи двигаются только «по направлению рук регулировщика», т.е. прямо. Водителю трамвая поворот направо запрещён. Соответственно он стоит и дожидается смены сигнала регулировщика. Вам можно продолжить движение прямо или направо. Проезжаете перекрёсток первым. (Пункт 6.10 ПДД)","img":"i457.jpg","tp":[8],"p":["6.10"]},{"t":34,"n":14,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Только мотоциклу","Только легковому автомобилю","Никому"],"c":1,"tip":"Перекрёсток равнозначный. Водители руководствуются «правилом правой руки». У вас помехой справа является только автомобиль, поэтому вы обязаны ему уступить дорогу.(Пункт 13.11 ПДД)","img":"i458.jpg","tp":[8],"p":["13.11"]},{"t":34,"n":15,"q":"Вы намерены повернуть налево. Ваши действия?","a":["Уступите дорогу обоим транспортным средствам","Уступите дорогу только легковому автомобилю","Уступите дорогу только автобусу"],"c":0,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Преимущество имеют транспортные средства, находящиеся на главной дороге, которые между собой руководствуются «правилом правой руки». После их проезда, проезжают транспортные средства, находящиеся на второстепенной дороге. Вы находитесь на второстепенной дороге. Уступаете обоим транспортным средствам.(Пункты 13.9, 13.10, 13.11 ПДД)","img":"i459.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":34,"n":16,"q":"Сигналом остановки для машиниста поезда служит следующее расположение руки или рук (днем с лоскутом яркой материи либо каким-нибудь хорошо видимым предметом, ночью — с факелом или фонарем):","a":["Вытянутые в стороны руки","Круговое движение руки","Поднятая вверх правая рука","Поднятые вверх обе руки"],"c":1,"tip":"Сигналом остановки для машиниста поезда служит круговое движение руки (днём с лоскутом яркой материи или каким-либо хорошо видимым предметом, ночью - с факелом или фонарем). (Пункт 15.5 ПДД. Примечание)","img":null,"tp":[14],"p":["15.5"]},{"t":34,"n":17,"q":"В тоннеле с искусственным освещением должны быть включены:","a":["Фары ближнего света или габаритные огни","Фары ближнего света или дневные ходовые огни","Фары ближнего или дальнего света"],"c":2,"tip":"Независимо от освещённости тоннеля при въезде в него должен быть включен дальний или ближний свет фар.(Пункт 19.1 ПДД)","img":null,"tp":[10],"p":["19.1"]},{"t":34,"n":18,"q":"Уголовная ответственность предусмотрена за управление транспортным средством, не повлекшее причинение тяжкого вреда здоровью или смерть человека, лицом, находящимся в состоянии опьянения, если оно ранее было подвергнуто административному наказанию:","a":["За управление транспортным средством в состоянии опьянения","За невыполнение законного требования уполномоченного должностного лица о прохождении медицинского освидетельствования на состояние опьянения","За совершение любого из перечисленных правонарушений"],"c":2,"tip":"Согласно статьи 264.1 Уголовного кодекса уголовная ответственность предусмотрена в данной ситуации - за совершение любого из перечисленных правонарушений.","img":null,"tp":[21],"p":[]},{"t":34,"n":19,"q":"При движении по двухполосной дороге за грузовым автомобилем у Вас появилась возможность совершить обгон. Ваши действия?","a":["Максимально приблизитесь к обгоняемому автомобилю, затем перестроитесь на полосу встречного движения и завершите маневр","Перестроитесь на полосу встречного движения, после чего произведете сближение с обгоняемым транспортным средством и завершите маневр","Допустимы оба варианта действий"],"c":1,"tip":"Движущийся впереди большегрузный грузовой автомобиль - это «движущаяся стена», ограничивающая обзорность. Только на дистанции можно просматривать достаточное для обгона расстояние, своевременно информировать и быть замеченным обгоняемым. При необходимости своевременно прекратить обгон и вернуться на свою полосу.(«Техника управления автомобилем»)","img":"i460.jpg","tp":[12],"p":[]},{"t":34,"n":20,"q":"Каким образом проводится сердечно-легочная реанимация пострадавшего?","a":["Искусственное дыхание и давление руками на грудину пострадавшего: вначале 1 вдох методом «Рот ко рту», затем 15 надавливаний на грудину","Давление руками на грудину пострадавшего и искусственное дыхание: вначале 15 надавливаний на грудину, затем 1 вдох методом «Рот ко рту»","Давление руками на грудину пострадавшего и искусственное дыхание: вначале 30 надавливаний на грудину, затем 2 вдоха методом «Рот ко рту»"],"c":2,"tip":"Сердечно-легочная реанимация проводится методом давления руками на грудину пострадавшего и искусственной вентиляции легких вначале 30 надавливаний на грудину, затем 2 вдоха методом «Рот ко рту».В правильном ответе сумма действий равна «32».","img":null,"tp":[16],"p":[]},{"t":35,"n":1,"q":"Что означает термин «Недостаточная видимость»?","a":["Видимость дороги менее 100 м вблизи опасных поворотов и переломов продольного профиля дороги","Видимость дороги менее 150 м в ночное время суток","Видимость дороги менее 300 м в условиях тумана, дождя, снегопада и т. п., а также в сумерки."],"c":2,"tip":"«Недостаточная видимость» - видимость дороги менее 300м в условиях тумана, дождя, снегопада и тому подобного, а также в сумерки.Пункт 1.2 термин «Недостаточная видимость».","img":null,"tp":[0],"p":[]},{"t":35,"n":2,"q":"Вы можете продолжить движение на следующем перекрестке:","a":["Только в направлении Б","В направлениях А и Б","В любом направлении из указанных"],"c":2,"tip":"В данном случае знак 4.1.1 «Движение прямо» установлен за пересечением проезжих частей, т.е. в начале участка дороги. Действие знака в такой ситуации распространяется до ближайшего перекрёстка. Поэтому Вы можете продолжать движение во всех указанных направлениях.(«Дорожные знаки»)","img":"i461.jpg","tp":[1],"p":[]},{"t":35,"n":3,"q":"Какие из указанных знаков разрешают движение со скоростью 60 км/ч?","a":["Только Б","Б и В","Все"],"c":1,"tip":"Знаки: «Б» - 4.6 «Ограничение минимальной скорости», «В» - 6.2 «Рекомендуемая скорость».(«Дорожные знаки»)","img":"i462.jpg","tp":[1],"p":[]},{"t":35,"n":4,"q":"Кто из водителей нарушил правила стоянки?","a":["Водители мотоцикла и грузового автомобиля","Только водитель грузового автомобиля","Никто не нарушил"],"c":1,"tip":"Водителям грузовых автомобилей при наличии знака 6.4 «Парковка (парковочное место)» с любой из табличек 8.6.2, 8.6.3 и 8.6.6-8.6.9 «Способ постановки транспортных средств» стоять в зоне действия комбинации этих знаков нельзя. («Дорожные знаки»).Водители легкового автомобиля и мотоцикла согласно знаку 6.4 «Парковка (парковочное место)» и таблички 8.6.3 абсолютно верно выполнили требования Правил.(Пункт 12.2 ПДД)","img":"i463.jpg","tp":[1,7],"p":["12.2"]},{"t":35,"n":5,"q":"Вы можете объехать препятствие:","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":0,"tip":"Знаки имеют приоритет над разметкой. Поэтому согласно знаку 4.2.2 «Объезд препятствия слева» Вы должны продолжить движение по траектории «А».(«Дорожные знаки», «Горизонтальная разметка»)","img":"i464.jpg","tp":[2],"p":[]},{"t":35,"n":6,"q":"Что означает сочетание красного и желтого сигналов светофора?","a":["Неисправна светофорная сигнализация","Вскоре будет включен зеленый сигнал","Вскоре будет включен красный сигнал"],"c":1,"tip":"Сочетание красного и жёлтого сигналов светофора запрещает движение и информирует о предстоящем включении зелёного сигнала.(Пункт 6.2 ПДД)","img":null,"tp":[3],"p":["6.2"]},{"t":35,"n":7,"q":"На каком расстоянии от транспортного средства должен быть выставлен знак аварийной остановки в данной ситуации?","a":["Не менее 15 м","Не менее 20 м","Не менее 30 м"],"c":2,"tip":"Действие происходит вне населённого пункта, поэтому расстояние, на котором устанавливается знак аварийной остановки, больше, чем в населённом пункте. Устанавливаете знак по обстановке, но это расстояние должно быть не менее 30 м.(Пункт 7.2 ПДД)","img":"i465.jpg","tp":[25],"p":["7.2"]},{"t":35,"n":8,"q":"Кому Вы должны уступить дорогу при повороте во двор?","a":["Только встречному автомобилю","Встречному автомобилю и пешеходам","Никому"],"c":1,"tip":"При повороте налево вне перекрестка водитель безрельсового ТС обязан уступить дорогу встречным ТС и пешеходам, путь движения которых он пересекает. (Пункты 8.3, 8.8 ПДД)","img":"i466.jpg","tp":[4],"p":["8.3","8.8"]},{"t":35,"n":9,"q":"Для обеспечения безопасности при выезде задним ходом с места стоянки, имеющего ограниченную видимость, необходимо:","a":["Подать звуковой сигнал","Включить аварийную сигнализацию","Прибегнуть к помощи других лиц"],"c":2,"tip":"Движение транспортного средства задним ходом разрешается при условии, что этот маневр будет безопасен и не создаст помех другим участникам движения. При необходимости водитель должен прибегнуть к помощи других лиц.(Пункт 8.12 ПДД)","img":null,"tp":[4],"p":["8.12"]},{"t":35,"n":10,"q":"С какой максимальной скоростью Вы имеете право продолжить движение на грузовом автомобиле с разрешенной максимальной массой более 3,5 т после въезда на примыкающую слева дорогу?","a":["60 км/ч","70 км/ч","90 км/ч"],"c":0,"tip":"Действие происходит в населенном пункте, обозначенном знаком 5.23.1 «Начало населенного пункта» (с белым фоном). Скорость в таких населенных пунктах ограничена. Допустимая максимальная скорость 60 км/ч.(«Дорожные знаки», пункт 10.2 ПДД)","img":"i467.jpg","tp":[5],"p":["10.2"]},{"t":35,"n":11,"q":"Как Вам следует поступить в данной ситуации?","a":["Уступить дорогу встречному автомобилю","Проехать первым","Действовать по взаимной
