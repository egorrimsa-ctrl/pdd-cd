Разрешено"],"c":0,"tip":"Сплошная линия разметки 1.4 жёлтого цвета обозначает места, где запрещена остановка. С 1 марта 2023 года данная разметка применяется только самостоятельно. Из определения зоны действия знака 3.27 «Остановка запрещена», она исключена. В данной ситуации является функционально недействующей. Останавливаться в указанном месте – запрещено.(«Дорожные знаки», «Горизонтальная разметка»).","img":"i87.jpg","tp":[2,1],"p":[]},{"t":7,"n":4,"q":"Действие каких знаков из указанных распространяется только до ближайшего по ходу движения перекрестка?","a":["А и В","Б и Г","В и Г"],"c":1,"tip":"Действие знаков: Б - 3.24 «Ограничение максимальной скорости» и Г - 3.28 «Стоянка запрещена» распространяется до ближайшего перекрёстка за ним, а в населённых пунктах при отсутствии перекрёстка - до конца населенного пункта. Действие же знаков: А - 5.31 «Зона с ограничением максимальной скорости» и В - 5.27 «Зона с ограничением стоянки» отменяется соответствующими только им знаками 5.32 «Конец зоны с ограничением максимальной скорости» и 5.28 «Конец зоны с ограничением стоянки».(«Дорожные знаки»)","img":"i88.jpg","tp":[1],"p":[]},{"t":7,"n":5,"q":"Что обозначают прерывистые линии разметки на перекрестке?","a":["Обязательное направление движения на перекрестке","Полосы движения в пределах перекрестка","Предупреждение о приближении к разметке, разделяющей транспортные потоки противоположных или попутных направлений"],"c":1,"tip":"«Горизонтальная разметка» 1.7 обозначает полосы движения в пределах перекрестка.","img":"i89.jpg","tp":[2],"p":[]},{"t":7,"n":6,"q":"Вам разрешается движение:","a":["Только прямо","Прямо и направо","В любом направлении"],"c":1,"tip":"При наличии регулировщика, сигналы светофора «не работают». Со стороны левого бока при вытянутой правой руке регулировщика безрельсовым транспортным средствам разрешается движение во всех направлениях.Но, т.к. Вы находитесь на правой полосе, Вам разрешается движение только прямо или направо.(Пункт 6.10 ПДД)","img":"i90.jpg","tp":[3],"p":["6.10"]},{"t":7,"n":7,"q":"Когда следует выключить указатели левого поворота, выполняя обгон?","a":["Сразу же после перестроения на полосу, предназначенную для встречного движения","После опережения обгоняемого транспортного средства","По усмотрению водителя"],"c":0,"tip":"Вы завершили перестроение на встречную полосу, прекращаете подачу сигнала немедленно. Опережая транспортное средство по встречной полосе, сигнал не подаёте.(Пункт 8.2 ПДД. «Техника управления автомобилем». Обгон)","img":null,"tp":[4],"p":["8.2"]},{"t":7,"n":8,"q":"Обязан ли водитель автобуса уступить дорогу водителю грузового автомобиля?","a":["Обязан","Обязан, если водитель грузового автомобиля начнет смещаться вправо","Не обязан"],"c":2,"tip":"Водитель автобуса продолжает движение по правой полосе без перестроения. Он «хозяин полосы», поэтому и уступать никому не обязан.(Пункт 8.4 ПДД)","img":"i91.jpg","tp":[4],"p":["8.4"]},{"t":7,"n":9,"q":"Разрешен ли Вам разворот на этом участке дороги?","a":["Разрешен","Разрешен только при видимости дороги не менее 100 м","Запрещен"],"c":1,"tip":"По ходу Вашего движения дорога делает поворот направо. Разворот разрешён только при видимости дороги более 100 м.(Пункт 8.11 ПДД)","img":"i92.jpg","tp":[4],"p":["8.11"]},{"t":7,"n":10,"q":"Каким грузовым автомобилям, перевозящим людей в кузове, разрешается движение вне населенных пунктов со скоростью не более 60 км/час?","a":["С максимальной разрешенной массой более 3,5 т","С максимальной разрешенной массой более 2,5 т","Всем грузовым автомобилям"],"c":2,"tip":"Всем грузовым автомобилям, перевозящим людей в кузове, вне населенных пунктов, разрешается движение со скоростью не более 60 км/ч.(Пункт 10.3 ПДД)","img":null,"tp":[5],"p":["10.3"]},{"t":7,"n":11,"q":"Разрешается ли Вам в конце подъема перестроиться на среднюю полосу для опережения грузового автомобиля?","a":["Разрешается","Разрешается только при видимости дороги не менее 100 м","Запрещается"],"c":0,"tip":"В данной ситуации четкое разграничение дороги по полосам. Одна полоса со встречным движением и две полосы движения в Вашем направлении. Поэтому можете совершать опережение и в конце подъёма. Но всегда проявляйте в таких ситуациях осторожность, т.к. что происходит на дороге за поперечным переломом её не видно, неизвестно.Не попадайте в ситуации, при которых наступает мгновенная неожиданность.(Пункты ПДД: 1.2 термин «Опережение», 11.4)","img":"i93.jpg","tp":[6],"p":["1.2","11.4"]},{"t":7,"n":12,"q":"В каком из указанных мест Вам можно поставить на стоянку грузовой автомобиль с разрешенной максимальной массой более 3,5 т?","a":["Только А","Только В","А или В","В любом"],"c":1,"tip":"На дороге с односторонним движением грузовым автомобилям, разрешённая максимальная масса которых более 3,5 т, с левой стороны дороги по ходу движения разрешается остановка, связанная только с разгрузкой или загрузкой. В месте «А» стоять нельзя. В месте «Б» Вы будете находиться в зоне действия знака 3.28 «Стоянка запрещена», что является нарушением. Ничего противоречащего для стоянки нет в месте «В».(«Дорожные знаки», пункт 12.1 ПДД)","img":"i94.jpg","tp":[7],"p":["12.1"]},{"t":7,"n":13,"q":"Как Вам следует поступить при повороте налево?","a":["Проехать перекресток первым","Выехать на перекресток и остановиться, чтобы уступить дорогу встречному автомобилю","Остановиться перед перекрестком и после проезда легкового автомобиля повернуть налево"],"c":1,"tip":"Остановка не далее стоп-линии обязательна при запрещающем сигнале светофора. Вам же горит «зелёный». Без остановки выезжаете на перекрёсток и перед поворотом налево останавливаетесь, чтобы уступить дорогу легковому автомобилю, движущемуся прямо со встречного направления.(«Горизонтальная разметка», пункты 6.13, 6.2, 13.3, 13.4 ПДД)","img":"i95.jpg","tp":[8],"p":["13.3","13.4","6.13","6.2"]},{"t":7,"n":14,"q":"Разрешено ли Вам выехать на перекресток, за которым образовался затор:","a":["Разрешено","Разрешено, если Вы намерены выполнить поворот","Запрещено"],"c":1,"tip":"В настоящее время заторы стали проблемой больших городов. Аналогичная ситуация не редкость. В прямом направлении Вам продолжать движение нельзя, так как Вы, остановившись на перекрёстке, перекроете движение транспортным средствам, движущимся в поперечном направлении. В данной ситуации можете выехать на перекрёсток только если намереваетесь повернуть налево или направо.(Пункт 13.2 ПДД).(14.12.18 обновлен вариант ответа (правильный). Теперь нельзя выезжать на перекресток с затором, если вы собираетесь сделать разворот)","img":"i96.jpg","tp":[8],"p":["13.2"]},{"t":7,"n":15,"q":"Вы намерены продолжить движение прямо. Кому Вы обязаны уступить дорогу?","a":["Только мотоциклу","Мотоциклу и легковому автомобилю","Никому"],"c":2,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Транспортные средства, находящиеся на главной дороге, имеют преимущество, между собой руководствуются «правилом правой руки». После их проезда, пользуясь этим же правилом, проезжают транспортные средства, находящиеся на второстепенной дороге. Первым проезжаете Вы, никому не уступая, мотоциклист - вторым, грузовик - третьим, легковой автомобиль - последним.(«Дорожные знаки», пункты 13.9, 13.10, 13.11 ПДД)","img":"i97.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":7,"n":16,"q":"Где могут двигаться пешеходы в жилой зоне?","a":["Только по тротуарам","По тротуарам и в один ряд по краю проезжей части","По тротуарам и по всей ширине проезжей части"],"c":2,"tip":"В жилой зоне, на дворовых территориях пешеходы имеют преимущество перед транспортными средствами. Их движение разрешается как по тротуарам, так и по всей ширине проезжей части.(Пункты 17.1, 17.4 ПДД)","img":null,"tp":[9],"p":["17.1","17.4"]},{"t":7,"n":17,"q":"На каком рисунке изображен автомобиль, водитель которого не нарушает правил перевозки грузов?","a":["Только на А","Только на Б","На обоих"],"c":2,"tip":"Оба водителя не нарушают правила перевозки грузов. На левом рисунке выступающий груз менее 1 м, что допускает его перевозку без специального обозначения. На правом рисунке, если действие происходит в дневное время, как и должно быть при перевозке груза, выступающего более чем на 1 м, он обозначен опознавательным знаком «Крупногабаритный груз».Теоретически и практически эти размеры определяются от внешних световых приборов, а не от выступающих частей автомобиля.(Пункт 23.4 ПДД)","img":"i98.jpg","tp":[23],"p":["23.4"]},{"t":7,"n":18,"q":"В каких случаях разрешается эксплуатация транспортного средства?","a":["Содержание вредных веществ в отработавших газах или их дымность превышают установленные нормы","Система питания и выпуска отработавших газов негерметичны","Не работает указатель температуры охлаждающей жидкости","Уровень шума выпуска отработавших газов превышает установленные нормы"],"c":2,"tip":"Согласно «Перечня неисправностей», если содержание вредных веществ в отработавших газах или их дымность превышают установленные нормы, нарушена герметичность системы питания (топливной системы), или уровень внешнего шума превышает установленные нормы (пункты 8.1, 8.2, 8.5), эксплуатация транспортных средств запрещена. Особенно будьте внимательны к подтеканию топлива, проявлением которого является запах. Такая неисправность грозит загоранием автомобиля, который не всегда удаётся потушить. Эксплуатация не запрещается, если не работает указатель температуры охлаждающей жидкости.(«Перечень неисправностей»).","img":null,"tp":[11],"p":[]},{"t":7,"n":19,"q":"Двигаться по глубокому снегу на грунтовой дороге следует:","a":["Изменяя скорость движения и передачу в зависимости от состояния дороги","На заранее выбранной пониженной передаче, без резких поворотов и остановок","На заранее выбранной повышенной передаче, без резких поворотов и остановок"],"c":1,"tip":"Если и дорога, и снежный покров ровные, а участок дороги продолжительный, то следует двигаться на пониженной передаче.","img":null,"tp":[12],"p":[]},{"t":7,"n":20,"q":"Какую оптимальную позу следует придать пострадавшему, находящемуся в сознании, при подозрении на травму позвоночника?","a":["Уложить пострадавшего на бок","Уложить пострадавшего на спину на твердой ровной поверхности, без необходимости его не перемещать, позу не менять","Уложить пострадавшего на спину, подложить под шею валик из одежды и приподнять ноги"],"c":1,"tip":"Правильный ответ - «пострадавшего не перемещать, позу не менять».","img":null,"tp":[16],"p":[]},{"t":8,"n":1,"q":"Какие действия при дорожно-транспортном происшествии должны немедленно осуществить водители, причастные к нему?","a":["Освободить проезжую часть","Остановить (не трогать с места) транспортное средство, включить аварийную сигнализацию и выставить знак аварийной остановки","Сообщить о случившемся в полицию"],"c":1,"tip":"После ДТП, каждый водитель, являющийся участником данного ДТП обязан:1. немедленно остановить (не трогать с места) ТС;2. включить аварийную сигнализацию и выставить знак аварийной остановки, на той полосе движения, на которой находится ТС, со стороны худшей видимости.Далее оценить наличие или отсутствие пострадавших, после чего действовать согласно пунктов 2.6, 2.6.1 ПДД.Первые два требования при ДТП, первостепенны во всех случаях.(Пункт 2.5 ПДД)","img":null,"tp":[22],"p":["2.5"]},{"t":8,"n":2,"q":"В чем особенность скоростного режима на этом участке дороги?","a":["Рекомендуемая скорость движения – 40 км/ч","Минимальная допустимая скорость движения – 40 км/ч","Минимальная допустимая скорость движения по левой полосе – 40 км/ч"],"c":2,"tip":"Табличка 8.14 «Полоса движения» указывает, что действие знака 4.6 «Ограничение минимальной скорости» распространяется только на ту полосу движения, над которой находится знак. Так как действие происходит в населённом пункте, на данном участке по правой полосе можно двигаться со скоростью, не превышающей 60 км/ч, на левой полосе скорость должна быть не менее 40 км/ч и не более 60 км/ч. Правильный ответ - минимальная допустимая скорость движения по левой полосе - 40 км/ч. («Дорожные знаки»)","img":"i99.jpg","tp":[1],"p":[]},{"t":8,"n":3,"q":"Какие из указанных знаков запрещают поворот налево?","a":["Только А","А и Б","А и В","Все"],"c":2,"tip":"На перекрёстке, перед которым установлен знак «А» - 5.13.1 «Выезд на дорогу с полосой для маршрутных транспортных средств», запрещается поворот налево других транспортных средств.Запрещает поворот всем видам транспортных средств и знак «В» - 6.3.1 «Место для разворота».Среди изображённых знаков следует обратить внимание на знак «Б» - 3.19 «Разворот запрещён», который, наоборот, поворот налево не запрещает.(«Дорожные знаки»)","img":"i100.jpg","tp":[1],"p":[]},{"t":8,"n":4,"q":"Можно ли Вам повернуть направо на этом перекрестке?","a":["Можно","Можно, если Вы управляете транспортным средством, которое обслуживает предприятие, расположенное справа от перекрестка","Нельзя"],"c":0,"tip":"Знак 6.8.2 «Тупик» указывает, что примыкающая дорога не имеет сквозного проезда. Каких-либо ограничений он не вводит. Повернуть направо Вам можно.(«Дорожные знаки»)","img":"i101.jpg","tp":[1],"p":[]},{"t":8,"n":5,"q":"Разрешается ли Вам перестроиться?","a":["Разрешается только на соседнюю полосу","Разрешается, если скорость грузового автомобиля менее 30 км/ч","Запрещается"],"c":0,"tip":"Реверсивные светофоры выключены. Двойная прерывистая линия разметки 1.9 разделяет транспортные потоки противоположных направлений. Прерывистую линию разметки 1.5, находящуюся слева пересекать не запрещается, поэтому Вам можно перестроиться на левую (соседнюю) полосу и продолжить движение по ней.(Пункт 6.7 ПДД)","img":"i102.jpg","tp":[2,3],"p":["6.7"]},{"t":8,"n":6,"q":"Разрешено ли Вам движение?","a":["Разрешено только направо","Разрешено только для выполнения разворота","Запрещено"],"c":2,"tip":"Вспоминаем старый преподавательский приём, афоризм: «правая вытянутая рука (со стороны правого бока) - шлагбаум». Движение запрещено.(Пункт 6.10 ПДД)","img":"i103.jpg","tp":[3],"p":["6.10"]},{"t":8,"n":7,"q":"Водитель автобуса должен выключить указатели левого поворота:","a":["После перестроения на левую полосу","После опережения грузового автомобиля","После возвращения на правую полосу"],"c":0,"tip":"Показанная траектория состоит из трёх фаз. Первая фаза - перестроение в параллельный ряд. Как только Вы его закончили, выключите левый сигнал указателя поворота. Вторая фаза - двигаетесь в параллельном ряду - включать сигналы не следует. Третья фаза - перестроение, возвращение на ранее занимаемую полосу. Перед перестроением включаете правый сигнал поворота. Закончив перестроение, выключаете его.(«Техника управления автомобилем», пункт 8.1 ПДД)","img":"i104.jpg","tp":[4],"p":["8.1"]},{"t":8,"n":8,"q":"По какой траектории Вам разрешается выполнить поворот налево?","a":["Только по А","Только по Б","По любой из указанных"],"c":1,"tip":"В случае отсутствия знака 5.15.1 «Направления движения по полосам» следовало бы выполнить поворот налево по траектории «А». Но на перекрёстках, перед которыми и на которых имеются знаки 5.15.1 и 5.15.2, выезд на трамвайные пути запрещён. Поворот налево (разворот) следует произвести по траектории «Б».(«Дорожные знаки», пункт 8.5 ПДД)","img":"i105.jpg","tp":[4],"p":["8.5"]},{"t":8,"n":9,"q":"Водитель имеет право произвести разворот от правого края проезжей части (с правой обочины):","a":["На регулируемом перекрестке","На нерегулируемом перекрестке","На участке дороги между перекрестками","В любом из перечисленных мест"],"c":2,"tip":"Разворот от правого края проезжей части (с правой обочины) допускается производить только вне перекрёстка.(Пункт 8.8 ПДД)","img":null,"tp":[4],"p":["8.8"]},{"t":8,"n":10,"q":"Вне населенных пунктов Вам можно продолжить движение:","a":["По любой полосе","По правой или средней полосе","Только по правой полосе"],"c":2,"tip":"Действие происходит вне населённого пункта. Вам запрещено движение по другим полосам при свободной правой полосе.(Пункт 9.4 ПДД)","img":"i106.jpg","tp":[13],"p":["9.4"]},{"t":8,"n":11,"q":"Разрешено ли Вам после опережения первого автомобиля продолжить движение по левой полосе вне населенных пунктов?","a":["Разрешено","Разрешено, если Вы намерены опередить второй автомобиль","Запрещено"],"c":1,"tip":"Вне населённого пункта именно в такой ситуации при наличии двух полос в данном направлении разрешается оставаться на левой полосе, чтобы не осуществлять лишние маневры во время опережения. При этом Вы не должны создавать помехи транспортным средствам, движущимся за Вами с более высокой скоростью.(Пункт 9.4 ПДД).","img":"i107.jpg","tp":[6,13],"p":["9.4"]},{"t":8,"n":12,"q":"Кто из водителей правильно поставил автомобиль на стоянку?","a":["Оба","Только водитель грузового автомобиля","Никто из водителей"],"c":2,"tip":"Никто из водителей не поставил автомобиль на стоянку правильно. Водитель любого грузового автомобиля во всех случаях не имеет права заезжать на прилегающий к проезжей части тротуар. Водители легковых автомобилей могут так поступать только в местах, обозначенных знаком 6.4 «Парковка (парковочное место)» с табличкой 8.6.2 «Способ постановки ТС на стоянку».(Пункт 12.2 ПДД)","img":"i108.jpg","tp":[7],"p":["12.2"]},{"t":8,"n":13,"q":"Кто из водителей, выполняющих поворот, нарушит Правила?","a":["Оба","Только водитель маломестного автобуса","Только водитель мотоцикла","Никто не нарушит"],"c":0,"tip":"Знак 4.1.1 «Движение прямо» в данном случае установлен непосредственно перед пересечением проезжих частей, т.е. перед перекрестком. Можно продолжать движение только прямо. В данной ситуации нарушают Правила оба водителя. («Дорожные знаки»)","img":"i109.jpg","tp":[8],"p":[]},{"t":8,"n":14,"q":"Вы намерены продолжить движение в прямом направлении. Ваши действия?","a":["Проедете перекресток первым","Уступите дорогу легковому автомобилю","Уступите дорогу легковому автомобилю и мотоциклу"],"c":1,"tip":"Перекрёсток равнозначный. При определении порядка проезда перекрёстка транспортными средствами руководствуемся «правилом правой руки», т.е. у кого помеха справа тот и уступает. Особенность решения этого вопроса - в выкатывании и остановке на перекрёстке транспортного средства, начинающего движение. Первым начинает движение водитель легкового автомобиля, поворачивающий налево, поскольку он в первоначальный момент не имеет помехи справа. Доехав до середины перекрёстка, перед тем как повернуть налево, он остановится, так как должен уступить дорогу мотоциклисту, находящемуся от него справа. После этого на траектории движения Вашего автомобиля помеха справа будет отсутствовать - проезжаете перекрёсток первым. Мотоциклист после Вас. И последним закончит проезд перекрёстка водитель, который начинал движение.(Пункт 13.11 ПДД)","img":"i110.jpg","tp":[8],"p":["13.11"]},{"t":8,"n":15,"q":"Кому Вы должны уступить дорогу при повороте налево?","a":["Только трамваям","Трамваю Б и легковому автомобилю","Всем транспортным средствам"],"c":1,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Транспортные средства, находящиеся на главной дороге, имеют преимущество. Между собой безрельсовые транспортные средства руководствуются «правилом правой руки», уступая дорогу трамваю, который в равнозначных условиях имеет перед ними преимущество. Первым проезжает трамвай «Б», после него легковой автомобиль, Вы после них. Последним проедет трамвай «А», так как он находится на второстепенной дороге.(Пункты 13.9, 13.1, 13.11 ПДД)","img":"i111.jpg","tp":[8],"p":["13.1","13.11","13.9"]},{"t":8,"n":16,"q":"Остановка на автомагистрали разрешена:","a":["В любых местах за пределами проезжей части","Только правее линии разметки, обозначающей край проезжей части","Только на специальных площадках для стоянки, обозначенных соответствующими знаками"],"c":2,"tip":"Согласно пункту 16.1 ПДД произвести остановку на автомагистрали можно только на специальных площадках для стоянки, обозначенных соответствующими знаками.","img":null,"tp":[18],"p":[]},{"t":8,"n":17,"q":"Какие внешние световые приборы должны использоваться при движении в темное время суток на освещенных участках дорог населенного пункта?","a":["Только габаритные огни","Фары ближнего света","Габаритные огни или фары ближнего света"],"c":1,"tip":"В тёмное время суток на освещённых участках дорог, расположенных в населённом пункте, при движении водитель должен включить фары ближнего света.(Пункт 19.2 ПДД)","img":null,"tp":[10],"p":["19.2"]},{"t":8,"n":18,"q":"При возникновении какой неисправности запрещается дальнейшее движение транспортного средства даже до места ремонта или стоянки?","a":["Неисправна рабочая тормозная система","Неисправна система выпуска отработавших газов","Не работает стеклоомыватель"],"c":0,"tip":"Движение при неисправной рабочей тормозной системе представляет явную опасность, поэтому движение запрещается.(Пункт 2.3.1 ПДД)","img":null,"tp":[11],"p":["2.3"]},{"t":8,"n":19,"q":"Более устойчив против опрокидывания на повороте грузовой автомобиль:","a":["Без груза","С неполной загрузкой","С максимально допустимой загрузкой"],"c":0,"tip":"Чем ниже и симметричнее расположен центр тяжести автомобиля, тем более он устойчив. Порожний автомобиль без груза всегда более устойчив против опрокидывания, чем при его наличии.","img":null,"tp":[12],"p":[]},{"t":8,"n":20,"q":"Как оказать первую помощь при отморожении и переохлаждении?","a":["Растереть пораженные участки тела снегом или шерстью, затем их утеплить, дать алкоголь, переместить в теплое помещение","Утеплить пораженные участки тела и обездвижить их, укутать пострадавшего теплой одеждой или пледом, дать теплое питье, переместить в теплое помещение","Смазать пораженные участки тела кремом, наложить согревающий компресс и грелку, переместить в теплое помещение, дать теплое питье"],"c":1,"tip":"Переохлаждение и отморожение - это различные состояния тела человека и его частей. При легкой и средней тяжести данных состояний, первую помощь пострадавшим следует оказывать в соответствии с ответом, в котором указываются действия в последовательности: утеплить, укутать пострадавшего, дать ему теплое питье, переместить в теплое помещение.","img":null,"tp":[16],"p":[]},{"t":9,"n":1,"q":"Какое удостоверение достаточно иметь водителю, управляющему грузовым автомобилем с разрешенной максимальной массой более 3,5 т, но не более 7,5 т и прицепом, разрешенная максимальная масса которого более 750 кг?","a":["На право управления транспортным средством подкатегории «C1»","На право управления транспортным средством категории «C»","На право управления транспортными средствами категории «C1E»"],"c":2,"tip":"Согласно статьи 25 п.1 Федерального закона «О безопасности дорожного движения» для управления грузовым автомобилем с разрешенной максимальной массой более 3,5 т, но не более 7,5 т и прицепом, разрешенная максимальная масса которого более 750 кг должны иметь водительское удостоверение на право управления ТС категории «С1E».(Пункт 2.1.1 ПДД)","img":null,"tp":[22],"p":["2.1"]},{"t":9,"n":2,"q":"Знаки предупреждают Вас о том, что:","a":["На протяжении 150 м возможно появление пешеходов на проезжей части","Через 150 м находится пешеходный переход","Через 150 м находится пешеходная дорожка"],"c":1,"tip":"Под знаком 1.22 «Пешеходный переход» установлена табличка 8.1.1 «Расстояние до объекта», указывающая расстояние до опасного участка, о котором информирует предупреждающий знак.(«Дорожные знаки»)","img":"i112.jpg","tp":[1],"p":[]},{"t":9,"n":3,"q":"Вам разрешено продолжить движение:","a":["Только в направлении Б","В направлениях А или Б","В направлениях Б или В"],"c":0,"tip":"Согласно знаку 4.3 «Круговое движение» Вы выезжаете на перекрёсток, движение по которому разрешается только в направлении стрелок, изображённых на знаке. Встречное движение по траектории «В» запрещено. Поворот направо по траектории «А» запрещает знак 3.18.1 «Поворот направо запрещён». Можете из указанных направлений продолжить движение только по траектории «Б».(«Дорожные знаки»)","img":"i113.jpg","tp":[1],"p":[]},{"t":9,"n":4,"q":"Управляя каким автомобилем Вы обязаны выполнить требования данного знака?","a":["Любым грузовым автомобилем","Грузовым автомобилем с разрешенной максимальной массой более 3,5 т","Грузовым автомобилем, на котором установлен опознавательный знак «Опасный груз»"],"c":2,"tip":"Знак 4.8.2 «Направление движения транспортных средств с опасными грузами» указывает обязательное направление движения транспортным средствам, оборудованным опознавательным знаком «Опасный груз».(«Дорожные знаки»)","img":"i114.jpg","tp":[1],"p":[]},{"t":9,"n":5,"q":"Можно ли Вам выполнить обгон при наличии данной разметки?","a":["Можно","Можно, если скорость трактора менее 30 км/ч","Нельзя"],"c":0,"tip":"Разметку 1.11 разрешается пересекать со стороны прерывистой линии, а также и со стороны сплошной, но только при завершении обгона или объезда препятствия. В данной ситуации Вам выполнить обгон можно, независимо от скорости трактора.(«Горизонтальная разметка»)","img":"i115.jpg","tp":[2],"p":[]},{"t":9,"n":6,"q":"В каких направлениях регулировщик разрешает Вам движение?","a":["Только прямо","Прямо и направо","Во всех направлениях"],"c":1,"tip":"Безрельсовым транспортным средствам при таком положении регулировщика со стороны левого и правого бока разрешается движение прямо и направо. «Грудь, спина - стена» - движение запрещено всем со стороны груди и спины.(Пункт 6.10 ПДД)","img":"i116.jpg","tp":[3],"p":["6.10"]},{"t":9,"n":7,"q":"Когда следует включать указатели поворота?","a":["Непосредственно перед поворотом или разворотом","Заблаговременно до начала выполнения маневра","По усмотрению водителя"],"c":1,"tip":"Ваши действия всегда должны быть понятны остальным участникам дорожного движения. О своих намерениях Вы должны информировать заблаговременно до начала выполнения маневра.(Пункт 8.2 ПДД)","img":null,"tp":[4],"p":["8.2"]},{"t":9,"n":8,"q":"Кто должен уступить дорогу?","a":["Водитель, намеревающийся начать движение от тротуара","Водитель, намеревающийся остановиться у тротуара","В данной ситуации водителям следует действовать по взаимной договоренности"],"c":0,"tip":"Водитель, намеревающийся начать движение после остановки или стоянки, обязан подавать сигнал соответствующего направления и начинать движение лишь убедившись, что маневр будет безопасен и не создаст помех другим участникам дорожного движения.(Пункт 8.1 ПДД)","img":"i117.jpg","tp":[4],"p":["8.1"]},{"t":9,"n":9,"q":"Разрешено ли Вам выполнить разворот в этом месте?","a":["Разрешено","Разрешено, если при этом не будут созданы помехи движению маршрутных транспортных средств","Запрещено"],"c":2,"tip":"Разворот в местах остановок маршрутных транспортных средств запрещён при любых обстоятельствах.(Пункт 8.11 ПДД)","img":"i118.jpg","tp":[4],"p":["8.11"]},{"t":9,"n":10,"q":"По какой траектории Вам разрешается продолжить движение?","a":["Только по А","Только по Б","По любой из указанных"],"c":1,"tip":"Водители, поворачивающие на дорогу с реверсивным движением, обозначенную знаком 5.10, должны двигаться по крайней правой полосе. Перестраиваться разрешается только после того, как водитель убедится, что движение в данном направлении разрешается и по другим полосам. Продолжать движение из указанных траекторий можно только по траектории «Б».(«Дорожные знаки», пункт 9.8 ПДД)","img":"i119.jpg","tp":[13],"p":["9.8"]},{"t":9,"n":11,"q":"Можно ли Вам после опережения грузового автомобиля продолжить движение по левой полосе вне населенных пунктов?","a":["Можно","Можно, если Вы управляете междугородним автобусом","Нельзя"],"c":2,"tip":"По завершении опережения водителю следует перестроиться на ранее занимаемую полосу. В данном случае на правую. Вне населённого пункта водители должны вести транспортные средства по возможности ближе к правому краю проезжей части. У вас такая возможность есть, продолжаете движение только по крайней правой полосе.(Пункт 9.4 ПДД)","img":"i120.jpg","tp":[6,13],"p":["9.4"]},{"t":9,"n":12,"q":"Запрещена ли водителю грузового автомобиля остановка в этом месте?","a":["Запрещена","Запрещена, если расстояние между автомобилем и линией разметки менее 3 м","Разрешена"],"c":2,"tip":"Остановка запрещается в местах, где расстояние между сплошной линией разметки и остановившимся ТС менее 3 м. В данной ситуации на проезжей части нанесена прерывистая линия разметки 1.5, разделяющая транспортные потоки противоположных направлений. Никаких запрещающих факторов для остановки в данной ситуации нет. Водителю грузового автомобиля остановка в данном месте разрешается.(Пункт 12.4 ПДД)","img":"i121.jpg","tp":[7],"p":["12.4"]},{"t":9,"n":13,"q":"Разрешено ли Вам выехать на перекресток, за которым образовался затор:","a":["Разрешено","Разрешено, если Вы намерены выполнить поворот","Запрещено"],"c":1,"tip":"Перекрёсток регулируемый. Вам «зелёный свет», но впереди «пробка». если Вы выедете на перекрёсток для движения в прямом направлении, то при смене сигналов будете оказывать помехи движению, особенно в поперечном направлении. Поэтому на перекрёсток Вы можете выехать только для поворота направо или налево.(Пункты 6.2, 13.2 ПДД).(14.12.18 обновлен вариант ответа (правильный). Теперь нельзя выезжать на перекресток с затором, если вы собираетесь сделать разворот)","img":"i96.jpg","tp":[8],"p":["13.2","6.2"]},{"t":9,"n":14,"q":"Вы намерены продолжить движение в прямом направлении. Ваши действия?","a":["Проедете перекресток первым","Уступите дорогу грузовому автомобилю"],"c":1,"tip":"Перекрёсток нерегулируемый, равнозначный. При разводке транспортных средств руководствуемся «правилом правой руки», т.е. у кого помеха справа, тот и уступает. Вы обязаны уступить дорогу грузовику.(Пункт 13.11 ПДД)","img":"i122.jpg","tp":[8],"p":["13.11"]},{"t":9,"n":15,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Только автобусу","Только легковому автомобилю","Никому"],"c":2,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Транспортные средства, находящиеся на главной дороге, имеют преимущество. А между собой руководствуются «правилом правой руки». У Вас помехи справа нет. Проезжаете первым, водитель легкового автомобиля после Вас, автобус последним, так как находится на второстепенной дороге.(Пункты 13.9, 13.10, 13.11 ПДД)","img":"i11.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":9,"n":16,"q":"Разрешается ли движение задним ходом на автомагистрали?","a":["Разрешается","Разрешается, если транспортное средство находится правее сплошной линии разметки, обозначающей край проезжей части автомагистрали","Запрещается"],"c":2,"tip":"Движение задним ходом по автомагистрали запрещено.(Пункт 16.1 ПДД)","img":null,"tp":[18],"p":["16.1"]},{"t":9,"n":17,"q":"При каких из перечисленных условий можно перевозить в кузове грузового автомобиля не более 8 человек, включая пассажиров в кабине?","a":["Только при наличии водительского удостоверения на право управления транспортным средством категории «С» независимо от стажа управления транспортным средством данной категории","Только при наличии водительского удостоверения на право управления транспортным средством категории «С» в течение более 1 года","При наличии водительского удостоверения на право управления транспортным средством категории «С» или подкатегории «С1» в течение 3 и более лет"],"c":2,"tip":"Согласно пункта 22.1 ПДД, правильный ответ - при наличии удостверения в течение 3 и более лет.","img":null,"tp":[23],"p":[]},{"t":9,"n":18,"q":"Дальнейшее движение транспортного средства (даже к месту стоянки или ремонта) при негорящих (отсутствующих) фарах и задних габаритных огнях запрещается:","a":["Только в условиях недостаточной видимости","Только в темное время суток","В обоих перечисленных случаях"],"c":2,"tip":"Запрещается движение при неисправности - негорящих (отсутствующих) фарах и задних габаритных огнях в темное время суток или в условиях недостаточной видимости. Правильный ответ - в обоих перечисленных случаях.(Пункт 2.3.1 ПДД)","img":null,"tp":[11],"p":["2.3"]},{"t":9,"n":19,"q":"Способ разворота с использованием прилегающей территории слева, обеспечивающий безопасность движения, показан:","a":["Только на левом рисунке","Только на правом рисунке","На обоих рисунках"],"c":1,"tip":"Наиболее рациональный и безопасный способ разворота в показанных ситуациях - на правом рисунке. Он позволяет лучше просматривать проезжую часть и требует меньше времени для разворота.","img":"i123.jpg","tp":[12],"p":[]},{"t":9,"n":20,"q":"Вероятность возникновения аварийной ситуации при движении в плотном транспортном потоке будет меньше, если скорость Вашего транспортного средства:","a":["Значительно меньше средней скорости потока","Близка к средней скорости потока","Значительно больше средней скорости потока"],"c":1,"tip":"Движение Вашего автомобиля не должно отличаться от движения потока. Количество перестроений должно быть сведено к минимуму. Водитель, не выполняющий эти условия, создаёт излишние опасные ситуации.","img":null,"tp":[12],"p":[]},{"t":10,"n":1,"q":"Главная дорога показана:","a":["Только на левом верхнем рисунке","На левом верхнем и нижнем рисунках","На всех рисунках"],"c":1,"tip":"Главная дорога показана на левом верхнем и нижнем рисунках, на которых перед перекрестком имеются знаки приоритета.На правом верхнем рисунке перед перекрестком установлен знак 6.8.2 «Тупик», который является информационным знаком, данный перекресток является равнозначным.(Пункт 1.2 термин «Главная дорога». «Дорожные знаки»)","img":"i124.jpg","tp":[0],"p":[]},{"t":10,"n":2,"q":"Какие из указанных знаков распространяют свое действие только на период времени, когда покрытие проезжей части влажное?","a":["Только А","А и Б","Все"],"c":0,"tip":"Только комбинация знаков «А» - 3.24 «Ограничение максимальной скорости» с табличкой 8.16 «Влажное покрытие», указывающей, что действие знака распространяется на период, когда покрытие проезжей части влажное - является правильным ответом.Знак «Б» - 1.18 «Выброс гравия» - предупреждает об участке дороги, на котором возможен выброс гравия, щебня и тому подобного из-под колёс транспортных средств.Знак «В» - 1.15 «Скользкая дорога» - предупреждает об участке дороги с повышенной скользкостью проезжей части. Причиной этого может быть выпадение снега, обледенение, разлив битума при производстве дорожных работ и т. п. («Дорожные знаки»)","img":"i125.jpg","tp":[1],"p":[]},{"t":10,"n":3,"q":"Разрешается ли Вам поставить автомобиль на стоянку в указанном месте?","a":["Разрешается","Разрешается, если Вы обслуживаете предприятие, находящееся в обозначенной зоне","Запрещается"],"c":2,"tip":"Табличка 8.2.2 «Зона действия» указывает, что зона действия знака 3.28 «Стоянка запрещена» имеет протяжённость 50 м от знака. Вы явно нарушите правила, если поставите автомобиль на стоянку в данном месте, если расстояние от знака до автомобиля будет менее 50 м. Хотя «на глазок» и на рисунке, и в практике такие расстояния точно определить непросто. Запомните правильный ответ – ЗАПРЕЩАЕТСЯ.(«Дорожные знаки»)","img":"i126.jpg","tp":[1],"p":[]},{"t":10,"n":4,"q":"Вы управляете грузовым автомобилем с разрешенной максимальной массой более 3,5 т. В каком направлении Вам разрешено дальнейшее движение?","a":["Только направо","Направо, налево и в обратном направлении","В любом"],"c":1,"tip":"Знак 3.4 «Движение грузовых автомобилей запрещено» распространяют своё действие только на грузовые автомобили с разрешённой максимальной массой более 3,5 т. Ваш автомобиль относится к такому классу. Знак 6.15.2 «Направление движение для грузовых автомобилей» является рекомендательным, т. е. необязательным. Поэтому можете на перекрестке повернуть направо, налево или развернуться и продолжить движение в обратном направлении.(«Дорожные знаки»)","img":"i127.jpg","tp":[1],"p":[]},{"t":10,"n":5,"q":"Такой вертикальной разметкой обозначают:","a":["Все вертикальные элементы дорожных сооружений","Только вертикальные элементы дорожных сооружений, представляющие опасность для движущихся транспортных средств","Только вертикальные элементы дорожных сооружений на автомагистралях и дорогах, обозначенных знаком 5.3 \"Дорога для автомобилей\""],"c":1,"tip":"Вертикальной разметкой 2.1 обозначают элементы дорожных сооружений, когда эти элементы представляют опасность для движущихся транспортных средств.","img":"i128.jpg","tp":[2],"p":[]},{"t":10,"n":6,"q":"Каким транспортным средствам разрешено продолжить движение?","a":["Маломестному автобусу и легковому автомобилю","Только автобусу","Только легковому автомобилю","Обоим транспортным средствам движение запрещено"],"c":0,"tip":"Перекрёсток регулируемый. Сигналы светофора при наличии регулировщика «не работают». Со стороны левого бока, при таком жесте регулировщика, при соблюдении расположения ТС на проезжей части разрешается движение во всех направлениях. Оба водителя продолжают движение.(Пункты 6.10, 6.15, 13.3 ПДД)","img":"i129.jpg","tp":[3],"p":["13.3","6.10","6.15"]},{"t":10,"n":7,"q":"Вы намерены произвести разворот на перекрестке. Какие указатели поворота необходимо включить перед въездом на перекресток?","a":["Правого поворота","Левого поворота","Включать указатели поворота нет необходимости"],"c":0,"tip":"Въезд на перекрёсток с круговым движением соответствует повороту направо. Соответственно включаете правый указатель поворота. Двигаясь по кругу, Вы не изменяете направление движения. Сигналы не используете. При съезде с перекрёстка опять совершаете правый поворот и опять заблаговременно включаете правый указатель поворота.(«Дорожные знаки», пункт 8.1 ПДД)","img":"i130.jpg","tp":[4],"p":["8.1"]},{"t":10,"n":8,"q":"По какой траектории Вам разрешается выполнить поворот налево?","a":["Только по А","Только по Б","По любой из указанных"],"c":1,"tip":"Перед поворотом налево, направо водитель должен заблаговременно занять крайнее положение на проезжей части. Дорога с односторонним движением, выезд с неё исключением не является. Поэтому следует поворот налево совершить по траектории «Б».(«Дорожные знаки», пункт 8.5 ПДД)","img":"i105.jpg","tp":[4],"p":["8.5"]},{"t":10,"n":9,"q":"Водитель грузового автомобиля в данной ситуации:","a":["Должен уступить дорогу автомобилю, который находится справа от него","Должен уступить дорогу автомобилю, который двигается по полосе разгона","Имеет преимущество, перед автомобилем, который двигается по полосе разгона"],"c":2,"tip":"Водитель легкового автомобиля въезжает на дорогу с полосы разгона. Он обязан уступить дорогу транспортным средствам, движущимся по этой дороге.(Пункт 8.10 ПДД)","img":"i131.jpg","tp":[4],"p":["8.10"]},{"t":10,"n":10,"q":"Что должно иметь решающее значение при выборе водителем скорости движения в темное время суток?","a":["Предельные ограничения скорости, установленные Правилами","Максимальная конструктивная скорость, установленная технической характеристикой используемого транспортного средства","Условия видимости"],"c":2,"tip":"Очень важным моментом при движении в ночное время является выбор скорости движения. При этом следует учитывать главное условие - расстояние видимости водителем дороги должно превышать величину остановочного пути.(«Техника управления автомобилем». Езда ночью)","img":null,"tp":[5],"p":[]},{"t":10,"n":11,"q":"Можно ли Вам обогнать трактор?","a":["Можно","Можно, если обгон будет завершен не ближе чем за 100 м до переезда","Нельзя"],"c":1,"tip":"Обгон запрещён на железнодорожных переездах и ближе, чем за 100 м перед ними. В данной ситуации действие происходит вне населённого пункта, согласно знаку 1.4.1 «Приближение к железнодорожному переезду» до железнодорожного переезда расстояние не менее 150-300 м.Поэтому вы можете совершить обгон трактора, если уверены, что успеете его завершить за 100 м до переезда.(«Дорожные знаки», пункт 11.4 ПДД)","img":"i132.jpg","tp":[6],"p":["11.4"]},{"t":10,"n":12,"q":"Где разрешается стоянка в целях длительного отдыха или ночлега на дорогах вне населенного пункта?","a":["Только на хорошо просматриваемом месте на обочине","Только на предусмотренных для этого площадках или за пределами дороги","В любом из перечисленных мест"],"c":1,"tip":"Стоянка с целью длительного отдыха, ночлега и тому подобное вне населенного пункта разрешается только на предусмотренных для этого площадках или за пределами дороги.(Пункт 12.3 ПДД)","img":null,"tp":[7],"p":["12.3"]},{"t":10,"n":13,"q":"При включении зеленого сигнала светофора Вам следует:","a":["Сразу начать движение","Начать движение, убедившись в отсутствии только пешеходов, завершающих переход проезжей части","Начать движение, убедившись в отсутствии пешеходов и транспортных средств, завершающих движение после смены сигнала светофора"],"c":2,"tip":"Грузовик закрывает обзорность справа, откуда могут неожиданно появиться пешеходы, начавшие движение после смены сигнала светофора. Следует убедиться в отсутствии ТС, завершающих движение через перекресток. Поэтому поступите с максимальной осторожностью.(Пункт 13.8 ПДД)","img":"i133.jpg","tp":[8],"p":["13.8"]},{"t":10,"n":14,"q":"Вы намерены проехать перекресток в прямом направлении. Кому Вы обязаны уступить дорогу?","a":["Только трамваю","Только грузовому автомобилю","Обоим транспортным средствам"],"c":2,"tip":"Перекрёсток равнозначный. В равнозначных условиях трамвай имеет преимущество, а безрельсовые транспортные средства руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает. Вы уступаете и трамваю, и грузовому автомобилю, которые проедут перекрёсток одновременно, т.к. их траектории движения не пересекаются.(Пункт 13.11 ПДД)","img":"i134.jpg","tp":[8],"p":["13.11"]},{"t":10,"n":15,"q":"Кому Вы должны уступить дорогу при повороте налево?","a":["Только автобусу","Только легковому автомобилю","Никому"],"c":2,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Преимуществом пользуются транспортные средства, находящиеся на главной дороге, которые между собой руководствуются «правилом правой руки». Вы проезжаете первым, так как для легкового автомобиля Вы являетесь помехой справа, а автобус находится на второстепенной дороге.(Пункты 13.3, 13.10 ПДД)","img":"i135.jpg","tp":[8],"p":["13.10","13.3"]},{"t":10,"n":16,"q":"Разрешен ли Вам въезд на железнодорожный переезд в данной ситуации?","a":["Разрешен","Разрешен, если отсутствует приближающийся поезд","Запрещен"],"c":2,"tip":"Запрещается выезжать на переезд при запрещающем сигнале светофора, независимо от положения и наличия шлагбаума. (Пункт 15.3 ПДД). Нарушение правил проезда железнодорожных переездов относится к грубейшим нарушениям Правил. Имейте в виду, что согласно статьи 12.10 часть 1 КоАП РФ за проезд ж/д переезда на запрещающий сигнал, переезд ж/д путей вне переезда, остановку и стоянку на нем предусмотрено наказание - штраф 5000 руб. или лишение прав на 3-6 месяцев.","img":"i136.jpg","tp":[14],"p":["15.3"]},{"t":10,"n":17,"q":"При движении в условиях недостаточной видимости можно использовать противотуманные фары:","a":["Только отдельно от ближнего или дальнего света фар","Только совместно с ближним или дальним светом фар","Как отдельно, так и совместно с ближним или дальним светом фар"],"c":1,"tip":"Противотуманные фары могут использоваться в условиях недостаточной видимости только совместно с ближним или дальним светом фар.(Пункт 19.4 ПДД)","img":null,"tp":[10],"p":["19.4"]},{"t":10,"n":18,"q":"Запрещается эксплуатация автобусов (категории М2 и М3), если остаточная глубина рисунка протектора шин (при отсутствии индикаторов износа) составляет не более:","a":["0,8 мм","1,0 мм","1,6 мм","2,0 мм"],"c":3,"tip":"Правильный ответ - 2 мм, согласно «Перечня неисправностей» пункта 5.4.","img":null,"tp":[11],"p":[]},{"t":10,"n":19,"q":"При приближении к вершине подъема в темное время суток водителю следует:","a":["Не переключать дальний свет фар на ближний","Переключить дальний свет фар на ближний только при появлении встречного транспортного средства","Всегда переключать дальний свет фар на ближний"],"c":2,"tip":"Что происходит за переломом дороги неизвестно. Встречное транспортное средство может быть полной неожиданностью. Ослепление неприятно физически и создаёт угрозу безопасности дорожного движения. Поэтому, при приближении к вершине подъема в темное время суток, водителю следует всегда переключать дальний свет фар на ближний.(Пункт 19.2 ПДД)","img":null,"tp":[10],"p":["19.2"]},{"t":10,"n":20,"q":"Какова первая помощь при черепно-мозговой травме, сопровождающейся ранением волосистой части головы?","a":["Остановить кровотечение прямым давлением на рану и наложить давящую повязку. При потере сознания придать устойчивое боковое положение. По возможности, приложить к голове холод.","Фиксировать шейный отдел позвоночника с помощью импровизированной шейной шины (воротника). На рану наложить стерильный ватный тампон, пострадавшего уложить на спину, приподняв ноги. По возможности, к голове приложить холод.","Шейную шину не накладывать, рану заклеить медицинским пластырем, пострадавшего уложить на бок"],"c":0,"tip":"Последовательность действий при оказании первой помощи следующая - остановить кровотечение прямым давлением на рану и наложить давящую повязку. При потере сознания придать устойчивое боковое положение. По возможности, приложить к голове холод.","img":null,"tp":[16],"p":[]},{"t":11,"n":1,"q":"Какие транспортные средства относятся к маршрутным транспортным средствам?","a":["Автобусы (в том числе маломестные, междугородние и школьные)","Автобусы, троллейбусы, трамваи, используемые при осуществлении регулярных перевозок пассажиров и багажа, движущиеся по установленному маршруту с обозначенными местами остановок","Любые транспортные средства, перевозящие пассажиров и багаж, движущиеся по маршруту с остановками"],"c":1,"tip":"К маршрутным транспортным средствам относятся – автобусы, троллейбусы, трамваи, используемые при осуществлении регулярных перевозок пассажиров и багажа, движущиеся по установленному маршруту с обозначенными местами остановокПункт 1.2 ПДД.","img":null,"tp":[0],"p":[]},{"t":11,"n":2,"q":"Двигаясь в населенном пункте, Вы можете продолжить движение:","a":["Только в направлении Б","В направлениях А или Б","В любом направлении из указанных"],"c":0,"tip":"В населенном пункте, обозначенном соответствующим знаком с белым фоном, на данной дороге водитель может использовать любую удобную для него полосу движения (Пункт 9.4 ПДД). Знак 4.1.4 «Движение прямо или направо» распространяет свое действие на первое пересечение проезжих частей, перед которыми он установлен. От действия знака могут отступать маршрутные транспортные средства. В данной ситуации для Вас разметка 1.11 (сплошная линия с прерывистой) значения не имеет. (Есть она или нет, к примеру, занесена снегом). Развернуться по траектории «В», Вам нельзя. Согласно пункта 8.5 ПДД нельзя совершить и поворот направо, т. к. вы не находитесь на крайней правой полосе. Можете продолжить движение только в направлении «Б».(«Дорожные знаки»)","img":"i137.jpg","tp":[1],"p":["9.4"]},{"t":11,"n":3,"q":"Этот знак указывает:","a":["Расстояние до конца тоннеля","Расстояние до места аварийной остановки","Направление движения к аварийному выходу и расстояние до него"],"c":2,"tip":"В тоннеле применён дорожный знак 6.21.1 «Направление движения к аварийному выходу». Он указывает направление движения к аварийному выходу и расстояние до него.(«Дорожные знаки»)","img":"i138.jpg","tp":[1],"p":[]},{"t":11,"n":4,"q":"До какого места действует требование данного знака?","a":["До ближайшего по ходу движения перекрестка","До места установки знака «Конец зоны с ограничением максимальной скорости»","До конца населенного пункта"],"c":1,"tip":"Действие знака 5.31 «Зона с ограничением максимальной скорости» отменяется только знаком 5.32 «Конец зоны с ограничением максимальной скорости».(«Дорожные знаки»)","img":"i139.jpg","tp":[1],"p":[]},{"t":11,"n":5,"q":"Эта разметка, нанесенная на полосе движения:","a":["Предоставляет Вам преимущество при перестроении на правую полосу","Информирует Вас о том, что дорога поворачивает направо","Предупреждает Вас о приближении к сужению проезжей части"],"c":2,"tip":"Разметка 1.19 предупреждает о приближении к сужению проезжей части (уменьшается количество полос движения в данном направлении).(«Горизонтальная разметка»)","img":"i140.jpg","tp":[2],"p":[]},{"t":11,"n":6,"q":"Запрещается выполнять обгон транспортного средства, имеющего нанесенные на наружные поверхности специальные цветографические схемы:","a":["Только при включении на нем специального звукового сигнала","Только при включении на нем проблесковых маячков синего (синего и красного) цвета","При наличии обоих перечисленных условий"],"c":2,"tip":"Обязательными условиями запрещения обгона «оперативника» (и сопровождаемых им Т. С.) являются: 1 - нанесённые на наружные поверхности специальные цветографические схемы; 2 - включение на нём проблесковых маячков синего цвета или синего и красного; 3 - включение сигнального звукового сигнала.Правильный ответ - при наличии всех условий.(Пункт 3.2 ПДД)","img":null,"tp":[17],"p":["3.2"]},{"t":11,"n":7,"q":"Обязаны ли Вы в данной ситуации подать сигнал правого поворота?","a":["Обязаны","Обязаны только в темное время суток","Не обязаны"],"c":0,"tip":"Вы будете перестраиваться. Перед перестроением следует подать сигнал правого поворота.(«Дорожные знаки», «Горизонтальная разметка» 1.19, пункт 8.1 ПДД)","img":"i141.jpg","tp":[4],"p":["1.19","8.1"]},{"t":11,"n":8,"q":"По какой траектории Вам разрешено выполнить поворот направо на маломестном автобусе?","a":["Только по А","Только по Б","По любой из указанных"],"c":0,"tip":"При повороте направо транспортное средство должно двигаться по возможности ближе к правому краю проезжей части. У Вас такая возможность есть, продолжаете при повороте направо движение по траектории «А».(Пункт 8.6 ПДД)","img":"i142.jpg","tp":[4],"p":["8.6"]},{"t":11,"n":9,"q":"Вам можно выполнить разворот:","a":["Только по траектории А","По траекториям А или В","По любой траектории из указанных"],"c":1,"tip":"Разворот запрещён на пешеходных переходах (траектории «Б»). Можете его произвести до или за пешеходным переходом, в данном случае по траектории «А» или «В».(Пункт 8.11 ПДД)","img":"i143.jpg","tp":[4],"p":["8.11"]},{"t":11,"n":10,"q":"В каких случаях разрешается выезжать за пределы правой полосы, если Вы управляете транспортным средством, скорость которого не должна превышать 40 км/ч?","a":["Только при перестроении перед поворотом налево либо разворотом","Только при обгоне или объезде","Во всех перечисленных случаях"],"c":2,"tip":"Транспортные средства, скорость движения которых не должна превышать 40 км/ч или которые по техническим причинам не могут развивать такую скорость, должны двигаться по крайней правой полосе, кроме случаев объезда, обгона или перестроения перед поворотом налево, разворотом или остановкой в разрешенных случаях на левой стороне дороги. Правильный ответ - во всех перечисленных случаях.(Пункт 9.5 ПДД)","img":null,"tp":[13],"p":["9.5"]},{"t":11,"n":11,"q":"Водитель обгоняемого транспортного средства:","a":["Должен снизить скорость","Должен сместиться как можно правее","Не должен препятствовать обгону путем повышения скорости движения или иными действиями"],"c":2,"tip":"Водителю обгоняемого транспортного средства запрещается препятствовать обгону посредством повышения скорости движения или иными действиями.(Пункт 11.3 ПДД)","img":null,"tp":[6],"p":["11.3"]},{"t":11,"n":12,"q":"Кто из водителей нарушил правила стоянки?","a":["Оба","Только водитель транспортного средства А","Только водитель транспортного средства Б","Никто не нарушил"],"c":0,"tip":"Стоянка запрещается ближе 50 м от железнодорожных переездов. Оба водителя являются нарушителями, так как расстояние меньше требуемого.(Пункт 12.5 ПДД)","img":"i144.jpg","tp":[7],"p":["12.5"]},{"t":11,"n":13,"q":"Обязаны ли Вы при повороте направо уступить дорогу автомобилю, выполняющему разворот?","a":["Обязаны","Не обязаны"],"c":0,"tip":"При движении «под дополнительную секцию», включённую одновременно с основным красным сигналом светофора, Вы обязаны уступить дорогу ВСЕМ движущимся с других направлений, независимо от их дальнейшего направления движения.(Пункт 13.5 ПДД)","img":"i145.jpg","tp":[8],"p":["13.5"]},{"t":11,"n":14,"q":"В каком случае Вы имеете право проехать перекресток первым?","a":["Только при движении прямо","При движении прямо и налево","При движении прямо, налево и в обратном направлении"],"c":1,"tip":"Перекрёсток равнозначный. Водители руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает. Помеха справа у водителя легкового автомобиля. Вы проезжаете перекрёсток первым при движении прямо и налево. При развороте у Вас справа будет помеха.(Пункт 13.11 ПДД)","img":"i146.jpg","tp":[8],"p":["13.11"]},{"t":11,"n":15,"q":"Вы намерены продолжить движение прямо. При желтом мигающем сигнале светофора следует:","a":["Проехать перекресток первым","Уступить дорогу только грузовому автомобилю","Уступить дорогу только трамваю","Уступить дорогу обоим транспортным средствам"],"c":0,"tip":"При жёлтом мигающем сигнале светофора перекрёсток является нерегулируемым. Согласно знакам приоритета - неравнозначным. Транспортные средства, находящиеся на главной дороге, имеют преимущество. Вы проезжаете первым, никому не уступая, так как трамвай и грузовик находятся на второстепенной дороге.(Пункты 13.3, 13.9 ПДД)","img":"i147.jpg","tp":[8],"p":["13.3","13.9"]},{"t":11,"n":16,"q":"В каких случаях Вы можете, управляя грузовым автомобилем с разрешенной максимальной массой более 3,5 т, проехать прямо?","a":["В случае сквозного проезда","В случае загрузки или разгрузки автомобиля в обозначенной знаком зоне","В обоих перечисленных случаях"],"c":1,"tip":"Запрещается сквозное движение через жилые зоны, обозначенные знаками, а также дворовые территории. Если у Вас нет цели осуществить сквозное движение, но есть цель произвести загрузку или выгрузку в обозначенной жилой зоне, то можете проехать перекрёсток и в прямом направлении.(«Дорожные знаки», пункты 17.2, 17.4 ПДД)","img":"i148.jpg","tp":[9],"p":["17.2","17.4"]},{"t":11,"n":17,"q":"Нормы времени управления транспортным средством и отдыха применяются в отношении физических лиц, осуществляющих эксплуатацию:","a":["Грузовых автомобилей с разрешенной максимальной массой более 3,5 т","Автобусов","Всех перечисленных транспортных средств"],"c":2,"tip":"Нормы времени управления ТС и отдыха применяются в отношении физических лиц, осуществляющих эксплуатацию грузовых автомобилей, разрешенная максимальная масса которых превышает 3500 килограммов, и автобусов (Пункт 26.4 ПДД). Указанные физические лица по требованию должностных лиц, уполномоченных на осуществление федерального государственного надзора в области безопасности дорожного движения, предоставляют доступ к тахографу и карте водителя, используемой совместно с тахографом, а также осуществляют по требованию этих должностных лиц вывод на печать информации из тахографа.","img":null,"tp":[12],"p":["26.4"]},{"t":11,"n":18,"q":"В каких случаях водители привлекаются к уголовной ответственности за нарушения Правил, повлекшие тяжкие последствия?","a":["Только при причинении смерти человеку","При причинении смерти человеку или тяжкого вреда здоровью человека","При наличии пострадавшего (вне зависимости от степени тяжести полученных им повреждений) или причинении крупного материального ущерба"],"c":1,"tip":"Согласно ст. 264 УК РФ к уголовной ответственности водители привлекаются за нарушения ПДД и правил эксплуатации Т.С. при причинении смерти человеку или тяжкого вреда здоровью человека.«Уголовный Кодекс РФ».","img":null,"tp":[21],"p":[]},{"t":11,"n":19,"q":"В случае остановки на подъеме (спуске) при наличии тротуара можно предотвратить самопроизвольное скатывание автобуса, повернув его передние колеса в положение:","a":["А и Г","Б и В","А и В","Б и Г"],"c":2,"tip":"Для исключения непреднамеренного скатывания автобуса выверните колёса так, чтобы возник упор в бордюрный камень тротуара. Это препятствует дальнейшему передвижению автобуса («А» и «В»). И, наоборот, при отсутствии упора может произойти самопроизвольное скатывание автобуса на проезжую часть («Б» и «Г»). Эта мера является дополнительной к обязательным мерам, т.е. использованию стояночного тормоза и включению желательно более низкой передачи или заднего хода.(Пункт 12.8 ПДД. «Комментарий ПДД РФ», издательство «За рулём»)","img":"i149.jpg","tp":[12],"p":["12.8"]},{"t":11,"n":20,"q":"Какое расстояние проедет транспортное средство за время, равное среднему времени реакции водителя, при скорости движения около 90 км/час?","a":["Примерно 15 м","Примерно 25 м","Примерно 35 м"],"c":1,"tip":"Спидометр автомобиля не показывает абсолютно точное значение скорости. Если скорость по спидометру около 90 км/час, что равнозначно 90 000 метров/час или 90 000 метров : 3 600 секунд = примерно 25 метров за 1 секунду.","img":null,"tp":[12],"p":[]},{"t":12,"n":1,"q":"В каких случаях владелец грузового автомобиля с разрешенной максимальной массой более 7,5 т может передавать управление этим транспортным средством в своем присутствии другому лицу, имея страховой полис обязательного страхования гражданской ответственности на бумажном носителе или в виде электронного документа либо его копии на бумажном носителе?","a":["При наличии у этого лица водительского удостоверения на право управления транспортным средством подкатегории «С1»","При наличии у этого лица водительского удостоверения на право управления транспортным средством категории «С»","В обоих перечисленных случаях"],"c":1,"tip":"Согласно ст. 25 п. 1 ФЗ «О безопасности дорожного движения» владелец грузового автомобиля с разрешенной максимальной массой более 7,5 т может передавать управление этим транспортным средством в своем присутствии другому лицу, имея соответствующий страховой полис на бумажном носителе или в виде электронного документа либо его копии, распечатанную на бумажном носителе, при наличии у этого лица водительского удостоверения на право управления транспортным средством категории «С».(Пункт 2.1.1 ПДД)","img":null,"tp":[22],"p":["2.1"]},{"t":12,"n":2,"q":"Этот знак:","a":["Предупреждает Вас о наличии узкого участка дороги, но не устанавливает очередность движения","Запрещает Вам проезд через мост","Обязывает Вас уступить дорогу встречному транспортному средству"],"c":2,"tip":"Знак 2.6 «Преимущество встречного движения» запрещает выезд на узкий участок дороги, если это может затруднить встречное движение. Поэтому Вам следует уступить дорогу грузовику, подъезжающему к мосту.(«Дорожные знаки», пункт 1.2 термин «Уступить дорогу»)","img":"i150.jpg","tp":[1],"p":[]},{"t":12,"n":3,"q":"В каких направлениях Вам можно продолжить движение на грузовом автомобиле?","a":["Только налево и в обратном направлении","Прямо, налево и в обратном направлении","В любом направлении"],"c":1,"tip":"Знак 5.13.2 «Выезд на дорогу с полосой для маршрутных транспортных средств» запрещает поворот направо. Поэтому Вы можете продолжить движение прямо, налево или развернуться для движения в обратном направлении.(«Дорожные знаки»)","img":"i151.jpg","tp":[1],"p":[]},{"t":12,"n":4,"q":"Каким транспортным средствам запрещена стоянка в выходные и праздничные дни?","a":["Только грузовым автомобилям с разрешенной максимальной массой более 3,5 т","Всем грузовым автомобилям","Всем транспортным средствам"],"c":0,"tip":"Табличка 8.5.1 «Субботние, воскресные и праздничные дни», установленная под знаком 5.27 «Зона с ограничением стоянки» с изображением грузового автомобиля, который указывает, что действие знака распространяется на грузовые автомобили, в т.ч. и с прицепом, р.м.м. которого более 3,5 т.(«Дорожные знаки»)","img":"i152.jpg","tp":[1],"p":[]},{"t":12,"n":5,"q":"Движение разрешается:","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":1,"tip":"Линию горизонтальной разметки 1.11 разрешается пересекать со стороны прерывистой, а также и со стороны сплошной, но только при завершении обгона или объезда. Водитель «А», выезжающий со двора, нарушает Правила. Разрешается движение автомобиля, совершающего разворот по траектории «Б».(«Горизонтальная разметка»)","img":"i153.jpg","tp":[2],"p":[]},{"t":12,"n":6,"q":"Какое значение имеет сигнал свистком, подаваемый регулировщиком?","a":["Водитель должен немедленно остановиться","Водитель должен ускорить движение","Сигнал подается для привлечения внимания участников движения"],"c":2,"tip":"Дополнительный сигнал свистком подается для привлечения внимания участников движения.(Пункт 6.12 ПДД)","img":null,"tp":[3],"p":["6.12"]},{"t":12,"n":7,"q":"Вы намерены повернуть налево на этом перекрестке. В какой момент следует включить указатели левого поворота?","a":["Заблаговременно, до въезда на перекресток","После въезда на первое пересечение проезжих частей","По Вашему усмотрению"],"c":1,"tip":"Правила требуют заблаговременно предупреждать других участников дорожного движения об изменении намерений в движении. Подаваемый Вами сигнал не должен вводить в заблуждение других водителей. В рассматриваемой ситуации следует включить указатель поворота после въезда на первое пересечение проезжих частей.(Пункты 8.1, 8.2 ПДД)","img":"i154.jpg","tp":[4],"p":["8.1","8.2"]},{"t":12,"n":8,"q":"Кто должен уступить дорогу при одновременном перестроении?","a":["Водитель легкового автомобиля","Водитель грузового автомобиля","В данной ситуации водителям следует действовать по взаимной договоренности"],"c":0,"tip":"При одновременном перестроении водители руководствуются «правилом правой руки». Помеха у водителя легкового автомобиля. Он уступает дорогу.(Пункт 8.4 ПДД)","img":"i155.jpg","tp":[4],"p":["8.4"]},{"t":12,"n":9,"q":"Разрешено ли Вам выполнить разворот на мосту по указанной траектории, управляя маломестным автобусом?","a":["Разрешено","Разрешено только при видимости дороги не менее 100 м","Запрещено"],"c":2,"tip":"Разворот на мостах запрещён для всех видов транспорта.(Пункт 8.11 ПДД)","img":"i156.jpg","tp":[4],"p":["8.11"]},{"t":12,"n":10,"q":"С какой максимальной скоростью имеет право двигаться водитель грузового автомобиля?","a":["60 км/ч","70 км/ч","80 км/ч"],"c":0,"tip":"Водитель не должен превышать скорость, указанную на опознавательном знаке «Ограничение скорости», которым обозначено транспортное средство, в данном случае грузовик.(«Дорожные знаки», пункт 10.4 ПДД)","img":"i157.jpg","tp":[5],"p":["10.4"]},{"t":12,"n":11,"q":"Разрешено ли Вам выполнить обгон в данной ситуации?","a":["Разрешено","Разрешено, если обгон будет завершен до перекрестка","Запрещено"],"c":1,"tip":"Предупреждающий знак 1.6 «Пересечение равнозначных дорог» устанавливается вне населённого пункта за 150-300 м до перекрёстка. На таких перекрёстках обгон запрещён. Обгон в показанной ситуации совершить можете, но закончить его необходимо до границы перекрёстка.(«Дорожные знаки», пункт 11.4 ПДД)","img":"i158.jpg","tp":[6],"p":["11.4"]},{"t":12,"n":12,"q":"Можно ли Вам поставить грузовой автомобиль с разрешенной максимальной массой более 3,5 т на стоянку в указанном месте?","a":["Можно","Можно, если Вы управляете автомобилем с разрешенной максимальной массой не более 7,5 т","Нельзя"],"c":2,"tip":"Действие происходит в населённом пункте на дороге, имеющей по одной полосе движения в каждом направлении, без трамвайных путей посередине. На таких дорогах, как исключение, разрешается остановка и стоянка с левой стороны дороги по ходу движения любым видам транспортных средств. Но знак 5.27 «Зона с ограничением стоянки» в отличие от знака 3.28 «Стоянка запрещена» распространяет действие на всю территорию (участок дороги) и действие его не прерывается до знака 5.28 «Конец зоны с ограничением стоянки».На данном участке дороги стоянка запрещена.(«Дорожные знаки», пункт 12.1 ПДД)","img":"i159.jpg","tp":[7],"p":["12.1"]},{"t":12,"n":13,"q":"Вы намерены повернуть направо. Ваши действия?","a":["Повернете направо, не уступая дорогу пешеходам","Повернете направо, уступив дорогу пешеходам","Остановитесь перед перекрестком и дождетесь другого сигнала регулировщика"],"c":1,"tip":"Руки регулировщика опущены («Грудь, спина - стена»). Со стороны правого и левого бока разрешено движение безрельсовым транспортным средствам прямо и направо, пешеходам разрешено переходить проезжую часть. (Пункт 6.10 ПДД). При повороте направо вы обязаны уступить дорогу пешеходам, переходящим проезжую часть дороги, на которую поворачиваете.(Пункт 13.1 ПДД)","img":"i160.jpg","tp":[8],"p":["13.1","6.10"]},{"t":12,"n":14,"q":"При движении в каком направлении Вы должны уступить дорогу автомобилю с включенными проблесковым маячком и специальным звуковым сигналом?","a":["Только налево","Налево и в обратном направлении","В любом"],"c":2,"tip":"Вы обязаны обеспечить беспрепятственный проезд перекрёстка «оперативнику» с включенными специальными сигналами независимо от направления его движения. Сделать это необходимо при движении в любом направлении.(Пункты 3.1, 3.2 ПДД)","img":"i161.jpg","tp":[17,8],"p":["3.1","3.2"]},{"t":12,"n":15,"q":"Вы намерены продолжить движение прямо. Ваши действия при желтом мигающем сигнале светофора?","a":["Уступите дорогу обоим транспортным средствам","Уступите дорогу только трамваю","Уступите дорогу только автомобилю","Проедете первым"],"c":2,"tip":"При жёлтом мигающем сигнале светофора перекрёсток является нерегулируемым, неравнозначным. Главная дорога меняет направление. Преимущество имеют транспортные средства, находящиеся на главной дороге, которые между собой руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает. У Вас помеха справа, уступаете дорогу только легковому автомобилю.(«Дорожные знаки», пункты 13.3, 13.9, 13.10, 13.11 ПДД)","img":"i162.jpg","tp":[8],"p":["13.10","13.11","13.3","13.9"]},{"t":12,"n":16,"q":"Разрешается ли учебная езда на автомагистрали?","a":["Запрещается","Разрешается только по крайней правой полосе","Разрешается"],"c":2,"tip":"Учебная езда на автомагистрали, обозначенной знаком 5.1 \"Автомагистраль\" разрешена с 2020 года(Пункт 16.1 ПДД).","img":null,"tp":[18],"p":["16.1"]},{"t":12,"n":17,"q":"При движении в темное время суток на неосвещенных участках дорог можно использовать противотуманные фары:","a":["Только отдельно от ближнего или дальнего света фар","Только совместно с ближним или дальним светом фар","Как отдельно, так и совместно с ближним или дальним светом фар"],"c":1,"tip":"В тёмное время суток на неосвещённых участках дорог должен быть включён дальний или ближний свет фар. Противотуманные фары можно включать только дополнительно к основному освещению.(Пункт 19.4 ПДД)","img":null,"tp":[10],"p":["19.4"]},{"t":12,"n":18,"q":"При какой неисправности тормозной системы запрещается дальнейшее движение грузового автомобиля и автобуса?","a":["Не включается контрольная лампа стояночной тормозной системы","Не действует манометр пневматического или пневмогидравлического тормозного привода","Уменьшен свободный ход педали тормоза"],"c":1,"tip":"Манометр является обязательным устройством в рабочей тормозной системе пневматического или пневмогидравлического тормозного привода.Если манометр не действует, то, соответственно, в рабочей тормозной системе возникла какая-то неисправность.В этом случае, согласно пункта 2.3.1 Правил, дальнейшее движение ТС запрещается. (В данном случае, грузового автомобиля или автобуса).","img":null,"tp":[11],"p":[]},{"t":12,"n":19,"q":"Способ разворота с использованием прилегающей территории справа, обеспечивающий безопасность движения, показан:","a":["Только на левом рисунке","Только на правом рисунке","На обоих рисунках"],"c":0,"tip":"На левом рисунке при выезде с прилегающей территории Вы просматриваете пересечение проезжих частей в обычном порядке. На правом же рисунке Вы через пересечение проезжих частей должны двигаться задним ходом, что требует большего времени, ограничивает обзорность.","img":"i163.jpg","tp":[12],"p":[]},{"t":12,"n":20,"q":"Как следует уложить пострадавшего при потере им сознания и наличии дыхания и кровообращения для оказания первой помощи?","a":["На спину с подложенным под голову валиком","На спину с вытянутыми ногами","Придать пострадавшему устойчивое боковое положение, чтобы согнутые колени опирались о землю, а верхняя рука находилась под щекой"],"c":2,"tip":"Чтобы пострадавший не мог погибнуть от удушения в результате западания языка, его следует положить на бок так, чтобы согнутые колени опирались о землю, а верхняя рука находилась под щекой.","img":null,"tp":[16],"p":[]},{"t":13,"n":1,"q":"Соответствуют ли действия водителя Правилам, если он движется посередине дороги?","a":["Соответствуют","Соответствуют, если отсутствуют встречные транспортные средства","Не соответствуют"],"c":2,"tip":"Водитель должен занимать сторону дороги, предназначенную для движения в данном направлении. Так как у нас правостороннее движение, он должен занять правую сторону дороги. Движение посередине дороги является нарушением.(Пункты 1.4, 9.1 ПДД)","img":"i164.jpg","tp":[0],"p":["1.4","9.1"]},{"t":13,"n":2,"q":"Как следует поступить, если Вам необходимо развернуться?","a":["Развернуться на этом перекрестке при отсутствии на нем других транспортных средств","Проехать прямо и развернуться за перекрестком","Проехать прямо и развернуться только на следующем перекрестке"],"c":1,"tip":"Действие знака 4.1.1 «Движение прямо», установленного перед пересечением проезжих частей, распространяется на первое пересечение за знаком. В данном случае действует на весь перекрёсток. Поэтому, если Вы решили развернуться, Вам ничего не остаётся, как проехать перекрёсток и развернуться на последующем за ним участке дороги, т.е. за перекрестком.(«Дорожные знаки»)","img":"i165.jpg","tp":[1],"p":[]},{"t":13,"n":3,"q":"Разрешена ли Вам стоянка в указанном месте?","a":["Разрешена","Разрешена только с включенной аварийной сигнализацией","Запрещена"],"c":2,"tip":"Зона действия знака 3.27 «Остановка запрещена» в данной ситуации от места установки до ближайшего перекрёстка. Здесь же разрыв разделительной полосы для разворота. Стоянка в указанном месте запрещена.(«Дорожные знаки», пункт 1.2 ПДД)","img":"i166.jpg","tp":[1],"p":["1.2"]},{"t":13,"n":4,"q":"Эта табличка распространяет действие установленного с ней знака:","a":["Только на грузовые автомобили с разрешенной максимальной массой более 3,5 т","На все грузовые автомобили","На все транспортные средства, кроме легковых автомобилей"],"c":0,"tip":"Табличка 8.4.1 «Вид транспортного средства» распространяет действие знака на грузовые автомобили, в том числе и с прицепом, с р.м.м. более 3,5 т.(«Дорожные знаки»)","img":"i167.jpg","tp":[1],"p":[]},{"t":13,"n":5,"q":"Какой пешеходный переход обозначает данная разметка?","a":["Только регулируемый","Только нерегулируемый","Любой"],"c":2,"tip":"Разметка 1.14.1 («зебра»), с использованием желтого фона в целях усиления ее восприятия водителями и, соответственно, повышения безопасности движения пешеходов применяется часто. Она может обозначать любой пешеходный переход - как регулируемый, так и нерегулируемый.(«Дорожная разметка»)","img":"i168.jpg","tp":[2],"p":[]},{"t":13,"n":6,"q":"Ваши действия в данной ситуации?","a":["Проедете переезд, убедившись в отсутствии приближающегося поезда","Остановитесь у светофора, а затем проедете переезд","Дождетесь выключения бело-лунного мигающего сигнала и проедете переезд"],"c":0,"tip":"Данный бело-лунный мигающий сигнал светофора равнозначен зелёному сигналу обычного светофора. Он разрешает движение транспортных средств через железнодорожный переезд. Проедете переезд, убедившись в отсутствии приближающегося поезда.(Пункт 6.9 ПДД)","img":"i169.jpg","tp":[3],"p":["6.9"]},{"t":13,"n":7,"q":"Когда может быть прекращена подача сигнала рукой о повороте?","a":["Непосредственно перед началом маневра","После начала маневра","Только после окончания маневра"],"c":0,"tip":"Подача сигнала рукой может быть закончена непосредственно перед выполнением маневра. При этом сигнал не должен вводить в заблуждение других участников движения.(Пункт 8.2 ПДД)","img":null,"tp":[4],"p":["8.2"]},{"t":13,"n":8,"q":"Из какой полосы разрешено въехать на данный перекрёсток?","a":["Только из правой","Только из левой","Из любой"],"c":2,"tip":"Въезд на перекрёсток, на котором организовано круговое движение, в виде исключения можно осуществлять с любой полосы данного направления. Выезд же с перекрёстка осуществляется по общим правилам.(Пункт 8.5 ПДД)","img":"i170.jpg","tp":[4],"p":["8.5"]},{"t":13,"n":9,"q":"Разрешается ли Вам выполнить разворот на данном участке дороги?","a":["Разрешается","Разрешается только при видимости дороги не менее 100 м","Запрещается"],"c":1,"tip":"Впереди поворот. Дома, деревья ограничивают обзор дороги. Разворот возможен лишь при условии, что дорога по ходу движения просматривается на расстоянии не менее 100 м.(Пункт 8.11 ПДД)","img":"i171.jpg","tp":[4],"p":["8.11"]},{"t":13,"n":10,"q":"С какой максимальной скоростью Вы имеете право продолжить движение на грузовом автомобиле с разрешенной максимальной массой более 3,5 т?","a":["60 км/ч","70 км/ч","90 км/ч"],"c":1,"tip":"На участке дороги, обозначенном данным знаком (синий фон), не действуют пункты Правил, устанавливающие порядок движения в населённых пунктах. На грузовике, разрешённая максимальная масса которого более 3,5 т, можете продолжать движение со скоростью не более 70 км/ч.(«Дорожные знаки», пункт 10.3 ПДД)","img":"i172.jpg","tp":[5],"p":["10.3"]},{"t":13,"n":11,"q":"Сколько транспортных средств Вам можно обогнать одновременно после проезда пешеходного перехода?","a":["Только одно","Только два","Все три"],"c":2,"tip":"Правилами не оговаривается количество обгоняемых транспортных средств. Запрещается обгон на пешеходных переходах. Факторов, запрещающих обгон, нет. Можете обогнать все три ТС. Но всегда следует помнить: обгон - классический вид риска водителя.(Пункты 1.2, 11.1, 11.4 ПДД)","img":"i173.jpg","tp":[6],"p":["1.2","11.1","11.4"]},{"t":13,"n":12,"q":"Разрешено ли Вам остановиться на мосту для посадки пассажира?","a":["Разрешено","Разрешено только на маломестном автобусе","Запрещено"],"c":2,"tip":"На мостах, эстакадах и путепроводах, имеющих менее трёх полос для движения в данном направлении, остановка запрещена для всех видов транспорта. В данной ситуации две полосы движения, следовательно, остановившись, Вы будете нарушителем Правил. Внимание! Не путайте этот вопрос с аналогичным (билет 14, вопрос 12), где имеется три полосы.(Пункт 12.4 ПДД)","img":"i174.jpg","tp":[7],"p":["12.4"]},{"t":13,"n":13,"q":"В данной ситуации Вы не обязаны уступать дорогу трамваю при движении:","a":["Прямо или направо","Только прямо","Только направо"],"c":0,"tip":"Перекресток регулируемый. Светофор с одноцветной сигнализацией, предназначенный для маршрутных ТС, разрешает движение прямо. Трамвай, поворачивающий направо, дожидается смены сигнала. Зеленый сигнал светофора разрешает Вам движение - проезжайте перекресток прямо первым.(Пункты 6.2, 6.8 ПДД)","img":"i175.jpg","tp":[8],"p":["6.2","6.8"]},{"t":13,"n":14,"q":"Кто из водителей, выполняющих поворот, должен уступить дорогу пешеходам?","a":["Только водитель легкового автомобиля","Только водитель грузового автомобиля","Оба"],"c":2,"tip":"При повороте направо или налево при проезде перекрёстков, как регулируемых, так и нерегулируемых, водитель обязан уступить дорогу пешеходам, переходящим проезжую часть дороги, на которую он поворачивает. Оба водителя уступают дорогу пешеходам.(Пункт 13.1 ПДД)","img":"i176.jpg","tp":[8],"p":["13.1"]},{"t":13,"n":15,"q":"Можете ли Вы в данной ситуации приступить к повороту налево?","a":["Можете","Можете, только убедившись в том, что не создадите помех встречному автомобилю, выполняющему поворот налево","Не можете"],"c":1,"tip":"Перекрёсток неравнозначный. Транспортные средства, находящиеся на главной дороге, имеют преимущество. Но так как Ваша траектория движения не пересекается с грузовиком, можете совершить движение через перекрёсток одновременно, при этом Вы должны учитывать преимущество грузовика, т.е. не создавать ему помех.(«Дорожные знаки», пункты 1.2 термин «Уступить дорогу», 13.9 ПДД)","img":"i177.jpg","tp":[8],"p":["1.2","13.9"]},{"t":13,"n":16,"q":"Разрешается ли Вам на автобусе двигаться по правой полосе?","a":["Разрешается","Разрешается, если Вы управляете маршрутным или школьным автобусом","Запрещается"],"c":1,"tip":"Согласно знаку 5.14.1 «Полоса для маршрутных транспортных средств» и разметки 1.23.1 (в виде буквы «А») правая полоса принадлежит маршрутным транспортным средствам и ТС, используемым в качестве легкового такси, а также велосипедистам и «школьным автобусам». Движение и остановка других транспортных средств на этой полосе запрещается. Вам разрешается движение по данной полосе, если Вы управляете маршрутным или школьным автобусом.(Пункт 18.2 ПДД, «Горизонтальная разметка» 1.23.1)","img":"i178.jpg","tp":[24],"p":["1.23","18.2"]},{"t":13,"n":17,"q":"Задние противотуманные фонари можно использовать:","a":["Только в условиях недостаточной видимости","Только при движении в темное время суток","В обоих перечисленных случаях"],"c":0,"tip":"Задние противотуманные фонари могут применяться только в условиях недостаточной видимости.(Пункт 19.7 ПДД)","img":null,"tp":[10],"p":["19.7"]},{"t":13,"n":18,"q":"При возникновении какой неисправности запрещено дальнейшее движение транспортного средства даже до места ремонта или стоянки?","a":["Не работает стеклоподъемник","Неисправно рулевое управление","Неисправен глушитель"],"c":1,"tip":"При неисправности рулевого управления движение представляет явную опасность, поэтому запрещено.(Пункт 2.3.1 ПДД)","img":null,"tp":[11],"p":["2.3"]},{"t":13,"n":19,"q":"Двигаясь в прямом направлении, Вы внезапно попали на небольшой участок скользкой дороги. Что следует предпринять?","a":["Плавно затормозить","Повернуть, руль, чтобы съехать с этого участка дороги","Не менять траектории и скорости движения"],"c":2,"tip":"Если это действительно небольшой участок дороги, то необходимо не менять траекторию и скорость, чтобы избежать возникновения заноса.","img":null,"tp":[12],"p":[]},{"t":13,"n":20,"q":"На какой срок может быть наложен кровоостанавливающий жгут?","a":["Не более получаса в теплое время года и не более одного часа в холодное время года","Не более одного часа в теплое время года и не более получаса в холодное время года","Время наложения жгута не ограничено"],"c":1,"tip":"Кровоостанавливающий жгут накладывается: в теплое время года (+4°С и выше ) - на время не более чем на один час, и на время не более получаса в холодное время года (ниже +4°С).","img":null,"tp":[16],"p":[]},{"t":14,"n":1,"q":"Что означает термин «Ограниченная видимость»?","a":["Видимость водителем дороги, ограниченная рельефом местности, геометрическими параметрами дороги, растительностью, строениями, сооружениями или другими объектами","Видимость водителем дороги менее 300 м в условиях тумана, дождя, снегопада, а также в сумерки","Видимость водителем дороги менее 150 м в ночное время","Видимость водителем дороги во всех перечисленных случаях"],"c":0,"tip":"«Ограниченная видимость» - видимость водителем дороги в направлении движения, ограниченная рельефом местности, геометрическими параметрами дороги, растительностью, строениями, сооружениями или иными объектами, в том числе транспортными средствами.(Пункт 1.2 ПДД термин «Ограниченная видимость»)","img":null,"tp":[0],"p":["1.2"]},{"t":14,"n":2,"q":"О чем предупреждают Вас эти знаки?","a":["Остановка транспортных средств на обочине запрещена","Съезд на обочину опасен в связи с проведением на ней дорожных работ","В месте производства дорожных работ стоянка запрещена"],"c":1,"tip":"Знак 1.25 «Дорожные работы» в сочетании с табличкой 8.12 «Опасная обочина» предупреждает водителей, что съезд на обочину опасен в связи с проведением на ней дорожных (ремонтных) работ.(«Дорожные знаки»)","img":"i179.jpg","tp":[1],"p":[]},{"t":14,"n":3,"q":"Какие из указанных знаков разрешают движение грузовым автомобилям с разрешенной максимальной массой более 3,5 т?","a":["Только А","А и В","Все"],"c":0,"tip":"Знак «Б» - 3.1 «Въезд запрещён» - запрещает въезд всех транспортных средств. От требований знака отступают маршрутные транспортные средства: трамвай, троллейбус, автобус. Знак «В» - 3.4 «Движение грузовых автомобилей запрещено» - при отсутствии цифры на автомобиле знака обозначает, что под знак могут проезжать грузовые автомобили только если их р.м.м. не более 3,5 т. Знак «А» - 5.3 «Дорога для автомобилей» - обозначающий дорогу, предназначенную только для автомобилей (без ограничений), автобусов и мотоциклов, каких-либо требований к массе и т.п. перечисленных транспортных с
