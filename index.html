редств не предъявляет.Из указанных разрешает движение грузовым автомобилям с р.м.м. более 3,5 т только знак «А».(«Дорожные знаки»)","img":"i180.jpg","tp":[1],"p":[]},{"t":14,"n":4,"q":"Вам можно продолжить движение по крайней левой полосе на автобусе:","a":["Только налево","Налево или в обратном направлении","Прямо, налево или в обратном направлении"],"c":2,"tip":"При наличии знаков, организующих направление движения по полосам или по полосе, как в данной ситуации, знаки, разрешающие поворот налево из крайней левой полосы, разрешают и разворот с этой полосы. Поэтому Вы можете продолжить движение прямо, налево или развернуться, для продолжения движения в обратном направлении.(«Дорожные знаки» 5.15.2)","img":"i181.jpg","tp":[1],"p":[]},{"t":14,"n":5,"q":"В каком из указанных мест Вам разрешено пересечь сплошную линию разметки и остановиться?","a":["А и Б","Только Б","В указанных местах пересекать сплошную линию разметки запрещено"],"c":1,"tip":"На данной дороге две смежные проезжие части. Между ними разделительная полоса. С левого края проезжей части нанесена разметка 1.2, которая обозначает край проезжей части.Разделительная полоса не предназначена для движения и остановки транспортных средств. (Место «А»). В месте «Б» - Вам можно останавливаться. Линия разметки 1.2 в данном случае обозначает край проезжей части. В такой ситуации ее допускается пересекать для остановки ТС на обочине и при выезде с нее в местах, где разрешена остановка или стоянка.(Пункт 1.2 термин «Разделительная полоса», «Горизонтальная разметка»)","img":"i182.jpg","tp":[2],"p":[]},{"t":14,"n":6,"q":"Должны ли Вы остановиться по требованию регулировщика в указанном им месте?","a":["Должны","Должны только с заездом на тротуар","Не должны"],"c":0,"tip":"Регулировщик решил Вас остановить. В этом случае его действия должны быть чёткими и конкретными. Первоначально он должен дать именно Вам указание об остановке, т.е. жест его руки должен быть направлен на Ваше транспортное средство. После этого регулировщик указывает место остановки. Ваша задача остановиться в указанном месте, даже если это противоречит правилам остановки. Как в данной ситуации, остановившись у тротуара.(Пункт 6.11 ПДД)","img":"i183.jpg","tp":[3],"p":["6.11"]},{"t":14,"n":7,"q":"Такой сигнал рукой, подаваемый водителем мотоцикла, информирует Вас:","a":["О его намерении повернуть налево или выполнить разворот","О его намерении продолжить движение прямо или налево","О наличии транспортного средства, приближающегося слева"],"c":0,"tip":"Сигналу левого поворота (разворота) соответствует вытянутая в сторону левая рука. Может использоваться для такого сигнала и правая вытянутая рука, но согнутая в локте под прямым углом вверх.(Пункт 8.1 ПДД)","img":"i184.jpg","tp":[4],"p":["8.1"]},{"t":14,"n":8,"q":"По какой траектории Вам разрешается выполнить поворот налево?","a":["Только по А","Только по Б","По любой из указанных"],"c":2,"tip":"Согласно знаку 5.7.2 «Выезд на дорогу с односторонним движением» на данном перекрёстке можно продолжить движение прямо, налево и совершить разворот. На дороге с односторонним движением можете двигаться по любой полосе. Поэтому Вам разрешается движение по любой из указанных траекторий.(«Дорожные знаки», пункт 8.6 ПДД)","img":"i185.jpg","tp":[4],"p":["8.6"]},{"t":14,"n":9,"q":"Можно ли Вам развернуться в этом месте?","a":["Можно","Можно только в светлое время суток","Нельзя"],"c":0,"tip":"Табличка под знаком 8.2.1 «Зона действия» указывает протяжённость опасных поворотов, о которых предупреждает знак 1.12.1 «Опасные повороты», и который устанавливается вне населённых пунктов за 150 - 300 м до опасного участка. При развороте Вы не должны оказаться в месте с видимостью дороги хотя бы в одном направлении менее 100 м. У Вас ещё есть небольшое расстояние, на котором можете совершить разворот.(«Дорожные знаки», пункт 8.11 ПДД)","img":"i186.jpg","tp":[4],"p":["8.11"]},{"t":14,"n":10,"q":"Допускается ли движение автомобилей по тротуарам или пешеходным дорожкам?","a":["Допускается","Допускается только при доставке грузов к торговым и другим предприятиям, расположенным непосредственно у тротуаров или пешеходных дорожек, если отсутствуют другие возможности подъезда","Не допускается"],"c":1,"tip":"Допускается движение автомобилей по тротуарам или пешеходным дорожкам только если Вы обслуживаете торговые или другие предприятия, расположенные непосредственно у этих тротуаров или дорожек, при отсутствии других возможностей подъезда.(Пункт 9.9 ПДД)","img":null,"tp":[13],"p":["9.9"]},{"t":14,"n":11,"q":"В данной ситуации Вы:","a":["Должны уступить дорогу, так как встречный автомобиль движется на подъем","Имеете право проехать первым, так как Вы движетесь на спуск","Имеете право проехать первым, так как препятствие находится на полосе движения встречного автомобиля"],"c":0,"tip":"В обычных условиях уступает тот из водителей, на чьей стороне помеха. На уклонах, обозначенных соответствующими знаками, иной порядок. При наличии препятствия уступить дорогу должен водитель транспортного средства, движущегося на спуск. Согласно знаку 1.13 «Крутой спуск» Вы руководствуетесь этим правилом и уступаете дорогу, встречному автомобилю движущемуся на подъем.(«Дорожные знаки», пункт 11.7 ПДД)","img":"i187.jpg","tp":[6],"p":["11.7"]},{"t":14,"n":12,"q":"Разрешено ли Вам остановиться на мосту в указанном месте?","a":["Разрешено","Разрешено только для высадки пассажиров","Запрещено"],"c":0,"tip":"На мостах, путепроводах и эстакадах остановка запрещается, если количество полос движения в данном направлении менее трёх. В данной ситуации - три полосы. Можете остановиться.(Пункт 12.4 ПДД)","img":"i188.jpg","tp":[7],"p":["12.4"]},{"t":14,"n":13,"q":"При включении зеленого сигнала светофора Вы должны уступить дорогу:","a":["Только грузовому автомобилю, завершающему разворот на перекрестке","Только легковому автомобилю","Обоим автомобилям"],"c":2,"tip":"Правила предусматривают такую ситуацию. При включении разрешающего сигнала светофора водитель обязан уступить дорогу транспортным средствам, завершающим движение через перекрёсток.У Вас именно такая ситуация - уступаете дорогу всем автомобилям, находящимся в границах перекрестка, в данном случае - обоим автомобилям.(Пункт 13.8 ПДД)","img":"i189.jpg","tp":[8],"p":["13.8"]},{"t":14,"n":14,"q":"Вы намерены проехать перекресток в прямом направлении. Кому Вы обязаны уступить дорогу?","a":["Только трамваю А","Только трамваю Б","Обоим трамваям"],"c":2,"tip":"Перекрёсток равнозначный. В равнозначных условиях трамваи имеют преимущество. В данной ситуации траектории движения трамваев не пересекаются, проезжают перекрёсток одновременно. Вы - после них.(Пункт 13.11 ПДД)","img":"i190.jpg","tp":[8],"p":["13.11"]},{"t":14,"n":15,"q":"При повороте налево Вы:","a":["Имеете преимущество","Должны уступить дорогу только автобусу","Должны уступить дорогу легковому автомобилю и автобусу"],"c":1,"tip":"Перекрёсток неравнозначный. Преимущество имеют транспортные средства, находящиеся на главной дороге. При повороте налево следует уступить дорогу транспортным средствам, движущимся прямо со встречного направления. Вы должны уступить только автобусу.(Пункты 13.9, 13.12 ПДД)","img":"i191.jpg","tp":[8],"p":["13.12","13.9"]},{"t":14,"n":16,"q":"Кто из водителей нарушает правила разворота на автомагистрали?","a":["Оба","Только водитель маломестного автобуса","Только водитель грузового автомобиля, выполняющего работы по ремонту или содержанию дорог","Никто не нарушает"],"c":1,"tip":"На автомагистрали разворот в технологических разрывах разделительной полосы запрещён (пункт 16.1 ПДД). Но водители транспортных средств с включённым проблесковым маячком жёлтого или оранжевого цвета при выполнении строительных, ремонтных или уборочных работ могут отступать от этого требования (пункта 16.1) при условии обеспечения безопасности движения (пункт 3.5 ПДД). Нарушает Правила водитель маломестного автобуса.","img":"i192.jpg","tp":[18],"p":["16.1","3.5"]},{"t":14,"n":17,"q":"Разрешается ли перевозить людей на грузовом прицепе?","a":["Разрешается","Разрешается, если они сопровождают груз","Запрещается"],"c":2,"tip":"Ни при каких обстоятельствах перевозка людей в прицепе не допускается.(Пункт 22.8 ПДД)","img":null,"tp":[23],"p":["22.8"]},{"t":14,"n":18,"q":"В каком из перечисленных случаев разрешается эксплуатация автомобиля?","a":["Шины имеют отслоения протектора или боковины","Шины имеют порезы, обнажающие корд","Зимние шины имеют восстановленные шипы противоскольжения"],"c":2,"tip":"Не запрещается эксплуатация автомобиля с «наварными» шинами, т. е. с восстановленным рисунком протектора, при условии соблюдения требований пункта 5.9 «Перечня неисправностей». С дефектами шин, перечисленными в других ответах, эксплуатация запрещена.(«Перечень неисправностей» пункт 5.6)","img":null,"tp":[11],"p":[]},{"t":14,"n":19,"q":"Как влияет длительный разгон транспортного средства с включенной первой передачей на расход топлива?","a":["Расход топлива увеличивается","Расход топлива не изменяется","Расход топлива уменьшается"],"c":0,"tip":"Движение без необходимости на пониженных передачах увеличивает расход топлива.","img":null,"tp":[12],"p":[]},{"t":14,"n":20,"q":"Является ли безопасным движение на грузовом автомобиле в темное время суток с включенным ближним светом фар по неосвещенному участку автомагистрали со скоростью 90 км/ч?","a":["Является безопасным, поскольку предельная допустимая скорость соответствует требованиям Правил","Является безопасным при малой интенсивности движения","Не является безопасным, поскольку остановочный путь превышает расстояние видимости"],"c":2,"tip":"Расстояние видимости водителем при движении ТС всегда должно превышать остановочный путь. Конструктивно данное условие с включенным ближним светом обеспечивается в темное время суток при движении ТС со скоростью до 60 км/ч. Поэтому, движение на грузовом автомобиле при указанных условиях движения со скоростью 90 км/ч не является безопасным, поскольку остановочный путь будет превышать расстояние видимости.В своих действиях за рулем исключите неоправданный риск, который часто заканчивается ДТП.(«Техника управления автомобилем»)","img":null,"tp":[12],"p":[]},{"t":15,"n":1,"q":"Какой неподвижный объект, не позволяющий продолжить движение по полосе, не относится к понятию «Препятствие»?","a":["Дефект проезжей части","Посторонний предмет","Неисправное или поврежденное транспортное средство","Транспортное средство, остановившееся на этой полосе из-за образования затора"],"c":3,"tip":"Не является препятствием затор или транспортное средство, остановившееся на полосе движения в соответствии с требованиями Правил.(Пункт 1.2 ПДД термин «Препятствие»)","img":null,"tp":[0],"p":["1.2"]},{"t":15,"n":2,"q":"Вам можно продолжить движение на перекрестке:","a":["Только в направлении Б","В направлениях А и Б","В направлениях Б и В"],"c":1,"tip":"Разделительная полоса делит дорогу на проезжие части. Действие знака 4.1.1 «Движение прямо», установленного перед перекрёстком, распространяется только на первое пересечение проезжих частей за знаком. Движение по траектории «В» запрещено. Вы можете двигаться по траектории «А» или «Б».(«Дорожные знаки», пункт 1.2 ПДД)","img":"i193.jpg","tp":[1],"p":["1.2"]},{"t":15,"n":3,"q":"В зоне действия этих знаков стоянка запрещена:","a":["Только грузовым автомобилям с разрешенной максимальной массой более 7,5 т","Грузовым автомобилям с разрешенной максимальной массой более 3,5 т","Любым грузовым автомобилям"],"c":1,"tip":"Табличка 8.4.1 «Вид транспортного средства» распространяет действие знака 3.28 «Стоянка запрещена» на грузовые автомобили, в том числе с прицепом, с разрешённой максимальной массой более 3,5 т.(«Дорожные знаки»)","img":"i194.jpg","tp":[1],"p":[]},{"t":15,"n":4,"q":"Какие из указанных табличек указывают протяженность зоны действия знаков, с которыми они применяются?","a":["Только А","Только Б","Б и В"],"c":2,"tip":"Таблички 8.2.1, 8.2.2 «Зона действия», обозначенные «Б» и «В», указывают зону действия запрещающих знаков.Табличка «А» 8.1.1 «Расстояние до объекта» указывает точное расстояние от знака до начала опасного участка, места введения какого-либо ограничения или определённого объекта, находящегося впереди по ходу движения.(«Дорожные знаки»)","img":"i195.jpg","tp":[1],"p":[]},{"t":15,"n":5,"q":"Разрешен ли Вам такой маневр при выключенных реверсивных светофорах?","a":["Разрешен","Разрешен, если нет встречных транспортных средств","Разрешен только для обгона","Запрещен"],"c":3,"tip":"Прерывистую линию 1.9 горизонтальной разметки, разделяющую транспортные потоки противоположных направлений, при выключенных реверсивных светофорах пересекать ЗАПРЕЩАЕТСЯ.(«Горизонтальная разметка»)","img":"i196.jpg","tp":[2],"p":[]},{"t":15,"n":6,"q":"При таких сигналах светофора и жесте регулировщика Вы должны:","a":["Остановиться у стоп-линии","Продолжить движение только прямо","Продолжить движение прямо или направо"],"c":0,"tip":"Перекрёсток регулируемый. Согласно «принципу приоритетности регулирования дорожного движения» сигналы светофора «не работают». Руководствуемся только сигналами регулировщика, поднятая вверх рука которого запрещает движение всех транспортных средств и пешеходов. При этом водители при наличии стоп-линии должны остановиться перед ней. Исключением являются транспортные средства, которые при поднятии регулировщиком руки вверх не могут остановиться, не прибегая к экстренному торможению.(Пункты 6.10, 6.13, 6.14 ПДД)","img":"i197.jpg","tp":[3],"p":["6.10","6.13","6.14"]},{"t":15,"n":7,"q":"Обязан ли в этой ситуации водитель, остановившийся из-за неисправности, выставить знак аварийной остановки?","a":["Обязан","Обязан, если неисправна аварийная сигнализация","Не обязан"],"c":0,"tip":"При вынужденной остановке в местах, где она запрещена, водитель должен включить аварийную сигнализацию и выставить знак аварийной остановки. Знак аварийной остановки устанавливается вне зависимости от наличия и исправности аварийной сигнализации, на той полосе движения, на которой находится ТС.(Пункты 7.1, 7.2 ПДД)","img":"i198.jpg","tp":[25],"p":["7.1","7.2"]},{"t":15,"n":8,"q":"По какой траектории Вам разрешено продолжить движение налево?","a":["Только по А","Только по Б","По любой из указанных"],"c":2,"tip":"При повороте налево, проезжая перекрёсток, водитель сам определяет траекторию движения, при этом должно быть выполнено условие: автомобиль при пересечении границы проезжих частей должен находиться на своей стороне дороги. По любой из указанных траекторий можете продолжать движение.(Пункт 8.6 ПДД)","img":"i199.jpg","tp":[4],"p":["8.6"]},{"t":15,"n":9,"q":"Как Вам следует действовать, выезжая на маломестном автобусе с места стоянки одновременно с легковым автомобилем?","a":["Уступить дорогу","Проехать первым","По взаимной договоренности с водителем этого автомобиля"],"c":0,"tip":"На стоянках, на территориях складов, баз, в поле и т.п. водители при разъезде руководствуются «правилом правой руки», т.е. у кого по траектории движения помеха справа, тот и уступает дорогу. Вы уступаете другому автомобилю.(Пункт 8.9 ПДД)","img":"i200.jpg","tp":[4],"p":["8.9"]},{"t":15,"n":10,"q":"К резкому торможению можно прибегнуть:","a":["Для остановки перед перекрестком или пешеходным переходом, когда зеленый сигнал светофора сменился на желтый","Для предотвращения дорожно-транспортного происшествия","В обоих перечисленных случаях"],"c":1,"tip":"Правилами разрешается применение резкого (экстренного) торможения только для предотвращения дорожно-транспортного происшествия. В остальных случаях используется служебное торможение.(Пункт 10.5 ПДД, «Техника управления автомобилем»)","img":null,"tp":[5],"p":["10.5"]},{"t":15,"n":11,"q":"Разрешается ли на двухполосной дороге выполнять обгон на перекрестках?","a":["Разрешается","Разрешается только на нерегулируемых перекрестках","Разрешается только на перекрестках неравнозначных дорог при движении по главной дороге","Запрещается"],"c":2,"tip":"Обгон запрещён на равнозначных перекрёстках. Допускается производить обгон на неравнозначных перекрёстках при движении по главной дороге.(Пункт 11.4 ПДД)","img":null,"tp":[6],"p":["11.4"]},{"t":15,"n":12,"q":"Кто из водителей нарушил правила остановки?","a":["Оба","Только водитель легкового автомобиля","Только водитель автобуса","Никто не нарушил"],"c":0,"tip":"Остановка с левой стороны дороги по ходу движения допускается только в населённых пунктах. Водитель легкового автомобиля, как и водитель автобуса, явно нарушает правила. Водителю автобуса при наличии обочины следовало остановиться на ней.(Пункт 12.1 ПДД)","img":"i201.jpg","tp":[7],"p":["12.1"]},{"t":15,"n":13,"q":"В каком случае Вы обязаны пропустить трамвай?","a":["При повороте налево, перестроившись на трамвайные пути попутного направления","При движении прямо","В обоих перечисленных случаях"],"c":2,"tip":"Перекресток регулируется светофором, траектории движения трамвая и ваша пересекаются. Находясь в равнозначных условиях трамвай имеет преимущество перед безрельсовыми ТС.Вы уступаете дорогу в обоих перечисленных случаях.(Пункты 6.2, 13.6 ПДД)","img":"i202.jpg","tp":[8],"p":["13.6","6.2"]},{"t":15,"n":14,"q":"При движении в прямом направлении Вам следует:","a":["Проехать перекресток первым","Уступить дорогу только трамваю","Уступить дорогу трамваю и легковому автомобилю"],"c":1,"tip":"Перекрёсток равнозначный. Трамвай в равнозначных условиях имеет преимущество перед безрельсовыми транспортными средствами. Проезжает первым. Вы с водителем легкового автомобиля руководствуетесь «правилом правой руки». У Вас помехи справа нет. Проезжаете перекрёсток, уступая только трамваю.(Пункт 13.11 ПДД)","img":"i203.jpg","tp":[8],"p":["13.11"]},{"t":15,"n":15,"q":"Кому Вы должны уступить дорогу при повороте налево?","a":["Только автобусу","Только легковому автомобилю","Никому"],"c":0,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Транспортные средства, находящиеся на главной дороге, имеют преимущество, между собой руководствуются «правилом правой руки». У Вас помеха справа, уступаете автобусу. Легковой автомобиль проедет последним, так как находится на второстепенной дороге.(Пункты 13.9, 13.10, 13.11 ПДД)","img":"i204.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":15,"n":16,"q":"Вам разрешается продолжить движение:","a":["Только по траектории А","Только по траектории Б","По траекториям А или Б","По траекториям Б или В","По любой траектории из указанных"],"c":1,"tip":"При повороте направо транспортное средство должно двигаться по возможности ближе к правому краю. Вы так и поступаете. Поворачиваете на крайнюю полосу, но продолжать движение по ней нельзя, так как согласно знаку 5.14.1 «Полоса для маршрутных транспортных средств» и разметки 1.23.1 (в виде буквы «А») она предназначена для движения маршрутных транспортных средств и ТС используемых в качестве легкового такси, а также велосипедистов и «школьных автобусов». Поэтому перестраиваетесь по траектории «Б» на соседнюю полосу.(Пункты 8.6, 18.2 ПДД, «Дорожные знаки»)","img":"i205.jpg","tp":[24],"p":["18.2","8.6"]},{"t":15,"n":17,"q":"Привлечь внимание водителя обгоняемого автомобиля при движении вне населенного пункта в светлое время суток можно:","a":["Только подачей звукового сигнала","Только кратковременным переключением фар с ближнего света на дальний","Только совместной подачей указанных сигналов","Любым из перечисленных способов"],"c":3,"tip":"Для предупреждения и привлечения внимания водителя обгоняемого автомобиля при движении вне населенного пункта Вы можете воспользоваться звуковым сигналом, либо кратковременным переключением фар с ближнего света на дальний, включая и совместную подачу этих сигналов.(Пункты 19.10, 19.11 ПДД)","img":null,"tp":[10],"p":["19.10","19.11"]},{"t":15,"n":18,"q":"При каком максимальном значении суммарного люфта в рулевом управлении допускается эксплуатация грузового автомобиля?","a":["10 градусов","20 градусов","25 градусов"],"c":2,"tip":"Эксплуатация грузового автомобиля допускается, если суммарный люфт в рулевом управлении не превышает величину в 25 градусов.(«Перечень неисправностей» пункт 2.3)","img":null,"tp":[11],"p":[]},{"t":15,"n":19,"q":"Как следует выбирать передачу при торможении двигателем с учетом крутизны спуска?","a":["Чем круче спуск, тем выше передача","Чем круче спуск, тем ниже передача","Выбор передачи не зависит от крутизны спуска"],"c":1,"tip":"Такую зависимость эффективности торможения водитель может использовать на крутых спусках, на автомобиле, имеющем механическую коробку перемены передач или перейти в ручной режим для выбора передачи на автоматизированных КПП.","img":null,"tp":[12],"p":[]},{"t":15,"n":20,"q":"О каких травмах у пострадавшего может свидетельствовать поза «лягушки» (ноги согнуты в коленях и разведены, а стопы развернуты подошвами друг к другу) и какую первую помощь необходимо при этом оказать?","a":["У пострадавшего могут быть ушиб брюшной стенки, перелом лодыжки, перелом костей стопы. При первой помощи вытянуть ноги, наложить шины на обе ноги от голеностопного сустава до подмышки.","У пострадавшего могут быть переломы шейки бедра, костей таза, перелом позвоночника, повреждение внутренних органов малого таза, внутреннее кровотечение. Позу ему не менять, ноги не вытягивать, шины не накладывать. При первой помощи подложить под колени валик из мягкой ткани, к животу по возможности приложить холод.","У пострадавшего могут быть переломы костей голени и нижней трети бедра. При первой помощи наложить шины только на травмированную ногу от голеностопного до коленного сустава, не вытягивая ногу."],"c":1,"tip":"Правильный ответ тот, в котором указан перелом позвоночника.Вынужденную позу «лягушки» у пострадавшего не следует менять. Ноги не вытягивать, шины не накладывать.","img":null,"tp":[16],"p":[]},{"t":16,"n":1,"q":"При наличии каких условий в случаях вынужденной остановки транспортного средства или дорожно транспортного происшествия водитель обязан быть одетым в куртку, жилет или жилет-накидку с полосами световозвращающего материала?","a":["Если это произошло вне населенных пунктов","Если это произошло в темное время суток либо в условиях ограниченной видимости","Если водитель находится на проезжей части или обочине","При наличии всех перечисленных условий"],"c":3,"tip":"Согласно пункта 2.3.4 ПДД водитель любого ТС обязан в случае вынужденной остановки транспортного средства или дорожно-транспортного происшествия вне населенных пунктов в темное время суток либо в условиях ограниченной видимости при нахождении на проезжей части или обочине быть одетым в куртку, жилет или жилет-накидку с полосами световозвращающего материала, соответствующих требованиям ГОСТа 12.4.281-2014","img":null,"tp":[22],"p":[]},{"t":16,"n":2,"q":"В какой из дворов Вам можно въехать в данной ситуации?","a":["Повороты во дворы запрещены","Только во двор направо","Только во двор налево","В любой"],"c":1,"tip":"Знак 4.1.1 «Движение прямо» установлен за пересечением проезжих частей, т.е. в начале участка дороги. Действие его в этом случае распространяется до следующего перекрёстка, при этом не запрещается совершать поворот направо во дворы и на прилегающие территории. Соответственно можете повернуть только во двор направо.(«Дорожные знаки»)","img":"i206.jpg","tp":[1],"p":[]},{"t":16,"n":3,"q":"Какой из указанных знаков запрещает дальнейшее движение всех без исключения транспортных средств?","a":["А","Б","В"],"c":1,"tip":"Знак «Б» - 3.17.2 «Опасность» запрещает дальнейшее движение всех без исключения транспортных средств. Необходимо понимать, что знак устанавливается в местах, угрожающих жизни и здоровью людей.(«Дорожные знаки»)","img":"i207.jpg","tp":[1],"p":[]},{"t":16,"n":4,"q":"О чем информируют эти знаки?","a":["Разрешенная скорость не более 40 км/ч при влажном покрытии","Рекомендуемая скорость 40 км/ч при влажном покрытии","Рекомендуемая скорость не более 40 км/ч только во время дождя"],"c":1,"tip":"Табличка 8.16 «Влажное покрытие» указывает, что действие знака 6.2 «Рекомендуемая скорость» распространяется на период времени, когда покрытие проезжей части влажное. В данном случае действие распространяется до ближайшего перекрёстка.(«Дорожные знаки»)","img":"i208.jpg","tp":[1],"p":[]},{"t":16,"n":5,"q":"Разрешена ли Вам остановка в этом месте?","a":["Разрешена","Разрешена без заезда на тротуар","Запрещена"],"c":2,"tip":"Сплошная линия разметки 1.4 жёлтого цвета обозначает места, где запрещена остановка. Применяется самостоятельно. Действие её распространяется также на ту сторону дороги, где она нанесена. Прилегающий тротуар является частью стороны дороги. Остановка Вам на всей длине разметки запрещена.","img":"i209.jpg","tp":[2],"p":[]},{"t":16,"n":6,"q":"Как следует поступить водителю при переключении такого сигнала светофора?","a":["При включении красного сигнала повернуть направо, уступая дорогу другим участникам движения","При включении зеленого сигнала продолжить движение только направо","Указанные действия являются правильными в обоих случаях"],"c":1,"tip":"Сигналы светофора, выполненные в виде стрелок красного, желтого и зеленого цветов, имеют то же значение, что и круглые сигналы соответствующего цвета, но их действие распространяется только на направление (направление указанное стрелками). Обычно такими светофорами регулируется пополосное движение.При включении только зеленого сигнала можно продолжить движение направо.","img":"i210.jpg","tp":[3],"p":[]},{"t":16,"n":7,"q":"Аварийная сигнализация на буксируемом механическом транспортном средстве должна быть включена:","a":["Только в условиях недостаточной видимости","Только в темное время суток","Во всех случаях, когда осуществляется буксировка"],"c":2,"tip":"Во всех случаях при буксировке на буксируемом механическом транспортном средстве должна быть включена аварийная сигнализация.(Пункт 7.1 ПДД)","img":null,"tp":[25],"p":["7.1"]},{"t":16,"n":8,"q":"Обязан ли водитель маломестного автобуса уступить дорогу легковому автомобилю?","a":["Обязан","Не обязан"],"c":1,"tip":"При перестроении водитель должен уступить дорогу транспортным средствам, движущимся попутно без изменения направления движения. Водитель маломестного автобуса, движущегося по левой полосе «хозяин» этой полосы, поэтому уступать не обязан.(Пункт 8.4 ПДД)","img":"i211.jpg","tp":[4],"p":["8.4"]},{"t":16,"n":9,"q":"Можно ли Вам на перекрестке выполнить разворот, двигаясь задним ходом?","a":["Можно","Можно, если при этом не будут созданы помехи другим участникам движения","Нельзя"],"c":2,"tip":"Движение задним ходом на перекрёстках запрещено.(Пункт 8.12 ПДД)","img":"i212.jpg","tp":[4],"p":["8.12"]},{"t":16,"n":10,"q":"С какой максимальной скоростью Вы имеете право продолжить движение вне населенных пунктов на грузовом автомобиле с разрешенной максимальной массой более 3,5 т?","a":["60 км/ч","70 км/ч","90 км/ч"],"c":1,"tip":"Действие происходит вне населённого пункта. После проезда знака 3.25 «Конец зоны ограничения максимальной скорости» на грузовом автомобиле с р.м.м. которого более 3,5 т вне населенных пунктов на всех дорогах, кроме автомагистрали разрешается движение с максимальной скоростью не более 70 км/ч.(«Дорожные знаки», пункт 10.3 ПДД)","img":"i213.jpg","tp":[5],"p":["10.3"]},{"t":16,"n":11,"q":"Разрешается ли Вам выполнить обгон в данной ситуации?","a":["Разрешается","Разрешается, только если скорость трактора менее 30 км/ч","Запрещается"],"c":0,"tip":"Перед Вами неравнозначный перекресток. Вы находитесь на главной дороге. Правила обгона разрешают в данной ситуации производить обгон любого транспортного средства.(Пункт 11.4 ПДД)","img":"i214.jpg","tp":[6],"p":["11.4"]},{"t":16,"n":12,"q":"В каком из указанных мест Вы можете поставить автобус на стоянку?","a":["Только В","Б или В","В любом"],"c":0,"tip":"В местах «А» и «Б» останавливаться нельзя, так как остановка с левой стороны дороги по ходу движения разрешается только в населённом пункте, обозначенном знаком 5.23.1 и 5.23.2 «Начало населённого пункта» с белым фоном. Правильно поступил бы водитель, остановившись в месте «В».(Пункт 12.1 ПДД)","img":"i215.jpg","tp":[7],"p":["12.1"]},{"t":16,"n":13,"q":"Вы намерены проехать перекресток в прямом направлении. Кому Вы должны уступить дорогу?","a":["Трамваю и автомобилю","Только трамваю","Никому"],"c":1,"tip":"Перекрёсток регулируемый. Трамвай в равнозначных условиях имеет преимущество перед безрельсовыми транспортными средствами. Проезжает первым. Легковой автомобиль при повороте налево обязан уступить дорогу транспортным средствам, движущимся со встречного направления прямо и направо. Вы уступаете дорогу только трамваю.(Пункты 13.3, 13.4, 13.6 ПДД)","img":"i216.jpg","tp":[8],"p":["13.3","13.4","13.6"]},{"t":16,"n":14,"q":"При въезде на перекресток Вы:","a":["Должны уступить дорогу обоим транспортным средствам","Должны уступить дорогу только автомобилю","Имеете преимущество перед обоими транспортными средствами"],"c":0,"tip":"При отсутствии знаков приоритета на перекрёстке с круговым движением «правило правой руки» не работает. Вы обязаны уступить дорогу всем ТС, движущимся по такому перекрестку.(Пункт 13.11.1 ПДД)","img":"i217.jpg","tp":[8],"p":["13.11"]},{"t":16,"n":15,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Только автобусу","Только легковому автомобилю","Обоим транспортным средствам"],"c":2,"tip":"Перекрёсток неравнозначный. Преимущество имеют транспортные средства, находящиеся на главной дороге. Вы находитесь на второстепенной дороге и уступаете обоим транспортным средствам, независимо от направления их дальнейшего движения.(«Дорожные знаки», пункт 13.9 ПДД)","img":"i218.jpg","tp":[8],"p":["13.9"]},{"t":16,"n":16,"q":"Разрешено ли Вам остановиться на автомагистрали правее линии, обозначающей край проезжей части?","a":["Разрешено","Разрешено только в случае вынужденной остановки","Запрещено"],"c":1,"tip":"На автомагистрали запрещается остановка вне специально выделенных мест. Для вывода транспортного средства с проезжей части на предназначенную полосу в случае вынужденной остановки необходимо пересечь сплошную линию горизонтальной разметки, расположенную справа и обозначающую край проезжей части.(«Горизонтальная разметка» 1.2, пункты 16.1, 16.2 ПДД)","img":"i219.jpg","tp":[18],"p":["1.2","16.1","16.2"]},{"t":16,"n":17,"q":"Какие требования являются обязательными при организованной перевозке группы детей?","a":["На автобусе должны быть установлены опознавательные знаки «Перевозка детей» и включен проблесковый маячок желтого или оранжевого цвета","Перевозка должна осуществляться с использованием ремней безопасности","С детьми должны находиться назначенные сопровождающие","Все перечисленные требования"],"c":3,"tip":"Организованная перевозка группы детей производится обязательно в автобусе при всех перечисленных требованиях.Данные требования сформулированы в пунктах 1.2 ПДД термин «Организованная перевозка группы детей»; 22.6 ПДД; пункта 8 «Общие положения».(14.12.18 обновлены формулировки вариантов ответа, в связи с измененными требованиями к организованной перевозке группы детей)","img":null,"tp":[23],"p":[]},{"t":16,"n":18,"q":"Запрещается эксплуатация автобуса, если стояночная тормозная система не обеспечивает неподвижное состояние автобуса в снаряженном состоянии на уклоне:","a":["До 16% включительно","До 23% включительно","До 31% включительно"],"c":1,"tip":"Запрещается эксплуатация автобуса, если стояночная тормозная система не обеспечивает неподвижное состояние автобуса в снаряженном состоянии (данная масса указывается предприятием-изготовителем) на уклоне до 23 процентов включительно.(«Перечень неисправностей», пункт 1.9)","img":null,"tp":[11],"p":[]},{"t":16,"n":19,"q":"При повороте направо обеспечение безопасности движения достигается путем выполнения поворота по траектории, которая показана:","a":["На левом рисунке","На правом рисунке","На обоих рисунках"],"c":0,"tip":"Центробежная сила тянет автомобиль влево. Для компенсации этих сил у водителя на левом рисунке ещё есть запас по ширине проезжей части для сохранения направления движения без выезда на полосу встречного движения. У водителя на правом рисунке никакого запаса нет, а учесть все факторы, которые влияют на сцепление колёс с дорогой на крутом повороте, не всегда удаётся и опытному водителю.(«Техника управления автомобилем»)","img":"i220.jpg","tp":[12],"p":[]},{"t":16,"n":20,"q":"Как определить наличие дыхания у потерявшего сознание пострадавшего?","a":["Взять пострадавшего за подбородок, запрокинуть голову и в течение 10 секунд проследить за движением его грудной клетки","Положить одну руку на лоб пострадавшего, двумя пальцами другой поднять подбородок и, запрокинув голову, наклониться к его лицу и в течение 10 секунд прислушаться к дыханию, постараться ощутить выдыхаемый воздух своей щекой, проследить за движением грудной клетки","Не запрокидывая головы пострадавшего, наклониться к его лицу и в течение 10 секунд прислушаться к дыханию, почувствовать его своей щекой, проследить за движением его грудной клетки"],"c":1,"tip":"Потеря сознания у человека может происходить по множеству причин. В дорожных условиях для определения наличия дыхания у потерявшего сознание пострадавшего наиболее правильные действия перечислены в ответе: «положить одну руку на лоб пострадавшего, двумя пальцами другой поднять подбородок и,...». При ответе на данный вопрос следует помнить, что ответ, в котором задействованы обе руки, является правильным.","img":null,"tp":[16],"p":[]},{"t":17,"n":1,"q":"Являются ли тротуары и обочины частью дороги?","a":["Являются","Являются только обочины","Не являются"],"c":0,"tip":"«Дорога» - обустроенная или приспособленная и используемая для движения транспортных средств полоса земли либо поверхность искусственного сооружения. Дорога включает в себя одну или несколько проезжих частей, а также трамвайные пути, тротуары, обочины и разделительные полосы при их наличии.Пункт 1.2 термин «Дорога».","img":null,"tp":[0],"p":[]},{"t":17,"n":2,"q":"На каком расстоянии до неровного участка дороги устанавливается этот знак вне населенного пункта?","a":["150 – 300 м","50 – 100 м","Непосредственно перед неровным участком дороги"],"c":0,"tip":"Как и большинство предупреждающих знаков, знак 1.16 «Неровная дорога» устанавливается вне населённого пункта за 150-300 м до опасного участка дороги.(«Дорожные знаки»)","img":"i221.jpg","tp":[1],"p":[]},{"t":17,"n":3,"q":"Данный знак запрещает движение:","a":["Всем транспортным средствам, фактическая масса которых более 6 т","Транспортным средствам, у которых фактическая масса, приходящаяся на какую-либо ось, более 6 т","Грузовым автомобилям с разрешенной максимальной массой более 6 т"],"c":1,"tip":"Знак 3.12 «Ограничение массы, приходящейся на ось транспортного средства» запрещает движение транспортных средств, у которых фактическая нагрузка на любую из осей больше указанной на знаке.(«Дорожные знаки»)","img":"i222.jpg","tp":[1],"p":[]},{"t":17,"n":4,"q":"Вам разрешено продолжить движение:","a":["По траекториям Б или В","По траекториям А или В","По любой траектории из указанных"],"c":1,"tip":"Знак 6.3.1 «Место для разворота» запрещает поворот налево для всех видов транспортных средств. Из указанных направлений нельзя продолжать движение по траектории «Б». Вам разрешено движение по траектории «А» или «В».(«Дорожные знаки»)","img":"i223.jpg","tp":[1],"p":[]},{"t":17,"n":5,"q":"Можно ли Вам выполнить обгон при наличии этой разметки?","a":["Можно","Можно, если скорость трактора менее 30 км/ч","Нельзя"],"c":2,"tip":"Горизонтальную разметку 1.11 разрешается пересекать со стороны прерывистой линии для обгона или объезда. С Вашей стороны - сплошная линия. В такой ситуации пересекать ее нельзя.(«Горизонтальная разметка»)","img":"i224.jpg","tp":[2],"p":[]},{"t":17,"n":6,"q":"В каком месте Вам следует остановиться?","a":["Перед светофором","Перед пересекаемой проезжей частью","В любом из перечисленных"],"c":0,"tip":"Знак 6.16 «Стоп-линия» указывает место остановки транспортных средств при запрещающем сигнале светофора (регулировщика). Вам «горит красный» - останавливаетесь перед светофором.(«Дорожные знаки», пункт 6.2 ПДД)","img":"i225.jpg","tp":[3],"p":["6.2"]},{"t":17,"n":7,"q":"На каком расстоянии от транспортного средства должен быть выставлен знак аварийной остановки в данной ситуации?","a":["Не менее 10 м","Не менее 15 м","Не менее 20 м","Не менее 30 м"],"c":1,"tip":"Действие происходит в населённом пункте. В этом случае знак аварийной остановки устанавливается на расстоянии не менее 15 м от транспортного средства.(Пункт 7.2 ПДД)","img":"i226.jpg","tp":[25],"p":["7.2"]},{"t":17,"n":8,"q":"Разрешено ли Вам выполнить поворот направо в данной ситуации?","a":["Разрешено","Разрешено, если при этом не будут созданы помехи транспортным средствам, движущимся с других направлений","Запрещено"],"c":2,"tip":"Вы находитесь на левой полосе, с которой совершить поворот направо нельзя. Для поворота направо необходимо было заблаговременно перестроиться на правую полосу.(Пункты 8.5, 6.3 ПДД)","img":"i227.jpg","tp":[4],"p":["6.3","8.5"]},{"t":17,"n":9,"q":"Можно ли Вам выполнить разворот по данной траектории?","a":["Можно","Можно, если ширина проезжей части недостаточна для выполнения маневра из крайнего левого положения","Нельзя"],"c":1,"tip":"Если при развороте вне перекрестка ширина проезжей части недостаточна для выполнения маневра из крайнего левого положения, его допускается производить от правого края проезжей части (с правой обочины). При этом водитель должен уступить дорогу попутным и встречным транспортным средствам.(Пункт 8.8 ПДД)","img":"i228.jpg","tp":[4],"p":["8.8"]},{"t":17,"n":10,"q":"Разрешается ли водителю движение со слишком малой скоростью?","a":["Разрешается","Разрешается, если при этом не создаются помехи другим транспортным средствам","Запрещается"],"c":1,"tip":"Водителю разрешается движение с относительно малой скоростью по отношению к другим транспортным средствам, если при этом не создаются помехи другим транспортным средствам.(Пункт 10.5 ПДД)","img":null,"tp":[5],"p":["10.5"]},{"t":17,"n":11,"q":"Можно ли Вам начать обгон в населенном пункте?","a":["Можно","Можно, если обгон будет завершен до переезда","Нельзя"],"c":2,"tip":"Обгон на железнодорожных переездах и ближе, чем за 100 м перед ними, запрещён. Трактор согласно знаку 1.2 «Железнодорожной переезд без шлагбаума», который в населённом пункте устанавливается за 50-100 м, находится уже в зоне запрещения обгона. Теперь начать обгон сможете только за железнодорожным переездом.(«Дорожные знаки», пункт 11.4 ПДД)","img":"i229.jpg","tp":[6],"p":["11.4"]},{"t":17,"n":12,"q":"В каком месте на данном участке дороги Вам разрешено поставить автомобиль на длительную стоянку?","a":["В любом месте на обочине","Только через 500 м на специальной площадке","Во всех перечисленных местах"],"c":1,"tip":"Стоянка с целью длительного отдыха, ночлега и т.п. вне населённого пункта разрешается только на предусмотренных для этого площадках или за пределами дорог. О наличии такой площадки Вас информирует знак сервиса 7.11 «Место отдыха». Цифра на знаке указывает расстояние до этого места.(«Дорожные знаки», пункт 12.3 ПДД)","img":"i230.jpg","tp":[7],"p":["12.3"]},{"t":17,"n":13,"q":"Обязаны ли Вы уступить дорогу автобусу?","a":["Обязаны","Не обязаны"],"c":0,"tip":"«Правило правой руки» универсально. Оно не работает в двух случаях - один из случаев, когда ТС движется под дополнительную секцию, включенную одновременно с основным желтым или красным сигналом. В данной ситуации Вы обязаны уступить дорогу всем ТС, движущимся с других направлений. Вы обязаны уступить дорогу автобусу.(Пункт 13.5 ПДД)","img":"i231.jpg","tp":[8],"p":["13.5"]},{"t":17,"n":14,"q":"Вы намерены повернуть налево. Ваши действия?","a":["Уступите дорогу обоим грузовым автомобилям","Выехав на перекресток, уступите дорогу встречному грузовому автомобилю и завершите поворот","Проедете перекресток первым"],"c":0,"tip":"Перекрёсток равнозначный. При «разводке» транспортных средств руководствуемся «правилом правой руки», т.е. у кого помеха справа, тот и уступает. Первым проедет грузовик, движущийся прямо, после него грузовик с маячком оранжевого цвета (который не предоставляет «преимущество»), последним Вы.(«Дорожные знаки», пункт 13.11 ПДД)","img":"i232.jpg","tp":[8],"p":["13.11"]},{"t":17,"n":15,"q":"После въезда на этот перекресток:","a":["Вы должны уступить дорогу легковому автомобилю, въезжающему на него","Вы будете иметь преимущество перед легковым автомобилем, въезжающим на него","Вам следует действовать по взаимной договоренности с водителем легкового автомобиля"],"c":1,"tip":"В случае если перед перекрестком с круговым движением установлен знак 4.3 «Круговое движение» правило «правой руки» не работает. Водитель ТС, находящийся на перекрестке пользуется преимуществом перед выезжающим на такой перекресток ТС.(«Дорожные знаки», пункт 13.11.1 ПДД)","img":"i233.jpg","tp":[8],"p":["13.11"]},{"t":17,"n":16,"q":"Кто из водителей должен уступить дорогу трамваю?","a":["Оба","Только водитель грузового автомобиля","Только водитель легкового автомобиля","Никто из водителей"],"c":3,"tip":"Вне перекрёстков, где трамвайные пути пересекают проезжую часть, трамвай имеет преимущество перед безрельсовыми транспортными средствами, кроме случаев выезда из депо. Здесь именно такой случай. Поэтому никто из водителей не уступает дорогу трамваю.(Пункт 18.1 ПДД)","img":"i234.jpg","tp":[24],"p":["18.1"]},{"t":17,"n":17,"q":"Можно ли буксировать автомобиль с недействующей тормозной системой, если фактическая масса этого автомобиля превышает половину фактической массы Вашего автомобиля?","a":["Можно","Можно только при скорости буксировки не более 30 км/ч","Нельзя"],"c":2,"tip":"Запрещается буксировать автомобиль с недействующей тормозной системой на гибкой сцепке, на жесткой сцепке, путём частичной погрузки - во всех случаях, если фактическая масса буксируемого ПРЕВЫШАЕТ ПОЛОВИНУ фактической массы Вашего автомобиля (буксирующего).(Пункт 20.4 ПДД)","img":null,"tp":[15],"p":["20.4"]},{"t":17,"n":18,"q":"При совершении административного правонарушения, влекущего задержание транспортного средства, оно задерживается до:","a":["Составления протокола об административном правонарушении","Устранения причины задержания","Рассмотрения дела об административном правонарушении"],"c":1,"tip":"Согласно ст. 27.13 ч.1 КоАП при совершении административного правонарушения, влекущего задержание ТС, оно задерживается до устранения причины задержания.«Кодекс РФ об административных правонарушениях».","img":null,"tp":[21],"p":[]},{"t":17,"n":19,"q":"Как изменяется длина тормозного пути грузового автомобиля при буксировке автомобиля с неисправной тормозной системой?","a":["Уменьшается, так как буксируемый автомобиль оказывает дополнительное сопротивление движению","Не изменяется","Увеличивается"],"c":2,"tip":"Буксировка транспортных средств с неисправной (недействующей) тормозной системой допускается только на жесткой сцепке или методом частичной погрузки.Любая такая «сцепка» изменит характеристики состава транспортных средств. Масса увеличится, соответственно увеличится и тормозной путь буксирующего грузового автомобиля.","img":null,"tp":[12],"p":[]},{"t":17,"n":20,"q":"В темное время суток и в пасмурную погоду скорость встречного автомобиля воспринимается:","a":["Ниже, чем в действительности","Восприятие скорости не меняется","Выше, чем в действительности"],"c":0,"tip":"В темное время суток и в пасмурную погоду скорость встречного автомобиля воспринимается ниже, чем в действительности.","img":null,"tp":[12],"p":[]},{"t":18,"n":1,"q":"Что означает термин «Обгон»?","a":["Опережение одного или нескольких транспортных средств, связанное с выездом на полосу (сторону проезжей части), предназначенную для встречного движения, и последующим возвращением на ранее занимаемую полосу (сторону проезжей части)","Опережение одного или нескольких транспортных средств, связанное с выездом из занимаемой полосы","Любое опережение одного или нескольких транспортных средств"],"c":0,"tip":"«Обгон» - опережение одного или нескольких транспортных средств, связанное с выездом на полосу (сторону проезжей части), предназначенную для встречного движения, и последующим возвращением на ранее занимаемую полосу (сторону проезжей части). (Пункт 1.2 ПДД термин «Обгон»). Если рассматривать в контексте термин «Обгон», «Опережение», пункты 9.2, 9.3, раздел 11 «Обгон, опережение, встречный разъезд», то следует вывод: «Обгон можно производить только на дорогах с двусторонним движением, имеющих две или три полосы движения.","img":null,"tp":[0],"p":["1.2"]},{"t":18,"n":2,"q":"Этот дорожный знак предупреждает:","a":["О приближении к скользкому участку дороги","О приближении к мокрому или загрязненному участку дороги","О приближении к участку дороги, где возможен выброс гравия (щебня) из-под колес"],"c":2,"tip":"Предупреждающий знак 1.18 «Выброс гравия» устанавливается вне населённого пункта за 150-300 м до опасного участка. При проезде этого участка следует по возможности увеличить интервал и дистанцию между автомобилями, снизить скорость. Летящие щебень, гравий могут «травмировать» лобовое стекло, стёкла фар автомобиля. На наших дорогах это не редкость.(«Дорожные знаки»)","img":"i235.jpg","tp":[1],"p":[]},{"t":18,"n":3,"q":"Разрешено ли Вам ставить автомобиль на стоянку в этом месте по четным числам месяца?","a":["Разрешено","Разрешено только после 21 часа","Запрещено"],"c":0,"tip":"Действие запрещающих стоянку знаков начинается от места их установки. Вы же намереваетесь поставить автомобиль на стоянку до знака, т.е. вне его действия. Однозначно разрешено.(«Дорожные знаки», пункт 12.1 ПДД)","img":"i236.jpg","tp":[1],"p":["12.1"]},{"t":18,"n":4,"q":"Какие из указанных знаков информируют о том, что на данной дороге действуют требования Правил, устанавливающие порядок движения в населенных пунктах?","a":["Только А","А и Б","Все"],"c":1,"tip":"Знаки «А» и «Б» - 5.23.1 и 5.23.2 «Начало населённого пункта» (с белым фоном).(«Дорожные знаки»)","img":"i237.jpg","tp":[1],"p":[]},{"t":18,"n":5,"q":"В данной ситуации Вы:","a":["Должны остановиться у знака","Должны остановиться у стоп-линии","Можете при отсутствии других транспортных средств проехать перекресток без остановки"],"c":1,"tip":"Знак 2.5 «Движение без остановки запрещено» установлен перед пересечением проезжих частей. При наличии стоп-линии (разметка 1.12) запрещается движение без остановки перед стоп-линией.(«Дорожные знаки», «Горизонтальная разметка»)","img":"i238.jpg","tp":[2],"p":[]},{"t":18,"n":6,"q":"В каком направлении Вам разрешено движение?","a":["Только налево и в обратном направлении","Прямо, налево и в обратном направлении","В любом"],"c":1,"tip":"При таком жесте регулировщика со стороны левого бока безрельсовым транспортным средствам разрешается движение во всех направлениях, но при этом должна учитываться «рядность» расположения. С левой полосы можете продолжить движение прямо, налево или развернуться, для движения в обратном направлении.(Пункты 6.10, 8.5 ПДД)","img":"i239.jpg","tp":[3],"p":["6.10","8.5"]},{"t":18,"n":7,"q":"Вы намерены остановиться слева у тротуара. В каком случае Вы обязаны включить на автобусе левые указатели поворота?","a":["Перед перестроением","Перед остановкой","В обоих перечисленных случаях"],"c":2,"tip":"Для остановки с левой стороны дороги по ходу вашего движения необходимо совершить перестроение. Заблаговременное включение левого указателя поворота обязательно. Обязательное его включение и перед остановкой.Правильный ответ - в обоих перечисленных случаях.","img":"i240.jpg","tp":[4],"p":[]},{"t":18,"n":8,"q":"Вам можно продолжить движение:","a":["Только по траектории А","По траекториям А или В","По любой траектории из указанных"],"c":1,"tip":"Стрелка на знаке 5.7.1 «Выезд на дорогу с односторонним движением» указывает направление движения на дороге с односторонним движением. Пересечение дороги не запрещается (траектория «В»). Запрещается поворот налево, т.е. движение во встречном направлении. При повороте направо транспортное средство должно двигаться по возможности ближе к правому краю проезжей части. У Вас такая возможность есть. Можете повернуть по траектории «А».(Пункт 8.6 ПДД, «Дорожные знаки»)","img":"i241.jpg","tp":[4],"p":["8.6"]},{"t":18,"n":9,"q":"Управляя автопоездом, имеющим большую длину, Вы имеете право выполнить разворот:","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":0,"tip":"Если при развороте вне перекрестка ширина проезжей части недостаточна для выполнения из крайнего левого положения, его допускается производить от правого края проезжей части (с правой обочины).Указанный ответ в таблице правильных ответов ГИБДД, является таковым только при одном условии (не оговоренном в вопросе), что ширина проезжей части для данного автопоезда, недостаточна для выполнения разворота из крайнего левого положения.(Пункт 8.5 ПДД)","img":"i242.jpg","tp":[4],"p":["8.5"]},{"t":18,"n":10,"q":"В каких из перечисленных случаев разрешается движение в населенных пунктах со скоростью не более 20 км/час?","a":["При движении в жилых зонах и на дворовых территориях","При движении в велосипедных зонах","Во всех перечисленных случаях"],"c":2,"tip":"Во всех перечисленных случаях разрешается движение в населенных пунктах со скоростью не более 20 км/ч.(Пункт 10.2 ПДД)","img":null,"tp":[5],"p":["10.2"]},{"t":18,"n":11,"q":"Можно ли водителю грузового автомобиля Б начать обгон?","a":["Можно","Можно, если водитель легкового автомобиля не приступил к обгону","Нельзя"],"c":2,"tip":"Водитель легкового автомобиля включил сигнал левого поворота. Водителю грузового автомобиля «Б» в такой ситуации выполнять обгон запрещается.(Пункт 11.2 ПДД)","img":"i243.jpg","tp":[6],"p":["11.2"]},{"t":18,"n":12,"q":"Кто нарушил правила остановки?","a":["Оба водителя","Только водитель грузового автомобиля","Только водитель легкового автомобиля","Никто не нарушил"],"c":1,"tip":"До края пересекаемой проезжей части у обоих водителей расстояние соответствует правилам остановки. Но водитель грузовика не учёл, что между транспортным средством и сплошной линией разметки, разделяющей полосы движения, расстояние менее 3 м, что и является причиной нарушения.(Пункт 12.4 ПДД)","img":"i244.jpg","tp":[7],"p":["12.4"]},{"t":18,"n":13,"q":"Обязаны ли Вы уступить дорогу легковому автомобилю при повороте направо?","a":["Обязаны","Обязаны, если легковой автомобиль поворачивает налево","Не обязаны"],"c":2,"tip":"Перекрёсток регулируемый. Знаки приоритета «не работают». При повороте налево водитель легкового автомобиля обязан уступить дорогу транспортным средствам, движущимся со встречного направления прямо или направо. У Вас преимущество.(Пункты 13.3, 13.4 ПДД)","img":"i245.jpg","tp":[8],"p":["13.3","13.4"]},{"t":18,"n":14,"q":"Вы намерены выполнить разворот. Ваши возможные действия?","a":["Отказаться от преимущества в движении и приступить к развороту после проезда легкового автомобиля","Выехать на перекресток первым и, уступив дорогу легковому автомобилю, закончить разворот","Допускаются оба варианта действий"],"c":2,"tip":"Данный вопрос и ответы на него требуют дополнительного пояснения. Пункт 1.3 ПДД является основополагающим пунктом Правил - «Участники дорожного движения обязаны знать и соблюдать относящиеся к ним требования Правил, сигналов светофоров, знаков и разметки, а также выполнять распоряжения регулировщиков, действующих в пределах предоставленных им прав и регулирующих дорожное движение установленными сигналами.» Согласно данного пункта отказаться от преимущества водителю невозможно, т.к. в этом случае водитель осознанно нарушает данный пункт Правил. В такой ситуации вся ответственность за решение по обеспечению дорожного движения ложится на данного водителя и в случае ДТП он будет признан виновным.В таких ситуациях следует на значительном расстоянии снизить скорость, чтобы дать возможность другому водителю оценить обстановку и понять, что он сможет совершить маневр без создания Вам помехи.В данной ситуации перекрёсток равнозначный. Водители ТС, траектории которых пересекаются в границах перекрестка, руководствуются «правилом правой руки». Наиболее правильный ответ - допускаются оба варианта действий.(Пункт 13.11 ПДД)","img":"i246.jpg","tp":[8],"p":["13.11"]},{"t":18,"n":15,"q":"Вы намерены проехать перекресток в прямом направлении. В данной ситуации:","a":["Вы обязаны уступить дорогу грузовому автомобилю","Вы имеете право проехать перекресток первым"],"c":1,"tip":"Перекрёсток неравнозначный. Специальный жёлтый мигающий сигнал на грузовике преимуществ не предоставляет. Транспортные средства находятся на равнозначной дороге. При повороте налево водитель грузовика обязан уступить дорогу Вам, движущемуся прямо со встречного направления.Проезжаете перекресток первым.(«Дорожные знаки», пункты 3.4, 13.12 ПДД)","img":"i247.jpg","tp":[8],"p":["13.12","3.4"]},{"t":18,"n":16,"q":"Как следует поступить водителю автобуса, отъезжающего от обозначенного места остановки?","a":["Уступить дорогу автомобилю","Подать звуковой сигнал и начать движение","Начать движение, убедившись, что водитель автомобиля уступает дорогу"],"c":2,"tip":"Этот случай предусматривает равнозначную ответственность водителей за разрешение возникшей ситуации. В населённых пунктах водители должны уступать дорогу троллейбусам и автобусам, начинающим движение от обозначенной остановки. Водители троллейбусов и автобусов могут начинать движение только после того, как убедятся, что им уступают дорогу.(Пункт 18.3 ПДД)","img":"i248.jpg","tp":[24],"p":["18.3"]},{"t":18,"n":17,"q":"Разрешается ли перевозка людей в буксируемом на жесткой сцепке автобусе?","a":["Разрешается","Разрешается только в светлое время суток","Разрешается только в автобусе, имеющем не более 16 сидячих мест","Запрещается"],"c":3,"tip":"В буксируемом автобусе, независимо от типа сцепки перевозка людей запрещается.(Пункт 20.2 ПДД)","img":null,"tp":[15],"p":["20.2"]},{"t":18,"n":18,"q":"За какие административные правонарушения в области дорожного движения предусмотрено наказание в виде обязательных работ?","a":["За управление транспортным средством водителем, не имеющим права управления транспортным средством (за исключением учебной езды)","За управление транспортным средством водителем, лишенным права управления транспортными средствами","За передачу управления транспортным средством лицу, заведомо не имеющему права управления (за исключением учебной езды) или лишенному такого права","За все перечисленные правонарушения"],"c":1,"tip":"Статья 12.7 ч.2 КоАП предусматривает административное наказание в виде обязательных работ за управление транспортным средством водителем, лишенным права управления транспортными средствами.","img":null,"tp":[21],"p":[]},{"t":18,"n":19,"q":"Как водитель должен воздействовать на педаль управления подачей топлива при возникновении заноса, вызванного резким ускорением движения?","a":["Усилить нажатие на педаль","Не менять силу нажатия на педаль","Ослабить нажатие на педаль"],"c":2,"tip":"Не делая никаких резких движений рулём, следует уменьшить нажатие на педаль газа и сцепление колёс с дорогой восстановится.","img":null,"tp":[12],"p":[]},{"t":18,"n":20,"q":"В каких случаях следует увеличить боковой интервал?","a":["При встречном разъезде на большой скорости","При разъезде с длинномерным транспортным средством","В обоих перечисленных случаях"],"c":2,"tip":"В обоих перечисленных случаях следует увеличивать боковой интервал, т. к. «динамический коридор» (отступление от прямолинейного движения) в данных ситуациях увеличивается.","img":null,"tp":[12],"p":[]},{"t":19,"n":1,"q":"Сколько проезжих частей имеет данная дорога?","a":["Одну","Две","Четыре"],"c":1,"tip":"Разделительная полоса делит дорогу на проезжие части. Данная дорога имеет две проезжие части, четыре полосы движения.(Пункт 1.2 ПДД)","img":"i13.jpg","tp":[0],"p":["1.2"]},{"t":19,"n":2,"q":"В каких направлениях Вам можно продолжить движение на грузовом автомобиле с разрешенной максимальной массой более 3,5 т?","a":["Только прямо","Прямо и направо","Прямо и в обратном направлении"],"c":0,"tip":"Табличка 8.4.1 под знаком распространяет действие знака на транспортное средство, которым Вы управляете. Согласно знаку 4.1.1 «Движение прямо» продолжаете движение только прямо.(«Дорожные знаки»)","img":"i249.jpg","tp":[1],"p":[]},{"t":19,"n":3,"q":"Разрешено ли осуществлять посадку (высадку) пассажиров либо загрузку (разгрузку) транспортного средства в зоне действия этого знака?","a":["Разрешено","Разрешено, если это займет не более 5 минут","Запрещено"],"c":0,"tip":"В зоне действия знака 3.28 «Стоянка запрещена» разрешается «остановка», включающая все действия, определяемые данным термином.(Пункт 1.2 термин «Остановка», «Дорожные знаки»)","img":"i250.jpg","tp":[1],"p":[]},{"t":19,"n":4,"q":"Какие из указанных знаков разрешают выполнить разворот?","a":["Только А","Б и В","Все"],"c":2,"tip":"Все из обозначенных знаков разрешают выполнить разворот на перекрёстках, перед которыми они установлены.Знак «А» - 3.18.2. «Поворот налево запрещен».Знак «Б» - 5.7.2. «Выезд на дорогу с односторонним движением».Знак «В» - 5.13.2. «Выезд на дорогу с полосой для маршрутных транспортных средств».(«Дорожные знаки»)","img":"i251.jpg","tp":[1],"p":[]},{"t":19,"n":5,"q":"Чем необходимо руководствоваться, если значения дорожных знаков и линий горизонтальной разметки противоречат друг другу?","a":["Требованиями линий разметки","Требованиями дорожных знаков","Правила эту ситуацию не регламентируют"],"c":1,"tip":"В случае, когда значения дорожных знаков, в том числе временных, и линий горизонтальной разметки противоречат друг другу, водители должны руководствоваться знаками.(«Горизонтальная разметка»)","img":null,"tp":[2],"p":[]},{"t":19,"n":6,"q":"Как Вы должны поступить в данной ситуации?","a":["Продолжить движение, не изменяя скорости","Снизить скорость и быть готовым в случае необходимости незамедлительно остановиться","Остановиться около автомобиля ДПС и продолжить движение только после разрешения сотрудника полиции"],"c":1,"tip":"Впереди нештатная дорожная ситуация. Приближаясь к стоящему транспортному средству с включенным проблесковым маячком синего цвета, водитель должен снизить скорость, чтобы иметь возможность незамедлительно остановиться в случае необходимости.(Пункт 3.3 ПДД)","img":"i252.jpg","tp":[17],"p":["3.3"]},{"t":19,"n":7,"q":"Когда должна быть прекращена подача сигнала указателями поворота?","a":["Непосредственно перед началом маневра","Сразу после начала маневра","Сразу после завершения маневра"],"c":2,"tip":"Подача сигнала указателями поворота должна производиться заблаговременно до начала выполнения маневра и прекращаться немедленно после его завершения. При этом сигнал не должен вводить в заблуждение других участников движения.(Пункт 8.2 ПДД)","img":null,"tp":[4],"p":["8.2"]},{"t":19,"n":8,"q":"По какой траектории Вам можно выполнить поворот налево?","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":0,"tip":"При отсутствии знаков 5.15.1 «Направления движения по полосам» или 5.15.2 следует выполнять поворот с заездом на трамвайные пути, т.е. по траектории «А».(Пункт 8.5 ПДД)","img":"i253.jpg","tp":[4],"p":["8.5"]},{"t":19,"n":9,"q":"Водитель случайно проехал нужный въезд во двор. Разрешено ли в этой ситуации использовать задний ход, чтобы затем повернуть направо?","a":["Разрешено","Разрешено, если водитель управляет грузовым такси","Запрещено"],"c":0,"tip":"Правила базируются на принципе: «Все, что не запрещено, - допустимо». При этом подразумевается, что допустимое не противоречит разумному и водитель при этом обеспечивает безопасные условия движения. На дорогах с односторонним движением «задний ход» не запрещён. Следовательно, водитель любого ТС может выполнить указанный маневр.(«Дорожные знаки», пункт 8.12 ПДД)","img":"i254.jpg","tp":[4],"p":["8.12"]},{"t":19,"n":10,"q":"С какой скоростью Вы имеете право продолжить движение в населенном пункте по левой полосе?","a":["Не более 40 км/ч","Не более 60 км/ч","Не менее 40 км/ч и не более 60 км/ч"],"c":2,"tip":"Разрешённая скорость движения в населённом пункте не более 60 км/ч. Вы выезжаете на полосу, над которой установлен знак 4.6 «Ограничение минимальной скорости» с табличкой 8.14 «Полоса движения», которая указывает полосу, на которую распространяется действие данного знака. Поэтому движение по данной полосе разрешается со скоростью не менее 40 км/ч, но и не превышающей 60 км/ч.(Пункт 10.2 ПДД, «Дорожные знаки»)","img":"i255.jpg","tp":[5],"p":["10.2"]},{"t":19,"n":11,"q":"По какой полосе Вам можно продолжить движение в населенном пункте после опережения грузового автомобиля?","a":["Только по правой","Только по левой","По любой"],"c":2,"tip":"Действие происходит в населённом пункте на дороге, имеющей по две полосы движения в каждом направлении. В этом случае имеете право использовать наиболее удобную для Вас полосу, т.е. любую.(Пункт 9.4 ПДД)","img":"i256.jpg","tp":[6,13],"p":["9.4"]},{"t":19,"n":12,"q":"Кто из водителей грузовых автомобилей нарушил правила стоянки?","a":["Оба","Только водитель автомобиля А","Только водитель автомобиля Б","Никто не нарушил"],"c":3,"tip":"В местном уширении проезжей части с помощью комбинации знака 6.4 «Парковка (парковочное место)» и таблички 8.6.1 «Способ постановки транспортного средства на стоянку», распространяющей действие на ВСЕ транспортные средства, организовано место стоянки любых транспортных средств, при этом ВСЕ обязательно должны располагаться вдоль проезжей части. Никто из данных водителей не нарушил правил стоянки.(«Дорожные знаки»)","img":"i257.jpg","tp":[7],"p":[]},{"t":19,"n":13,"q":"Вы намерены проехать перекресток в прямом направлении. Ваши действия?","a":["Остановитесь перед стоп-линией","Продолжите движение, уступая дорогу легковому автомобилю","Продолжите движение, имея преимущество перед легковым автомобилем"],"c":1,"tip":"Перекрёсток регулируемый. Вы продолжаете движение под дополнительную секцию светофора, включенную одновременно с основным красным сигналом светофора без остановки у стоп-линии. Но в этом случае, продолжая движение, необходимо учитывать, что уступаете дорогу всем транспортным средствам, движущимся с других направлений. В случае создания помехи, Вы создадите опасную ситуацию, которая может перейти в аварийную, и тогда Вы станете виновником ДТП.(Пункты 13.3, 13.5 ПДД)","img":"i258.jpg","tp":[8],"p":["13.3","13.5"]},{"t":19,"n":14,"q":"Как Вам следует поступить при повороте направо?","a":["Проехать перекресток первым","Уступить дорогу только легковому автомобилю","Уступить дорогу легковому автомобилю и мотоциклу"],"c":0,"tip":"Перекрёсток равнозначный. Водители руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает. Мотоциклист и легковой автомобиль имеют помеху справа. У Вас помехи нет, проедете перекрёсток первым, вторым - легковой автомобиль, мотоциклист - последним.(Пункт 13.11 ПДД)","img":"i259.jpg","tp":[8],"p":["13.11"]},{"t":19,"n":15,"q":"Если невозможно определить наличие покрытия на дороге (темное время суток, грязь, снег и тому подобное), а знаков приоритета нет, то:","a":["Вы имеете право считать, что находитесь на главной дороге","Вам следует считать, что находитесь на равнозначной дороге","Вы должны считать, что находитесь на второстепенной дороге"],"c":2,"tip":"Если покрытие невозможно определить (темное время суток, грязь, снег и тому подобное), а знаков приоритета нет, то следует считать себя находящимся на второстепенной дороге.(Дорожные знаки, пункт 13.13 ПДД)","img":null,"tp":[8],"p":["13.13"]},{"t":19,"n":16,"q":"В данной ситуации Вы:","a":["Должны уступить дорогу автобусу, начинающему движение от обозначенного места остановки","Имеете преимущество, так как автобус начинает движение с выездом на левую полосу"],"c":0,"tip":"В населённых пунктах, обозначенных соответствующим знаком с белым фоном, при трогании от обозначенного места остановки автобусы и троллейбусы имеют преимущество. При этом водители троллейбусов и автобусов могут начинать движение только после того, как убедятся, что им уступают дорогу. Этот пункт Правил предусматривает редкий случай - равнозначную ответственность водителей за разрешение дорожной ситуации.(Пункт 18.3 ПДД)","img":"i260.jpg","tp":[24],"p":["18.3"]},{"t":19,"n":17,"q":"Какие внешние световые приборы должны быть включены в темное время суток и в условиях недостаточной видимости независимо от освещения дороги, а также в тоннелях на буксируемых механических транспортных средствах?","a":["Дневные ходовые огни","Габаритные огни","Задние противотуманные фонари"],"c":1,"tip":"В темное время суток и в условиях недостаточной видимости независимо от освещения дороги, а также в тоннелях на движущемся транспортном средстве должны быть включены следующие световые приборы - на прицепах и буксируемых механических транспортных средствах - габаритные огни.(Пункт 19.1 ПДД)","img":null,"tp":[10],"p":["19.1"]},{"t":19,"n":18,"q":"У водителя, совершившего административное правонарушение, водительское удостоверение изымается:","a":["При выявлении и пресечении правонарушения","Немедленно после вынесения постановления о лишении права управления транспортными средствами","После вступления постановления о лишении права управления транспортными средствами в законную силу"],"c":2,"tip":"У водителя, совершившего административное правонарушение, водительское удостоверение изымается после вступления в законную силу постановления о лишении права управления транспортными средствами.(КоАП ст. 31.1 п.1, ст. 31.2 ч.2, ст. 32.6 ч.1)","img":null,"tp":[21],"p":[]},{"t":19,"n":19,"q":"Для прекращения заноса, вызванного торможением, водитель в первую очередь должен:","a":["Прекратить начатое торможение","Выключить сцепление","Продолжить торможение, не изменяя усилия на педаль тормоза"],"c":0,"tip":"Причиной заноса при торможении является или неодновременное срабатывание тормозных механизмов, или блокировка колёс. Следует немедленно разблокировать колёса, т.е. педаль тормоза отпустить, попытаться выровнять автомобиль.(«Техника управления автомобилем»)","img":null,"tp":[12],"p":[]},{"t":19,"n":20,"q":"Что необходимо сделать для извлечения инородного тела, попавшего в дыхательные пути пострадавшего?","a":["Уложить пострадавшего на свое колено лицом вниз и ударить кулаком по спине несколько раз","Вызвать рвоту, надавив на корень языка. При отрицательном результате ударить ребром ладони по спине пострадавшего либо встать спереди и сильно надавить кулаком на его живот.","Встать сбоку от пострадавшего, поддерживая его одной рукой под грудь, второй рукой наклонить корпус пострадавшего вперед головой вниз. Нанести пять резких ударов основанием ладони в область между лопаток. При отрицательном результате встать сзади, обхватить его обеими руками чуть выше пупка, сцепить свои руки в замок и пять раз резко надавить на область живота в направлении внутрь и кверху."],"c":2,"tip":"Для извлечения инородного тела, попавшего в дыхательные пути пострадавшего, необходимо запомнить, что в первую очередь надо встать сбоку от пострадавшего, поддерживая его одной рукой под грудь, второй рукой наклонить корпус пострадавшего вперед головой вниз. Нанести пять резких ударов основанием ладони в область между лопаток, а далее действовать, как изложено в правильном ответе.","img":null,"tp":[16],"p":[]},{"t":20,"n":1,"q":"Какие условия являются обязательными для оформления документа о дорожно-транспортном происшествии (ДТП) без участия уполномоченных на то сотрудников полиции?","a":["В результате взаимодействия (столкновения) двух транспортных средств (в том числе с прицепами к ним) вред причинен только им","Гражданская ответственность владельцев транспортных средств застрахована в соответствии с законодательством","Обстоятельства причинения вреда в связи с повреждением транспортных средств, характер и перечень видимых повреждений зафиксированы в соответствии с правилами обязательного страхования","Все перечисленные условия"],"c":3,"tip":"Согласно пункта 2.6.1 ПДД и ч. 1 ст. 11.1 ФЗ «Об обязательном страховании гражданской ответственности владельцев транспортных средств\" водители, причастные к ДТП при наличии всех перечисленных условий, указанных в ответах могут оформить документы о дорожно-транспортном происшествии без участия уполномоченных на то сотрудников полиции. (14.12.18 обновлены формулировки вопроса и вариантов ответа)","img":null,"tp":[22],"p":[]},{"t":20,"n":2,"q":"Можно ли Вам за перекрестком въехать во двор?","a":["Можно","Можно, если Вы обслуживаете предприятие, находящееся в этом доме","Нельзя"],"c":0,"tip":"Действие знака 4.1.1 «Движение прямо» в случае его установки перед пересечением проезжих частей (перекрёстком) распространяется только на первое пересечение за знаком. Поворот налево совершается вне зоны действия знака. Ничего противоречащего его выполнению нет. Въезжаете во двор по указанной траектории.(«Дорожные знаки»)","img":"i261.jpg","tp":[1],"p":[]},{"t":20,"n":3,"q":"Разрешается ли Вам остановка за знаком?","a":["Разрешается","Разрешается только для посадки (высадки) пассажира","Запрещается"],"c":2,"tip":"Табличка 8.2.4 «Зона действия», установленная под знаком 3.27 «Остановка запрещена», указывает, что зона действия запрещающего знака распространяется и до знака, и после знака.Поэтому остановка в указанном месте Правилами запрещена.(«Дорожные знаки»)","img":"i262.jpg","tp":[1],"p":[]},{"t":20,"n":4,"q":"Какие из указанных знаков запрещают дальнейшее движение без остановки?","a":["А и Г","Б и В","В и Г","Все"],"c":1,"tip":"Проезд без остановки запрещают: знак «Б» - 3.17.1 «Таможня» и знак «В» - 3.17.3 «Контроль».(«Дорожные знаки»)","img":"i263.jpg","tp":[1],"p":[]},{"t":20,"n":5,"q":"Чем необходимо руководствоваться, если нанесенные на проезжей части белые и оранжевые линии разметки противоречат друг другу?","a":["Белыми линиями разметки","Оранжевыми линиями разметки","Правила эту ситуацию не регламентируют"],"c":1,"tip":"Постоянная разметка имеет белый цвет. Временная - оранжевый цвет. В случаях, когда линии временной разметки и линии постоянной разметки противоречат друг другу, водители должны руководствоваться линиями временной разметки.(«Горизонтальная разметка»)","img":null,"tp":[2],"p":[]},{"t":20,"n":6,"q":"Вы намеревались проехать перекресток в прямом направлении. Как следует поступить, если Вы не успели заранее перестроиться на левую полосу?","a":["Остановиться перед стоп-линией и дождаться зеленого сигнала светофора","Выехать за стоп-линию, перестроиться на левую полосу и остановиться перед пересекаемой проезжей частью","Повернуть направо"],"c":2,"tip":"В данном случае ничего не поделаешь. И знак 5.15.1 «Направления движения по полосам», и светофор с дополнительной секцией обязывают Вас с крайней правой полосы совершить поворот направо.(«Дорожные знаки», пункт 6.3 ПДД)","img":"i264.jpg","tp":[3],"p":["6.3"]},{"t":20,"n":7,"q":"Какой знак используется для обозначения транспортного средства при вынужденной остановке в местах, где с учетом условий видимости оно не может быть своевременно замечено другими водителями?","a":["А","Б","В"],"c":0,"tip":"Знак аварийной остановки «А».(Пункт 7.2 ПДД)","img":"i265.jpg","tp":[25],"p":["7.2"]},{"t":20,"n":8,"q":"Вам можно выполнить поворот налево:","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":2,"tip":"Знак 5.15.1 - «Направления движения по полосам» разрешает поворот налево из крайней левой полосы и средней. Указанные траектории наглядно показывают, как его следует осуществлять с любой из перечисленных полос. При повороте соблюдайте выбранную рядность.(«Дорожные знаки», пункт 8.5 ПДД)","img":"i266.jpg","tp":[4],"p":["8.5"]},{"t":20,"n":9,"q":"Разрешается ли Вам выполнить разворот с заездом во двор задним ходом?","a":["Разрешается","Разрешается, если при этом не будут созданы помехи другим участникам движения","Запрещается"],"c":1,"tip":"Ничего противоречащего выполнению разворота подобным способом в данной ситуации нет. Движение задним ходом запрещается на перекрёстках. Здесь же используется прилегающая территория (въезд во двор через арку). Осуществляемый маневр должен быть безопасен и не создавать помех другим участникам движения.(Пункты 1.2, 8.12 ПДД)","img":"i267.jpg","tp":[4],"p":["1.2","8.12"]},{"t":20,"n":10,"q":"Укажите расстояние, под которым в Правилах понимается дистанция:","a":["Только А","Только Б","Только В","А и В"],"c":1,"tip":"Расстояние «Б» - дистанция между попутными транспортными средствами. Расстояние «А» - интервал между встречными транспортными средствами, расстояние «В» - интервал между попутными транспортными средствами.(Пункт 9.10 ПДД)","img":"i268.jpg","tp":[13],"p":["9.10"]},{"t":20,"n":11,"q":"Можно ли Вам начать обгон грузового автомобиля в данной ситуации?","a":["Можно","Можно, только после проезда дорожного знака","Нельзя"],"c":2,"tip":"В данной ситуации Вам обгон грузового автомобиля начинать нельзя, хотя зона запрещения обгона заканчивается. Причина - водителю запрещается выполнять обгон, если ТС, движущееся впереди, в данном случае грузовик, уже производит обгон.(Пункт 11.2 ПДД)","img":"i269.jpg","tp":[6],"p":["11.2"]},{"t":20,"n":12,"q":"Разрешена ли стоянка автобусам на краю тротуара, граничащего с проезжей частью?","a":["Да","Разрешена только с частичным заездом на тротуар","Разрешена только маломестным автобусам","Нет"],"c":3,"tip":"Такой способ постановки на стоянку не допускается всем видам автобусов.(Пункт 12.2 ПДД)","img":null,"tp":[7],"p":["12.2"]},{"t":20,"n":13,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Только встречному автомобилю","Только пешеходам","Встречному автомобилю и пешеходам"],"c":2,"tip":"Перекрёсток регулируемый. При повороте налево Вы обязаны уступить дорогу легковому автомобилю, движущемуся прямо со встречного направления, и пешеходам, переходящим проезжую часть дороги, на которую поворачиваете.(Пункты 13.1, 13.4 ПДД)","img":"i270.jpg","tp":[8],"p":["13.1","13.4"]},{"t":20,"n":14,"q":"При повороте направо Вам следует:","a":["Уступить дорогу легковому автомобилю","Проехать перекресток первым"],"c":1,"tip":"Перекрёсток равнозначный. При определении порядка проезда перекрёстка водители руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает. У Вас помеха справа отсутствует, проезжаете перекрёсток первым.(Пункт 13.11 ПДД)","img":"i271.jpg","tp":[8],"p":["13.11"]},{"t":20,"n":15,"q":"Кому Вы обязаны уступить дорогу?","a":["Автобусу и мотоциклу","Легковому автомобилю и автобусу","Всем транспортным средствам"],"c":2,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Транспортные средства, находящиеся на главной дороге, имеют преимущество, между собой руководствуются «правилом правой руки». После их проезда этим же правилом пользуются транспортные средства, находящиеся на второстепенной дороге. Первым проезжает мотоциклист, вторым - автобус, далее легковой автомобиль. Вы последним, уступив всем транспортным средствам.(«Дорожные знаки», пункты 13.9, 13.10, 13.11 ПДД)","img":"i272.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":20,"n":16,"q":"В данной ситуации Вы должны остановиться:","a":["У знака «Движение без остановки запрещено»","У знака «Однопутная железная дорога»","За 5 м до ближайшего рельса"],"c":0,"tip":"Знак 2.5 - «Движение без остановки запрещено» установлен перед железнодорожным переездом. В этом случае при запрещении движения водитель должен остановиться перед стоп-линией, а при ее отсутствии (как в данной ситуации) - перед знаком. Выезд за знак будет грубым нарушением Правил.(«Дорожные знаки», пункт 15.4 ПДД)","img":"i273.jpg","tp":[14],"p":["15.4"]},{"t":20,"n":17,"q":"Противотуманные фары и задние противотуманные фонари могут быть включены одновременно:","a":["Только в тумане","В условиях недостаточной видимости","В условиях ограниченной видимости"],"c":1,"tip":"В условиях «недостаточной видимости» - видимости дороги менее 300 м в условиях тумана, дождя, снегопада и т. п., а также в сумерки, согласно пунктам 19.4 и 19.7 ПДД могут применяться противотуманные фары и противотуманные фонари, как раздельно, так и одновременно.(Пункты 19.4, 19.7 ПДД)","img":null,"tp":[10],"p":["19.4","19.7"]},{"t":20,"n":18,"q":"Какие меры административного принуждения предусмотрены за управление транспортным средством, на котором установлены стекла (в том числе покрытые прозрачными цветными пленками), светопропускание которых не соответствует требованиям технического регламента о безопасности колесных транспортных средств?","a":["Штраф в размере 500 рублей","Задержание транспортного средства и штраф в размере 1000 рублей","Штраф в размере 1500 рублей или лишение права управления транспортными средствами на срок от 1 до 3 месяцев"],"c":0,"tip":"Согласно ст. 12.5 ч.31 КоАП РФ, за управление ТС, на котором установлены стекла (в т.ч. покрытые прозрачными цветными пленками), светопропускание которых не соответствует требованиям технического регламента о безопасности колесных ТС, водитель наказывается только штрафом в размере 500 руб.","img":null,"tp":[21],"p":[]},{"t":20,"n":19,"q":"Как правильно произвести экстренное торможение, если автомобиль оборудован антиблокировочной тормозной системой?","a":["Путем прерывистого нажатия на педаль тормоза","Путем нажатия на педаль тормоза до упора и удерживания ее до полной остановки","Путем использования стояночной тормозной системы"],"c":1,"tip":"Антиблокировочная система (ABS) - является частью современной тормозной системы автомобиля. ABS - предотвращает блокировку колёс во время торможения, тем самым сохраняя управляемость и курсовую устойчивость автомобиля, что очень важно для исключения «юза» и «заноса» и в момент экстренного торможения.Неадекватное дорожной обстановке применение «экстренного» торможения тоже может быть причиной ДТП. Поэтому контролируйте ситуацию в этот момент не только спереди по ходу Вашего движения, но и за Вами.(«Техника управления автомобилем»)","img":null,"tp":[12],"p":[]},{"t":20,"n":20,"q":"При движении по какому участку дороги действие сильного бокового ветра наиболее опасно?","a":["По закрытому деревьями","При выезде с закрытого участка на открытый","По открытому"],"c":1,"tip":"Действие сильного бокового ветра на Т.С. наиболее опасно в ситуации - при выезде с закрытого участка на открытый.В этом случае необходимо быть готовым, чтобы скорректировать боковое усилие ветра.","img":null,"tp":[12],"p":[]},{"t":21,"n":1,"q":"Разрешается ли водителю пользоваться телефоном во время движения?","a":["Разрешается","Разрешается только при использовании технического устройства, позволяющего вести переговоры без использования рук","Разрешается только при движении со скоростью менее 20 км/ч","Запрещается"],"c":1,"tip":"Водителю запрещается пользоваться во время движения телефоном, не оборудованном техническим устройством, позволяющим вести переговоры без использования рук.(Пункт 2.7 ПДД)","img":null,"tp":[22],"p":["2.7"]},{"t":21,"n":2,"q":"Этот знак предупреждает о приближении к перекрестку, на котором Вы:","a":["Имеете право преимущественного проезда","Должны уступить дорогу всем транспортным средствам, движущимся по пересекаемой дороге","Должны уступить дорогу только транспортным средствам, приближающимся справа"],"c":2,"tip":"Данная ситуация на первый взгляд очень проста. Знак 1.6 «Пересечение равнозначных дорог» предупреждает, что через 50-100 м будет находиться равнозначный перекрёсток, при определении порядка проезда которого водители будут руководствоваться «правилом правой руки», т.е. у кого из них окажется помеха справа, тот обязательно уступит дорогу.(«Дорожные знаки», пункт 13.11 ПДД). Но до этого перекрёстка видим: находится крутой поворот, дальнейшая видимость ограничена, что представляет для водителя первостепенную опасность, но о чём Вы преждевременно не проинформированы. К сожалению, в практике таких недостатков в организации дорожного движения очень много, что существенно влияет на нашу дорожную безопасность.","img":"i274.jpg","tp":[1],"p":["13.11"]},{"t":21,"n":3,"q":"Данный знак запрещает движение:","a":["Всем транспортным средствам с прицепами","Грузовым автомобилям и тракторам с прицепами, а также всем транспортным средствам, осуществляющим буксировку","Только транспортным средствам, осуществляющим буксировку"],"c":1,"tip":"Знак 3.7 «Движение с прицепом запрещено» запрещает движение грузовых автомобилей и тракторов с прицепом любого типа, а также буксировку механических транспортных средств.(«Дорожные знаки»)","img":"i275.jpg","tp
