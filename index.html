":[1],"p":[]},{"t":21,"n":4,"q":"Какой из указанных знаков информирует о начале дороги с реверсивным движением?","a":["А","Б","В"],"c":2,"tip":"Знак «В» - 5.8 «Реверсивное движение».(«Дорожные знаки»)","img":"i276.jpg","tp":[1],"p":[]},{"t":21,"n":5,"q":"Эта вертикальная разметка:","a":["Запрещает стоянку транспортных средств","Запрещает остановку транспортных средств","Обозначает бордюры на опасных участках дорог"],"c":2,"tip":"Вертикальная разметка 2.7 обозначает бордюры на опасных участках дорог.","img":"i277.jpg","tp":[2],"p":[]},{"t":21,"n":6,"q":"Разрешено ли Вам за перекрестком выехать на полосу с реверсивным движением?","a":["Разрешено","Разрешено, только для последующего поворота налево или разворота","Запрещено"],"c":2,"tip":"При выключенных сигналах реверсивного светофора, который расположен над полосой, обозначенной с обеих сторон разметкой 1.9, въезд на эту полосу запрещён.(Пункт 6.7 ПДД)","img":"i278.jpg","tp":[3],"p":["6.7"]},{"t":21,"n":7,"q":"Такой сигнал рукой, подаваемый водителем легкового автомобиля, информирует Вас:","a":["О его намерении повернуть налево или выполнить разворот","О его намерении остановиться и уступить дорогу грузовому автомобилю","О приближающемся слева транспортном средстве"],"c":0,"tip":"Сигналу левого поворота (разворота) соответствует вытянутая в сторону левая рука (как в данной ситуации), либо правая, вытянутая в сторону и согнутая в локте под прямым углом вверх.(Пункт 8.1 ПДД)","img":"i279.jpg","tp":[4],"p":["8.1"]},{"t":21,"n":8,"q":"При повороте налево для въезда во двор Вы обязаны уступить дорогу:","a":["Только велосипедисту","Только пешеходам","Пешеходам и велосипедисту"],"c":2,"tip":"При съезде с дороги, водитель должен уступить дорогу пешеходам и велосипедистам, путь движения которых он пересекает.(Пункт 8.3 ПДД)","img":"i280.jpg","tp":[4],"p":["8.3"]},{"t":21,"n":9,"q":"Движение транспортных средств задним ходом разрешается:","a":["На перекрестках","На дорогах с односторонним движением","На пешеходных переходах","В местах остановок маршрутных транспортных средств"],"c":1,"tip":"Из перечисленных мест только на дороге с односторонним движением разрешается движение задним ходом.(Пункт 8.12 ПДД)","img":null,"tp":[4],"p":["8.12"]},{"t":21,"n":10,"q":"В каких направлениях Вам разрешается продолжить движение по крайней левой полосе на грузовом автомобиле с разрешенной максимальной массой более 3,5 т?","a":["Только налево","Налево и в обратном направлении","Прямо, налево и в обратном направлении"],"c":1,"tip":"При наличии трёх полос и более в данном направлении водитель грузовика, разрешённая максимальная масса которого более 2,5 т, может выезжать на крайнюю левую полосу только для поворота налево и разворота. Данные знаки особых предписаний, разрешающие поворот налево из крайней левой полосы, разрешают и разворот. Вам, при управлении грузовым автомобилем р.м.м. которого более 3,5 т, можно с данной полосы повернуть налево или развернуться для движения в обратном направлении.(«Дорожные знаки», пункт 9.4 ПДД)","img":"i281.jpg","tp":[13],"p":["9.4"]},{"t":21,"n":11,"q":"Вы можете начать обгон:","a":["На переезде","Непосредственно после переезда","Через 100 м после переезда"],"c":1,"tip":"Обгон запрещён на железнодорожных переездах и ближе чем за 100 м перед ними. Сразу же после проезда границы железнодорожного переезда (в данной ситуации стойки со знаками и светофором за переездом) можете приступать к обгону.(Пункт 11.4 ПДД)","img":"i282.jpg","tp":[6],"p":["11.4"]},{"t":21,"n":12,"q":"В каком месте Вам следует поставить автомобиль на стоянку с правой стороны дороги?","a":["Непосредственно перед пересечением проезжих частей","Непосредственно после пересечения проезжих частей","Не ближе 5 м от края пересекаемой проезжей части"],"c":2,"tip":"Остановка и стоянка запрещается - на пересечении проезжих частей и ближе 5 м от края проезжей части.(Пункт 12.4 ПДД)","img":"i283.jpg","tp":[7],"p":["12.4"]},{"t":21,"n":13,"q":"Кому Вы должны уступить дорогу при повороте налево?","a":["Только мотоциклу","Только автомобилю с включенными проблесковым маячком и специальным звуковым сигналом","Обоим транспортным средствам"],"c":2,"tip":"Перекрёсток регулируемый. Знаки приоритета «не работают». Первым на красный сигнал светофора выезжает на перекрёсток «оперативник» (от сигналов светофора он имеет право отступать) с включенными проблесковым маячком и специальным звуковым сигналом, которому остальные обязаны обеспечить беспрепятственный проезд. При повороте налево Вы уступаете дорогу мотоциклисту, движущемуся прямо со стороны встречного направления. Проезжаете перекрёсток последним, уступая обоим транспортным средствам.(Пункты 3.1, 3.2, 13.3, 13.4 ПДД)","img":"i284.jpg","tp":[8],"p":["13.3","13.4","3.1","3.2"]},{"t":21,"n":14,"q":"Вы намерены повернуть налево. Ваши действия?","a":["Проедете перекресток первым","Проедете перекресток одновременно со встречным автомобилем до проезда мотоцикла","Проедете перекресток последним"],"c":2,"tip":"Перекрёсток равнозначный. Водители между собой руководствуются «правилом правой руки». У Вас помеха справа. У мотоциклиста тоже. Отсутствует помеха справа у водителя легкового автомобиля, траектория движения которого не пересекается с Вашей. Он проезжает первым, мотоциклист - вторым, Вы - последним.(Пункт 13.11 ПДД)","img":"i285.jpg","tp":[8],"p":["13.11"]},{"t":21,"n":15,"q":"Как Вам следует поступить при движении в прямом направлении?","a":["Уступить дорогу грузовому автомобилю, выезжающему с грунтовой дороги","Проехать перекресток первым"],"c":1,"tip":"В прямом направлении дорога с твердым покрытием. Грузовик будет выезжать на перекресток с грунтовой дороги, которая в данной ситуации является второстепенной. Перекресток неравнозначный. Вы двигаетесь по главной дороге, поэтому проезжаете перекресток первым.(Пункты 1.2 термин «Главная дорога», 13.9 ПДД)","img":"i286.jpg","tp":[8],"p":["1.2","13.9"]},{"t":21,"n":16,"q":"При выезде из жилой зоны необходимо уступить дорогу:","a":["Только транспортным средствам с включенным проблесковым маячком","Только транспортным средствам, приближающимся слева","Только транспортным средствам, приближающимся справа","Всем транспортным средствам"],"c":3,"tip":"При выезде из жилой зоны водители должны уступить дорогу другим участникам движения, в том числе всем транспортным средствам.(Пункт 17.3 ПДД)","img":null,"tp":[9],"p":["17.3"]},{"t":21,"n":17,"q":"В зоне действия каких знаков Правила разрешают подачу звуковых сигналов только для предотвращения дорожно-транспортного происшествия?","a":["Только А","Только Б","А и Б","А и В"],"c":2,"tip":"В зоне действия знаков 5.23.1 и 5.23.2 «Начало населённого пункта» (с белым фоном) и 3.26 «Подача звукового сигнала запрещена» запрещается подача звукового сигнала, кроме случаев предупреждения дорожно-транспортного происшествия (ДТП).(«Дорожные знаки», пункт 19.10 ПДД)","img":"i287.jpg","tp":[10],"p":["19.10"]},{"t":21,"n":18,"q":"Какие административные наказания предусмотрены за управление транспортным средством, если обязательное страхование гражданской ответственности владельца этого транспортного средства заведомо отсутствует?","a":["Предупреждение или штраф в размере 500 рублей","Штраф в размере 800 рублей","Штраф в размере 1000 рублей или лишение права управления транспортными средствами на срок от 1 до 3 месяцев"],"c":1,"tip":"В случае, когда страховое свидетельство «ОСАГО» заведомо отсутствует, водитель привлекается, согласно ст. 12.37 ч. 2 КоАП, к административной ответственности - только к штрафу в размере 800 рублей.","img":null,"tp":[21],"p":[]},{"t":21,"n":19,"q":"В месте выезда из лесистого участка, где установлен знак «Боковой ветер», Вам следует:","a":["Уменьшить скорость и быть готовым к возможному отклонению автомобиля от заданного курса","Не изменяя скорости, сместиться ближе к центру дороги","Не изменяя скорости, сместиться ближе к обочине"],"c":0,"tip":"Вам следует уменьшить скорость и быть готовым к возможному отклонению автомобиля от сил бокового ветра.","img":"i288.jpg","tp":[12],"p":[]},{"t":21,"n":20,"q":"Каковы признаки кровотечения из крупной артерии и с чего начинается первая помощь при ее ранении?","a":["Кровь темного цвета вытекает из раны медленно. На рану накладывается давящая повязка, с указанием в записке времени наложения повязки.","Кровь ярко-алого цвета вытекает из раны пульсирующей или фонтанирующей струей. Артерия прижимается пальцами, затем в точках прижатия выше раны, максимально близко к ней, накладывается кровоостанавливающий жгут с указанием в записке времени наложения жгута.","Кровь вытекает из раны медленно. Накладывается кровоостанавливающий жгут ниже места ранения, с указанием в записке времени наложения жгута."],"c":1,"tip":"При ранении крупных артерий кровь ярко-алого цвета вытекает пульсирующей или фонтанирующей струей.В правильном ответе, эта особенность, что кровь ярко-алого цвета и указана. Останавливают кровотечение наложением жгута с указанием времени наложения.","img":null,"tp":[16],"p":[]},{"t":22,"n":1,"q":"Сколько перекрестков изображено на рисунке?","a":["Один","Два","Четыре"],"c":0,"tip":"В изображённой ситуации один четырехсторонний перекрёсток, образованный пересечением двух дорог.(Пункт 1.2 ПДД термин «Перекрёсток»)","img":"i289.jpg","tp":[0],"p":["1.2"]},{"t":22,"n":2,"q":"Какие из предупреждающих и запрещающих знаков являются временными?","a":["Только установленные на переносных опорах","Имеющие желтый фон, а также установленные на переносных опорах","Только установленные в местах производства дорожных работ"],"c":1,"tip":"Желтый фон на предупреждающих и запрещающих знаках, означает, что эти знаки являются временными. Временными являются и знаки, установленные на переносных опорах. (Дорожные знаки)","img":null,"tp":[1],"p":[]},{"t":22,"n":3,"q":"В каком случае из перечисленных при перевозке крупногабаритного груза Вам запрещено продолжить движение в прямом направлении?","a":["Если высота груза 4 м","Если габаритная высота автомобиля вместе с грузом 4 м","В обоих случаях"],"c":0,"tip":"Знак 3.13 «Ограничение высоты» запрещает движение транспортных средств, габаритная высота которых (с грузом или без него) больше указанной на знаке. Габарит по высоте определяется от проезжей части доверхней точки груза или ТС. В данном вопросе при перевозке груза высотой 4 м, общая высота автомобиля вместе с грузом превысит величину, указанную на знаке.Если высота автомобиля вместе с грузом равна 4 м (не превышает), то движение не запрещено.(«Дорожные знаки»)","img":"i290.jpg","tp":[1],"p":[]},{"t":22,"n":4,"q":"Что означают эти дорожные знаки?","a":["Стоянка разрешена транспортным средствам оперативных служб","Стоянка разрешена только с включенными габаритными огнями","Стоянка разрешена в субботние, воскресные и праздничные дни"],"c":2,"tip":"Табличка 8.5.1 «Субботние, воскресные и праздничные дни» указывает, что знак, с которым она применяется, действует только в вышеперечисленные дни.(«Дорожные знаки»)","img":"i291.jpg","tp":[1],"p":[]},{"t":22,"n":5,"q":"Допускается ли пересекать сплошную линию разметки обозначающую край проезжей части?","a":["Допускается для остановки на обочине и при выезде с неё","Допускается для остановки на обочине и при выезде с неё только в местах, где разрешается остановка и стоянка","Запрещается"],"c":1,"tip":"Сплошную линию горизонтальной разметки 1.2, обозначающую край проезжей части и располагающуюся справа от водителя, допускается пересекать для остановки транспортного средства на обочине и при выезде с неё только в местах, где соответственно разрешена остановка и стоянка.(«Горизонтальная разметка»)","img":null,"tp":[2],"p":[]},{"t":22,"n":6,"q":"В данной ситуации водитель автомобиля с включенными проблесковыми маячками:","a":["Должен ожидать разрешающего сигнала светофора","Может двигаться только прямо или направо","Может двигаться в любом направлении"],"c":2,"tip":"Водители транспортных средств с включенным проблесковым маячком синего цвета, выполняя неотложное служебное задание, могут отступать от требований сигналов светофоров, дорожных знаков, дорожной разметки, без исключения при условии обеспечения безопасности движения.«Оперативник» может двигаться в любом направлении по своему усмотрению.(Пункт 3.1 ПДД)","img":"i292.jpg","tp":[17],"p":["3.1"]},{"t":22,"n":7,"q":"Обязаны ли Вы в данной ситуации включить указатели левого поворота?","a":["Обязаны","Обязаны, если будете выполнять разворот","Не обязаны"],"c":0,"tip":"С крайней левой полосы Вы можете согласно знаку 4.1.6 «Движение направо или налево» совершить поворот налево или разворот. В любом случае Вы обязаны включить левые указатели поворота.(«Дорожные знаки», пункт 8.1 ПДД)","img":"i293.jpg","tp":[4],"p":["8.1"]},{"t":22,"n":8,"q":"По какой траектории Вам можно выполнить поворот налево?","a":["Только по А","Только по Б","По любой из указанных"],"c":1,"tip":"Поворачивая при выезде с пересечения проезжих частей, Вы не должны оказаться на стороне встречного движения. Поворот налево следует произвести по траектории «Б».(Пункт 8.6 ПДД)","img":"i294.jpg","tp":[4],"p":["8.6"]},{"t":22,"n":9,"q":"Разрешено ли водителю движение задним ходом на путепроводе для посадки пассажира?","a":["Разрешено","Разрешено, если при этом не будут созданы помехи другим участникам движения","Запрещено"],"c":2,"tip":"Движение задним ходом запрещается в местах, где запрещён разворот, и на перекрёстках. Разворот и, следовательно, движение задним ходом на мостах и путепроводах не допускается, т.е. запрещается.(Пункты 8.11, 8.12 ПДД)","img":"i295.jpg","tp":[4],"p":["8.11","8.12"]},{"t":22,"n":10,"q":"Разрешается ли использовать для движения трамвайные пути встречного направления?","a":["Разрешается","Разрешается, если при этом не будут созданы помехи встречным транспортным средствам","Разрешается только при объезде трамвая попутного направления","Запрещается"],"c":3,"tip":"Выезд на трамвайные пути встречного движения при любых обстоятельствах запрещён.(Пункт 9.6 ПДД)","img":null,"tp":[13],"p":["9.6"]},{"t":22,"n":11,"q":"Какие ограничения, относящиеся к обгону, действуют на железнодорожных переездах и вблизи них?","a":["Обгон запрещен только на переезде","Обгон запрещен на переезде и ближе чем за 100 м перед ним","Обгон запрещен на переезде и на расстоянии 100 м до и после него"],"c":1,"tip":"Обгон запрещен на железнодорожных переездах и ближе чем за 100 метров перед ними.(Пункт 11.4 ПДД)","img":null,"tp":[6],"p":["11.4"]},{"t":22,"n":12,"q":"Разрешено ли водителю грузового автомобиля остановиться в этом месте?","a":["Разрешено","Запрещено, если разрешенная максимальная масса автомобиля более 3,5 т","Запрещено"],"c":0,"tip":"Сочетание знаков 6.4 «Парковка (парковочное место) с табличкой 8.6.3 «Способ постановки транспортного средства на стоянку» касается легковых автомобилей и мотоциклов. В данном месте не запрещается производить остановку любых ТС на проезжей части.(Пункт 12.2 ПДД)","img":"i296.jpg","tp":[7],"p":["12.2"]},{"t":22,"n":13,"q":"Вы намерены повернуть налево. Ваши действия?","a":["Выполните маневр без остановки на перекрестке","Повернете налево и остановитесь в разрыве разделительной полосы, дождетесь разрешающего сигнала светофора на выезде с перекрестка и завершите маневр","Остановитесь перед перекрестком, дождетесь зеленого сигнала светофора на выезде с перекрестка и начнете выполнение маневра"],"c":0,"tip":"Перекрёсток регулируемый. При повороте налево Вам следует выехать в намеченном направлении, независимо от сигнала светофора на выезде с перекрестка.(Пункты 6.2, 13.7 ПДД)","img":"i297.jpg","tp":[8],"p":["13.7","6.2"]},{"t":22,"n":14,"q":"В каком случае Вы должны уступить дорогу трамваю?","a":["При повороте налево","При движении прямо","В обоих перечисленных случаях"],"c":2,"tip":"Перекрёсток равнозначный. Трамвай в равнозначных условиях имеет преимущество перед безрельсовыми транспортными средствами. Вы уступаете дорогу в обоих перечисленных случаях.(Пункт 13.11 ПДД)","img":"i298.jpg","tp":[8],"p":["13.11"]},{"t":22,"n":15,"q":"Вы намерены повернуть направо. Можете ли Вы приступить к повороту?","a":["Можете","Можете, когда убедитесь, что при этом не будут созданы помехи грузовому автомобилю","Не можете"],"c":1,"tip":"При повороте направо Вы должны двигаться по возможности ближе к правому краю проезжей части, т.е. по крайней правой полосе, которая свободна. Если Вы убеждены, что не создадите помеху находящемуся на главной дороге и имеющему преимущество грузовому автомобилю, выезжаете на перекрёсток, не дожидаясь его проезда через перекрёсток, так как знак 2.4 «Уступите дорогу» не предписывает совершать обязательную остановку перед пересечением.(Пункты 1.2 термин «Уступить дорогу», 13.9 ПДД, «Дорожные знаки»)","img":"i299.jpg","tp":[8],"p":["1.2","13.9"]},{"t":22,"n":16,"q":"Водители должны уступать дорогу другим участникам движения:","a":["При выезде из жилой зоны","При выезде с дворовой территории","В обоих перечисленных случаях"],"c":2,"tip":"При выезде из жилой зоны, дворовой территории водители должны уступать дорогу другим участникам движения. Правильный ответ - в обоих перечисленных случаях.(Пункты 17.3, 17.4 ПДД)","img":null,"tp":[9],"p":["17.3","17.4"]},{"t":22,"n":17,"q":"В каких случаях число перевозимых людей не должно превышать количества оборудованных для сидения мест?","a":["Только при перевозке в кузове грузового автомобиля","Только при перевозке в салоне автобуса, осуществляющего перевозку на междугородном, горном, туристическом или экскурсионном маршруте","Во всех перечисленных случаях"],"c":2,"tip":"Число перевозимых людей в кузове грузового автомобиля, а также в салоне автобуса, осуществляющего перевозку на междугородном, горном, туристическом или экскурсионном маршруте, и при организованной перевозке группы детей не должно превышать количества оборудованных для сидения мест (Пункт 22.3 ПДД)","img":null,"tp":[23],"p":["22.3"]},{"t":22,"n":18,"q":"При каком минимальном значении светопропускания ветрового стекла и стёкол, через которые обеспечивается передняя обзорность для водителя (за исключением оснащённых броневой защитой), разрешается эксплуатация транспортных средств:","a":["75 процентов","70 процентов","60 процентов"],"c":1,"tip":"Пункт 4.2 «Перечня неисправностей» запрещает эксплуатацию ТС, если на них установлены предметы или нанесены покрытия, ограничивающие обзорность с места водителя.Этот пункт касается передней обзорности ТС.Применение шторок на всех окнах автобусов, как боковых, так и задних, допускается, если этот автобус является туристическим. При этом задняя обзорность с места водителя должна быть обеспечена наличием наружных зеркал заднего вида, установленных с обеих сторон.","img":null,"tp":[11],"p":[]},{"t":22,"n":19,"q":"При каком стиле вождения будет обеспечен наименьший расход топлива?","a":["При резком ускорении и плавном замедлении","При плавном ускорении и резком замедлении","При плавном ускорении и плавном замедлении"],"c":2,"tip":"Плавное ускорение при разгоне и плавное замедление при торможении.","img":null,"tp":[12],"p":[]},{"t":22,"n":20,"q":"Если во время движения по сухой дороге с асфальтобетонным покрытием начал моросить дождь, водителю следует:","a":["Уменьшить скорость и быть особенно осторожным","Не изменяя скорости продолжить движение","Увеличить скорость и попытаться проехать как можно большее расстояние, пока не начался сильный дождь"],"c":0,"tip":"Капли дождя с пылью, частичками грязи образуют «плёнку», которая резко понижает коэффициент сцепления колёс с дорогой, что может стать причиной заноса автомобиля. В это время необходимо уменьшить скорость, быть внимательным и осмотрительным.","img":null,"tp":[12],"p":[]},{"t":23,"n":1,"q":"Сколько пересечений проезжих частей имеет этот перекресток?","a":["Одно","Два","Четыре"],"c":1,"tip":"Разделительная полоса примыкающей дороги справа делит данную дорогу на две проезжие части. Разметка 1.3 (двойная сплошная линия) такого права не имеет.Поэтому этот перекрёсток имеет два пересечения проезжих частей.(Пункт 1.2 ПДД термин «Разделительная полоса»)","img":"i300.jpg","tp":[0],"p":["1.2"]},{"t":23,"n":2,"q":"Данный дорожный знак:","a":["Предупреждает Вас о приближении к месту пересечения с трамвайной линией","Предупреждает Вас о приближении к трамвайной остановке","Обязывает Вас остановиться непосредственно перед пересечением с трамвайной линией"],"c":0,"tip":"Знак 1.5 «Пересечение с трамвайной линией» в населённом пункте устанавливается за 50 - 100 м до пересечения с трамвайной линией. Имейте ввиду, что вне перекрестка, где трамвайные пути пересекают проезжую часть, трамвай имеет преимущество перед безрельсовыми ТС, кроме случаев выезда из депо.(«Дорожные знаки». Пункт 18.1 ПДД)","img":"i301.jpg","tp":[1],"p":["18.1"]},{"t":23,"n":3,"q":"Эти знаки обязывают соблюдать дистанцию:","a":["Менее 70 м на протяжении 100 м","Не менее 70 м на протяжении 100 м","От 70 м до 100 м"],"c":1,"tip":"Знак 3.16 «Ограничение минимальной дистанции» запрещает движение транспортных средств с дистанцией между ними меньше указанной на знаке.Табличка 8.2.1 «Зона действия», установленная под знаком, указывает зону действия знака. В данном случае она равна 100 метрам от места установки знака.(«Дорожные знаки»)","img":"i302.jpg","tp":[1],"p":[]},{"t":23,"n":4,"q":"В каких направлениях Вам разрешено продолжить движение?","a":["Только прямо","Прямо или налево","Прямо, налево или в обратном направлении"],"c":1,"tip":"Со средней полосы, над которой расположен знак 5.15.2 «Направления движения по полосе», разрешается движение прямо и поворот налево. Разворот был бы разрешён в случае расположения ТС на крайней левой полосе.(«Дорожные знаки»)","img":"i303.jpg","tp":[1],"p":[]},{"t":23,"n":5,"q":"Разрешается ли Вам поставить автомобиль на стоянку в этом месте?","a":["Разрешается","Разрешается только с частичным заездом на тротуар","Запрещается"],"c":2,"tip":"Жёлтая прерывистая линия 1.10 горизонтальной разметки обозначает места и зону, где запрещена стоянка. Применяется самостоятельно, как в данной ситуации.(«Горизонтальная разметка»)","img":"i304.jpg","tp":[2],"p":[]},{"t":23,"n":6,"q":"Вам можно продолжить движение:","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":1,"tip":"В такой ситуации, когда перед перекрестком установлен светофор с дополнительной секцией, при этом включена зеленая стрелка с основным красным сигналом, а за светофором на дороге несколько проезжих частей, движение под дополнительную секцию разрешается только в первую проезжую часть за светофором, т. е. по траектории «Б».(Пункт 6.3 ПДД)","img":"i305.jpg","tp":[3],"p":["6.3"]},{"t":23,"n":7,"q":"Обязан ли водитель подавать сигналы указателями поворота при начале движения в жилой зоне, обозначенной соответствующим знаком?","a":["Обязан","Обязан только при наличии в непосредственной близости пешеходов","Не обязан"],"c":0,"tip":"Вне зависимости от того, где это происходит, присутствуют ли другие транспортные средства, при прочих обстоятельствах возьмите за обязательное для себя правило перед началом движения подавать соответствующий сигнал поворота.(Пункт 8.1 ПДД)","img":null,"tp":[4],"p":["8.1"]},{"t":23,"n":8,"q":"По какой траектории Вам разрешено продолжить движение?","a":["Только по А","По А или Б","По любой из указанных"],"c":0,"tip":"Встречное движение (таким является траектория «В») на перекрёстке, где организовано круговое движение, запрещено. Въезд на такой перекрёсток, как исключение из общего правила, можно производить с любой полосы проезжей части, предназначенной для движения в данном направлении. (Пункт 8.5 ПДД).При повороте направо транспортное средство должно двигаться по возможности ближе к правому краю проезжей части. (Пункт 8.6 ПДД).В показанной ситуации такая возможность есть, Вы продолжаете движение по траектории «А».","img":"i306.jpg","tp":[4],"p":["8.5","8.6"]},{"t":23,"n":9,"q":"На этом участке дороги Вам запрещается:","a":["Только разворот","Только обгон или объезд","Только перестроение на левую полосу с последующей остановкой на обочине","Любой маневр из перечисленных"],"c":2,"tip":"Вы двигаетесь со стороны прерывистой линии 1.11 горизонтальной разметки. Ее можно пересечь с данной стороны для разворота, обгона или объезда препятствия.Остановка с левой стороны дороги вне населенных пунктов запрещена.Поэтому Вам запрещается из перечисленных ответов перестроение на левую полосу с последующей остановкой на обочине.(«Горизонтальная разметка» 1.11, пункт 8.11 ПДД)","img":"i307.jpg","tp":[4],"p":["1.11","8.11"]},{"t":23,"n":10,"q":"Разрешается ли Вам выехать на трамвайные пути встречного направления в данной ситуации?","a":["Разрешается","Разрешается только при отсутствии встречного трамвая","Запрещается"],"c":2,"tip":"Вы двигаетесь по трамвайным путям попутного направления. Выезжать на трамвайные пути встречного направления запрещается.(Пункт 9.6 ПДД)","img":"i308.jpg","tp":[13],"p":["9.6"]},{"t":23,"n":11,"q":"В данной ситуации Вы:","a":["Должны уступить дорогу, так как препятствие находится на Вашей полосе движения","Должны уступить дорогу, так как встречный автомобиль движется на спуск","Имеете право проехать первым, так как Вы движетесь на подъем"],"c":2,"tip":"На подъёмах при наличии препятствия уступает дорогу водитель, движущийся на спуск. Вам обязан уступить дорогу водитель легкового автомобиля.(«Дорожные знаки», пункт 11.7 ПДД)","img":"i309.jpg","tp":[6],"p":["11.7"]},{"t":23,"n":12,"q":"На каком расстоянии от знака Вам разрешено поставить автомобиль на стоянку?","a":["Не менее 5 м","Не менее 10 м","Не менее 15 м"],"c":2,"tip":"Остановка и стоянка запрещаются ближе 15 м от мест остановки маршрутных транспортных средств, обозначенных разметкой 1.17 (жёлтая зигзагообразная), а при ее отсутствии - от указателя места остановки маршрутных транспортных средств. В изображенной ситуации расстояние от передней части автомобиля должно быть не менее 15 м.(Пункты 12.4, 12.5 ПДД)","img":"i310.jpg","tp":[7],"p":["12.4","12.5"]},{"t":23,"n":13,"q":"Как следует поступить в этой ситуации, если Вам необходимо повернуть направо?","a":["Остановиться и дождаться другого сигнала регулировщика","Повернуть направо, уступив дорогу пешеходам","Повернуть направо, имея преимущество в движении перед пешеходами"],"c":1,"tip":"Правая рука регулировщика вытянута вперед. Со стороны левого бока безрельсовым транспортным средствам разрешено движение во всех направлениях - прямо, направо, налево и разворот. При повороте направо Вы обязаны уступить дорогу пешеходам, переходящим проезжую часть, на которую поворачиваете.(Пункты 6.10, 13.1 ПДД)","img":"i311.jpg","tp":[8],"p":["13.1","6.10"]},{"t":23,"n":14,"q":"Вы намерены проехать перекресток в прямом направлении. В данной ситуации:","a":["Вы обязаны уступить дорогу легковому автомобилю","Вы имеете право проехать перекресток первым"],"c":1,"tip":"Перекрёсток равнозначный. Водители руководствуются «правилом правой руки», т.е. у кого помеха справа тот и уступает. Постоянно контролируя отсутствие помехи справа, проезжаете перекрёсток первым.(Пункты 13.11, 13.12 ПДД)","img":"i312.jpg","tp":[8],"p":["13.11","13.12"]},{"t":23,"n":15,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Обоим транспортным средствам","Только автобусу","Только легковому автомобилю","Никому"],"c":1,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Транспортные средства, находящиеся на главной дороге, имеют преимущество, между собой руководствуются «правилом правой руки». У Вас помеха справа - уступаете автобусу.(Пункты 13.9, 13.10, 13.11 ПДД)","img":"i313.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":23,"n":16,"q":"Разрешается ли водителю произвести остановку в этом месте в целях разгрузки транспортного средства?","a":["Разрешается","Разрешается, если остановка займет не более 5 минут","Разрешается, если не будут созданы помехи движению маршрутных транспортных средств","Запрещается"],"c":3,"tip":"Полоса для маршрутных транспортных средств отделена прерывистой линией разметки. В этом случае остановка допускается только в связи с посадкой или высадкой пассажиров, при условии, что остановка не создаст помех движению маршрутных транспортных средств, легковых такси, велосипедистов, «школьных автобусов». Другие случаи правилами не допускаются.(Пункт 18.2 ПДД, «Горизонтальная разметка» 1.23.1)","img":"i314.jpg","tp":[24],"p":["1.23","18.2"]},{"t":23,"n":17,"q":"В каком случае при движении в светлое время суток недостаточно включения дневных ходовых огней?","a":["Только при видимости дороги менее 300 м в условиях тумана, дождя или снегопада","Только при движении в тоннелях","В обоих перечисленных случаях"],"c":2,"tip":"В условиях недостаточной видимости (в том числе при видимости дороги при наличии тумана менее 300 м) должны быть включены фары дальнего или ближнего света фар, также и при движении в тоннелях, т.к. освещенности, особенно от светодиодных дневных ходовых огней, недостаточно.Правильный ответ - в обоих перечисленных случаях.(Пункт 19.1 ПДД)","img":null,"tp":[10],"p":["19.1"]},{"t":23,"n":18,"q":"Что требуется для возврата водительского удостоверения после истечения срока лишения права управления, назначенного за оставление водителем в нарушение Правил дорожного движения места дорожно-транспортного происшествия, участником которого он являлся?","a":["Только проверка знания водителем Правил дорожного движения","Проверка знания водителем Правил дорожного движения и уплата наложенных на него штрафов за административные правонарушения в области дорожного движения","Проверка знания водителем Правил дорожного движения и медицинское освидетельствование его на наличие медицинских противопоказаний к управлению транспортным средством"],"c":1,"tip":"Для возврата водительского удостоверения после истечения срока лишения права управления, назначенного за оставление водителем в нарушение Правил дорожного движения места дорожно-транспортного происшествия, участником которого он являлся, необходимо: пройти проверку знаний водителем Правил дорожного движения и уплату наложенных на него штрафов за административные правонарушения в области дорожного движения.(Ст. 32.6, ч.4.1; ст. 12.27 ч.2; глава 12 КоАП)","img":null,"tp":[21],"p":[]},{"t":23,"n":19,"q":"Чем опасно длительное торможение с выключенными передачей или сцеплением на крутом спуске?","a":["Значительно увеличивается износ протектора шин","Повышается износ деталей тормозных механизмов","Перегреваются тормозные механизмы и уменьшается эффективность торможения"],"c":2,"tip":"В случаях перегрева тормозных механизмов может произойти закипание тормозной жидкости, что приведёт к полному отказу тормозов.","img":null,"tp":[12],"p":[]},{"t":23,"n":20,"q":"Как изменяется поле зрения водителя с увеличением скорости движения?","a":["Расширяется","Не изменяется","Сужается"],"c":2,"tip":"С увеличением скорости поле зрения водителя сужается, так как водитель вынужден смотреть намного дальше вперед, чтобы успеть оценить ситуацию в стремительно меняющейся дорожной обстановке","img":null,"tp":[12],"p":[]},{"t":24,"n":1,"q":"При движении на автобусе, оборудованном ремнями безопасности, должны быть пристегнуты:","a":["Только водитель","Водитель и пассажир на переднем сиденье","Все лица, находящиеся в автобусе"],"c":2,"tip":"Пункт ПДД 2.1.2 и 5.1 обязывает всех водителей и пассажиров ТС, оборудованных ремнями безопасности, во время движения быть пристегнутыми. Это правило касается и всех видов автобусов.","img":null,"tp":[22],"p":[]},{"t":24,"n":2,"q":"Эти знаки предупреждают Вас:","a":["О приближении к железнодорожному переезду с тремя путями","О наличии через 150 – 300 м железнодорожного переезда без шлагбаума","О наличии через 50 – 100 м железнодорожного переезда"],"c":1,"tip":"На одной стойке размещены два предупреждающих знака. Нижний знак 1.4.1 «Приближение к железнодорожному переезду» устанавливается только вне населённых пунктов на расстоянии 150 - 300 м до железнодорожного переезда. Верхний знак 1.2 «Железнодорожный переезд без шлагбаума» вне населённого пункта устанавливается на таком же расстоянии. Такое сочетание знаков предупреждает, что Вы приближаетесь к железнодорожному переезду без шлагбаума, расстояние до которого не менее 150 м.(«Дорожные знаки»)","img":"i315.jpg","tp":[1],"p":[]},{"t":24,"n":3,"q":"Разрешено ли Вам поставить автомобиль на стоянку в этом месте?","a":["Разрешено","Разрешено, если Вы обслуживаете предприятие, находящееся рядом с этим местом","Запрещено"],"c":0,"tip":"В указанном месте можете «парковаться», так как действие знака 3.27 «Остановка запрещена» распространяется согласно табличке 8.2.3 «Зона действия» до знака.","img":"i316.jpg","tp":[1],"p":[]},{"t":24,"n":4,"q":"Какие из указанных знаков обязывают водителя грузового автомобиля с разрешенной максимальной массой более 3,5 т повернуть направо?","a":["Только А","Только Б","А и Б","Б и В"],"c":1,"tip":"Только требования предписывающего знака «Б» - 4.1.2 «Движение направо» - из обозначенных обязательны для всех транспортных средств. От его действий могут отступать маршрутные транспортные средства: трамвай, троллейбус, автобус.Действие знака «А» - 5.7.1 «Выезд на дорогу с односторонним движением» - не запрещает пересечение данной дороги любым транспортным средством.Знак «В» - 6.15.2 «Направление движения для грузовых автомобилей» - является рекомендательным для грузовых автомобилей, тракторов, самоходных машин, если на перекрёстке их движение в одном из направлений запрещено.(«Дорожные знаки»)","img":"i317.jpg","tp":[1],"p":[]},{"t":24,"n":5,"q":"Данная разметка обозначает:","a":["Место, где начинается (заканчивается) жилая зона","Искусственную неровность на проезжей части","Место, где начинается (заканчивается) зона с ограничением стоянки"],"c":1,"tip":"Горизонтальная разметка 1.25 обозначает искусственную неровность на проезжей части (так называемый «лежащий полицейский»).","img":"i318.jpg","tp":[2],"p":[]},{"t":24,"n":6,"q":"Что означает мигание желтого сигнала светофора?","a":["Предупреждает о неисправности светофора","Разрешает движение и информирует о наличии нерегулируемого перекрестка или пешеходного перехода","Запрещает дальнейшее движение"],"c":1,"tip":"Жёлтый мигающий сигнал разрешает движение и информирует о наличии нерегулируемого перекрёстка или пешеходного перехода, предупреждает участников дорожного движения об опасности.(Пункт 6.2 ПДД)","img":null,"tp":[3],"p":["6.2"]},{"t":24,"n":7,"q":"Какую ошибку совершает водитель, въезжающий во двор?","a":["Поворачивает в зоне действия знака «Движение прямо»","Поворачивает, не включив указатели поворота","Совершает обе перечисленные ошибки"],"c":1,"tip":"Знак 4.1.1 «Движение прямо», установленный за пересечением проезжих частей, не запрещает совершать поворот направо во дворы и на другие прилегающие территории. Перед тем, как выполнить указанный маневр, водитель должен включить соответствующий указатель поворота, т.е. проинформировать о своих намерениях других водителей. Такие ошибки не редки. Обычно их совершают водители, которые привыкают к одиночеству на дорогах с малым движением или неправильно подготовленные.(«Дорожные знаки», пункт 8.1 ПДД)","img":"i319.jpg","tp":[4],"p":["8.1"]},{"t":24,"n":8,"q":"Должны ли Вы уступить дорогу грузовому автомобилю в данной ситуации?","a":["Должны","Должны, если он намерен повернуть направо","Не должны"],"c":2,"tip":"Грузовик при выезде с прилегающей к дороге территории обязан уступить дорогу транспортным средствам, движущимся по дороге. Преимущество Ваше.(Пункт 8.3 ПДД)","img":"i320.jpg","tp":[4],"p":["8.3"]},{"t":24,"n":9,"q":"Разрешается ли Вам выполнить разворот?","a":["Разрешается","Разрешается только по траектории А","Разрешается только по траектории Б","Запрещается"],"c":1,"tip":"Производить разворот на перекрестках, обозначенных знаком 5.7.2 «Выезд на дорогу с односторонним движением» (траектория «А») разрешается.Разворот по траектории «Б» совершать нельзя, т.к. он запрещен на пешеходных переходах. В данном случае границами пешеходного перехода являются знаки 5.19.1, 5.19.2 «Пешеходный переход»(«Дорожные знаки», пункт 8.11 ПДД)","img":"i321.jpg","tp":[4],"p":["8.11"]},{"t":24,"n":10,"q":"С какой максимальной скоростью Вы имеете право продолжить движение вне населенных пунктов, если перевозите людей в кузове грузового автомобиля с разрешенной максимальной массой более 3,5 т?","a":["60 км/ч","70 км/ч","90 км/ч"],"c":0,"tip":"При перевозке людей в кузове грузового автомобиля, независимо от его р.м.м. данный автомобиль может двигаться со скоростью не более 60 км/ч.(Пункт 10.3 ПДД)","img":"i322.jpg","tp":[5],"p":["10.3"]},{"t":24,"n":11,"q":"Разрешено ли Вам выполнить обгон?","a":["Разрешено","Разрешено, если скорость грузового автомобиля менее 30 км/ч","Запрещено"],"c":2,"tip":"Знак 3.20 «Обгон запрещён» запрещает обгон всех транспортных средств, кроме тихоходных ТС., гужевых повозок, мопедов и двухколесных мотоциклов без бокового прицепа.Обгон грузового автомобиля запрещён.(«Дорожные знаки»)","img":"i323.jpg","tp":[6],"p":[]},{"t":24,"n":12,"q":"Кто из водителей грузовых автомобилей нарушил правила стоянки?","a":["Оба","Только водитель автомобиля А","Только водитель автомобиля Б","Никто не нарушил"],"c":0,"tip":"В местном уширении проезжей части с помощью комбинации знака 6.4 «Парковка (парковочное место)» и таблички 8.6.4 «Способ постановки транспортного средства» организовано место стоянки только легковых автомобилей, мотоциклов. При этом они должны располагаться перпендикулярно краю проезжей части. Оба водителя нарушают правила.(«Дорожные знаки»)","img":"i324.jpg","tp":[7],"p":[]},{"t":24,"n":13,"q":"При повороте налево Вы:","a":["Должны уступить дорогу обоим транспортным средствам","Должны уступить дорогу только легковому автомобилю","Имеете право проехать перекресток первым"],"c":0,"tip":"Перекрёсток регулируемый. Всем трем ТС разрешено движение. Трамвай в равнозначных условиях имеет преимущество перед безрельсовыми ТС. Он проезжает первым. Вы - при повороте налево обязаны уступить автомобилю, движущемуся навстречу прямо.Правильный ответ - должны уступить дорогу обоим транспортным средствам.(Пункты 6.2, 13.4, 13.6 ПДД)","img":"i325.jpg","tp":[8],"p":["13.4","13.6","6.2"]},{"t":24,"n":14,"q":"Кто имеет право проехать перекресток первым, если все намерены двигаться прямо?","a":["Водитель троллейбуса","Вы вместе с водителем троллейбуса","В данной ситуации очередность проезда определяется по взаимной договоренности водителей"],"c":2,"tip":"Перекрёсток равнозначный. Мигающий маячок жёлтого цвета водителю грузовика преимущества не предоставляет (пункт 3.4 ПДД). «Правило правой руки» не применить, так как у всех помеха справа. Действительно, объяснения такой ситуации в Правилах нет. Водителям следует по договорённости обеспечить беспрепятственный проезд только одного транспортного средства, а далее начнёт действовать «правило правой руки».","img":"i326.jpg","tp":[8],"p":["3.4"]},{"t":24,"n":15,"q":"В каком случае Вы обязаны уступить дорогу пешеходам?","a":["Только при повороте налево","Только при повороте направо","В обоих случаях"],"c":2,"tip":"При проезде любых перекрёстков с поворотом налево или направо водитель обязан уступить дорогу пешеходам, переходящим проезжую часть дороги, на которую он поворачивает.(Пункт 13.1 ПДД)","img":"i327.jpg","tp":[8],"p":["13.1"]},{"t":24,"n":16,"q":"В данной ситуации Вы должны остановиться:","a":["Около светофора или шлагбаума","Не ближе 5 м от светофора или шлагбаума","Не ближе 10 м до ближайшего рельса"],"c":1,"tip":"Запрещается выезд на переезд при закрытом шлагбауме независимо от сигнала светофора.(Пункт 15.4 ПДД)","img":"i328.jpg","tp":[14],"p":["15.4"]},{"t":24,"n":17,"q":"На каком расстоянии до встречного транспортного средства следует переключать дальний свет фар на ближний?","a":["Не менее чем за 150 м","Не менее чем за 300 м","По усмотрению водителя"],"c":0,"tip":"Переключиться с дальнего света фар на ближний при разъезде со встречным транспортным средством следует на расстоянии не менее чем 150 м, а если водитель встречного транспортного средства периодическим «миганием» света фар попросит Вас об этом и на большем расстоянии - переключайтесь. Вам будут благодарны. Ослепление неприятно физически и небезопасно, в том числе и для Вас.(Пункт 19.2 ПДД)","img":null,"tp":[10],"p":["19.2"]},{"t":24,"n":18,"q":"В каком случае разрешается эксплуатация грузового автомобиля?","a":["Имеются видимые разрушения, короткие замыкания и следы пробоя изоляции электрических проводов","Не работает указатель температуры охлаждающей жидкости","Государственный регистрационный знак, способ и место его установки не отвечают требованиям национального стандарта","Отсутствуют опознавательные знаки, которые должны быть на нем установлены"],"c":1,"tip":"Эксплуатация ТС не запрещается при неисправности - не работает (или конструктивно отсутствует) указатель температуры охлаждающей жидкости.В остальных ответах, согласно пунктов 9.6, 10.1 и 10.2 «Перечня неисправностей» эксплуатация запрещается.","img":null,"tp":[11],"p":[]},{"t":24,"n":19,"q":"Что следует сделать водителю, чтобы предотвратить возникновение заноса при проезде крутого поворота?","a":["Перед поворотом снизить скорость и выжать педаль сцепления, чтобы дать возможность автомобилю двигаться накатом на повороте","Перед поворотом снизить скорость, при необходимости включить пониженную передачу, а при проезде поворота не увеличивать резко скорость и не тормозить","Допускаются любые из перечисленных действий"],"c":1,"tip":"Чтобы предотвратить возникновение заноса при проезде крутого поворота, который возникает с помощью центробежной силы, необходимо до вхождения в поворот занять правильное расположение ТС на проезжей части так, чтобы траектория движения в повороте проходила по большему радиусу кривизны, снизить скорость (приблизительно на 1/3), при необходимости включить пониженную передачу, а при проезде поворота не увеличивать резко скорость и не тормозить.(Автошкола РФ, Техника управления автомобилем)","img":null,"tp":[12],"p":[]},{"t":24,"n":20,"q":"Разрешено ли давать пострадавшему лекарственные средства при оказании ему первой помощи?","a":["Разрешено","Разрешено в случае крайней необходимости","Запрещено"],"c":2,"tip":"Правильный ответ - запрещено.Причина - у пострадавшего, который может находиться в бессознательном состоянии, будет отсутствовать глотательный рефлекс.","img":null,"tp":[16],"p":[]},{"t":25,"n":1,"q":"На каком рисунке изображена дорога с разделительной полосой?","a":["На обоих","Только на правом","На обоих рисунках дорога с разделительной полосой не изображена"],"c":0,"tip":"Разделительная полоса – конструктивно выделенный элемент дороги. Пример – правый рисунок. И (или) с помощью сплошных линий разметки 1.2 Пример – левый рисунок. Правильный ответ – на обоих.(Пункт 1.2 термин «Разделительная полоса»)","img":"i329.jpg","tp":[0],"p":[]},{"t":25,"n":2,"q":"Вам разрешено продолжить движение на грузовом автомобиле, имеющем разрешенную максимальную массу более 3,5 т, с прицепом:","a":["Только прямо","Прямо и направо","Прямо и в обратном направлении"],"c":0,"tip":"Табличка под знаком 8.4.1 «Вид транспортного средства» распространяет действие знака 4.1.1 «Движение прямо» на грузовые автомобили, в том числе с прицепом, с разрешённой максимальной массой более 3,5 т. Вам разрешается движение на перекрестке только прямо.(«Дорожные знаки»)","img":"i330.jpg","tp":[1],"p":[]},{"t":25,"n":3,"q":"Какие из указанных знаков отменяют все ограничения, введенные ранее запрещающими знаками?","a":["Только В","А и Б","В и Г","Все"],"c":0,"tip":"Знак «В» - 3.31 «Конец зоны всех ограничений».(«Дорожные знаки»)","img":"i331.jpg","tp":[1],"p":[]},{"t":25,"n":4,"q":"Этот знак указывает, что:","a":["Вы должны повернуть направо или налево","На пересекаемой дороге организовано реверсивное движение","Вправо и влево от перекрестка организовано одностороннее движение"],"c":1,"tip":"Перед Вами перекрёсток, по пересекаемой дороге которого организовано реверсивное движение, о чём информирует знак 5.10 «Выезд на дорогу с реверсивным движением».(«Дорожные знаки»)","img":"i332.jpg","tp":[1],"p":[]},{"t":25,"n":5,"q":"Какой маневр Вам запрещается выполнить при наличии данной линии разметки?","a":["Обгон","Объезд","Разворот","Разрешаются все перечисленные маневры"],"c":3,"tip":"В данном случае прерывистая линия горизонтальной разметки 1.5 разделяет транспортные потоки. Пересечение ее разрешается с любой стороны. Она ничего не запрещает при выполнении перечисленных маневров. Наоборот, чётко Вас ориентирует, на какой стороне движения находитесь.(«Горизонтальная разметка»)","img":"i333.jpg","tp":[2],"p":[]},{"t":25,"n":6,"q":"Сигналы такого светофора распространяются:","a":["Только на трамваи","На трамваи, а также другие транспортные средства, движущиеся по полосе для маршрутных транспортных средств","На все маршрутные транспортные средства"],"c":1,"tip":"Для регулирования движения трамваев, а также других маршрутных транспортных средств, движущихся по выделенной для них полосе, могут применяться светофоры одноцветной сигнализации с четырьмя круглыми сигналами бело-лунного цвета, расположенными в виде буквы «Т».(Пункт 6.8 ПДД)","img":"i334.jpg","tp":[3],"p":["6.8"]},{"t":25,"n":7,"q":"Обязаны ли Вы включить указатели поворота в данной ситуации?","a":["Обязаны","Обязаны только при наличии на перекрестке других транспортных средств","Не обязаны"],"c":0,"tip":"Вы согласно знаку 4.1.2 «Движение направо» можете продолжить движение, только повернув направо. Перед поворотом обязательно должны подать соответствующий предупредительный сигнал.(«Дорожные знаки», пункт 8.1 ПДД)","img":"i335.jpg","tp":[4],"p":["8.1"]},{"t":25,"n":8,"q":"Кто должен уступить дорогу?","a":["Водитель легкового автомобиля","Водитель грузового автомобиля"],"c":1,"tip":"Впереди сужение дороги, о чём водителей предупреждает знак 1.20.2 «Сужение дороги». Водителю грузовика необходимо перестроиться на левую полосу. Он обязан уступить дорогу легковому автомобилю, движущемуся попутно без изменения направления движения.(«Дорожные знаки», пункт 8.4 ПДД)","img":"i336.jpg","tp":[4],"p":["8.4"]},{"t":25,"n":9,"q":"Водитель случайно проехал перекресток. Разрешено ли ему в этой ситуации использовать задний ход, чтобы затем продолжить движение налево?","a":["Разрешено","Разрешено, если при этом не будут созданы помехи для других участников дорожного движения","Запрещено"],"c":2,"tip":"Движение задним ходом на перекрёстках запрещено.(Пункт 8.12 ПДД)","img":"i337.jpg","tp":[4],"p":["8.12"]},{"t":25,"n":10,"q":"Каким транспортным средствам и в каких случаях разрешается движение вне населенных пунктов со скоростью не более 90 км/ч?","a":["Грузовым автомобилям, перевозящим людей в кузове","Грузовым автомобилям с разрешенной максимальной массой более 3,5 тонн на дорогах, не относящихся к автомагистралям","Автобусам, осуществляющим организованные перевозки групп детей","Автобусам, в которых места для сидения пассажиров оборудованы ремнями безопасности, предназначенным для перевозки исключительно сидящих пассажиров, на всех дорогах"],"c":3,"tip":"Вне населенных пунктов разрешается движение автобусам, в которых места для сидения пассажиров оборудованы ремнями безопасности, предназначенным для перевозки исключительно сидящих пассажиров со скоростью не более 90 км/ч.(Пункт 10.3 ПДД)","img":null,"tp":[5],"p":["10.3"]},{"t":25,"n":11,"q":"Можно ли Вам выполнить обгон?","a":["Можно","Можно, если скорость грузового автомобиля менее 30 км/ч","Нельзя"],"c":2,"tip":"Обгон запрещён, так как видимость ограничена. Подчас возникает естественное желание обогнать «еле плетущееся» транспортное средство. Не поддавайтесь безоглядно таким порывам. Помните! Наиболее опасными являются обгоны при значительно меньшей скорости обгоняемого по сравнению со скоростью встречного транспортного средства.(Пункт 11.4 ПДД)Главное условие выполнения обгона - «Путь, необходимый для обгона, никогда не должен превышать половины видимого отрезка пути». Т. е. если Ваш путь обгона составит 200 м, то видимость дороги должна быть не менее 400 м. Строго придерживайтесь этого правила, иначе попадёте в ситуацию - «ловушку» из которой выхода нет.","img":"i338.jpg","tp":[6],"p":["11.4"]},{"t":25,"n":12,"q":"Разрешена ли остановка в этом месте?","a":["Разрешена","Разрешена, если расстояние между транспортным средством и сплошной линией разметки не менее 3 м","Запрещена"],"c":2,"tip":"Остановка на пешеходных переходах и на расстоянии ближе 5 м запрещена. Это расстояние не выдержано. Останавливаться в обозначенном месте нельзя.(Пункт 12.4 ПДД)","img":"i339.jpg","tp":[7],"p":["12.4"]},{"t":25,"n":13,"q":"Значения каких дорожных знаков отменяются сигналами светофора?","a":["Знаков приоритета","Запрещающих знаков","Предписывающих знаков","Всех перечисленных знаков"],"c":0,"tip":"Движение регулируется: регулировщиком, сигналами светофора, знаками приоритета, разметкой, дорожным покрытием, «правилом правой руки». По вышеперечисленному «принципу приоритетности регулирования дорожного движения» знаки приоритета работают (т.е. ими мы руководствуемся) в том случае, когда отсутствует регулировщик, светофор выключен, неисправен, переведён в «жёлтый мигающий режим».(«Дорожные знаки», пункты 6.15 и 13.3 ПДД)","img":null,"tp":[8],"p":["13.3","6.15"]},{"t":25,"n":14,"q":"При повороте направо Вы должны уступить дорогу:","a":["Только велосипедисту","Только пешеходам","Пешеходам и велосипедисту"],"c":2,"tip":"При повороте направо или налево водитель обязан уступить дорогу пешеходам и велосипедистам, пересекающим проезжую часть дороги, на которую он поворачивает.Это правило проезда перекрестков касается как регулируемых, так и нерегулируемых перекрестков.(Пункт 13.1 ПДД)","img":"i340.jpg","tp":[8],"p":["13.1"]},{"t":25,"n":15,"q":"Вы намерены повернуть налево. Кому Вы обязаны уступить дорогу?","a":["Никому","Только легковому автомобилю","Легковому автомобилю и автобусу","Всем транспортным средствам"],"c":1,"tip":"Перекрёсток неравнозначный. Транспортные средства, находящиеся на главной дороге, имеют преимущество. Между собой руководствуются «правилом правой руки». После их проезда, руководствуясь тем же правилом, проедут транспортные средства, находящиеся на второстепенной дороге. Первым проезжает перекрёсток легковой автомобиль, Вы - вторым, мотоциклист - третьим, автобус - последним.(Пункты 13.9, 13.10, 13.11 ПДД)","img":"i341.jpg","tp":[8],"p":["13.10","13.11","13.9"]},{"t":25,"n":16,"q":"Как Вам следует поступить в данной ситуации?","a":["Проехать железнодорожный переезд без остановки перед знаком","Остановиться перед знаком и продолжить движение сразу же после проезда поезда","Остановиться перед знаком и продолжить движение, убедившись в отсутствии приближающегося поезда"],"c":2,"tip":"На пути движения многопутная железная дорога. Вам необходимо остановиться перед знаком 2.5 «Движение без остановки запрещено», дождаться проезда поезда и, убедившись в отсутствии приближающихся поездов с обоих направлений, продолжить дальнейшее движение.(«Дорожные знаки», пункты 15.1, 15.2, 15.3, 15.4 ПДД)","img":"i342.jpg","tp":[14],"p":["15.1","15.2","15.3","15.4"]},{"t":25,"n":17,"q":"Привлечь внимание водителя обгоняемого автомобиля при движении в населенном пункте в светлое время суток можно:","a":["Только звуковым сигналом","Только кратковременным переключением фар с ближнего света на дальний","Только совместной подачей звукового и светового сигналов","Любым из перечисленных способов"],"c":1,"tip":"Применение звукового сигнала при обгоне допускается только вне населенных пунктов. В населенном пункте, для предупреждения об обгоне вместо звукового сигнала может подаваться световой сигнал, представляющий собой кратковременное переключение фар с ближнего на дальний свет.(Пункт 19.11 ПДД)","img":null,"tp":[10],"p":["19.11"]},{"t":25,"n":18,"q":"В каком случае запрещается эксплуатация транспортного средства?","a":["Не работает указатель уровня топлива","Нарушена регулировка угла опережения зажигания","Затруднен пуск двигателя","Звуковой сигнальный прибор неисправен"],"c":3,"tip":"«Перечнем неисправностей» запрещается эксплуатация в случае, если не работает звуковой сигнал.(«Перечень неисправностей» пункт 9.3)","img":null,"tp":[11],"p":[]},{"t":25,"n":19,"q":"Как зависит величина тормозного пути транспортного средства от скорости движения?","a":["Не зависит","Увеличивается пропорционально скорости","Увеличивается пропорционально квадрату скорости"],"c":2,"tip":"Величина тормозного пути находится в зависимости от квадрата скорости.Так, при увеличении скорости в два раза, величина тормозного пути возрастет в четыре раза, а при увеличении скорости в три раза - тормозной путь возрастет в девять раз.(«Техника управления автомобилем»)","img":null,"tp":[12],"p":[]},{"t":25,"n":20,"q":"Как остановить кровотечение при ранении вены и некрупных артерий?","a":["Наложить давящую повязку на место ранения","Наложить жгут выше места ранения","Наложить жгут ниже места ранения"],"c":0,"tip":"Необходимо наложить давящую повязку непосредственно на рану.(«Медицинская помощь при ДТП»)","img":null,"tp":[16],"p":[]},{"t":26,"n":1,"q":"Выезд из двора или c другой прилегающей территории:","a":["Считается перекрестком равнозначных дорог","Считается перекрестком неравнозначных дорог","Не считается перекрестком"],"c":2,"tip":"«Прилегающая территория» - территория, непосредственно прилегающая к дороге и не предназначенная для сквозного движения транспортных средств (дворы, жилые массивы, автостоянки, АЗС, предприятия и тому подобное). Выезд из двора или с другой прилегающей территории перекрестком не считается.(Пункт 1.2 ПДД)","img":"i343.jpg","tp":[0],"p":["1.2"]},{"t":26,"n":2,"q":"Какие из указанных знаков требуют обязательной остановки?","a":["Только А","Только Б","Б и В","Все"],"c":1,"tip":"Только знак «Б» - 2.5 «Движение без остановки запрещено» - требует обязательной остановки. Знак устанавливается или у пересечения проезжих частей (случай 1), или у ж. д. переезда, или карантинного поста (случай 2).Знак «А» - 2.6 «Преимущество встречного движения» - запрещает въезд на узкий участок дороги, если это может затруднить встречное движение.Знак «В» - 6.16 «Стоп-линия» - обозначает место остановки транспортных средств при запрещающем сигнале светофора.Знак «Г» - 2.4 «Уступите дорогу» - определяет очерёдность проезда конкретного пересечения. Место остановки при необходимости выбирайте сами, руководствуясь правилом: «Вы не должны возобновлять или продолжать движение, осуществлять какой-либо маневр, если действие Вашего автомобиля вынудит других участников движения изменить направление движения или скорость».(«Дорожные знаки»)","img":"i344.jpg","tp":[1],"p":[]},{"t":26,"n":3,"q":"В зоне действия этого знака разрешается использовать звуковой сигнал:","a":["Только для предупреждения об обгоне","Только для предотвращения дорожно-транспортного происшествия","В обоих перечисленных случаях"],"c":1,"tip":"В зоне действия знака 3.26 «Подача звукового сигнала запрещена» подача звукового сигнала недопустима, кроме случаев предупреждения дорожно-транспортного происшествия.(«Дорожные знаки»)","img":"i345.jpg","tp":[1],"p":[]},{"t":26,"n":4,"q":"Где начинают действовать требования Правил, относящиеся к населенным пунктам?","a":["Только с места установки дорожного знака «Начало населенного пункта» на белом фоне","С места установки дорожного знака с названием населенного пункта на белом или синем фоне","В начале застроенной территории, непосредственно прилегающей к дороге"],"c":0,"tip":"Только с места установки знака 5.23.1 или 5.23.2 «Начало населённого пункта» на белом фоне.(«Дорожные знаки»)","img":null,"tp":[1],"p":[]},{"t":26,"n":5,"q":"Такой вертикальной разметкой обозначают боковые поверхности ограждений:","a":["Только на опасных участках дорог","Только на участках дорог, не относящихся к опасным","На всех участках дорог"],"c":1,"tip":"Вертикальной разметкой 2.6 обозначают боковые поверхности ограждений во всех случаях, когда не применяется разметка 2.5 используемая на закруглениях дорог, крутых спусках, других опасных участках.","img":"i346.jpg","tp":[2],"p":[]},{"t":26,"n":6,"q":"Что означают красный мигающий сигнал или два попеременно мигающих красных сигнала светофора, установленного на железнодорожном переезде?","a":["Движение разрешается с особой осторожностью","Движение запрещено","Светофорная сигнализация неисправна"],"c":1,"tip":"Красный мигающий сигнал или два попеременно мигающих красных сигнала запрещают движение. Мигающие красные сигналы применяются на железнодорожных переездах, перед разводными мостами, паромами или переправами и в местах выезда пожарных и других автомобилей аварийных служб.(Пункт 6.2 ПДД. Комментарий к ПДД РФ, издательство «За рулем»)","img":null,"tp":[3],"p":["6.2"]},{"t":26,"n":7,"q":"Какие световые сигналы Вы обязаны подать в данной ситуации?","a":["Включить световые указатели поворота налево","Осуществить кратковременное переключение фар с ближнего на дальний свет","Подать перечисленные световые сигналы одновременно"],"c":0,"tip":"Вы перестраиваетесь на левую полосу. Своевременное включение сигнала левого поворота обязательно в любом случае.(Пункт 8.1 ПДД)","img":"i347.jpg","tp":[4],"p":["8.1"]},{"t":26,"n":8,"q":"В каких направлениях Вам можно продолжить движение по второй полосе?","a":["Только налево","Налево и в обратном направлении","Направо, налево и в обратном направлении"],"c":1,"tip":"Знак 4.1.6 «Движение направо или налево» из крайней левой полосы разрешает поворот налево и разворот для движения в обратном направлении. Для поворота направо необходимо было заранее перестроиться на крайнюю правую полосу.(«Дорожные знаки», пункт 8.5 ПДД)","img":"i348.jpg","tp":[4],"p":["8.5"]},{"t":26,"n":9,"q":"Разрешен ли Вам разворот в этом месте?","a":["Разрешен","Разрешен, если при этом не будут созданы помехи движению маршрутных транспортных средств","Запрещен"],"c":2,"tip":"Разворот в местах остановок маршрутных транспортных средств запрещен.(Пункт 8.11 ПДД)","img":"i349.jpg","tp":[4],"p":["8.11"]},{"t":26,"n":10,"q":"По какой траектории Вы имеете право продолжить движение?","a":["Только по А","Только по Б","По любой из указанных"],"c":1,"tip":"Водители, поворачивающие на дорогу, обозначенную знаком 5.10 «Выезд на дорогу с реверсивным движением», должны двигаться по крайней правой полосе. В данной ситуации по траектории «Б». Перестроение разрешается только после того, как водитель убедится, что движение в данном направлении разрешается и по другим полосам.(Пункт 9.8 ПДД)","img":"i350.jpg","tp":[13],"p":["9.8"]},{"t":26,"n":11,"q":"Разрешается ли обгон на перекрестках?","a":["Разрешается","Разрешается только на регулируемых перекрестках","Разрешается только при движении по главной дороге на нерегулируемых перекрестках","Запрещается"],"c":2,"tip":"Обгон запрещен на регулируемых перекрестках, а также на нерегулируемых перекрестках при движении по дороге, не являющейся главной.(Пункт 11.4 ПДД)","img":null,"tp":[6],"p":["11.4"]},{"t":26,"n":12,"q":"Водители каких транспортных средств нарушили правила остановки?","a":["Только маломестного автобуса Б","Маломестного автобуса Б и грузового автомобиля В","Всех транспортных средств"],"c":1,"tip":"Остановка и стоянка транспортных средств при наличии обочины должна осуществляться на ней (как это сделал водитель автомобиля «А»). И только при её отсутствии - у края проезжей части. Водители автомобилей «Б» и «В» являются нарушителями ПДД.(Пункт 12.1 ПДД)","img":"i351.jpg","tp":[7],"p":["12.1"]},{"t":26,"n":13,"q":"Вы намерены повернуть налево. Ваши действия?","a":["Остановитесь перед перекрестком, дождетесь зеленого сигнала светофора, установленного на разделительной полосе, и начнете выполнение маневра","Выехав на перекресток, остановитесь у стоп-линии и, дождавшись зеленого сигнала светофора, установленного на разделительной полосе, завершите маневр","Выполните маневр без остановки на перекрестке"],"c":1,"tip":"В обычной ситуации водитель выезжает с перекрёстка независимо от сигналов светофора на выходе с перекрёстка. Но здесь ситуация иная. Применено раздельное действие светофоров. На перекрёстке два пересечения проезжих частей. Повернув налево, Вы обязаны при запрещающем сигнале светофора остановиться у «стоп-линии» (разметки 1.12). После включения разрешающего сигнала продолжаете движение через перекрёсток.(Пункт 13.7 ПДД)","img":"i352.jpg","tp":[8],"p":["13.7"]},{"t":26,"n":14,"q":"Кому Вы должны уступить дорогу при повороте налево?","a":["Только легковому автомобилю","Только грузовому автомобилю","Обоим транспортным средствам"],"c":2,"tip":"Перекрёсток равнозначный. При любой его конфигурации водители руководствуются «правилом правой руки». Первым проезжает грузовик, так как у него нет помехи справа, вторым легковой автомобиль, Вы - последним.Вам следует уступить обоим транспортным средствам.(Пункт 13.11 ПДД)","img":"i353.jpg","tp":[8],"p":["13.11"]},{"t":26,"n":15,"q":"При движении прямо Вы обязаны уступить дорогу:","a":["Только легковому автомобилю","Автобусу и легковому автомобилю","Всем транспортным средствам"],"c":1,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Преимущество имеют транспортные средства, находящиеся на главной дороге. После их проезда проезжают транспортные средства, находящиеся на второстепенной дороге, которые между собой руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает. Помеха справа у мотоциклиста, он уступает Вам. Транспортные средства проедут перекрёсток в следующем порядке: автобус, легковой автомобиль, Вы, мотоциклист.(«Дорожные знаки», пункты 13.9, 13.10 ПДД)","img":"i354.jpg","tp":[8],"p":["13.10","13.9"]},{"t":26,"n":16,"q":"Где необходимо остановиться, если сразу за пешеходным переходом образовался затор?","a":["На пешеходном переходе, если нет пешеходов","Непосредственно перед пешеходным переходом","Не ближе 5 м до пешеходного перехода"],"c":1,"tip":"Здесь Вы производите временное прекращение движения, а не преднамеренную остановку. Поэтому останавливаетесь до границы пешеходного перехода, которая обозначается знаками или разметкой.Правильный ответ - непосредственно перед пешеходным переходом.(Пункт 14.4 ПДД)","img":null,"tp":[20],"p":["14.4"]},{"t":26,"n":17,"q":"На каком рисунке изображен автомобиль, водитель которого нарушает правила перевозки грузов?","a":["Только на А","Только на Б","На обоих"],"c":0,"tip":"Правила разрешают движение ТС, габаритные параметры которых по ширине не превышают 2,55 метра.Допускается без обозначения опознавательным знаком «Крупногабаритный груз» перевозка груза, выступающего сбоку не более 0,4 м от внешнего края габаритного огня. На рисунке «А» это расстояние больше допустимого. На рисунке «Б» расстояние меньше допустимого.Нарушает Правила только водитель автомобиля «А».(Пункты 23.4, 23.5 ПДД)","img":"i355.jpg","tp":[23],"p":["23.4","23.5"]},{"t":26,"n":18,"q":"В каком случае запрещается эксплуатация транспортных средств?","a":["Двигатель не развивает максимальной мощности","Двигатель неустойчиво работает на холостых оборотах","Системы питания и выпуска отработавших газов некомплектны и негерметичны"],"c":2,"tip":"В случае неисправности систем питания двигателя и выпуска отработанный газов и их некомплектности и негерметичности, эксплуатация ТС запрещается.(«Перечень неисправностей» пункт 8.2).","img":null,"tp":[11],"p":[]},{"t":26,"n":19,"q":"Уменьшение тормозного пути транспортного средства, не оборудованного антиблокировочной тормозной системой, достигается:","a":["Путем нажатия на педаль тормоза до упора","Путем прерывистого нажатия на педаль тормоза","Путем нажатия на педаль тормоза с одновременным использованием стояночной тормозной системы"],"c":1,"tip":"Блокировка колёс при торможении на мокром, скользком покрытии вызывает «юз» - неуправляемость автомобиля. Поэтому для уменьшения тормозного пути и обеспечения безопасности движения используйте пульсационное, прерывистое нажатие на педаль тормоза с попеременным её освобождением.","img":null,"tp":[12],"p":[]},{"t":26,"n":20,"q":"Минимальной величиной необходимой дистанции при движении по сухой дороге на грузовом автомобиле или автобусе принято считать расстояние, которое транспортное средство проедет не менее чем за:","a":["1 секунду","2 секунды","3 секунды"],"c":2,"tip":"Дистанция между движущимися ТС зависит от их тормозного пути. Тормозной путь грузового автомобиля или автобуса при равных условиях значительно больше легкового автомобиля. Причиной этого является большая масса и большее время срабатывания тормозных механизмов.Поэтому необходимой безопасной дистанцией принято считать расстояние, которое автомобили данных классов проедут, в отличии от легковых автомобилей, за 3 секунды.","img":null,"tp":[12],"p":[]},{"t":27,"n":1,"q":"Если в результате дорожно-транспортного происшествия (ДТП) вред причинен только имуществу, то, предварительно зафиксировав положение транспортных средств по отношению друг другу и объектам дорожной инфраструктуры, следы и предметы, относящиеся к ДТП, повреждения транспортных средств, водитель, причастный к ДТП:","a":["Обязан освободить проезжую часть","Обязан освободить проезжую часть, если движению других транспортных средств создается препятствие","Имеет право по своему усмотрению освободить проезжую часть"],"c":1,"tip":"Согласно п. 2.6.1 ПДД если в результате ДТП вред причинен только имуществу, то, предварительно зафиксировав положение ТС по отношению друг к другу и объектам дорожной инфраструктуры, следы и предметы, относящиеся к ДТП, повреждения ТС, водитель, причастный к ДТП, обязан освободить проезжую часть, если движению других ТС создается препятствие.(14.12.18 обновлен вопрос и варианты ответа. Теперь суть вопроса в том, при каких условиях водитель может освободить проезжую часть)","img":null,"tp":[22],"p":[]},{"t":27,"n":2,"q":"Какие из указанных знаков используются для обозначения границ искусственной неровности?","a":["Только А","Только Б","Б и В"],"c":0,"tip":"Знак «А» - 5.20 «Искусственная неровность» обозначает границу искусственной неровности («лежащий полицейский»). Знак устанавливается на ближайшей границе искусственной неровности относительно приближающихся ТС.(«Дорожные знаки»)","img":"i356.jpg","tp":[1],"p":[]},{"t":27,"n":3,"q":"Данный знак запрещает движение транспортным средствам, которые:","a":["Имеют разрешенную максимальную массу более 7 т","Имеют фактическую массу более 7 т","Перевозят грузы массой более 7 т"],"c":1,"tip":"Знак 3.11 «Ограничение массы» запрещает движение транспортных средств, в том числе и составов, фактическая масса которых больше, чем указано на знаке.(«Дорожные знаки»)","img":"i357.jpg","tp":[1],"p":[]},{"t":27,"n":4,"q":"Управляя каким транспортным средством можно опередить легковой автомобиль?","a":["Только грузовым автомобилем с разрешенной максимальной массой не более 3,5 т","Только автобусом","Любым из перечисленных транспортных средств"],"c":2,"tip":"На знаке 5.15.7 «Направление движения по полосам» изображён знак 3.4 «Движение грузовых автомобилей запрещено» без цифры на автомобиле. Этот знак в таком случае запрещает движение грузовых автомобилей с разрешённой максимальной массой более 3,5 т по левой полосе по ходу Вашего движения.(«Дорожные знаки»)","img":"i358.jpg","tp":[1],"p":[]},{"t":27,"n":5,"q":"Что обозначает эта разметка?","a":["Номер дороги или маршрута","Рекомендуемую скорость движения на данном участке дороги","Разрешенную максимальную скорость движения на данном участке дороги"],"c":2,"tip":"Разметка 1.24.2 дублирует знак 3.24 «Ограничение максимальной скорости» и применяется совместно с ним.(«Горизонтальная разметка», «Дорожные знаки»)","img":"i359.jpg","tp":[2],"p":[]},{"t":27,"n":6,"q":"Чем должны руководствоваться участники дорожного движения, если указания регулировщика противоречат значениям сигналов светофоров и требованиям дорожных знаков?","a":["Требованиями дорожных знаков","Значениями сигналов светофора","Указаниями регулировщика"],"c":2,"tip":"Регулирование дорожного движения базируется на «принципе приоритетности регулирования дорожного движения». При наличии нескольких средств регулирования действует только одно. По убывающей движение регулируется: регулировщиком, сигналами светофора, знаками приоритета, разметкой, дорожным покрытием, «правилом правой руки». Исходя из этого принципа, при наличии регулировщика руководствуйтесь его сигналами и указаниями.(Пункты ПДД 6.15, 8.9, 13.3, 1.2 термин «Главная дорога»)","img":null,"tp":[3],"p":["1.2","13.3","6.15","8.9"]},{"t":27,"n":7,"q":"Такой сигнал рукой, подаваемый водителем мотоцикла, который движется по левой полосе, информирует о его намерении:","a":["Продолжить движение прямо","Повернуть направо","Остановиться"],"c":1,"tip":"Оба сигнала рукой информируют о намерении мотоциклистов совершить поворот направо.(Пункт 8.1 ПДД)","img":"i360.jpg","tp":[4],"p":["8.1"]},{"t":27,"n":8,"q":"При перестроении на правую полосу в данной ситуации Вы:","a":["Должны уступить дорогу автомобилю, движущемуся по соседней полосе","Имеете преимущество в движении"],"c":0,"tip":"Полоса, по которой Вы двигаетесь, заканчивается. Вам необходимо перестраиваться. При перестроении Вы обязаны уступить дорогу транспортным средствам, движущимся попутно без изменения направления движения.(«Горизонтальная разметка» 1.19, пункт 8.4 ПДД)","img":"i361.jpg","tp":[4],"p":["1.19","8.4"]},{"t":27,"n":9,"q":"По какой траектории Вам разрешается выполнить разворот?","a":["Только по А","Только по Б","По указанным траекториям разворот запрещен"],"c":0,"tip":"Действие знака 4.1.1 «Движение прямо», установленного перед пересечением проезжих частей, распространяется на первое пересечение за знаком. На данном перекрёстке два пересечения, образуемых разделительной полосой. Траектория «Б» проходит по первому пересечению, что противоречит действиям знака. Можно выполнить разворот по траектории «А».(«Дорожные знаки»)","img":"i362.jpg","tp":[4],"p":[]},{"t":27,"n":10,"q":"Каковы Ваши действия в данной ситуации?","a":["Объедете грузовой автомобиль справа по обочине","Продолжите движение только после того, как грузовой автомобиль освободит полосу движения","Допускаются оба варианта действий"],"c":1,"tip":"Водитель грузовика подаёт сигнал поворота. Объехать справа в этой ситуации допускается, если Вы произведёте объезд, не выезжая на обочину, движение по которой запрещено.В данной ситуации дожидайтесь, когда грузовой автомобиль освободит полосу движения.(Пункт 9.9 ПДД)","img":"i363.jpg","tp":[13],"p":["9.9"]},{"t":27,"n":11,"q":"Запрещено ли выполнить обгон на подъеме?","a":["Разрешено","Запрещено только в конце подъема","Запрещено"],"c":1,"tip":"Конец подъёма - это место перелома продольного профиля дороги. При подъезде к этому месту видимость отсутствует. Поэтому, Правилами обгон в конце подъёма, на опасных поворотах и на других участках с ограниченной видимостью запрещён.(Пункт 11.4 ПДД)Не забываем главное условие обгона - «Путь, необходимый для обгона, никогда не должен превышать половины видимого отрезка пути».","img":null,"tp":[6],"p":["11.4"]},{"t":27,"n":12,"q":"Нарушил ли водитель грузового автомобиля правила стоянки?","a":["Нарушил","Нарушил, только если разрешенная максимальная масса грузового автомобиля более 3,5 т","Не нарушил"],"c":0,"tip":"Грузовым автомобилям остановка, стоянка с заездом на прилегающий тротуар запрещаются.(Пункт 12.2 ПДД)","img":"i364.jpg","tp":[7],"p":["12.2"]},{"t":27,"n":13,"q":"Как Вам следует поступить при повороте направо?","a":["Остановиться и дождаться другого сигнала регулировщика","Проехать перекресток, уступив дорогу трамваю","Проехать перекресток первым"],"c":2,"tip":"Перекрёсток регулируемый. Со стороны левого бока при таком жесте регулировщика безрельсовым транспортным средствам движение разрешается во всех направлениях. Трамваи двигаются только «по направлению рук регулировщика». В данной ситуации трамвай продолжать движение не может. Его водитель будет дожидаться смены сигнала регулировщика. Вы продолжаете движение через перекрёсток, т.е. проезжаете его первым.(Пункт 6.10 ПДД)","img":"i365.jpg","tp":[8],"p":["6.10"]},{"t":27,"n":14,"q":"Как Вам следует поступить, двигаясь по перекрестку с круговым движением?","a":["Уступить дорогу грузовому автомобилю","Проехать перекресток первым","Действовать по взаимной договоренности с водителем грузового автомобиля"],"c":1,"tip":"При выезде на перекресток с круговым движением, при отсутствии знаков приоритета, обозначенным только знаком 4.3 «Круговое движение», правило «правой руки» НЕ РАБОТАЕТ. Вы имеете преимущество и проезжаете перекресток первым. При въезде на данный перекресток водитель грузового автомобиля обязан уступить дорогу ВСЕМ ТС, движущимся по такому перекрестку.(Пункт 13.11.1 ПДД)","img":"i366.jpg","tp":[8],"p":["13.11"]},{"t":27,"n":15,"q":"Кому Вы обязаны уступить дорогу при повороте налево?","a":["Только легковому автомобилю","Легковому автомобилю и автобусу","Всем транспортным средствам"],"c":1,"tip":"Перекрёсток неравнозначный. Главная дорога меняет направление. Преимущество имеют транспортные средства, находящиеся на главной дороге. После их проезда проезжают транспортные средства, находящиеся на второстепенной дороге, которые между собой руководствуются «правилом правой руки», т.е. у кого помеха справа, тот и уступает. Помеха справа у мотоциклиста, он уступает Вам. Транспортные средства проедут перекрёсток в следующем порядке: автобус, легковой автомобиль, Вы, мотоциклист.(«Дорожные знаки», пункты 13.9, 13.10 ПДД)","img":"i367.jpg","tp":[8],"p":["13.10","13.9"]},{"t":27,"n":16,"q":"На каком наименьшем расстоянии до ближайшего рельса Вы должны остановиться?","a":["5 м","10 м","15 м","20 м"],"c":1,"tip":"При отсутствии шлагбаума водитель должен остановиться не ближе 10 м до ближайшего рельса.(Пункт 15.4 ПДД)","img":"i368.jpg","tp":[14],"p":["15.4"]},{"t":27,"n":17,"q":"При буксировке на гибкой сцепке между буксирующим и буксируемым транспортными средствами должно быть обеспечено расстояние:","a":["Не более 4 м","От 4 до 6 м","От 6 до 8 м"],"c":1,"tip":"При буксировке на гибкой сцепке должно быть обеспечено расстояние между буксирующим и буксируемым транспортными средствами в пределах 4 - 6 м.(Пункт 20.3 ПДД)","img":null,"tp":[15],"p":["20.3"]},{"t":27,"n":18,"q":"Какие административные правонарушения, совершенные водителем, который лишен права управления транспортными средствами, влекут административный арест?","a":["Управление транспортным средством; оставление водителем в нарушение Правил места дорожно-транспортного происшествия, участником которого он являлся","Управление транспортным средством в состоянии опьянения; невыполнение законного требования уполномоченного должностного лица о прохождении медицинского освидетельствования на состояние опьянения","Все перечисленные действия"],"c":2,"tip":"Административный арест водителей при всех перечисленных действиях предусмотрен статьями КоАП: ст.12.7 ч. 2; ст. 12.26 ч.2; ст. 12.27. ч.2.","img":null,"tp":[21],"p":[]},{"t":27,"n":19,"q":"Устранение заноса задней оси путем увеличения скорости возможно:","a":["Только на переднеприводном автомобиле","Только на заднеприводном автомобиле","На любом автомобиле из перечисленных"],"c":0,"tip":"Переднеприводный автомобиль отличается не только компоновкой, но и поведением на дороге. При движении по прямой он не испытывает ни малейших тенденций к заносу. Занос происходит на поворотах, за счет центробежных сил. Если водитель заднеприводного автомобиля в этой ситуации снижает скорость и поворачивает руль в сторону заноса, то водителю переднеприводного автомобиля делать этого ни в коем случае нельзя. В случае уменьшения подачи топлива происходит торможение двигателем, далее за счёт сил инерции «клевок» вперёд, который разгружает задние колеса, а им, наоборот, чтобы восстановить сцепление с дорогой, как раз нужна дополнительная нагрузка, которая возникает при увеличении скорости.","img":null,"tp":[12],"p":[]},{"t":27,"n":20,"q":"На каком рисунке показано правильное положение рук на рулевом колесе?","a":["На левом","На среднем","На правом"],"c":2,"tip":"Наиболее рациональным является положение рук на руле при сравнении с циферблатом часов «без десяти два».Правильный ответ - на правом рисунке.(«Техника управления автомобилем»)","img":"i369.jpg","tp":[12],"p":[]},{"t":28,"n":1,"q":"Обязан ли водитель предоставлять транспортное средство медицинским и фармацевтическим работникам для перевозки граждан в ближайшее лечебно-профилактическое учреждение в случаях, угрожающих их жизни?","a":["Обязан","Обязан только при движении в попутном направлении","Не обязан"],"c":0,"tip":"Оказывать такую транспортную услугу медицинским и фармацевтическим работникам обязывает пункт 2.3.3 ПДД.","img":null,"tp":[22],"p":[]},{"t":28,"n":2,"q":"Вам можно продолжить движение:","a":["Только по траектории А","Только по траектории Б","По любой траектории из указанных"],"c":0,"tip":"Разделительные полосы делят дорогу на смежные проезжие части. Действие знака 4.1.2 «Движение направо», установленного перед пересечением проезжих частей, распространяется на первое пересечение. Можете продолжить движение только по траектории «А».(Пункт 1.2 термин «Разделительная полоса», «Дорожные знаки»)","img":"i370.jpg","tp":[1],"p":[]},{"t":28,"n":3,"q":"Можно ли проехать по мосту этому автопоезду, если фактическая масса автомобиля 8 т, а прицепа 5 т?","a":["Можно","Можно только по разрешению Госавтоинспекции","Нельзя"],"c":2,"tip":"Знак 3.11 «Ограничение массы» запрещает движение транспортных средств, в том числе и составов, фактическая масса которых больше, чем указано на знаке. Фактическая масса автопоезда 13 т. Водитель должен объехать данный участок дороги по другому маршруту.(«Дорожные знаки»)","img":"i371.jpg","tp":[1],"p":[]},{"t":28,"n":4,"q":"Какие из указанных знаков используются для обозначения номера, присвоенного дороге (маршруту)?","a":["Только А","Только Б","А и Б","Все"],"c":2,"tip":"Знаки «А» и «Б» имеют общий номер и наименование: 6.14.1 «Номер маршрута». Знак «В» - 6.13 «Километровый знак» - обозначает расстояние до начала или конца дороги (км).(«Дорожные знаки»)","img":"i372.jpg","tp":[1],"p":[]},{"t":28,"n":5,"q":"Временная горизонтальная разметка имеет:","a":["Только оранжевый цвет","Только желтый цвет","Желтый или оранжевый цвет"],"c":0,"tip":"Временная горизонтальная разметки имеет оранжевый цвет.(«Дорожная разметка»)","img":null,"tp":[2],"p":[]},{"t":28,"n":6,"q":"Вы имеете право двигаться:","a":["Только прямо","Только направо","Прямо или направо"],"c":2,"tip":"Перекрёсток регулируемый. Со стороны левого и правого бока регулировщика безрельсовым транспортным средствам разрешается движение прямо или направо. По пересекаемой дороге согласно знаку 5.7.1 «Выезд на дорогу с односторонним движением» осуществляется одностороннее движение. Данный знак запрещает только поворот налево.(«Дорожные знаки», пункт 6.10 ПДД)","img":"i373.jpg","tp":[3],"p":["6.10"]},{"t":28,"n":7,"q":"Как необходимо обозначить свое транспортное средство при дорожно-транспортном происшествии?","a":["Только с помощью аварийной сигнализации","Только с помощью знака аварийной остановки","Обоими перечисленными способами"],"c":2,"tip":"При ДТП водитель обязан включить аварийную сигнализацию и выставить знак аварийной остановки.(Пункты 7.1, 7.2 ПДД)","img":null,"tp":[25],"p":["7.1","7.2"]},{"t":28,"n":8,"q":"Кто имеет преимущество в движении?","a":["Водитель легкового автомобиля","Водитель грузового автомобиля"],"c":1,"tip":"Водитель легкового автомобиля выезжает с прилегающей территории к дороге (с АЗС). Он обязан уступить дорогу транспортным средствам, движущимся по пересекаемой дороге, соответственно водитель грузовика имеет «преимущество».(Пункты 1.2, 8.3 ПДД)","img":"i374.jpg","tp":[4],"p":["1.2","8.3"]},{"t":28,"n":9,"q":"Разрешено ли водителю движение задним ходом для посадки пассажира на этом участке дороги?","a":["Разрешено","Разрешено, если водитель управляет маршрутным транспортным средством","Запрещено"],"c":0,"tip":"Знак 4.1.1 «Движение прямо» не запрещает движение задним ходом, если оно происходит вне границ перекрёстка. На этом участке можно подъехать к пассажиру задним ходом, при условии изложенном выше.(«Дорожные знаки», пункт 8.12 ПДД)","img":"i375.jpg","tp":[4],"p":["8.12"]},{"t":28,"n":10,"q":"Разрешается ли Вам, управляя грузовым автомобилем с разрешенной максимальной массой более 3,5 т, выехать на третью полосу в данной ситуации?","a":["Разрешается","Разрешается только для поворота налево или разворота","Разрешается только для опережения","Запрещается"],"c":1,"tip":"Водитель грузового автомобиля, раз
