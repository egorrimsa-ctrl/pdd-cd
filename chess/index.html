<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#302e2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Задачи">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Шахматные задачи</title>
<style>
:root{--bg:#302e2b;--panel:#262522;--panel2:#3c3a37;--text:#f2f1ef;--muted:#a7a6a2;--green:#81b64c;--green2:#a3d160;--red:#e0503b;--light:#ebecd0;--dark:#739552;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);min-height:100vh;min-height:100dvh}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.top{display:flex;align-items:center;gap:8px;height:52px;padding:0 10px;max-width:1040px;margin:0 auto}
.top h1{flex:1;font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:40px;height:40px;border-radius:8px;background:transparent;font-size:22px;display:flex;align-items:center;justify-content:center}
.icon:active{background:var(--panel2)}
main{max-width:1040px;margin:0 auto;padding:0 12px 24px}
.screen{animation:fade .15s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.muted{color:var(--muted)}
.small{font-size:14px}

/* --- меню --- */
.rating-card{background:var(--panel);border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.rating-card .big{font-size:34px;font-weight:800;line-height:1}
.rating-card svg{flex:1;height:48px;min-width:0}
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border-radius:12px;padding:16px;min-height:76px}
.tile:active{background:var(--panel2)}
.tile .ic{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.tile b{display:block;font-size:18px}
.tile span.muted{font-size:14px}
.tile.main{background:var(--green);color:#fff}
.tile.main .muted{color:#eef7e4}
.tile.main:active{background:#6e9c40}
.foot{margin-top:18px;font-size:13px;color:var(--muted);line-height:1.5}
.foot .box{background:var(--panel);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.foot b{color:var(--text)}

/* --- кнопки --- */
.btn{background:var(--green);color:#fff;border-radius:10px;padding:13px 16px;font-weight:700;font-size:16px;box-shadow:0 4px 0 #5d8a35;flex:1 1 0;min-width:0}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #5d8a35}
.btn.sec{background:var(--panel2);box-shadow:0 4px 0 #2a2926;font-weight:600}
.btn.sec:active{box-shadow:0 2px 0 #2a2926}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:8px}

/* --- экран задачи --- */
.play{display:flex;gap:20px;align-items:flex-start;justify-content:center}
.board-col{width:min(100%,calc(100dvh - 300px),640px);min-width:min(100%,300px);flex:none}
.side{flex:1;min-width:260px;max-width:360px;display:flex;flex-direction:column;gap:10px}
@media (max-width:760px){.play{flex-direction:column;align-items:stretch;gap:10px}.board-col{width:100%;min-width:0;max-width:calc(100dvh - 250px);margin:0 auto}.side{max-width:none;min-width:0}#play{margin:0 -12px}.side{padding:0 12px}}
.infobar{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 2px}
.infobar .grow{flex:1}
.pill{background:var(--panel);border-radius:8px;padding:6px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.delta{font-weight:800;font-variant-numeric:tabular-nums}
.delta.up{color:var(--green2)}.delta.down{color:var(--red)}
.status{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:12px;padding:14px;min-height:64px;font-size:17px;font-weight:600}
.status .dot{width:26px;height:26px;border-radius:6px;flex:none;border:2px solid #000}
.status .dot.w{background:#fff}.status .dot.b{background:#111;border-color:#666}
.status.ok{background:#3a5a22}.status.bad{background:#6a2a22}.status.win{background:var(--green);color:#fff}
.status .sub{display:block;font-size:14px;font-weight:400;opacity:.85}
.meta{font-size:14px;color:var(--muted);background:var(--panel);border-radius:10px;padding:10px 14px}
.meta b{color:var(--text)}
.timer{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red)}
.strikes{font-size:22px;letter-spacing:2px;color:#555}
.strikes .x{color:var(--red)}
.score{font-size:28px;font-weight:800}

/* --- доска --- */
.board{position:relative;width:100%;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:4px;overflow:hidden}
.sqs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq.last.l{background:#f5f682}.sq.last.d{background:#b9ca43}
.sq.sel.l{background:#f5f682}.sq.sel.d{background:#b9ca43}
.sq.hint::before{content:"";position:absolute;inset:0;background:rgba(80,160,255,.55)}
.sq.wrong::before{content:"";position:absolute;inset:0;background:rgba(224,80,59,.65)}
.sq.good::before{content:"";position:absolute;inset:0;background:rgba(129,182,76,.6)}
.sq.check::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,0,0,.9) 0,rgba(231,0,0,.55) 35%,rgba(169,0,0,0) 70%)}
.sq.dot::after{content:"";position:absolute;left:36%;top:36%;width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.18)}
.sq.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:clamp(4px,1.1vw,7px) solid rgba(0,0,0,.18)}
.coord{position:absolute;font-size:clamp(9px,2.4vw,13px);font-weight:700;pointer-events:none}
.coord.f{right:3px;bottom:1px}.coord.r{left:3px;top:1px}
.sq.l .coord{color:var(--dark)}.sq.d .coord{color:var(--light)}
.pcs{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;width:12.5%;height:12.5%;background-size:100% 100%;will-change:transform}
.pc.anim{transition:transform .2s ease}
.pc.drag{z-index:5;transition:none;scale:1.15}
.badge{position:absolute;width:5.2%;height:5.2%;border-radius:50%;z-index:6;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:clamp(10px,2.6vw,16px);box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none}
.badge.ok{background:var(--green)}.badge.bad{background:var(--red)}
.promo{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:center;justify-content:center}
.promo div{background:#fff;border-radius:10px;display:flex;gap:4px;padding:6px}
.promo button{width:min(18vw,80px);height:min(18vw,80px);background-size:90% 90%;background-position:center;background-repeat:no-repeat;border-radius:8px;background-color:#eee}

/* --- списки --- */
.seg{display:flex;background:var(--panel);border-radius:10px;padding:4px;gap:4px;margin-bottom:12px;overflow-x:auto}
.seg button{flex:1 0 auto;background:transparent;border-radius:8px;padding:9px 8px;font-size:13px;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text);font-weight:700}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border-radius:10px;padding:12px 14px}
.item:active{background:var(--panel2)}
.item .t{flex:1;min-width:0}
.item b{display:block;font-weight:600}
.item .n{font-size:13px;color:var(--muted)}
.bar{height:6px;background:#1b1a18;border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--green)}
h2{font-size:17px;margin:20px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.card{background:var(--panel);border-radius:10px;padding:12px;text-align:center}
.card b{display:block;font-size:24px}
.card span{font-size:13px;color:var(--muted)}
.rush-modes{display:grid;gap:10px}
.results{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.results li button{width:100%;background:var(--panel);border-radius:8px;padding:10px;display:flex;justify-content:space-between;gap:6px}
.results .okc{color:var(--green2);font-weight:800}.results .badc{color:var(--red);font-weight:800}
textarea{width:100%;background:#1b1a18;color:var(--text);border:1px solid #444;border-radius:8px;padding:8px;font:12px ui-monospace,monospace}
.graph{width:100%;height:150px;background:var(--panel);border-radius:10px;display:block}

/* --- игра вдвоём --- */
#btns.wrap{flex-wrap:wrap}
#btns.wrap .btn{flex:1 1 calc(50% - 8px)}
.clk{flex:1;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel);border-radius:8px;padding:8px 12px;color:var(--muted)}
.clk b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--text)}
.clk.on{background:#f2f1ef;color:#302e2b}.clk.on b{color:#111}
.clk.low b{color:var(--red)}
.mat{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.mat .cap{font-weight:400;font-size:17px;letter-spacing:-2px;color:var(--text)}
.mat .adv{color:var(--green2)}
.moves{max-height:30vh;overflow-y:auto;color:var(--text);font-size:15px;line-height:1.7}
.moves .mv{white-space:nowrap;margin-right:6px}
.moves i{font-style:normal;color:var(--muted)}
.tcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:14px}
.tcs button{background:var(--panel);border-radius:10px;padding:14px 6px;font-weight:600;border:2px solid transparent}
.tcs button.on{border-color:var(--green);background:#3a4a2c}
.switch{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:10px;padding:14px;font-weight:600}
.switch input{width:22px;height:22px;accent-color:var(--green);flex:none}

/* --- анализ --- */
.board-wrap{display:flex;gap:6px;align-items:stretch}
.board-wrap .board{flex:1;min-width:0}
.evalbar{width:22px;flex:none;background:#403d39;border-radius:3px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.evalbar i{display:block;width:100%;background:#f2f1ef;transition:height .3s ease}
.evalbar.flip{flex-direction:column-reverse}
.evalbar span{position:absolute;left:0;right:0;text-align:center;font-size:9px;font-weight:800;letter-spacing:-.5px}
.evalbar span.wt{bottom:3px;color:#302e2b}.evalbar span.bt{top:3px;color:#f2f1ef}
.evalbar.flip span.wt{bottom:auto;top:3px}.evalbar.flip span.bt{top:auto;bottom:3px}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.nav{margin-top:8px}
.nav .btn{padding:10px 4px;font-size:18px}
@media (max-width:760px){.nav{padding:0 12px}}
.clsic{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:16px}
.clsdot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;color:#fff;font-weight:900;font-size:10px;margin-right:6px;vertical-align:-4px;flex:none}
.clsdot.sm{width:16px;height:16px;font-size:8px;margin-right:4px;vertical-align:-3px}
.badge.cls{width:6.6%;height:6.6%;font-size:clamp(10px,2.8vw,16px);border:1.5px solid rgba(255,255,255,.85)}
.sumt{width:100%;border-collapse:collapse;color:var(--text);font-size:14px;margin-bottom:10px}
.sumt th{font-size:13px;color:var(--muted);font-weight:600;text-align:center;padding:4px;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.sumt td{padding:4px}
.sumt td+td{text-align:center;font-weight:700;width:30%}
.sumt tr.big td{font-size:17px;font-weight:800}
.sumt tr.big td:first-child{font-size:14px;font-weight:600}
.evgraph{width:100%;height:90px;display:block;border-radius:8px;margin:6px 0 10px;cursor:pointer}
.mvlist{max-height:34vh;overflow-y:auto}
.mvrow{display:grid;grid-template-columns:30px 1fr 1fr;align-items:center;gap:2px}
.mvrow i{font-style:normal;color:var(--muted);font-size:13px}
.mvb{background:transparent;text-align:left;padding:5px 6px;border-radius:6px;color:var(--text);font-size:15px;display:flex;align-items:center}
.mvb.on{background:var(--panel2)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.levels button{background:var(--panel);border-radius:10px;padding:10px;display:grid;grid-template-columns:34px 1fr;grid-template-rows:auto auto;column-gap:8px;text-align:left;border:2px solid transparent;align-items:center}
.levels button.on{border-color:var(--green);background:#3a4a2c}
.levels .li{grid-row:span 2;font-size:26px;text-align:center}
.levels b{font-size:14px;line-height:1.2}
.levels span:last-child{font-size:12px;color:var(--muted)}
.status .sub .clsdot{width:18px;height:18px;font-size:9px;vertical-align:-4px}

  $('#themes').innerHTML = `<div class="seg">${DIFFS.map(([id, n]) => `<button data-d="${id}" class="${S.diff === id ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div class="list">${items}</div>`;
  $('#themes').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { S.diff = b.dataset.d; save(); goThemes(); });
  $('#themes').querySelectorAll('[data-t]').forEach(b => b.onclick = () => startTheme(b.dataset.t));
  show('themes', 'Темы', goHome);
}

/* ---------- состояние задачи ---------- */
let G = null;            // текущая задача
let MODE = null;         // {kind:'rated'|'theme'|'rush'|'review', theme, ...}
const boardEl = $('#board'), sqsEl = $('#sqs'), pcsEl = $('#pcs');
let flip = false, sqEls = [];

(function buildSquares() {
  for (let i = 0; i < 64; i++) { const d = document.createElement('div'); sqsEl.appendChild(d); sqEls.push(d); }
})();

function viewIdx(s) { return flip ? 63 - s : s; }
function paintSquares() {
  for (let vi = 0; vi < 64; vi++) {
    const s = flip ? 63 - vi : vi, r = s >> 3, c = s & 7, el = sqEls[vi];
    let cls = 'sq ' + ((r + c) % 2 ? 'd' : 'l');
    const h = G.hl;
    if (G.last && G.last.includes(s)) cls += ' last';
    if (G.sel === s) cls += ' sel';
    if (h.hint.includes(s)) cls += ' hint';
    if (h.wrong === s) cls += ' wrong';
    if (h.good === s) cls += ' good';
    if (h.check === s) cls += ' check';
    if (G.targets.includes(s)) cls += G.st.b[s] || (G.epT === s) ? ' ring' : ' dot';
    el.className = cls;
    el.innerHTML = '';
    const vr = vi >> 3, vc = vi & 7;
    if (vc === 0) el.insertAdjacentHTML('beforeend', `<span class="coord r">${8 - r}</span>`);
    if (vr === 7) el.insertAdjacentHTML('beforeend', `<span class="coord f">${String.fromCharCode(97 + c)}</span>`);
  }
}
function placeEl(el, s) { const vi = viewIdx(s); el.style.left = (vi & 7) * 12.5 + '%'; el.style.top = (vi >> 3) * 12.5 + '%'; }
function drawPieces(anims) {
  pcsEl.innerHTML = '';
  const moving = [];
  for (let s = 0; s < 64; s++) {
    const p = G.st.b[s]; if (!p) continue;
    const el = document.createElement('div');
    el.className = 'pc ' + (C.colorOf(p) === 'w' ? 'w' : 'b') + p.toUpperCase();
    el.dataset.s = s;
    placeEl(el, s);
    const a = anims && anims.find(x => x[1] === s);
    if (a) {
      const f = viewIdx(a[0]), t = viewIdx(s);
      el.style.transform = `translate(${((f & 7) - (t & 7)) * 100}%,${((f >> 3) - (t >> 3)) * 100}%)`;
      moving.push(el);
    }
    pcsEl.appendChild(el);
  }
  if (moving.length) requestAnimationFrame(() => requestAnimationFrame(() => moving.forEach(el => { el.classList.add('anim'); el.style.transform = ''; })));
  drawBadge();
}
function drawBadge() {
  pcsEl.querySelectorAll('.badge').forEach(b => b.remove());
  if (!G.badge) return;
  const [s, kind, txt] = G.badge, vi = viewIdx(s), b = document.createElement('div');
  b.className = 'badge ' + kind; b.textContent = txt || (kind === 'ok' ? '✓' : '✗');
  if (G.badgeColor) b.style.background = G.badgeColor;
  const bw = kind === 'cls' ? 6.6 : 5.2;
  b.style.left = Math.min(100 - bw, (vi & 7) * 12.5 + 12.5 - bw * .75) + '%'; b.style.top = Math.max(0.3, (vi >> 3) * 12.5 - bw * .3) + '%';
  pcsEl.appendChild(b);
}
function render(anims) {
  G.hl.check = C.inCheck(G.st) ? C.kingSq(G.st.b, G.st.turn) : -1;
  paintSquares();
  drawPieces(anims);
  drawArrows();
  $('#evalbar').hidden = !G.evalbar;
  $('#nav').hidden = !G.review;
  if (G.evalbar) drawEvalbar();
}
function animsFor(m) {
  const a = [[m.from, m.to]];
  if (m.castle === 'k') a.push([m.to + 1, m.to - 1]);
  if (m.castle === 'q') a.push([m.to - 2, m.to + 1]);
  return a;
}
function playSound(m, st) {
  if (m.capture) SND.capture(); else SND.move();
}

/* ---------- статус и кнопки ---------- */
const colorRu = c => c === 'w' ? 'белых' : 'чёрных';
function setStatus(kind, text, sub) {
  const el = $('#status');
  el.className = 'status' + (kind ? ' ' + kind : '');
  const dot = !kind || kind === 'ok' || kind === 'bad' ? `<span class="dot ${G ? G.user : 'w'}"></span>` : '';
  el.innerHTML = `${dot}<span>${text}${sub ? `<span class="sub">${sub}</span>` : ''}</span>`;
}
function setButtons(list) {
  const el = $('#btns'); el.innerHTML = '';
  for (const [label, fn, cls] of list) {
    const b = document.createElement('button'); b.className = 'btn' + (cls ? ' ' + cls : ''); b.textContent = label; b.onclick = fn; el.appendChild(b);
  }
}
function setInfo(html) { $('#infobar').innerHTML = html; }
function setMeta(html) { const el = $('#meta'); el.hidden = !html; el.innerHTML = html || ''; }

/* ---------- запуск задачи ---------- */
function startPuzzle(p, mode) {
  MODE = mode;
  const st = C.parseFEN(p.fen);
  G = { p, st, idx:0, user: st.turn === 'w' ? 'b' : 'w', mistakes:0, hinted:0, gaveUp:false, done:false, busy:true,
        sel:null, targets:[], epT:-1, last:null, hl:{ hint:[], wrong:-1, good:-1, check:-1 }, badge:null, rated:false, t0:Date.now() };
  flip = G.user === 'b';
  hidePromo();
  render();
  setStatus('', `Вы играете за ${colorRu(G.user)}`, 'Сначала ходит соперник…');
  updateUi();
  setTimeout(() => { if (G && G.p === p) opponentMove(); }, 550);
}
function opponentMove() {
  const m = C.findUci(G.st, G.p.moves[G.idx]);
  G.st = C.make(G.st, m); G.idx++; G.last = [m.from, m.to]; G.busy = false; G.hl.hint = [];
  playSound(m); render(animsFor(m));
  if (!G.done) setStatus('', `Ваш ход: играйте за ${colorRu(G.user)}`, G.idx > 1 ? 'Верно! Продолжайте.' : 'Найдите лучший ход.');
  updateUi();
}
function canMove() { return G && !G.done && !G.busy && G.st.turn === G.user; }

function select(s) {
  G.sel = s;
  const ms = C.legal(G.st).filter(m => m.from === s);
  G.targets = [...new Set(ms.map(m => m.to))];
  G.epT = (ms.find(m => m.ep) || {}).to ?? -1;
}
function deselect() { G.sel = null; G.targets = []; G.epT = -1; }

function tryUser(from, to, dropped) {
  const ms = C.legal(G.st).filter(m => m.from === from && m.to === to);
  if (!ms.length) { deselect(); render(); return; }
  if (ms.length > 1) { askPromo(ms, dropped); return; }
  userMove(ms[0], dropped);
}
function askPromo(ms, dropped) {
  const color = G.user, el = $('#promo');
  el.innerHTML = '<div>' + ['q','r','b','n'].map(x => `<button data-p="${x}" class="pc ${color}${x.toUpperCase()}" style="position:static;width:min(18vw,80px);height:min(18vw,80px)" aria-label="${x}"></button>`).join('') + '</div>';
  el.hidden = false;
  // Касание, открывшее окно, тут же порождает «click» — его пропускаем.
  const t0 = Date.now(), fresh = () => Date.now() - t0 < 400;
  el.querySelectorAll('button').forEach(b => b.onclick = ev => { ev.stopPropagation(); if (fresh()) return; hidePromo(); userMove(ms.find(m => m.promo === b.dataset.p), dropped); });
  el.onclick = () => { if (fresh()) return; hidePromo(); deselect(); render(); };
}
function hidePromo() { $('#promo').hidden = true; }

function userMove(m, dropped) {
  if (G.game) return gameMove(m, dropped);
  const u = C.uci(m), exp = G.p.moves[G.idx];
  const after = C.make(G.st, m), mate = C.isMate(after);
  const prev = G.st, prevLast = G.last;
  deselect(); G.hl.hint = []; G.hl.wrong = -1; G.hl.good = -1;
  G.st = after; G.last = [m.from, m.to];
  const anims = dropped ? (m.castle ? animsFor(m).slice(1) : null) : animsFor(m);
  if (u === exp || mate) {
    G.idx++; G.badge = [m.to, 'ok'];
    playSound(m); render(anims);
    if (mate || G.idx >= G.p.moves.length) { solved(); return; }
    G.busy = true; updateUi();
    setStatus('ok', 'Верно!', 'Соперник отвечает…');
    setTimeout(() => { if (G && G.st === after) { G.badge = null; opponentMove(); } }, 420);
    return;
  }
  // неверно
  G.mistakes++; G.badge = [m.to, 'bad']; G.hl.wrong = m.to; G.busy = true;
  SND.wrong(); render(anims);
  if (MODE.kind === 'rated') applyRating(false);
  if (MODE.kind === 'rush') { rushResult(false); return; }
  setStatus('bad', 'Неверно', 'Ход отменён — попробуйте другой.');
  updateUi();
  setTimeout(() => {
    if (!G || G.st !== after) return;
    G.st = prev; G.badge = null; G.hl.wrong = -1; G.busy = false;
    G.last = prevLast;
    render([[m.to, m.from]]);
    updateUi();
  }, 800);
}

function solved() {
  G.done = true; G.busy = false;
  const clean = G.mistakes === 0 && !G.hinted && !G.gaveUp;
  record(clean);
  if (MODE.kind === 'rush') { rushResult(true); return; }
  if (MODE.kind === 'rated' && !G.rated) applyRating(true);
  SND.win();
  setStatus('win', clean ? 'Решено! Отлично.' : 'Задача решена', clean ? 'С первой попытки.' : 'В следующий раз — без ошибок.');
  updateUi();
}

function record(clean) {
  if (G.recorded) return; G.recorded = true;
  S.attempts++; if (clean) S.firstTry++;
  for (const t of G.p.themes) { const a = S.theme[t] || (S.theme[t] = [0, 0]); a[0]++; if (clean) a[1]++; }
  save();
}

function applyRating(win) {
  if (G.rated) return; G.rated = true;
  const E = 1 / (1 + Math.pow(10, (G.p.rating - S.rating) / 400));
  const K = S.rated < 20 ? 40 : 24;
  let d = Math.round(K * ((win ? 1 : 0) - E));
  if (win && d < 1) d = 1; if (!win && d > -1) d = -1;
  S.rating = Math.max(100, S.rating + d); S.rated++; if (win) S.ratedWon++;
  S.best = Math.max(S.best, S.rating); S.hist.push(S.rating); if (S.hist.length > 500) S.hist.splice(0, S.hist.length - 500);
  S.seen[G.p.id] = win ? 1 : 0;
  G.delta = d; save();
}

function updateUi() {
  if (!G) return;
  if (G.game) return gameUi();
  $('#btns').classList.remove('wrap');
  const k = MODE.kind;
  if (k === 'rush') { rushInfo(); setButtons([]); setMeta(''); return; }
  // шапка
  const label = k === 'rated' ? 'Рейтинг' : k === 'theme' ? TNAME[MODE.theme] : 'Разбор';
  let right = '';
  if (k === 'rated') right = `<span class="pill">${S.rating}</span>${G.delta != null ? `<span class="delta ${G.delta >= 0 ? 'up' : 'down'}">${G.delta >= 0 ? '+' : '−'}${Math.abs(G.delta)}</span>` : ''}`;
  setInfo(`<span class="grow muted">${label}</span>${right}`);
  if (G.done) {
    const th = G.p.themes.filter(t => TNAME[t] && !(t === 'mate' && G.p.themes.some(x => /^mateIn/.test(x)))).map(t => TNAME[t]);
    setMeta(`Рейтинг задачи: <b>${G.p.rating}</b>${th.length ? '<br>Темы: ' + th.join(', ') : ''}`);
    const btns = [];
    if (k !== 'review') btns.push(['Следующая', () => nextPuzzle()]);
    else btns.push(['Назад к результатам', () => show('rushEnd', 'Puzzle Rush', goRushMenu)]);
    btns.unshift(['Заново', () => startPuzzle(G.p, MODE), 'sec']);
    setButtons(btns);
  } else {
    setMeta('');
    setButtons([
      ['Подсказка', hint, 'sec'],
      ['Решение', showSolution, 'sec'],
      k === 'review' ? ['К результатам', () => show('rushEnd', 'Puzzle Rush', goRushMenu), 'sec']
        : ['Пропустить', () => { if (k === 'rated' && !G.rated && G.idx > 0) applyRating(false); nextPuzzle(); }, 'sec']
    ]);
    $('#btns').querySelectorAll('button').forEach((b, i) => { if (i < 2) b.disabled = G.busy || G.st.turn !== G.user; });
  }
}

function hint() {
  if (!canMove()) return;
  const m = C.findUci(G.st, G.p.moves[G.idx]);
  G.hinted++;
  if (MODE.kind === 'rated') applyRating(false);
  G.hl.hint = G.hinted === 1 ? [m.from] : [m.from, m.to];
  render(); updateUi();
  setStatus('', G.hinted === 1 ? 'Подсказка: ходите этой фигурой' : 'Подсказка: вот ход целиком', G.hinted === 1 ? 'Нажмите «Подсказка» ещё раз, чтобы увидеть, куда.' : 'Сделайте этот ход.');
}

function showSolution() {
  if (!G || G.done) return;
  G.gaveUp = true; G.done = true; G.busy = true;
  if (MODE.kind === 'rated') applyRating(false);
  record(false);
  deselect(); G.hl.hint = []; G.badge = null;
  setStatus('', 'Решение', 'Показываю ходы…');
  const step = () => {
    if (!G || !G.gaveUp) return;
    if (G.idx >= G.p.moves.length) { G.busy = false; setStatus('', 'Решение показано', 'Разберите позицию и переходите к следующей.'); updateUi(); return; }
    const m = C.findUci(G.st, G.p.moves[G.idx]);
    G.st = C.make(G.st, m); G.idx++; G.last = [m.from, m.to];
    playSound(m); render(animsFor(m));
    setTimeout(step, 750);
  };
  updateUi();
  setTimeout(step, 300);
}

function nextPuzzle() {
  if (MODE.kind === 'rated') return startRated();
  if (MODE.kind === 'theme') return startTheme(MODE.theme);
}

function startRated() {
  const p = pickNear(S.rating, PZ, q => q.id in S.seen);
  show('play', 'Решать задачи', goHome);
  startPuzzle(p, { kind:'rated' });
}
let themeSeen = {};
function startTheme(t) {
  const pool = PZ.filter(p => p.themes.includes(t) && diffOk(p));
  const target = S.diff === 'mine' ? S.rating : S.diff === 'easy' ? 900 : S.diff === 'mid' ? 1500 : S.diff === 'hard' ? 2050 : 600 + Math.random() * 1800;
  const seen = themeSeen[t] || (themeSeen[t] = new Set());
  if (pool.every(p => seen.has(p.id))) seen.clear();
  const fresh2 = pool.filter(q => !seen.has(q.id));
  const p = S.diff === 'any' ? fresh2[Math.floor(Math.random() * fresh2.length)] : pickNear(target, pool, q => seen.has(q.id));
  seen.add(p.id);
  show('play', TNAME[t], goThemes);
  startPuzzle(p, { kind:'theme', theme:t });
}

/* ---------- управление: касание и перетаскивание ---------- */
let drag = null;
function squareAt(e) {
  const r = boardEl.getBoundingClientRect();
  const c = Math.floor((e.clientX - r.left) / r.width * 8), rr = Math.floor((e.clientY - r.top) / r.height * 8);
  if (c < 0 || c > 7 || rr < 0 || rr > 7) return -1;
  const vi = rr * 8 + c; return flip ? 63 - vi : vi;
}
boardEl.addEventListener('pointerdown', e => {
  audio();
  if (!canMove() || !$('#promo').hidden) return;
  const s = squareAt(e); if (s < 0) return;
  if (G.sel !== null && G.targets.includes(s)) { tryUser(G.sel, s, false); return; }
  const p = G.st.b[s];
  if (p && C.colorOf(p) === G.user) {
    const wasSel = G.sel === s;
    select(s); paintSquares();
    const el = pcsEl.querySelector(`.pc[data-s="${s}"]`);
    const r = boardEl.getBoundingClientRect(), sz = r.width / 8;
    const vi = viewIdx(s), cx = r.left + (vi & 7) * sz + sz / 2, cy = r.top + (vi >> 3) * sz + sz / 2;
    drag = { s, el, cx, cy, x0:e.clientX, y0:e.clientY, moved:false, wasSel };
    try { boardEl.setPointerCapture(e.pointerId); } catch (_) {}
  } else { deselect(); paintSquares(); }
});
boardEl.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
  drag.moved = true;
  if (drag.el) { drag.el.classList.remove('anim'); drag.el.classList.add('drag'); drag.el.style.transform = `translate(${e.clientX - drag.cx}px,${e.clientY - drag.cy}px)`; }
  e.preventDefault();
});
function endDrag(e, cancel) {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.el) { d.el.classList.remove('drag'); d.el.style.transform = ''; }
  if (cancel) return;
  const s = squareAt(e);
  if (d.moved) {
    if (s >= 0 && s !== d.s && G.targets.includes(s)) tryUser(d.s, s, true);
  } else if (d.wasSel && s === d.s) { deselect(); paintSquares(); }
}
boardEl.addEventListener('pointerup', e => endDrag(e, false));
boardEl.addEventListener('pointercancel', e => endDrag(e, true));
boardEl.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- Puzzle Rush ---------- */
let R = null, rushTimer = null;
function goRushMenu() {
  stopRush();
  $('#rushMenu').innerHTML = `<p class="muted">Задачи идут от лёгких к сложным. Одна неверная попытка — минус жизнь, после трёх ошибок забег окончен.</p>
  <div class="rush-modes">${RUSH_MODES.map(m => `<button class="tile${m.id === 'r3' ? ' main' : ''}" data-m="${m.id}"><span class="ic" style="background:${m.id === 'r3' ? '#5d8a35' : '#3c3a37'}">${m.time ? '⏱' : '❤️'}</span><span><b>${m.name}</b><span class="muted">${m.sub}${S.rush[m.id] ? ' · рекорд ' + S.rush[m.id] : ''}</span></span></button>`).join('')}</div>`;
  $('#rushMenu').querySelectorAll('[data-m]').forEach(b => b.onclick = () => startRush(RUSH_MODES.find(m => m.id === b.dataset.m)));
  show('rushMenu', 'Puzzle Rush', goHome);
}
function startRush(mode) {
  R = { mode, score:0, strikes:0, n:0, used:new Set(), log:[], end: mode.time ? Date.now() + mode.time * 1000 : 0, over:false };
  show('play', 'Puzzle Rush · ' + mode.name, () => { if (confirmLeave()) goRushMenu(); });
  if (mode.time) rushTimer = setInterval(() => { rushInfo(); if (Date.now() >= R.end) finishRush(); }, 200);
  rushNext();
}
function confirmLeave() { return !R || R.over || confirm('Выйти из забега? Результат не сохранится.'); }
function rushNext() {
  const target = Math.min(2400, 600 + R.n * 45);
  const p = pickNear(target, PZ, q => R.used.has(q.id));
  R.used.add(p.id); R.n++;
  startPuzzle(p, { kind:'rush' });
}
function rushInfo() {
  if (!R) return;
  const left = R.mode.time ? Math.max(0, R.end - Date.now()) : 0;
  const mm = Math.floor(left / 60000), ss = Math.floor(left / 1000) % 60;
  setInfo(`${R.mode.time ? `<span class="timer${left < 30000 ? ' low' : ''}">${mm}:${String(ss).padStart(2, '0')}</span>` : ''}
    <span class="grow"></span><span class="strikes">${[0,1,2].map(i => `<span class="${i < R.strikes ? 'x' : ''}">✗</span>`).join('')}</span>
    <span class="score">${R.score}</span>`);
}
function rushResult(ok) {
  if (!R || R.over) return;
  R.log.push({ id:G.p.id, ok, rating:G.p.rating });
  if (ok) { R.score++; SND.win(); setStatus('ok', 'Верно!', `Счёт: ${R.score}`); }
  else { R.strikes++; record(false); setStatus('bad', 'Ошибка', `Осталось жизней: ${3 - R.strikes}`); }
  G.done = true; G.busy = true;
  rushInfo();
  setTimeout(() => {
    if (!R || R.over) return;
    if (R.strikes >= 3) finishRush(); else rushNext();
  }, ok ? 450 : 900);
}
function stopRush() { if (rushTimer) clearInterval(rushTimer); rushTimer = null; }
function finishRush() {
  if (!R || R.over) return;
  R.over = true; stopRush(); SND.end();
  const prev = S.rush[R.mode.id] || 0, rec = R.score > prev;
  if (rec) S.rush[R.mode.id] = R.score;
  save();
  $('#rushEnd').innerHTML = `<div class="rating-card" style="justify-content:center;text-align:center;flex-direction:column">
     <div class="muted">${R.mode.name}</div><div class="big" style="font-size:56px">${R.score}</div>
     <div class="muted">${rec ? '🏆 Новый рекорд!' : 'Рекорд: ' + prev}</div></div>
   <div class="row" style="margin-bottom:14px"><button class="btn sec" id="reMenu">Меню</button><button class="btn" id="reAgain">Ещё раз</button></div>
   <h2>Задачи забега <span class="muted small">— нажмите, чтобы разобрать</span></h2>
   <ul class="results">${R.log.map((x, i) => `<li><button data-id="${x.id}"><span>${i + 1}. <span class="${x.ok ? 'okc' : 'badc'}">${x.ok ? '✓' : '✗'}</span></span><span class="muted">${x.rating}</span></button></li>`).join('')}</ul>`;
  $('#reMenu').onclick = goRushMenu;
  $('#reAgain').onclick = () => startRush(R.mode);
  $('#rushEnd').querySelectorAll('[data-id]').forEach(b => b.onclick = () => { show('play', 'Разбор задачи', () => show('rushEnd', 'Puzzle Rush', goRushMenu)); startPuzzle(BYID[b.dataset.id], { kind:'review' }); });
  show('rushEnd', 'Puzzle Rush', goRushMenu);
}

/* ===== Игра вдвоём на одной доске ===== */
const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const GKEY = 'chess-game-v1';
const TCS = [
  { id:'none', name:'Без часов', base:0, inc:0 },
  { id:'1+0', name:'1 мин', base:60, inc:0 },
  { id:'3+2', name:'3 + 2', base:180, inc:2 },
  { id:'5+0', name:'5 мин', base:300, inc:0 },
  { id:'10+0', name:'10 мин', base:600, inc:0 },
  { id:'15+10', name:'15 + 10', base:900, inc:10 },
  { id:'30+0', name:'30 мин', base:1800, inc:0 }
];
const FIG = { K:'♔', Q:'♕', R:'♖', B:'♗', N:'♘' };
const VAL = { p:1, n:3, b:3, r:5, q:9, k:0 };
const sideRu = c => c === 'w' ? 'белые' : 'чёрные';
const SideRu = c => c === 'w' ? 'Белые' : 'Чёрные';
const otherC = c => c === 'w' ? 'b' : 'w';
let gameTimer = null;

const san = (st, m) => C.san(st, m, true);
const posKey = st => st.b.join(',') + st.turn + st.castle + st.ep;

function insufficient(b) {
  const rest = [];
  b.forEach((p, s) => { if (p && p.toLowerCase() !== 'k') rest.push([p.toLowerCase(), s]); });
  if (!rest.length) return true;
  if (rest.length === 1 && (rest[0][0] === 'b' || rest[0][0] === 'n')) return true;
  if (rest.every(([p]) => p === 'b')) { const col = s => ((s >> 3) + (s & 7)) % 2; return rest.every(([, s]) => col(s) === col(rest[0][1])); }
  return false;
}

function replay(moves) {
  let st = C.parseFEN(START_FEN);
  const H = [{ st, key:posKey(st), hm:0, m:null }], sans = [], ok = [];
  for (const u of moves) {
    const m = C.findUci(st, u); if (!m) break;
    sans.push(san(st, m)); ok.push(u);
    const hm = st.b[m.from].toLowerCase() === 'p' || m.capture ? 0 : H[H.length - 1].hm + 1;
    st = C.make(st, m);
    H.push({ st, key:posKey(st), hm, m });
  }
  return { st, H, sans, moves:ok };
}

/* ---------- часы ---------- */
const now = () => Date.now();
function clockLeft(c) {
  const k = G.clock; if (!k) return 0;
  return k[c] - (k.running && !k.paused && G.st.turn === c && !G.result ? now() - k.since : 0);
}
function clockCommit() {
  const k = G && G.game && G.clock; if (!k || !k.running || k.paused || G.result) return;
  k[G.st.turn] -= now() - k.since; k.since = now();
}
function clockPause(p) {
  if (!G || !G.game || !G.clock) return;
  if (p) { clockCommit(); G.clock.paused = true; } else { G.clock.paused = false; G.clock.since = now(); }
  saveGame();
}
const fmt = ms => {
  ms = Math.max(0, ms);
  if (ms < 10000) return (ms / 1000).toFixed(1);
  const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};
function gameTick() {
  if (!G || !G.game) { clearInterval(gameTimer); gameTimer = null; return; }
  if (!G.clock || G.result) return;
  const c = G.st.turn;
  if (clockLeft(c) <= 0) {
    G.clock[c] = 0;
    const win = otherC(c);
    const winPieces = G.st.b.filter(p => p && C.colorOf(p) === win && p.toLowerCase() !== 'k');
    const cannot = !winPieces.length || (winPieces.length === 1 && 'bn'.includes(winPieces[0].toLowerCase()));
    endGame(cannot ? { draw:true, why:'Время вышло, но у соперника не хватает фигур для мата' } : { winner:win, why:`У ${c === 'w' ? 'белых' : 'чёрных'} кончилось время` });
    return;
  }
  drawClocks();
}
function drawClocks() {
  if (!G.clock) return;
  for (const c of ['w', 'b']) {
    const el = $('#clk-' + c); if (!el) continue;
    const ms = clockLeft(c);
    el.querySelector('b').textContent = fmt(ms);
    el.classList.toggle('on', G.st.turn === c && !G.result && G.clock.running);
    el.classList.toggle('low', ms < 20000);
  }
}

/* ---------- партия ---------- */
function saveGame() {
  if (!G || !G.game) return;
  clockCommit();
  const k = G.clock;
  try { localStorage.setItem(G.bot ? BKEY : GKEY, JSON.stringify({ gid:G.gid, moves:G.moves, tc:G.tc, clock:k ? { w:k.w, b:k.b } : null, result:G.result || null, bot:G.bot || null })); } catch (e) {}
}
function loadGame(key = GKEY) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch (e) { return null; } }

function startGame(saved, bot) {
  bot = bot || (saved && saved.bot) || null;
  const tc = bot ? TCS[0] : TCS.find(t => t.id === (saved ? saved.tc : S.gameTc)) || TCS[0];
  const r = replay(saved ? saved.moves : []);
  G = { game:true, gid:saved && saved.gid || String(Date.now()), tc:tc.id, inc:tc.inc * 1000, st:r.st, H:r.H, sans:r.sans, moves:r.moves, user:r.st.turn,
        done:false, busy:false, sel:null, targets:[], epT:-1, last:null, hl:{ hint:[], wrong:-1, good:-1, check:-1 }, badge:null, result:null,
        bot, gen:0, evals:[], cls:{}, clsBest:{}, opening:null, arrows:[] };
  if (bot) G.user = bot.color;
  const lastH = r.H[r.H.length - 1]; if (lastH.m) G.last = [lastH.m.from, lastH.m.to];
  G.clock = tc.base ? { w:saved && saved.clock ? saved.clock.w : tc.base * 1000, b:saved && saved.clock ? saved.clock.b : tc.base * 1000,
                        running:r.moves.length > 0, paused:false, since:now() } : null;
  MODE = { kind:'game' };
  if (saved && saved.result) { G.result = saved.result; G.done = true; }
  setFlip();
  hidePromo();
  if (bot) show('play', 'Тренер · ' + LEVELS[bot.lvl].name, () => { Eng.stop(); goBotMenu(); });
  else show('play', 'Игра вдвоём', () => { clockPause(true); Eng.stop(); goGameMenu(); });
  render(); gameUi();
  clearInterval(gameTimer); gameTimer = setInterval(gameTick, 100);
  saveGame();
  afterMove();
}
function setFlip() { flip = G.bot ? G.bot.color === 'b' : S.autoFlip ? G.st.turn === 'b' : !!S.gameFlip; }

function gameMove(m, dropped, byBot) {
  const prev = G.st;
  G.gen++; G.arrows = []; G.hl.hint = [];
  // значок вашего хода остаётся, пока тренер отвечает, если ваша фигура всё ещё на месте
  if (!(byBot && G.badge && G.st.b[G.badge[0]] && m.to !== G.badge[0])) { G.badge = null; G.badgeColor = null; }
  clockCommit();
  const k = G.clock;
  if (k) { if (k.running) k[prev.turn] += G.inc; k.running = true; k.since = now(); }
  G.sans.push(san(prev, m));
  const hm = prev.b[m.from].toLowerCase() === 'p' || m.capture ? 0 : G.H[G.H.length - 1].hm + 1;
  G.st = C.make(prev, m); G.moves.push(C.uci(m));
  G.H.push({ st:G.st, key:posKey(G.st), hm, m });
  G.last = [m.from, m.to]; deselect(); G.user = G.bot ? G.bot.color : G.st.turn;
  playSound(m);
  render(dropped ? (m.castle ? animsFor(m).slice(1) : null) : animsFor(m));
  checkEnd();
  saveGame();
  gameUi();
  afterMove();
  if (S.autoFlip && !G.bot && !G.result) {
    G.busy = true;
    setTimeout(() => { if (!G || !G.game) return; G.busy = false; setFlip(); render(); }, 380);
  }
}
function checkEnd() {
  const st = G.st, n = C.legal(st).length;
  if (!n) return endGame(C.inCheck(st) ? { winner:otherC(st.turn), why:'Мат' } : { draw:true, why:'Пат: ходить некуда, но шаха нет' }, true);
  if (insufficient(st.b)) return endGame({ draw:true, why:'Ни у кого не хватает фигур для мата' }, true);
  const key = posKey(st);
  if (G.H.filter(h => h.key === key).length >= 3) return endGame({ draw:true, why:'Позиция повторилась три раза' }, true);
  if (G.H[G.H.length - 1].hm >= 100) return endGame({ draw:true, why:'50 ходов без взятий и ходов пешками' }, true);
}
function endGame(res, quiet) {
  clockCommit();
  G.result = res; G.done = true; deselect();
  setTimeout(() => SND.end(), quiet ? 250 : 0);
  saveGame();
  archiveGame();
  if (!quiet) { render(); gameUi(); }
}
function undoMove() {
  if (!G.moves.length) return;
  clockCommit();
  let n = G.moves.length - 1;
  if (G.bot) { n = G.moves.length; do { n--; } while (n > 0 && (n % 2 === 0 ? 'w' : 'b') !== G.bot.color); }
  G.gen++; G.badge = null; G.badgeColor = null; G.arrows = []; G.hl.hint = [];
  G.evals.length = Math.min(G.evals.length, n + 1);
  for (const k of Object.keys(G.cls)) if (+k > n) { delete G.cls[k]; delete G.clsBest[k]; }
  const r = replay(G.moves.slice(0, n));
  if (G.result) unarchiveGame(G.gid);
  Object.assign(G, { st:r.st, H:r.H, sans:r.sans, moves:r.moves, user:G.bot ? G.bot.color : r.st.turn, result:null, done:false, busy:false });
  deselect();
  const h = r.H[r.H.length - 1]; G.last = h.m ? [h.m.from, h.m.to] : null;
  if (G.clock) { G.clock.since = now(); if (!G.moves.length) G.clock.running = false; }
  if (S.autoFlip || G.bot) setFlip();
  render(); saveGame(); gameUi();
  afterMove();
}

function material() {
  const cnt = { w:{}, b:{} }, start = { p:8, n:2, b:2, r:2, q:1 };
  let score = { w:0, b:0 };
  for (const p of G.st.b) if (p) { const c = C.colorOf(p), t = p.toLowerCase(); cnt[c][t] = (cnt[c][t] || 0) + 1; score[c] += VAL[t]; }
  // взятые фигуры: чего не хватает у соперника
  const took = c => { const o = otherC(c); let s = ''; for (const t of ['q','r','b','n','p']) { const promoted = ['q','r','b','n'].reduce((n, x) => n + Math.max(0, (cnt[o][x] || 0) - start[x]), 0); const miss = Math.max(0, start[t] - (cnt[o][t] || 0) - (t === 'p' ? promoted : 0)); s += (o === 'w' ? { q:'♕\uFE0E',r:'♖\uFE0E',b:'♗\uFE0E',n:'♘\uFE0E',p:'♙\uFE0E' } : { q:'♛\uFE0E',r:'♜\uFE0E',b:'♝\uFE0E',n:'♞\uFE0E',p:'♟\uFE0E' })[t].repeat(miss); } return s; };
  const d = score.w - score.b;
  return { w:took('w'), b:took('b'), d };
}

function gameUi() {
  if (!G || !G.game) return;
  const tc = TCS.find(t => t.id === G.tc);
  if (G.bot) return botUi();
  setInfo(G.clock
    ? `<span class="clk" id="clk-w"><span>♔ Белые</span><b></b></span><span class="clk" id="clk-b"><span>♚ Чёрные</span><b></b></span>`
    : `<span class="grow muted">Без часов</span><span class="muted small">Ход ${Math.floor(G.moves.length / 2) + 1}</span>`);
  drawClocks();
  const r = G.result;
  if (r) {
    const el = $('#status'); el.className = 'status win';
    el.innerHTML = `<span>${r.draw ? 'Ничья' : (r.why === 'Мат' ? 'Мат! ' : '') + 'Победили ' + sideRu(r.winner)}<span class="sub">${r.draw || r.why !== 'Мат' ? r.why : (r.winner === 'w' ? 'Чёрный' : 'Белый') + ' король заматован'}</span></span>`;
  } else {
    const cl = liveOn() && G.cls[G.moves.length] ? clsLine(G, G.moves.length) : '';
    setStatus('', `Ход ${G.st.turn === 'w' ? 'белых' : 'чёрных'}${C.inCheck(G.st) ? ' · шах!' : ''}`, cl || (G.moves.length ? 'Последний ход: ' + G.sans[G.sans.length - 1] : 'Белые начинают'));
    $('#status .dot').className = 'dot ' + G.st.turn;
  }
  const btns = r
    ? [['Отменить ход', undoMove, 'sec'], ['Новая партия', () => startGame(null), 'sec'], ['Анализ партии', () => { saveGame(); analyzeGame(gameFromCurrent(), () => startGame(loadGame())); }]]
    : [['Отменить ход', undoMove, 'sec'], ['Повернуть', () => { S.autoFlip = false; S.gameFlip = !flip; save(); setFlip(); render(); gameUi(); }, 'sec'],
       ['Ничья', () => { if (confirm('Оба игрока согласны на ничью?')) endGame({ draw:true, why:'По соглашению' }); }, 'sec'],
       ['Сдаться', () => { const c = G.st.turn; if (confirm(`${SideRu(c)} сдаются?`)) endGame({ winner:otherC(c), why:`${SideRu(c)} сдались` }); }, 'sec'],
       ['📊 Анализ', () => { if (!G.moves.length) return; clockPause(true); analyzeGame(gameFromCurrent(), () => { const s = loadGame(); startGame(s); }); }, 'sec']];
  setButtons(btns);
  $('#btns').classList.add('wrap');
  $('#btns').querySelector('button').disabled = !G.moves.length;
  const ab = [...$('#btns').querySelectorAll('button')].find(b => b.textContent.includes('Анализ')); if (ab) ab.disabled = !G.moves.length;
  // запись партии
  const mat = material();
  let list = '';
  for (let i = 0; i < G.sans.length; i += 2) list += `<span class="mv"><i>${i / 2 + 1}.</i> ${G.sans[i]}${G.sans[i + 1] ? ' ' + G.sans[i + 1] : ''}</span> `;
  setMeta(`<div class="mat"><span>Белые взяли: <b class="cap">${mat.w || '—'}</b>${mat.d > 0 ? ` <b class="adv">+${mat.d}</b>` : ''}</span>
    <span>Чёрные взяли: <b class="cap">${mat.b || '—'}</b>${mat.d < 0 ? ` <b class="adv">+${-mat.d}</b>` : ''}</span></div>
    <div class="moves" id="moves">${list || '<span class="muted">Ходов пока нет</span>'}</div>
    <div class="muted small" style="margin-top:6px">${tc.name}${S.autoFlip ? ' · доска поворачивается к тому, кто ходит' : ''}</div>`);
  const mv = $('#moves'); if (mv) mv.scrollTop = mv.scrollHeight;
}

function goGameMenu() {
  RV = null; MODE = null;
  clearInterval(gameTimer); gameTimer = null;
  const saved = loadGame();
  const savedOn = saved && saved.moves.length && !saved.result;
  $('#gameMenu').innerHTML = `
   ${savedOn ? `<button class="tile main" id="gContinue" style="margin-bottom:14px"><span class="ic" style="background:#5d8a35">▶️</span><span><b>Продолжить партию</b><span class="muted">${saved.moves.length} ${plural(saved.moves.length, 'полуход', 'полухода', 'полуходов')} · ${(TCS.find(t => t.id === saved.tc) || TCS[0]).name}</span></span></button>` : ''}
   <h2 style="margin-top:0">Контроль времени</h2>
   <div class="tcs">${TCS.map(t => `<button data-tc="${t.id}" class="${S.gameTc === t.id ? 'on' : ''}">${t.name}</button>`).join('')}</div>

/* ===== Анализ партии (как «Обзор партии» на chess.com) ===== */
const AKEY = 'chess-analysis-v1', HKEY = 'chess-games-v1';
const DEPTH = 14;
const CLS = {
  brilliant:  { name:'Блестящий ход',  icon:'!!', color:'#26c2a3' },
  great:      { name:'Отличный ход',   icon:'!',  color:'#5c8bb0' },
  best:       { name:'Лучший ход',     icon:'★',  color:'#81b64c' },

  good:       { name:'Хороший ход',    icon:'✓',  color:'#95af8a' },
  book:       { name:'Теория',         icon:'📖︎', color:'#a88865' },
  inaccuracy: { name:'Неточность',     icon:'?!', color:'#f7c631' },
  mistake:    { name:'Ошибка',         icon:'?',  color:'#ffa459' },

const CLS_ORDER = ['brilliant', 'great', 'best', 'excellent', 'good', 'book', 'inaccuracy', 'mistake', 'miss', 'blunder'];
const PVAL = { p:1, n:3, b:3, r:5, q:9, k:100 };

/* ---------- архив партий ---------- */
function loadHistory() { try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch (e) { return []; } }
function saveHistory(h) { try { localStorage.setItem(HKEY, JSON.stringify(h.slice(0, 60))); } catch (e) {} }
function archiveGame() {

  h.unshift({ id:G.gid, date:Date.now(), moves:G.moves.slice(), result:G.result, tc:G.tc, bot:G.bot || null });
  saveHistory(h);
}
function unarchiveGame(id) { saveHistory(loadHistory().filter(x => x.id !== id)); }
function gameFromCurrent() {
  return { id:G.gid, moves:G.moves.slice(), result:G.result, fen:START_FEN, ...namesFor(G.bot) };
}
function namesFor(bot) {
  if (!bot) return { white:'Белые', black:'Чёрные' };
  const t = 'Тренер ≈' + LEVELS[bot.lvl].elo;
  return bot.color === 'w' ? { white:'Вы', black:t } : { white:t, black:'Вы' };
}
const resultStr = r => !r ? '*' : r.draw ? '½–½' : r.winner === 'w' ? '1–0' : '0–1';

/* ---------- движок ---------- */
const Eng = {
  w:null, handler:null, ready:null, rej:null, q:Promise.resolve(),
  start() {
    if (this.ready) return this.ready;
    this.ready = new Promise((res, rej) => {
      try { this.w = new Worker('sf/stockfish-19-lite-single.js'); } catch (e) { this.ready = null; rej(e); return; }
      this.w.onmessage = e => { if (this.handler) this.handler(String(e.data)); };
      this.w.onerror = e => { this.ready = null; rej(e); };
      this.handler = l => { if (l === 'uciok') this.w.postMessage('isready'); if (l === 'readyok') { this.handler = null; res(); } };
      this.w.postMessage('uci');
    });
    return this.ready;
  },
  // задачи к движку выполняются строго по очереди
  task(fn) { const p = this.q.then(() => this.start()).then(fn); this.q = p.catch(() => {}); return p; },
  newGame() { return new Promise(res => { this.handler = l => { if (l === 'readyok') { this.handler = null; res(); } }; this.w.postMessage('ucinewgame'); this.w.postMessage('isready'); }); },
  // opts: depth | movetime, mpv (линий), elo (ограничение силы)
  search(fen, opts) {
    return new Promise((res, rej) => {
      const lines = []; this.rej = rej;
      this.handler = l => {
        if (l.startsWith('info') && l.includes(' pv ')) {
          const mp = +(l.match(/ multipv (\d+)/) || [0, 1])[1];
          const sc = l.match(/ score (cp|mate) (-?\d+)/);
          if (!sc) return;
          lines[mp - 1] = { kind:sc[1], v:+sc[2], pv:l.split(' pv ')[1].trim().split(' ') };
        } else if (l.startsWith('bestmove')) { this.handler = null; this.rej = null; res({ lines, best:l.split(' ')[1] }); }
      };
      const w = this.w;
      w.postMessage('setoption name MultiPV value ' + (opts.mpv || 2));
      w.postMessage('setoption name UCI_LimitStrength value ' + (opts.elo ? 'true' : 'false'));
      if (opts.elo) w.postMessage('setoption name UCI_Elo value ' + opts.elo);
      w.postMessage('position fen ' + fen);
      w.postMessage(opts.movetime ? 'go movetime ' + opts.movetime : 'go depth ' + opts.depth);
    });
  },
  analyse(fen, depth) { return this.search(fen, { depth, mpv:2 }); },
  stop() {
    if (this.rej) { const r = this.rej; this.rej = null; r(new Error('stopped')); }
    if (this.w) { this.w.terminate(); this.w = null; }
    this.ready = null; this.handler = null; this.q = Promise.resolve();
  }
};
// результат поиска → оценка позиции (с точки зрения белых) для классификации
function toEval(r, st) {
  const l1 = r.lines[0] || { kind:'cp', v:0, pv:[r.best] };
  const e = whiteScore(l1, st.turn);
  e.best = l1.pv[0] || r.best; e.pv = l1.pv.slice(0, 6);
  if (r.lines[1]) { const e2 = whiteScore(r.lines[1], st.turn); e.alt = e2.mate != null ? { mate:e2.mate } : { cp:e2.cp }; e.altMove = r.lines[1].pv[0]; }
  return e;
}
function terminalEval(st) { return C.legal(st).length ? null : (C.inCheck(st) ? { mate:0, matedSide:st.turn } : { cp:0 }); }

/* ---------- оценки ---------- */
// оценка с точки зрения белых: {cp} или {mate} (mate>0 — белые матуют; mate=0 — мат уже на доске)
function whiteScore(line, turn) {
  const sgn = turn === 'w' ? 1 : -1;
  return line.kind === 'mate' ? { mate:line.v * sgn } : { cp:line.v * sgn };
}
function winW(e) {
  if (e.mate != null) return e.mate > 0 ? 100 : e.mate < 0 ? 0 : (e.matedSide === 'w' ? 0 : 100);
  return 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * e.cp)) - 1);
}
const winFor = (e, c) => c === 'w' ? winW(e) : 100 - winW(e);
function evalText(e) {
  if (e.mate != null) return e.mate === 0 ? (e.matedSide === 'w' ? '0–1' : '1–0') : (e.mate > 0 ? 'M' : '−M') + Math.abs(e.mate);
  const v = e.cp / 100; return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(Math.abs(v) >= 10 ? 0 : 1);
}

function openingBook() {
  if (openingBook.p) return openingBook.p;
  openingBook.p = fetch('openings.json').then(r => r.json()).then(list => {
    const prefixes = new Set(), names = new Map();
    for (const [eco, name, ucis] of list) {
      const u = ucis.split(' ');
      for (let i = 1; i <= u.length; i++) prefixes.add(u.slice(0, i).join(' '));
      names.set(ucis, eco + ' · ' + name);
    }
    return { prefixes, names };
  }).catch(() => ({ prefixes:new Set(), names:new Map() }));
  return openingBook.p;
}

/* ---------- запуск анализа ---------- */
let anaCancel = false, anaBack = null;
function cacheGet(key) { try { return (JSON.parse(localStorage.getItem(AKEY) || '{}'))[key] || null; } catch (e) { return null; } }
function cachePut(key, val) {
  try {
    const all = JSON.parse(localStorage.getItem(AKEY) || '{}'); all[key] = val;
    const keys = Object.keys(all); if (keys.length > 25) delete all[keys[0]];
    localStorage.setItem(AKEY, JSON.stringify(all));
  } catch (e) {}
}

async function analyzeGame(game, backFn) {
  anaBack = backFn || goAnaMenu;
  clearInterval(gameTimer); gameTimer = null;
  if (G && G.game && G.clock) clockPause(true);
  const back = () => { anaCancel = true; Eng.stop(); anaBack(); };
  // позиции партии
  let st = C.parseFEN(game.fen || START_FEN);
  const P = [{ st, hm:0, fm:1 }], sans = [];
  for (const u of game.moves) {
    const m = C.findUci(st, u); if (!m) break;
    sans.push(C.san(st, m, true));
    const prev = P[P.length - 1];
    const hm = st.b[m.from].toLowerCase() === 'p' || m.capture ? 0 : prev.hm + 1;
    st = C.make(st, m);
    P.push({ st, m, hm, fm:prev.fm + (st.turn === 'w' ? 1 : 0) });
  }
  const key = (game.fen || '') + '|' + game.moves.join(' ') + '|' + DEPTH;
  let E = cacheGet(key);
  if (!E) {
    anaCancel = false;
    $('#anaWait').innerHTML = `<div class="rating-card" style="flex-direction:column;align-items:stretch;text-align:center">
      <div class="big" style="font-size:22px">Анализирую партию…</div>
      <div class="muted small" id="anaTxt">Запускаю движок</div>
      <div class="bar" style="height:10px"><i id="anaBar" style="width:0"></i></div>
      <div class="muted small">Движок Stockfish работает прямо на телефоне, без интернета.</div></div>
      <button class="btn sec" id="anaStop" style="width:100%">Отмена</button>`;
    $('#anaStop').onclick = back;
    show('anaWait', 'Анализ партии', back);
    Eng.stop();
    try { await Eng.start(); await Eng.newGame(); }
    catch (e) { $('#anaTxt').textContent = 'Не удалось запустить движок. Откройте приложение один раз с интернетом, чтобы он скачался.'; return; }
    E = [];
    for (let i = 0; i < P.length; i++) {
      if (anaCancel) return;
      const s = P[i].st;
      if (!C.legal(s).length) { E.push(C.inCheck(s) ? { mate:0, matedSide:s.turn } : { cp:0 }); continue; }
      let r;
      try { r = await Eng.analyse(C.toFEN(s, P[i].hm, P[i].fm), DEPTH); } catch (e) { return; }
      if (anaCancel) return;
      E.push(toEval(r, s));
      $('#anaTxt').textContent = `Позиция ${i + 1} из ${P.length}`;
      $('#anaBar').style.width = Math.round((i + 1) / P.length * 100) + '%';
    }
    cachePut(key, E);
  }
  const book = await openingBook();
  openReview(game, P, sans, E, book);
}

/* ---------- классификация ходов ---------- */
function classify(P, E, book, startFen) {
  const out = [];
  let line = [], opening = null, inBook = !startFen || startFen === START_FEN;
  for (let i = 0; i < P.length - 1; i++) {
    const before = P[i].st, after = P[i + 1].st, m = P[i + 1].m, c = before.turn;
    const u = C.uci(m);
    line.push(u);
    const wb = winFor(E[i], c), wa = winFor(E[i + 1], c);
    const loss = Math.max(0, wb - wa);
    let acc = 103.1668 * Math.exp(-0.04354 * loss) - 3.1669; acc = Math.max(0, Math.min(100, acc));
    let k;
    const lk = line.join(' ');
    k = judge(before, after, m, P[i].m, E[i], E[i + 1], i > 0 ? out[i - 1].k : null, loss);
    // дебютный ход из базы считаем «теорией», только если он не ошибочный
    if (inBook && book.prefixes.has(lk) && loss < 6) { k = 'book'; if (book.names.has(lk)) opening = book.names.get(lk); }
    else inBook = false;
    if (k === 'book') acc = 100;
    out.push({ k, acc, loss, c });
  }
  return { moves:out, opening };
}
function judge(before, after, m, prevM, eB, eA, prevCls, loss) {
  const c = before.turn, u = C.uci(m);
  const wb = winFor(eB, c), wa = winFor(eA, c);
  if (loss == null) loss = Math.max(0, wb - wa);
  const isBest = u === eB.best;
  // «Блестящий»: жертва фигуры, которая оказывается лучшим или почти лучшим ходом
  const mover = before.b[m.from].toLowerCase(), val = PVAL[mover];
  const captured = m.capture ? (m.ep ? 1 : PVAL[before.b[m.to].toLowerCase()]) : 0;
  let sac = false;
  if (val >= 3 && val < 100 && captured < val && C.attacked(after.b, m.to, after.turn)) {
    const takers = C.legal(after).filter(x => x.to === m.to);
    const cheap = takers.some(x => PVAL[after.b[x.from].toLowerCase()] < val);
    const defended = C.attacked(after.b, m.to, c);
    sac = takers.length > 0 && (cheap || !defended);
  }
  const alt = eB.alt ? winFor(eB.alt, c) : null;
  const prevWasRecapture = prevM && prevM.to === m.to;
  const forcedMate = isBest && eB.mate != null && (c === 'w' ? eB.mate > 0 : eB.mate < 0);
  if (sac && !C.inCheck(before) && ((loss <= 2 && wa >= 50 && wb < 97) || forcedMate)) return 'brilliant';
  if (isBest && alt != null && wb - alt >= 20 && wb > 15 && wb < 95 && !prevWasRecapture && !C.inCheck(before)) return 'great';
  if (isBest || loss < 1) return 'best';
  if (loss < 2.5) return 'excellent';
  if (loss < 6) return 'good';
  if ((prevCls === 'mistake' || prevCls === 'blunder' || prevCls === 'miss') && loss >= 10 && wa >= 30) return 'miss';
  if (loss < 10) return 'inaccuracy';
  if (loss < 20) return 'mistake';
  return 'blunder';
}
function gameAccuracy(list) {
  if (!list.length) return null;
  const a = list.map(x => x.acc);
  const mean = a.reduce((s, x) => s + x, 0) / a.length;
  const harm = a.length / a.reduce((s, x) => s + 1 / Math.max(x, 5), 0);
  return Math.round(((mean + harm) / 2) * 10) / 10;
}
function accToRating(acc) {
  const T = [[0, 100], [40, 250], [50, 400], [60, 650], [70, 900], [75, 1100], [80, 1350], [85, 1600], [88, 1800], [90, 1950], [92, 2150], [94, 2350], [96, 2600], [98, 2850], [100, 3000]];
  for (let i = 1; i < T.length; i++) if (acc <= T[i][0]) {
    const [a0, r0] = T[i - 1], [a1, r1] = T[i];
    return Math.round((r0 + (r1 - r0) * (acc - a0) / (a1 - a0)) / 50) * 50;
  }
  return 3000;
}

/* ---------- экран разбора ---------- */
let RV = null;
function openReview(game, P, sans, E, book) {
  const { moves, opening } = classify(P, E, book, game.fen);
  RV = { game, P, sans, E, moves, opening, ply:0 };
  const per = { w:moves.filter(x => x.c === 'w'), b:moves.filter(x => x.c === 'b') };
  RV.sum = {};
  for (const c of ['w', 'b']) {
    const acc = gameAccuracy(per[c].filter(x => x.k !== 'book'));
    const cnt = {}; for (const x of per[c]) cnt[x.k] = (cnt[x.k] || 0) + 1;
    RV.sum[c] = { acc, rating:acc == null ? null : accToRating(acc), cnt };
  }
  G = { review:true, st:P[0].st, done:true, busy:false, user:'-', sel:null, targets:[], epT:-1, last:null,
        hl:{ hint:[], wrong:-1, good:-1, check:-1 }, badge:null, evalbar:true, arrows:[] };
  MODE = { kind:'analysis' };
  flip = false;
  hidePromo();
  show('play', 'Анализ партии', () => { Eng.stop(); RV = null; MODE = null; anaBack(); });
  $('#nav').hidden = false;
  $('#nav').innerHTML = [['⏮', () => goPly(0)], ['◀', () => goPly(RV.ply - 1)], ['▶', () => goPly(RV.ply + 1)], ['⏭', () => goPly(RV.P.length - 1)], ['⇅', () => { flip = !flip; goPly(RV.ply); }]]
    .map((b, i) => `<button class="btn sec" data-n="${i}">${b[0]}</button>`).join('');
  const navFns = [() => goPly(0), () => goPly(RV.ply - 1), () => goPly(RV.ply + 1), () => goPly(RV.P.length - 1), () => { flip = !flip; goPly(RV.ply); }];
  $('#nav').querySelectorAll('button').forEach((b, i) => b.onclick = navFns[i]);
  setButtons([]);
  goPly(0);
}

function goPly(n) {
  if (!RV) return;
  n = Math.max(0, Math.min(RV.P.length - 1, n));
  const forward = n === RV.ply + 1;
  RV.ply = n;
  const p = RV.P[n];
  G.st = p.st; G.last = p.m ? [p.m.from, p.m.to] : null; G.arrows = [];
  const mv = n > 0 ? RV.moves[n - 1] : null;
  G.badge = mv ? [p.m.to, 'cls', CLS[mv.k].icon] : null;
  G.badgeColor = mv ? CLS[mv.k].color : null;
  if (mv && !['best', 'book', 'brilliant', 'great'].includes(mv.k)) {

}

function drawArrows() {
  const svg = $('#arrows');
  if (!G || !G.arrows || !G.arrows.length) { svg.innerHTML = ''; return; }
  const ctr = s => { const vi = viewIdx(s); return [(vi & 7) * 100 + 50, (vi >> 3) * 100 + 50]; };
  svg.innerHTML = G.arrows.map(([f, t, col]) => {
    const [x1, y1] = ctr(f), [x2, y2] = ctr(t);
    const ang = Math.atan2(y2 - y1, x2 - x1), len = Math.hypot(x2 - x1, y2 - y1) - 30;
    const ex = x1 + Math.cos(ang) * len, ey = y1 + Math.sin(ang) * len;
    const hx = x1 + Math.cos(ang) * (len + 28), hy = y1 + Math.sin(ang) * (len + 28);
    const px = Math.cos(ang + Math.PI / 2) * 26, py = Math.sin(ang + Math.PI / 2) * 26;
    return `<g opacity=".85"><line x1="${x1}" y1="${y1}" x2="${ex}" y2="${ey}" stroke="${col}" stroke-width="20" stroke-linecap="round"/>
      <polygon points="${hx},${hy} ${ex + px},${ey + py} ${ex - px},${ey - py}" fill="${col}"/></g>`;
  }).join('');
}

function pvSan(st, pv, n) {
  const out = []; let s = st;
  for (const u of pv.slice(0, n)) { const m = C.findUci(s, u); if (!m) break; out.push(C.san(s, m, true)); s = C.make(s, m); }
  return out.join(' ');
}

/* ---------- PGN ---------- */
function parsePGN(text) {
  const tags = {};
  text.replace(/\[(\w+)\s+"([^"]*)"\]/g, (_, k, v) => { tags[k] = v; return ''; });
  let body = text.replace(/\[[^\]]*\]/g, ' ').replace(/\{[^}]*\}/g, ' ').replace(/;[^\n]*/g, ' ');
  while (/\([^()]*\)/.test(body)) body = body.replace(/\([^()]*\)/g, ' ');
  body = body.replace(/\$\d+/g, ' ').replace(/\d+\.(\.\.)?/g, ' ');
  const fen = tags.FEN || START_FEN;
  let st = C.parseFEN(fen); const moves = [];
  for (const tok of body.split(/\s+/).filter(Boolean)) {
    if (/^(1-0|0-1|1\/2-1\/2|\*|½-½)$/.test(tok)) break;
    const m = C.parseSan(st, tok);
    if (!m) throw new Error(`Не понял ход «${tok}» (ход ${moves.length + 1})`);
    moves.push(C.uci(m)); st = C.make(st, m);
  }
  if (!moves.length) throw new Error('В тексте нет ходов');
  const res = tags.Result === '1-0' ? { winner:'w' } : tags.Result === '0-1' ? { winner:'b' } : tags.Result === '1/2-1/2' ? { draw:true } : null;
  const nameOf = (n, elo) => n && n !== '?' ? n + (elo && elo !== '?' ? ` (${elo})` : '') : null;
  return { id:'pgn' + Date.now(), moves, fen, result:res, white:nameOf(tags.White, tags.WhiteElo) || 'Белые', black:nameOf(tags.Black, tags.BlackElo) || 'Чёрные' };
}

/* ===== Игра с тренером и «кружок» оценки хода ===== */
const BKEY = 'chess-bot-v1';
const LIVE_DEPTH = 12;
const LEVELS = [
  { name:'Новичок',            elo:250,  icon:'🐣', depth:1, mpv:10, T:300, blunder:.30 },
  { name:'Начинающий',         elo:500,  icon:'🙂', depth:2, mpv:8,  T:200, blunder:.15 },
  { name:'Любитель',           elo:800,  icon:'😎', depth:3, mpv:6,  T:120, blunder:.08 },
  { name:'Средний',            elo:1100, icon:'🧐', depth:5, mpv:5,  T:60,  blunder:.04 },
  { name:'Клубный',            elo:1400, icon:'🏅', uci:1400, ms:300 },
  { name:'Опытный',            elo:1700, icon:'🎓', uci:1700, ms:400 },
  { name:'Кандидат в мастера', elo:2000, icon:'🥈', uci:2000, ms:500 },
  { name:'Мастер',             elo:2300, icon:'🥇', uci:2300, ms:700 },
  { name:'Гроссмейстер',       elo:2600, icon:'👑', uci:2600, ms:900 },
  { name:'Максимум',           elo:3000, icon:'🤖', max:true, ms:1500 }
];
const botName = b => { const l = LEVELS[b.lvl] || LEVELS[0]; return `Тренер «${l.name}» (≈${l.elo})`; };
const sleepMs = ms => new Promise(r => setTimeout(r, ms));

/* ---------- выбор хода тренером ---------- */
async function pickBotMove(fen, st, lvl) {
  if (lvl.max) return (await Eng.search(fen, { movetime:lvl.ms, mpv:1 })).best;
  if (lvl.uci) return (await Eng.search(fen, { movetime:lvl.ms, mpv:1, elo:lvl.uci })).best;
  const r = await Eng.search(fen, { depth:lvl.depth, mpv:lvl.mpv });
  const legal = C.legal(st);
  if (Math.random() < lvl.blunder) return C.uci(legal[Math.floor(Math.random() * legal.length)]);
  const cand = r.lines.filter(Boolean).map(l => ({ u:l.pv[0], s:l.kind === 'mate' ? (l.v > 0 ? 10000 - l.v * 10 : -10000 - l.v * 10) : l.v }));
  if (!cand.length) return r.best;
  const top = Math.max(...cand.map(c => c.s));
  const w = cand.map(c => Math.exp((c.s - top) / lvl.T));
  let x = Math.random() * w.reduce((a, b) => a + b, 0);
  for (let i = 0; i < cand.length; i++) { x -= w[i]; if (x <= 0) return cand[i].u; }
  return cand[0].u;
}

async function botMove() {
  const g = G, gen = g.gen;
  if (!g.bot || g.result || g.st.turn === g.bot.color) return;
  g.busy = true; gameUi();
  const lvl = LEVELS[g.bot.lvl], h = g.H[g.H.length - 1], t0 = Date.now();
  let u;
  try { u = await Eng.task(() => pickBotMove(C.toFEN(h.st, h.hm, Math.floor(g.moves.length / 2) + 1), h.st, lvl)); }
  catch (e) { if (g === G) { g.busy = false; gameUi(); } return; }
  await sleepMs(Math.max(0, 450 - (Date.now() - t0)));
  if (g !== G || g.gen !== gen || g.result) return;
  g.busy = false;
  const m = C.findUci(g.st, u) || C.legal(g.st)[0];
  gameMove(m, false, true);
}

/* ---------- живая оценка ходов ---------- */
const liveOn = () => G && G.game && (G.bot ? S.coachCls !== false : S.liveCls !== false);
async function evalPly(g, ply) {
  if (ply < 0 || g.evals[ply]) return g.evals[ply];
  const h = g.H[ply]; if (!h) return null;
  const t = terminalEval(h.st);
  if (t) return (g.evals[ply] = t);
  const r = await Eng.task(() => Eng.search(C.toFEN(h.st, h.hm, Math.floor(ply / 2) + 1), { depth:LIVE_DEPTH, mpv:2 }));
  if (g.H[ply] !== h) return null;          // ход успели отменить
  return (g.evals[ply] = toEval(r, h.st));
}
// вызывается после каждого хода и при открытии партии
async function afterMove() {
  const g = G, gen = g.gen, ply = g.moves.length;
  const need = g.bot || liveOn();
  if (need) { try { await evalPly(g, ply - 1); await evalPly(g, ply); } catch (e) {} }
  if (g !== G || g.gen !== gen) return;
  if (ply && liveOn() && g.evals[ply - 1] && g.evals[ply]) await classifyPly(g, ply);
  if (g !== G || g.gen !== gen) return;
  if (g.bot && !g.result && g.st.turn !== g.bot.color) botMove();
}
async function classifyPly(g, ply) {
  if (g.cls[ply]) return showCls(g, ply);
  const book = await openingBook();
  const h = g.H[ply], before = g.H[ply - 1].st, m = h.m;
  let k;
  const prefix = g.moves.slice(0, ply).join(' ');
  const prevBook = ply === 1 || g.cls[ply - 1] === 'book';
  k = judge(before, h.st, m, g.H[ply - 1].m, g.evals[ply - 1], g.evals[ply], g.cls[ply - 1] || null);
  const loss = Math.max(0, winFor(g.evals[ply - 1], before.turn) - winFor(g.evals[ply], before.turn));
  if (prevBook && book.prefixes.has(prefix) && loss < 6) k = 'book';
  g.cls[ply] = k;
  const best = g.evals[ply - 1].best, bm = best && C.findUci(before, best);
  g.clsBest[ply] = bm && C.uci(bm) !== C.uci(m) ? C.san(before, bm, true) : null;
  if (book.names.has(prefix)) g.opening = book.names.get(prefix);
  showCls(g, ply);
}
function showCls(g, ply) {
  if (g !== G || g.moves.length !== ply) return;
  const h = g.H[ply], mover = g.H[ply - 1].st.turn;
  if (g.bot && mover !== g.bot.color) return;      // в игре с тренером оцениваем только ваши ходы
  const c = CLS[g.cls[ply]];
  g.badge = [h.m.to, 'cls', c.icon]; g.badgeColor = c.color; g.badgePly = ply;
  drawBadge();
  gameUi();
}
// текст «кружка» для строки статуса
function clsLine(g, ply) {
  const k = g.cls[ply]; if (!k) return '';
  const c = CLS[k];
  const bad = ['inaccuracy', 'mistake', 'miss', 'blunder'].includes(k);
  return `<span class="clsdot" style="background:${c.color}">${c.icon}</span>${g.sans[ply - 1]} — ${c.name.toLowerCase()}${bad && g.clsBest[ply] ? `. Лучше было ${g.clsBest[ply]}` : ''}`;
}

/* ---------- подсказка ---------- */
async function coachHint() {
  const g = G; if (!g || g.result || g.busy || g.st.turn !== g.user) return;
  setStatus('', 'Подсказка', 'Тренер смотрит позицию…');
  let e;
  try { e = await evalPly(g, g.moves.length); } catch (err) { return; }
  if (g !== G || !e || !e.best) return;
  const m = C.findUci(g.st, e.best); if (!m) return;
  g.arrows = [[m.from, m.to, '#4a8fe7']]; g.hl.hint = [m.from];
  render(); gameUi();
  setStatus('', 'Подсказка тренера', `Сильнее всего здесь ${C.san(g.st, m, true)}. Стрелка показывает ход.`);
}

   <label class="switch"><input type="checkbox" id="bCls" ${S.coachCls !== false ? 'checked' : ''}><span>Оценивать мои ходы кружком, как на chess.com</span></label>
   <p class="muted small">После каждого вашего хода тренер покажет значок: лучший ход, неточность, ошибка, зевок… Если ошиблись — подскажет, что было сильнее, и ход можно взять назад.</p>
   <button class="btn" id="bPlay" style="width:100%">Играть</button>
   <p class="muted small" style="margin-top:12px">Рейтинги уровней примерные. Тренер — движок Stockfish, работает без интернета.</p>`;
  $('#botMenu').querySelectorAll('[data-l]').forEach(b => b.onclick = () => { S.botLvl = +b.dataset.l; save(); goBotMenu(); });
  $('#botMenu').querySelectorAll('[data-c]').forEach(b => b.onclick = () => { S.botColor = b.dataset.c; save(); goBotMenu(); });
  $('#bCls').onchange = e => { S.coachCls = e.target.checked; save(); };
  $('#bPlay').onclick = () => {
    if (savedOn && !confirm('Начать новую партию? Текущая будет удалена.')) return;
    const c = S.botColor === 'r' ? (Math.random() < .5 ? 'w' : 'b') : (S.botColor || 'w');
    startGame(null, { lvl:S.botLvl ?? 3, color:c });
  };
  if (savedOn) $('#bContinue').onclick = () => startGame(saved, saved.bot);
  show('botMenu', 'Игра с тренером', goHome);
}

</script>
</body>
</html>
